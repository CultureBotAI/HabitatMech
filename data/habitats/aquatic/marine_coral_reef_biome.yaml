identifier: ENVO:01000049
label: marine coral reef biome
definition: The marine coral reef biome comprises constructional wave-resistant entities
  which are primarily built by corals and are often cemented together. The growth
  of these structures is aided by zooxanthellae, algae that are symbiotic with the
  reef-building corals.
