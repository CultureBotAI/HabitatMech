identifier: habitatmech:GOLD.1208484062
label: serpentinization-hosted carbonate hydrothermal vent chimney
definition: A marine hydrothermal vent chimney which is built of brucite and calcium
  and magnesium carbonates precipitated where low-temperature, hyperalkaline, hydrogen-
  and methane-rich fluid produced by serpentinization of ultramafic rock mixes with
  seawater.
