- timestamp: '2026-08-25T00:00:00Z'
  curator: codex-gpt-5
  action: SAME_AS
  changes: 'Merged into habitatmech:GOLD.ce244e62cd ''Non-marine Saline and Alkaline'':
    the same concept under another source''s name. Duplicate correction (#110, #185):
    BacDive''s “Non-marine-Saline-and-Alkaline” isolation-source bin and GOLD''s identically
    scoped node denote the same broad inland aquatic habitat. The earlier “quality,
    not a place” ruling was wrong for the source concept, so its 37 STRAIN assertions
    and taxa merge into the defined GOLD survivor. BacDive''s automatic PATO:0001430
    alkaline xref is deliberately not carried: it covers only one arm of this saline-or-alkaline
    disjunction and would misleadingly drop the saline arm. (source concept habitatmech:BACDIVE.9a0a53afc1)'
- timestamp: '2026-08-25T00:00:00Z'
  curator: codex-gpt-5
  action: CONFIRM_UNGROUNDED
  changes: 'Confirmed UNGROUNDED: no ontology term fits this concept. Nearest broader
    term ENVO:01000317 ''aquatic environment'' attached as a parent. Definition review
    (#110, #185): GOLD''s node names the broad environment grouping its inland saline,
    alkaline and combined descendants, not a bare water quality. The earlier “quality,
    not a place” ruling confused the modifiers with the source concept and left a
    genuine 121-organism habitat undefined. ENVO:01000317 is the defensible existing
    genus. The inherited aquatic-biome edge is replaced by the curated definition
    because this source bin also contains operated settings such as solar salterns
    and fracking water. The node is disjunctive — saline OR alkaline OR both — and
    descendants that leak outside the intended inland scope remain independently curated.
    (source concept habitatmech:GOLD.ce244e62cd)'
- timestamp: '2026-08-25T00:00:00Z'
  curator: codex-gpt-5
  action: DEFINED
  changes: 'Defined as ''inland saline or alkaline aquatic environment'' under ENVO:01000317
    ''aquatic environment''. Definition curated from the committed deep-research report
    for this record (#110, #185). The “or both” wording preserves GOLD''s disjunctive
    hierarchy instead of claiming every child is simultaneously saline and alkaline.
    “Inland” is preferred to “non-marine” because marine-derived inland brines can
    remain geographically inland, while “athalassohaline” is not an exact synonym
    because it classifies water by ionic composition rather than location. Parent
    replacement is intentional: GOLD''s inherited aquatic-biome edge is false for
    the node''s operated-setting descendants, whereas ENVO''s aquatic-environment
    genus covers both natural and engineered water-determined settings. Dropped the
    exact synonym ''Non-marine-Saline-and-Alkaline'' (#213): it is BacDive''s label
    for the concept GOLD spells ''Non-marine Saline and Alkaline'', and the two differ
    only in punctuation. Both source labels survive on the record''s source_attestations,
    where they identify which source said what; as a pair of EXACT synonyms they would
    read to an ENVO editor as the same string written twice. Found by the guard added
    for this issue, not by the review that filed it.'
