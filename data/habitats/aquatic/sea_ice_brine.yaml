      acid cis/trans isomerase (CPS_0087, UniProtKB:Q48AQ8) in Colwellia psychrerythraea
      34H alongside virally encoded fatty acid desaturase (FAD) genes (unbinned viral
      metagenome contigs across 476 viral populations in PMID:32546670 without isolate-level
      UniProtKB accessions).
