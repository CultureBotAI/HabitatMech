causal_graphs:
- graph_id: sea_ice_brine_colwellia_glaciecola_cpslip_pfa_cti_and_viral_fad_cryoadaptation
  title: Sea-ice brine subzero hypersaline pocket selection, Colwellia/Polaribacter/Glaciecola
    and phage community enrichment, and CpsLip/pfa/cti/FAD membrane and lipid cryoadaptation
    mechanism
  description: Seawater-derived sea-ice brines form liquid subzero hypersaline pockets
    within frozen sea ice where concentrated dissolved salts prevent freezing amid
    seasonal temperature and salinity fluctuations. These subzero hypersaline conditions
    select for psychrophilic bacterial assemblages (~10^5 cells mL-1) dominated by
    Polaribacter, Paraglaciecola, Colwellia (including Colwellia psychrerythraea 34H),
    Glaciecola, and Marinobacter alongside habitat-specific bacteriophages (1.3 x
    10^5 to 2.1 x 10^5 mL-1). Colwellia psychrerythraea 34H and co-occurring brine
    bacteria and phages express cold-active lipase CpsLip (UniProtKB:Q486T5), polyunsaturated
    and trans-unsaturated fatty acid synthesis/isomerization genes (pfa and cti),
    cryoprotectant extracellular polysaccharide substances (EPS), and virally encoded
    fatty acid desaturase (FAD) auxiliary metabolic genes to maintain membrane fluidity
    and lipid hydrolysis under subzero hypersaline stress.
