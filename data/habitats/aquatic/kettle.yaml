identifier: ENVO:00000311
label: kettle
definition: A fluvioglacial landform occurring as the result of blocks of ice calving
  from the front of a receding glacier and becoming partially to wholly buried by
  glacial outwash. Glacial outwash is generated when sediment laden streams of meltwater
  flow away from the glacier and are deposited to form broad outwash plains called
  sandurs. When the ice blocks melt, holes are left in the sandur.
