identifier: ENVO:01000034
label: oceanic sea surface microlayer biome
definition: The oceanic sea surface microlayer (SML) biome comprises the top 1000
  micrometers of the marine surface waters occurring offshore, away from a continental
  shelf. It is the boundary layer where all exchange occurs between the atmosphere
  and the ocean. The chemical, physical, and biological properties of the SML differ
  greatly from the sub-surface water just a few centimeters beneath.
