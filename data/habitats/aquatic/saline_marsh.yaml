        snippet: Close relatives of marine symbionts from the Candidatus Thiodiazotropha
          genus contributed ~30% and ~20% of all sulfur-oxidizing dsrA and nitrogen-fixing
          nifK transcripts in stressed roots, respectively.
        notes: Representative Candidatus Thiodiazotropha endolucinida nitrogenase
          beta chain NifK (nifK, CODIS_20460, UniProtKB:A0A7Z0VLY7; 523 aa) for root-associated
