  - node_id: rhizosphere_sulfide_detoxification_coupled_cn_fixation_and_marsh_ch4_flux
    label: rhizosphere sulfide detoxification, chemolithotrophic C/N fixation, and
      estuarine marsh methane flux
    node_type: COMMUNITY_PROCESS
    description: Coupling of chemolithotrophic sulfur oxidation with carbon and nitrogen
      fixation that detoxifies sulfide in the Spartina alterniflora root zone alongside
      sediment sulfate reduction and methane emission.
  edges:
  - edge_id: saline_marsh_maintains_spartina_rhizosphere_sulfidic_redox_gradient
    subject: saline_marsh
    predicate: maintains
    object: spartina_rhizosphere_sulfidic_redox_and_root_carbon_gradient
    description: Saline marshes vegetated by Spartina alterniflora maintain sulfidic,
      reduced sediment conditions alongside available carbon substrates in the oxidized
      root zone.
    evidence:
    - reference: PMID:35227326
      snippet: The S. alterniflora root microbiome is dominated by highly active and
        competitive species taking advantage of available carbon substrates in the
        oxidized root zone.
      notes: Spartina alterniflora salt marshes provide available carbon substrates
        in the oxidized root zone across sediment redox gradients (PMID:35227326).
    - reference: PMID:38684658
      snippet: Abundant sulfur-oxidizing bacteria encode and highly express genes
        for carbon fixation (RuBisCO), nitrogen fixation (nifHDK) and sulfur oxidation
        (oxidative-dsrAB), especially in roots stressed by sulfidic and reduced sediment
        conditions.
      notes: Coastal salt marshes dominated by Spartina alterniflora subject plant
        roots to sulfidic and reduced sediment conditions (PMID:38684658).
  - edge_id: spartina_redox_gradient_selects_for_thiodiazotropha_srb_and_methanogens
    subject: spartina_rhizosphere_sulfidic_redox_and_root_carbon_gradient
    predicate: selects for
    object: salt_marsh_thiodiazotropha_desulfobacteraceae_and_methanogen_guild
    description: Sulfidic marsh sediments and Spartina alterniflora roots enrich Candidatus
      Thiodiazotropha, Desulfobacteraceae and Desulfobulbaceae sulfate-reducing bacteria,
      and Methanomicrobiales/Methanosaeta methanogens.
    evidence:
    - reference: PMID:35227326
      snippet: Core microbiome bacteria from the Candidatus Thiodiazotropha genus,
        with the metabolic potential to couple S oxidation with C and N fixation,
        were shown to be highly abundant in the root and rhizosphere of S. alterniflora.
      notes: Candidatus Thiodiazotropha is enriched in the core root and rhizosphere
        microbiome of salt marsh Spartina alterniflora (PMID:35227326).
    - reference: PMID:23986751
      snippet: In SRB, sequences closely related to the families Desulfobacteraceae
        and Desulfobulbaceae dominated in the salt marsh, although they displayed
        minimal changes with the S. alterniflora invasion.
      notes: Desulfobacteraceae and Desulfobulbaceae dominate the sulfate-reducing
        bacterial community alongside Methanomicrobiales, Methanococcales, and Methanosaeta
        in estuarine salt marsh sediments (PMID:23986751).
  - edge_id: salt_marsh_guild_expresses_dsrab_nifhdk_rubisco_and_mcra
    subject: salt_marsh_thiodiazotropha_desulfobacteraceae_and_methanogen_guild
    predicate: expresses
    object: marsh_oxidative_dsrab_nifhdk_rubisco_and_mcra_enzymes
    description: Salt marsh Candidatus Thiodiazotropha, sulfate-reducing bacteria,
      and methanogens encode and express RuBisCO, nifHDK/nifK, oxidative-dsrAB/dsrA,
      reductive dsrB, and mcrA.
    evidence:
    - reference: PMID:38684658
      snippet: Close relatives of marine symbionts from the Candidatus Thiodiazotropha
        genus contributed ~30% and ~20% of all sulfur-oxidizing dsrA and nitrogen-fixing
        nifK transcripts in stressed roots, respectively.
      notes: Candidatus Thiodiazotropha relatives contribute ~30% of sulfur-oxidizing
        dsrA and ~20% of nitrogen-fixing nifK transcripts in stressed Spartina alterniflora
        roots alongside RuBisCO and nifHDK (PMID:38684658).
    - reference: PMID:23986751
      snippet: The community structures of methanogens and sulfate-reducing bacteria
        (SRB) as a function of Spartina alterniflora invasion in Phragmites australis-vegetated
        sediments of the Dongtan wetland in the Yangtze River estuary, China, were
        investigated using 454 pyrosequencing and quantitative real-time PCR (qPCR)
        of the methyl coenzyme M reductase A (mcrA) and dissimilatory sulfite-reductase
        (dsrB) genes.
      notes: Estuarine salt marsh methanogens and sulfate-reducing bacteria harbor
        mcrA and dsrB genes in Spartina alterniflora and Phragmites australis stands
        (PMID:23986751).
  - edge_id: marsh_enzymes_catalyze_sulfide_detoxification_cn_fixation_and_methane_flux
    subject: marsh_oxidative_dsrab_nifhdk_rubisco_and_mcra_enzymes
    predicate: catalyzes
    object: rhizosphere_sulfide_detoxification_coupled_cn_fixation_and_marsh_ch4_flux
    description: Oxidative-dsrAB, nifHDK, and RuBisCO couple sulfide-detoxifying sulfur
      oxidation with carbon and nitrogen fixation in the Spartina root zone while
      mcrA and dsrB drive sediment methane production and sulfate reduction.
    evidence:
    - reference: PMID:35227326
      snippet: 'Two microbially mediated mechanisms are proposed to stimulate S. alterniflora
        primary productivity: (i) enhanced microbial activity replenishes nutrients
        and terminal electron acceptors in higher biomass stands, and (ii) coupling
        of chemolithotrophic S oxidation with carbon (C) and nitrogen (N) fixation
        by root- and rhizosphere-associated prokaryotes detoxifies sulfide in the
        root zone while potentially transferring fixed C and N to the host plant.'
      notes: Coupled chemolithotrophic sulfur oxidation and C/N fixation detoxifies
        root-zone sulfide and supports Spartina alterniflora primary productivity
        (PMID:35227326).
    - reference: PMID:23986751
      snippet: qPCR analysis revealed higher copy numbers of mcrA genes in sediments
        from S. alterniflora stands than P. australis stands (5- and 7.5-fold more
        in the spring and summer, respectively), which is consistent with the higher
        methane flux rates measured in the S. alterniflora stands (up to 8.01 ± 5.61
        mg m(-2) h(-1)).
      notes: Elevated mcrA gene copy numbers correspond to elevated methane flux rates
        in Spartina alterniflora salt marsh sediments (PMID:23986751).
