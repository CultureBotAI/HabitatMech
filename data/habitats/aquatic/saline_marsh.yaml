causal_graphs:
- graph_id: saline_marsh_spartina_rhizosphere_thiodiazotropha_dsrab_nifhdk_and_mcra_cycling
  title: Saline marsh Spartina alterniflora rhizosphere sulfidic redox gradient, Candidatus
    Thiodiazotropha and SRB/methanogen guild selection, and coupled oxidative-dsrAB/nifHDK/mcrA
    cycling mechanism
  description: Tidal saline marshes vegetated by the foundation cordgrass Spartina
    alterniflora maintain steep rhizosphere and bulk-sediment redox gradients combining
    sulfidic, reduced sediment conditions with plant-derived organic substrates in
    the oxidized root zone. These gradients select for a core root and sediment microbiome
    dominated by sulfur-oxidizing symbionts of the genus Candidatus Thiodiazotropha
    alongside sulfate-reducing bacteria (Desulfobacteraceae and Desulfobulbaceae)
    and hydrogenotrophic/acetoclastic methanogens (Methanomicrobiales, Methanococcales,
    Methanosaeta). These guilds express oxidative and reductive dissimilatory sulfite
    reductase (oxidative-dsrAB, dsrA, dsrB), nitrogenase (nifHDK, nifK), ribulose-1,5-bisphosphate
    carboxylase/oxygenase (RuBisCO), and methyl coenzyme M reductase A (mcrA) to couple
    chemolithoautotrophic sulfide oxidation with carbon and nitrogen fixation in stressed
    roots while driving sediment sulfate reduction and methanogenesis.
  nodes:
  - node_id: saline_marsh
    label: saline marsh
    node_type: HABITAT
    grounding: ENVO:00000054
    description: Coastal intertidal saline marsh wetland vegetated by salt-tolerant
      macrophytes such as Spartina alterniflora and Phragmites australis.
  - node_id: spartina_rhizosphere_sulfidic_redox_and_root_carbon_gradient
    label: Spartina alterniflora sulfidic sediment redox gradient and oxidized root-zone
      carbon substrates
    node_type: ENVIRONMENTAL_FACTOR
    description: Sulfidic, reduced estuarine marsh sediment conditions coupled with
      plant-derived carbon substrates in the oxidized Spartina alterniflora root zone.
  - node_id: salt_marsh_thiodiazotropha_desulfobacteraceae_and_methanogen_guild
    label: Candidatus Thiodiazotropha, Desulfobacteraceae/Desulfobulbaceae SRB, and
      Methanomicrobiales/Methanosaeta guild
    node_type: COMMUNITY
    description: Salt marsh root, rhizosphere, and sediment prokaryotic community
      comprising Candidatus Thiodiazotropha sulfur-oxidizing diazotrophs, Desulfobacteraceae
      and Desulfobulbaceae sulfate-reducing bacteria, and Methanomicrobiales, Methanococcales,
      and Methanosaeta methanogens.
  - node_id: marsh_oxidative_dsrab_nifhdk_rubisco_and_mcra_enzymes
    label: oxidative and reductive dissimilatory sulfite reductase (dsrAB, dsrB),
      nitrogenase (nifHDK), RuBisCO, and methyl coenzyme M reductase A (mcrA)
    node_type: GENE_OR_PROTEIN
    description: Chemolithoautotrophic sulfur-oxidation genes (oxidative-dsrAB, dsrA;
      represented by Candidatus Thiodiazotropha endolucinida UniProtKB:A0A7Z0VL60),
      nitrogen-fixation genes (nifHDK, nifK; UniProtKB:A0A7Z0VLY7), and carbon-fixation
      RuBisCO (cbbL1; UniProtKB:A0A7Z0VJ95) in root-associated Candidatus Thiodiazotropha
      alongside sediment Desulfobacteraceae sulfate-reducing dsrB (UniProtKB:A0A850T8A4)
      and Methanosaeta methanogenic mcrA (UniProtKB:H3K2E3) genes.
    protein_examples:
    - accession: UniProtKB:A0A7Z0VL60
      entry_name: A0A7Z0VL60_9GAMM
      recommended_name: Sulfite reductase, dissimilatory-type subunit beta
      gene_symbol: dsvB_1
      locus_tag: CODIS_24930
      taxon_id: NCBITaxon:1655433
      taxon_name: Candidatus Thiodiazotropha endolucinida
      role_in_node: subunit
      sequence_length: 356
      crc64: B9B43D1F4A97F7A3
      evidence:
      - reference: PMID:38684658
        snippet: Close relatives of marine symbionts from the Candidatus Thiodiazotropha
          genus contributed ~30% and ~20% of all sulfur-oxidizing dsrA and nitrogen-fixing
          nifK transcripts in stressed roots, respectively.
        notes: Representative Candidatus Thiodiazotropha endolucinida dissimilatory-type
          sulfite reductase subunit (dsvB_1, CODIS_24930, UniProtKB:A0A7Z0VL60; 356
          aa) for the Ca. Thiodiazotropha oxidative-dsrAB guild in Spartina alterniflora
          roots (PMID:38684658).
    - accession: UniProtKB:A0A7Z0VLY7
