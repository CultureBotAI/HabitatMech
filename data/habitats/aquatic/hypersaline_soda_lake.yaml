- graph_id: hypersaline_soda_lake_thioalkalivibrio_halorhodospira_fcc_sox_soe_hdr_dsr_and_cbbl_cbbm_cycling
  title: Hypersaline soda lake carbonate-alkaline brine selection and Thioalkalivibrio-Halorhodospira
    fcc/sox/soe/hdr/dsr sulfur oxidation and cbbL/cbbM RuBisCO carbon fixation mechanism
  description: Hypersaline soda lakes (such as Kulunda Steppe, Wadi Natrun, and Kenyan
    soda lakes) maintain high concentrations of sodium carbonate/bicarbonate (stable
    pH > 9, optimum pH 10.0) and moderate to extremely high salinity alongside reduced
    sulfur compounds (sulfide, thiosulfate, elemental sulfur). These extreme haloalkaline
    conditions select for obligately chemolithoautotrophic and phototrophic haloalkaliphilic
    Ectothiorhodospiraceae (Thioalkalivibrio spp. including T. sulfidiphilus and Halorhodospira).
    These guilds encode flavocytochrome c (fcc), the truncated Sox system (sox), sulfite:quinone
    oxidoreductase (soe), heterodisulfide reductase (hdr), reverse dissimilatory sulfite
    reductase (dsr), and Calvin-Benson cycle form I and form II RuBisCO (cbbL, cbbM),
    catalyzing haloalkaline dissimilatory sulfur oxidation coupled to autotrophic
    CO2 assimilation.
