    evidence:
    - reference: PMID:30837958
      snippet: Soda lakes are saline alkaline lakes characterized by high concentrations
        of sodium carbonate/bicarbonate which lead to a stable elevated pH (>9), and
        moderate to extremely high salinity. Despite this combination of extreme conditions,
        biodiversity in soda lakes is high, and the presence of diverse microbial
        communities provides a driving force for highly active biogeochemical cycles.
      notes: Berben et al. 2019 (PMID:30837958) characterized the high sodium carbonate/bicarbonate
        alkalinity (pH > 9) and salinity of soda lakes.
