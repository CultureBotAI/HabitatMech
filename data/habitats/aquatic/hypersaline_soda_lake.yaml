    node_type: GENE_OR_PROTEIN
    description: 'Dissimilatory sulfur-oxidation enzymes — flavocytochrome c (fcc),
      truncated Sox system, sulfite:quinone oxidoreductase (soe), heterodisulfide
      reductase (hdr), and dissimilatory sulfite reductase (dsr) — together with Calvin-Benson
      cycle form I and form II RuBisCO (cbbL, cbbM) and rTCA ATP citrate lyase (aclB).
      Verified protein_examples are attached for the hypersaline soda lake isolate
      Thioalkalivibrio sulfidiphilus strain HL-EbGR7 (NCBITaxon:396588; PMID:21984678,
      PMID:30837958): Calvin-Benson cycle form I RuBisCO large chain CbbL (UniProtKB:B8GQP8,
      cbbL, Tgr7_3203) and small subunit CbbS (UniProtKB:B8GQP7, cbbS, Tgr7_3202),
      reverse dissimilatory sulfite reductase alpha (UniProtKB:B8GUE5, Tgr7_2185)
      and beta (UniProtKB:B8GUE6, Tgr7_2186) subunits, and truncated Sox system L-cysteine
      S-thiosulfotransferase subunit SoxA (UniProtKB:B8GN83, Tgr7_0853).'
