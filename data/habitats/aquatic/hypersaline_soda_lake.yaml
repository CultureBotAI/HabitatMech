    description: High carbonate alkalinity, salinity, and reduced sulfur in hypersaline
      soda lakes select for chemolithoautotrophic Thioalkalivibrio and phototrophic
      Halorhodospira.
    evidence:
    - reference: PMID:30837958
      snippet: The sulfur cycle is one of the most important of these and bacterial
        sulfur oxidation is dominated by members of the obligately chemolithoautotrophic
        genus Thioalkalivibrio. Currently, 10 species have been described in this
        genus, but over one hundred isolates have been obtained from soda lake samples.
      notes: Bacterial sulfur oxidation in soda lakes is dominated by the obligately
        chemolithoautotrophic genus Thioalkalivibrio (PMID:30837958).
    - reference: PMID:21073490
      snippet: The cbbL libraries from hypersaline lakes were dominated by members
        of the extremely haloalkaliphilic sulfur-oxidizing Ectothiorhodospiraceae,
        i.e. the chemolithotrophic Thioalkalivibrio and the phototrophic Halorhodospira.
      notes: Hypersaline soda lake sediments from the Kulunda Steppe and Wadi Natrun
        are dominated by Thioalkalivibrio and Halorhodospira (PMID:21073490).
  - edge_id: thioalkalivibrio_halorhodospira_guild_expresses_fcc_sox_soe_hdr_dsr_and_cbbl_cbbm
    subject: haloalkaliphilic_thioalkalivibrio_and_halorhodospira_ectothiorhodospiraceae_guild
    predicate: expresses
    object: haloalkaliphilic_fcc_sox_soe_hdr_dsr_and_cbbl_cbbm_aclb_enzymes
    description: Soda lake Thioalkalivibrio and Ectothiorhodospiraceae encode flavocytochrome
      c (fcc), the truncated Sox system, sulfite:quinone oxidoreductase (soe), heterodisulfide
      reductase (hdr), reverse Dsr (dsr), and form I and II RuBisCO (cbbL, cbbM).
    evidence:
    - reference: PMID:30837958
      snippet: Investigation of the ortholog groups containing genes related to sulfur
        oxidation showed that flavocytochrome c (fcc), the truncated sox system, and
        sulfite:quinone oxidoreductase (soe) are present in all strains, whereas dissimilatory
        sulfite reductase (dsr; which catalyzes the oxidation of elemental sulfur)
        was found in only six strains. The heterodisulfide reductase system (hdr),
        which is proposed to oxidize sulfur to sulfite in strains lacking both dsr
        and soxCD, was detected in 73 genomes.
      notes: Comparative genomics of 75 soda-lake Thioalkalivibrio strains identified
        universal fcc, truncated sox, and soe alongside hdr (73 genomes) and dsr (6
        genomes) (PMID:30837958).
    - reference: PMID:21073490
      snippet: Sediments from six soda lakes of the Kulunda Steppe (Altai, Russia)
        and from hypersaline alkaline lakes of Wadi Natrun (Egypt) were analyzed for
        the presence of cbb and aclB genes encoding key enzymes Ci assimilation (RuBisCO
        in Calvin-Benson and ATP citrate lyase in rTCA cycles, respectively). The
        cbbL gene (RuBisCO form I) was found in all samples and was most diverse,
        while the cbbM (RuBisCO form II) and aclB were detected only in few samples
        and with a much lower diversity.
      notes: Soda lake sediment communities harbor cbbL (RuBisCO form I), cbbM (RuBisCO
        form II), and aclB (PMID:21073490).
  - edge_id: fcc_sox_soe_hdr_dsr_and_rubisco_enzymes_drive_haloalkaline_sulfur_and_carbon_cycling
    subject: haloalkaliphilic_fcc_sox_soe_hdr_dsr_and_cbbl_cbbm_aclb_enzymes
    predicate: catalyzes
    object: haloalkaline_chemolithoautotrophic_sulfur_oxidation_and_co2_assimilation
    description: Reverse Dsr, truncated Sox, Fcc/Soe/Hdr, and type I RuBisCO enzymes
      catalyze chemolithoautotrophic growth with sulfide and thiosulfate coupled to
      CO2 assimilation at pH 8.0-10.5.
    evidence:
    - reference: PMID:21984678
      snippet: Chemolithoautotrophic growth was observed with sulfide and thiosulfate
        in a pH range of 8.0-10.5 (optimum at pH 10.0) and a salinity range of 0.2-1.5
        M total Na(+) (optimum at 0.4 M). The genome sequence of strain HL-EbGr7(T)
        demonstrated the presence of genes encoding the reverse Dsr pathway and a
        truncated Sox pathway for sulfur oxidation and enzymes of the Calvin-Benson
        cycle of autotrophic CO(2) assimilation with ribulose-bisphosphate carboxylase/oxygenase
        (RuBisCO) type I.
      notes: Thioalkalivibrio sulfidiphilus catalyzes sulfide and thiosulfate oxidation
        coupled to type I RuBisCO CO2 assimilation at pH 8.0-10.5 (PMID:21984678).
