causal_graphs:
- graph_id: marine_sediment_sulfate_sulfur_cycling
  title: Marine sediment sulfate sulfur cycling
  description: A conditional sulfur-cycling model for organic-bearing marine sediment
    with sulfate supply and anoxic porewater, especially fine-grained coastal and
    continental-shelf sediment. It is not universal across marine sediment; slowly
    accumulating deep-ocean sediment can remain oxic to basement. Interacting sulfate-reducing
    populations oxidize organic carbon toward inorganic carbon while reducing sulfate
    to sulfide. Sulfide may be reoxidized or retained in iron sulfides and other sinks;
    this graph is not a complete sulfur budget or a strictly separated redox sequence.
  nodes:
  - node_id: marine_sediment
    label: marine sediment
    node_type: HABITAT
    grounding: ENVO:03000033
  - node_id: settling_marine_particles
    label: settling marine particles
    node_type: ENVIRONMENTAL_FACTOR
  - node_id: buried_organic_matter
    label: buried organic matter
    node_type: CHEMICAL
  - node_id: oxygen_depletion
    label: oxygen depletion
    node_type: ENVIRONMENTAL_PARAMETER
  - node_id: anoxic_porewater
    label: anoxic porewater
    node_type: HABITAT
  - node_id: seawater_sulfate
    label: seawater sulfate
    node_type: CHEMICAL
  - node_id: sulfate_reducing_microorganisms
    label: interacting sulfate-reducing populations in the modeled sediment
    node_type: COMMUNITY
  - node_id: microbial_sulfate_reduction
    label: microbial sulfate reduction
    node_type: PATHWAY
  - node_id: carbon_mineralization
    label: carbon mineralization
    node_type: COMMUNITY_PROCESS
  - node_id: hydrogen_sulfide
    label: hydrogen sulfide
    node_type: CHEMICAL
  - node_id: sulfur_oxidizing_microorganisms
    label: interacting sulfur-oxidizing populations in the modeled sediment
    node_type: COMMUNITY
  - node_id: sulfide_oxidation
    label: sulfide oxidation
    node_type: PATHWAY
  - node_id: reactive_iron_minerals
    label: reactive iron minerals
    node_type: CHEMICAL
  - node_id: iron_sulfide_minerals
    label: iron sulfide minerals
    node_type: CHEMICAL
  edges:
  - edge_id: marine_sediment_receives_particles
    subject: marine_sediment
    predicate: receives
    object: settling_marine_particles
    description: Marine sediment forms from particles transported through the marine
      water column and deposited on the seafloor.
    evidence:
    - reference: PMID:31388058
      notes: Introduction, electron-donor discussion; deposited organic matter supplies
        reducing power to the sediment. This does not imply that all deposited particles
        contain bioavailable organic matter.
  - edge_id: particles_bury_marine_organic_matter
    subject: settling_marine_particles
    predicate: buries
    object: buried_organic_matter
    description: Deposition and burial of organic-bearing particles supply organic
      matter to sediment habitats on and below the seafloor.
    evidence:
    - reference: PMID:31388058
      notes: Introduction, organic-matter burial and electron-donor discussion; burial
        is a possible fate, not the fate of every settling particle.
  - edge_id: buried_organic_matter_depletes_oxygen
    subject: buried_organic_matter
    predicate: contributes to
    object: oxygen_depletion
    description: Aerobic microbial remineralization of buried organic matter consumes
      oxygen; whether porewater becomes anoxic depends on oxygen supply relative to
      consumption.
    evidence:
    - reference: PMID:31105660
      notes: Organic Matter Degradation and Fig. 1; surface oxygen is available for
        respiration. The review focuses on fine-grained shelf sediment.
    - reference: PMID:31388058
      notes: Introduction and Fig. 1 contrast respiration exceeding oxygen supply
        with slowly accumulating sediment that remains oxic to basement.
  - edge_id: oxygen_depletion_creates_anoxic_porewater
    subject: oxygen_depletion
    predicate: can create
    object: anoxic_porewater
    description: Where oxygen consumption exceeds resupply, depletion can create anoxic
      porewater. Oxygen can instead persist through slowly accumulating deep-ocean
      sediment; no universal depletion depth or rate is asserted.
    evidence:
    - reference: PMID:31388058
      notes: Introduction, Fig. 1 and Box 1 distinguish oxic and anoxic sediment columns
        and the limits of the standard redox-zonation model.
  - edge_id: seawater_supplies_sulfate
    subject: marine_sediment
    predicate: receives
    object: seawater_sulfate
    description: Marine sediment porewaters receive sulfate from overlying seawater.
    evidence:
    - reference: PMID:31105660
      notes: Organic Matter Degradation, first paragraph; sulfate supplied from seawater
        penetrates the seabed. The cited concentration is not asserted as a universal
        measurement for this habitat.
  - edge_id: sulfate_selects_sulfate_reducers
    subject: seawater_sulfate
    predicate: supports
    object: sulfate_reducing_microorganisms
    description: Sulfate supplies an electron acceptor for sulfate-respiring populations
      in anoxic porewater when suitable donors and physiological conditions are available;
      sulfate alone does not establish growth.
    evidence:
    - reference: PMID:28419734
      notes: Introduction and Sulfate-Reducing Microorganisms; diverse populations
        use sulfate with available donors. Legacy selection edge ID retained.
  - edge_id: anoxic_porewater_enables_sulfate_reduction
    subject: anoxic_porewater
    predicate: enables
    object: microbial_sulfate_reduction
    description: Anoxic porewater supports sulfate reduction where sulfate, suitable
      donors and active populations coexist. Iron reduction and other pathways can
      overlap; prior exhaustion of every other acceptor is not required by this model.
    evidence:
    - reference: PMID:31105660
      notes: Organic Matter Degradation, redox-zonation discussion; sulfate reduction
        also occurs in layers geochemically characterized by iron reduction. This
        is not a mutually exclusive sequence.
    - reference: PMID:31388058
      notes: Box 1, overlapping pathways and limitations of standard zonation.
  - edge_id: sulfate_reducers_perform_sulfate_reduction
    subject: sulfate_reducing_microorganisms
    predicate: performs
    object: microbial_sulfate_reduction
    description: Sulfate-reducing populations couple suitable substrate oxidation
      to sulfate respiration; organic compounds or hydrogen can provide reducing power.
    evidence:
    - reference: PMID:28419734
      notes: Sulfate-Reducing Microorganisms; organic compounds and hydrogen are electron
        donors, and the functional group spans multiple taxa.
  - edge_id: sulfate_reduction_mineralizes_carbon
    subject: microbial_sulfate_reduction
    predicate: drives
    object: carbon_mineralization
    description: Organoclastic sulfate reduction couples organic-carbon oxidation
      toward inorganic carbon to sulfate reduction. Sulfide is the reduced sulfur
      product, not a carbon-mineralization product.
    evidence:
    - reference: PMID:31105660
      notes: Introduction, first paragraph and Organic Matter Degradation; terminal
        organic-carbon oxidation to CO2 is coupled to sulfate reduction. Hydrogen-driven
        sulfate reduction need not oxidize organic carbon directly.
  - edge_id: sulfate_reduction_produces_sulfide
    subject: microbial_sulfate_reduction
    predicate: produces
    object: hydrogen_sulfide
    description: Microbial sulfate reduction reduces sulfate to hydrogen sulfide in
      marine porewaters.
    evidence:
    - reference: PMID:28419734
      notes: Introduction and Sulfate-Reducing Microorganisms describe sulfate reduction
        to sulfide. The former non-verbatim snippet is removed; hydrogen sulfide and
        its dissociated forms depend on solution chemistry.
  - edge_id: sulfide_selects_sulfur_oxidizers
    subject: hydrogen_sulfide
    predicate: can support
    object: sulfur_oxidizing_microorganisms
    description: Sulfide can support sulfur-oxidizing populations where suitable oxidants
      and physiological conditions are available; geochemical sulfide oxidation also
      occurs.
    evidence:
    - reference: PMID:31105660
      notes: Introduction and Fig. 1 distinguish biological and geochemical oxidation
        and multiple possible oxidants. No selection experiment or universal biological
        fraction is asserted; legacy edge ID retained.
  - edge_id: sulfur_oxidizers_perform_sulfide_oxidation
    subject: sulfur_oxidizing_microorganisms
    predicate: performs
    object: sulfide_oxidation
    description: Sulfur-oxidizing microorganisms return reduced sulfide toward oxidized
      sulfur pools.
    evidence:
    - reference: PMID:28419734
      notes: Introduction, microbial sulfur-cycle overview; sulfur-oxidizing populations
        mediate oxidation of reduced sulfur. This does not assign all sulfide oxidation
        to microorganisms.
  - edge_id: reactive_iron_traps_sulfide
    subject: reactive_iron_minerals
    predicate: reacts with
    object: hydrogen_sulfide
    description: Reactive iron can react with sulfide in the modeled sediment; iron
      reactivity and availability constrain this sink.
    evidence:
    - reference: PMID:31105660
      notes: Introduction and Fig. 1 explain sulfide reaction with buried iron and
        iron-sulfide formation. Lin's mineral-surface/rate study is not evidence for
        this trapping reaction and is removed from the edge.
  - edge_id: sulfide_reaction_forms_iron_sulfides
    subject: hydrogen_sulfide
    predicate: produces
    object: iron_sulfide_minerals
    description: Sulfide reacts with reactive iron to form iron sulfide minerals,
      trapping part of the reduced sulfur pool in sediment.
    evidence:
    - reference: PMID:31105660
      notes: Introduction and Fig. 1 identify iron monosulfide and pyrite as sulfur
        sinks; precipitation is one fate alongside reoxidation and organic-sulfur
        formation, not a complete sulfur budget.
