causal_graphs:
- graph_id: solar_saltern_sediment_hypersaline_anoxic_gradient_srb_haloarchaea_dsrab_methylotrophic_methanogenesis
  title: Solar saltern sediment thalassohaline hypersaline anoxic and heavy-metal
    gradient, sulfate-reducing bacteria and halophilic Euryarchaeota guild selection,
    and dsrAB/methylamine-methanogenesis/metal-ATPase benthic cycling mechanism
  description: Benthic sediments underlying solar saltern evaporation and crystallizer
    ponds experience extreme thalassohaline sodium and chloride concentrations (up
    to 97-148 ppt Cl- and crystallizer saturation), anoxia, methylated amine accumulation,
    and localized heavy-metal enrichment. This hypersaline anoxic regime selects for
    a stratified benthic community combining diverse sulfate-reducing bacteria (including
    Desulfovermiculus and Deltaproteobacteria), sulfur-oxidizing Thioalkalispira,
    halophilic Halobacteriaceae (Halobacterium salinarum, Natronomonas, Haloarcula,
    Halorubrum), and methylotrophic methanogenic archaea (Methanosarcinaceae such
    as Candidatus Methanosalis and MBSL-1 candidate division euryarchaeota). These
    benthic guilds express dissimilatory (bi)sulfite reductase (dsrAB), trimethylamine
    and dimethylamine methylotrophic methanogenesis enzymes, potassium-uptake and
    compatible-solute synthesis/transport genes, and heavy-metal resistance transporters
    (copper-translocating P-type ATPases and cobalt-zinc-cadmium resistance proteins)
    to drive benthic sulfate reduction, methylotrophic methane emission, and osmotic
    and metal-stress homeostasis.
