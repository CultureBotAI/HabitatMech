identifier: ENVO:00000369
label: brine pool
definition: 'MERGED DEFINITION: TARGET DEFINITION: A large area of brine on the ocean
  basin near cold seep vents which release methane into the water. These pools are
  concentrations of water having an extremely high salinity as compared to the surrounding
  ocean, caused by the motion of large salt deposits through salt tectonics. --------------------
  SOURCE DEFINITION: Marine brine pools are large areas of brine on the ocean basin.
  These pools are bodies of water that have a salinity three to five times greater
  than the surrounding ocean. For deep-sea brine pools the source of the salt is the
  dissolution of large salt deposits through salt tectonics. The brine often contains
  high concentrations of methane, providing energy to chemosynthetic animals that
  live near the pool.'
