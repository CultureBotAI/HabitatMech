causal_graphs:
- graph_id: liquid_water_planktonic_solute_foraging
  title: Liquid water planktonic solute foraging
  description: Conditional model of a connected marine water column containing planktonic
    heterotrophic bacteria and localized organic substrates. Water activity must be
    compatible with the focal organisms; liquid phase alone does not imply high water
    activity, growth, or this planktonic setting. Particles may be suspended or sinking.
    Extracellular hydrolysis and diffusion can create nutrient gradients, and chemotaxis
    can improve access where its benefits exceed its costs. A fraction of assimilated
    carbon supports biomass production, which can supply grazers in a microbial loop.
  nodes:
  - node_id: liquid_water
    label: liquid water
    node_type: HABITAT
    grounding: ENVO:00002006
  - node_id: high_water_activity
    label: high water activity
    node_type: ENVIRONMENTAL_FACTOR
  - node_id: bulk_aqueous_phase
    label: connected marine water-column habitat
    node_type: HABITAT
  - node_id: polymeric_organic_matter
    label: polymeric organic matter
    node_type: CHEMICAL
  - node_id: extracellular_hydrolysis
    label: extracellular hydrolysis
    node_type: PATHWAY
  - node_id: dissolved_organic_matter
    label: dissolved organic matter
    node_type: CHEMICAL
  - node_id: solute_diffusion
    label: solute diffusion
    node_type: ENVIRONMENTAL_FACTOR
  - node_id: microscale_solute_gradients
    label: microscale solute gradients
    node_type: ENVIRONMENTAL_FACTOR
  - node_id: chemotactic_motility
    label: chemotactic motility
    node_type: TRAIT
  - node_id: free_living_bacteria
    label: planktonic heterotrophic bacterial community
    node_type: COMMUNITY
  - node_id: heterotrophic_uptake
    label: heterotrophic dissolved-carbon uptake
    node_type: PATHWAY
  - node_id: bacterial_biomass
    label: bacterial biomass production
    node_type: BIOLOGICAL_PROCESS
  - node_id: microbial_loop
    label: microbial loop
    node_type: COMMUNITY_PROCESS
  edges:
  - edge_id: liquid_water_provides_high_water_activity
    subject: liquid_water
    predicate: can provide
    object: high_water_activity
    description: Within the sufficiently dilute conditions of this marine water-column
      model, the aqueous medium can provide water activity compatible with the focal
      bacteria. Water activity depends on solute composition and other conditions,
      not on liquid phase alone; liquid hypersaline media can instead have low water
      activity.
    evidence:
    - reference: PMID:15306380
      snippet: Life at low water activity
      notes: Grant reviewed water-activity limits and the microbial physiology required
        when water availability falls in saline or dry habitats.
    - reference: PMID:25500507
      snippet: common water-activity limit
      notes: Stevenson and colleagues, Materials and methods, describe growth assays
        in liquid salt-supplemented media at low water activities. These experiments
        limit the edge's scope rather than proving that every liquid-water habitat
        has high water activity.
  - edge_id: high_water_activity_permits_aquatic_growth
    subject: high_water_activity
    predicate: can permit
    object: bacterial_biomass
    description: Water activity compatible with the focal bacteria can permit hydrated
      cells to maintain metabolism and produce biomass when other nutritional and
      physiological requirements are met. High water activity alone is not sufficient
      for growth and is not required by all bacteria.
    evidence:
    - reference: PMID:15306380
      snippet: Life at low water activity
      notes: The review connects external water activity with cellular water stress,
        osmoadaptation, and whether microbes can grow.
    - reference: PMID:21663439
      snippet: Bacterial osmoregulation
      notes: Wood reviewed the homeostatic mechanisms bacteria use to maintain turgor
        and cytoplasmic hydration across external osmotic conditions.
  - edge_id: liquid_water_forms_bulk_aqueous_phase
    subject: liquid_water
    predicate: forms
    object: bulk_aqueous_phase
    description: In this model, liquid water forms the medium of a connected marine
      water-column habitat where planktonic cells encounter substrates. Isolated droplets
      and other liquid-water microhabitats are outside this graph's scope; connectivity
      is not inferred from material identity.
    evidence:
    - reference: DOI:10.3354/meps010257
      snippet: water-column microbes
      notes: Azam and colleagues treated liquid seawater as the bulk medium connecting
        bacteria, dissolved organic matter, and grazers.
    - reference: PMID:23204367
      notes: Introduction and Marine microenvironments describe the marine water column
        and its localized substrates. This is the inspected full-text support for
        the bounded setting, not all liquid water.
  - edge_id: liquid_water_suspends_free_living_cells
    subject: liquid_water
    predicate: suspends
    object: free_living_bacteria
    description: The modeled marine water column can contain dispersed planktonic
      heterotrophic bacterial populations. Their presence is a community-level setting,
      not a single taxon or a consequence guaranteed by the liquid phase.
    evidence:
    - reference: DOI:10.3354/meps010257
      snippet: ecological role of water-column microbes
      notes: Azam and colleagues synthesized bacterial biomass, production, and grazing
        in the marine water column.
    - reference: PMID:23204367
      notes: Introduction distinguishes diverse marine bacterial populations and their
        water-column roles. The ecological assemblage is represented as COMMUNITY;
        no species-wide habitat assertion is added.
  - edge_id: liquid_water_suspends_polymeric_particles
    subject: liquid_water
    predicate: can contain
    object: polymeric_organic_matter
    description: The modeled water column can contain suspended or sinking organic
      particles and high-molecular-weight substrates accessible to extracellular enzymes.
      Neither persistent suspension nor substrate presence follows from liquid-water
      identity alone.
    evidence:
    - reference: PMID:21329211
      snippet: extracellular enzymes and the marine carbon cycle
      notes: Arnosti reviewed how marine extracellular enzymes hydrolyze complex organic
        matter outside microbial cells.
    - reference: PMID:23204367
      snippet: suspended and sinking particles
      notes: Particles as Resource Islands distinguishes particle suspension, sinking,
        attached hydrolysis and release of dissolved substrates.
  - edge_id: polymeric_matter_requires_hydrolysis
    subject: polymeric_organic_matter
    predicate: requires
    object: extracellular_hydrolysis
    description: Macromolecular substrates too large for direct uptake require extracellular
      hydrolysis into transportable products in this modeled route. This is not a
      requirement for every dissolved organic compound.
    evidence:
    - reference: PMID:21329211
      snippet: extracellular enzymes
      notes: Arnosti reviewed extracellular enzymatic hydrolysis as the step that
        makes macromolecular organic matter available to microbes.
  - edge_id: extracellular_hydrolysis_releases_dom
    subject: extracellular_hydrolysis
    predicate: releases
    object: dissolved_organic_matter
    description: Extracellular hydrolysis can release smaller dissolved organic molecules
      from polymeric substrates into surrounding water. This is one source of dissolved
      organic matter, not its sole origin.
    evidence:
    - reference: PMID:21329211
      snippet: marine carbon cycle
      notes: The review links extracellular enzyme activity to transformations of
        marine dissolved and particulate organic matter.
  - edge_id: bulk_water_allows_solute_diffusion
    subject: bulk_aqueous_phase
    predicate: enables
    object: solute_diffusion
    description: Dissolved substrates diffuse through the aqueous phase around particles,
      lysed cells, and other localized organic-matter sources.
    evidence:
    - reference: PMID:23204367
      snippet: bacterial chemotaxis in the ocean
      notes: Stocker and Seymour reviewed how aquatic nutrient sources generate dynamic
        dissolved plumes, patches, and gradients around bacteria.
  - edge_id: dom_forms_microscale_gradients
    subject: dissolved_organic_matter
    predicate: forms
    object: microscale_solute_gradients
    description: Dissolved organic substrates released from localized sources form
      transient microscale gradients in water.
    evidence:
    - reference: PMID:23118182
      snippet: Marine microbes see a sea of gradients
      notes: Stocker described the microscale chemical heterogeneity encountered by
        planktonic microbes.
    - reference: PMID:23204367
      snippet: highly heterogeneous down to the microscale
      notes: Stocker and Seymour synthesized the physical and ecological origins of
        aquatic microscale nutrient heterogeneity.
  - edge_id: gradients_select_chemotactic_motility
    subject: microscale_solute_gradients
    predicate: can favor
    object: chemotactic_motility
    description: Transient nutrient gradients can favor chemotactic bacteria where
      access to substrates outweighs swimming and sensing costs. The model does not
      imply that all marine bacteria are motile.
    evidence:
    - reference: PMID:23204367
      snippet: chemotaxis may provide a significant fitness advantage
      notes: Stocker and Seymour reviewed chemotaxis as an adaptation to short-lived
        nutrient patches in aquatic habitats.
  - edge_id: chemotaxis_increases_dom_uptake
    subject: chemotactic_motility
    predicate: can increase
    object: heterotrophic_uptake
    description: Chemotactic motility can improve substrate exposure and uptake in
      suitable nutrient patches; the benefit depends on transport, patch lifetime,
      physiology and the costs of motility.
    evidence:
    - reference: PMID:23204367
      snippet: successfully use chemotaxis
      notes: The review connects high-performance chemotaxis with rapid responses
        to aquatic chemical gradients.
  - edge_id: dom_supports_heterotrophic_bacteria
    subject: dissolved_organic_matter
    predicate: supports
    object: free_living_bacteria
    description: Bioavailable dissolved organic substrates can support the modeled
      planktonic heterotrophic bacterial community when other growth requirements
      are met. This does not make all free-living bacteria heterotrophs or all dissolved
      organic matter readily usable.
    evidence:
    - reference: DOI:10.3354/meps010257
      snippet: ecological role of water-column microbes
      notes: Azam and colleagues framed dissolved organic matter uptake by water-column
        bacteria as a central aquatic carbon-flow process.
    - reference: PMID:23204367
      notes: Introduction identifies marine bacterial transfer of dissolved organic
        matter toward higher trophic levels; particle sections bound access to usable
        substrates and localized conditions.
  - edge_id: uptake_generates_bacterial_biomass
    subject: heterotrophic_uptake
    predicate: supports
    object: bacterial_biomass
    description: Assimilation of part of the taken-up dissolved carbon can support
      bacterial biomass production. Uptake is not identical to biomass production;
      respiration and other carbon fates remain possible.
    evidence:
    - reference: DOI:10.3354/meps010257
      snippet: bacterial biomass and productivity
      notes: The microbial-loop synthesis linked uptake of dissolved carbon to bacterial
        biomass and productivity in the water column.
    - reference: PMID:23204367
      notes: Abstract distinguishes biomass incorporation from respiration. The endpoint
        represents biomass production as a biological process, not a community biomass
        stock mislabeled as a cellular state.
  - edge_id: bacterial_biomass_feeds_microbial_loop
    subject: bacterial_biomass
    predicate: contributes to
    object: microbial_loop
    description: Bacterial biomass production can supply prey carbon to heterotrophic
      flagellates and microzooplankton in the modeled marine microbial loop. This
      conditional trophic route does not prescribe the fate of all produced biomass.
    evidence:
    - reference: DOI:10.3354/meps010257
      snippet: microbial loop
      notes: Azam and colleagues introduced the water-column microbial-loop model
        linking bacteria, bacterivorous flagellates, and microzooplankton.
    - reference: PMID:23204367
      notes: Introduction supports bacterial transfer of dissolved organic matter
        toward higher trophic levels. Azam's inspected author-upload abstract supports
        the named grazing sequence; its publisher full text remained inaccessible,
        so no more detailed Azam-specific claim is made.
