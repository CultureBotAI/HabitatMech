identifier: habitatmech:GOLD.5c80d6475a
label: diffuse-flow hydrothermal vent fluid
definition: A marine hydrothermal vent environment characterized by low-temperature
  hydrothermal fluid mixed with subsurface seawater discharging diffusely through
  seafloor fissures and porous substrata.
