label: white smoker
definition: A hydrothermal vent found on the ocean floor which emits lighter-hued
  minerals, such as those containing barium, calcium and silicon. These alkaline hydrothermal
  vents also continuously generate acetyl thioesters, providing both the starting
  point for more complex organic molecules and the energy needed to produce them.
