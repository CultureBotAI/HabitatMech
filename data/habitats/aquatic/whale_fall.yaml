identifier: ENVO:01000140
label: whale fall
definition: 'Whale fall is the term used for a whale carcass that has fallen to the
  ocean floor. When a whale dies in shallow water, its carcass is typically devoured
  by scavengers over a relatively short period of time: within several months. However,
  in deeper water (depths of 2,000 m/6,600 ft or greater), fewer scavenger species
  exist, and the carcass can provide sustenance for a complex localized ecosystem
  over periods of decades.'
