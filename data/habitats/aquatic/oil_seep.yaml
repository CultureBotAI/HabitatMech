causal_graphs:
- graph_id: oil_seep_hydrocarbon_sulfate_flux_anme_desulfosarcina_mcra_dsrab_alkb_oxidation
  title: Oil seep hydrocarbon and sulfate flux, ANME/Desulfosarcina-Desulfococcus
    and acidophilic alkane-degrader guild selection, and mcrA/dsrAB/alkB hydrocarbon
    oxidation mechanism
  description: Marine and terrestrial hydrocarbon (oil) seeps discharge subsurface
    fluids enriched in methane, short-chain n-alkanes (ethane, propane, n-butane),
    and longer saturated acyclic and branched alkanes (C15-C30, pristane, phytane)
    into sulfate-bearing sediments and soils. These hydrocarbon and sulfate gradients
    select for anaerobic methane-oxidizing archaea (ANME-1 and ANME-2) and sulfate-reducing
    Deltaproteobacteria (Desulfosarcina/Desulfococcus clade including strain BuS5,
    Desulfobacteraceae, and Desulfobulbaceae) beneath Beggiatoa mats in marine seeps,
    as well as aerobic alkane-degrading heterotrophs (Acidisphaera and Acidiphilium)
    in acidic terrestrial seeps. These guilds express methyl coenzyme M reductase
    (mcrA), dissimilatory sulfite reductase (dsrAB), fumarate-activating alkylsuccinate
    pathway enzymes, and alkane monooxygenase (alkB) to catalyze anaerobic methane
    and short-chain alkane oxidation coupled to sulfate reduction alongside aerobic
    medium- and long-chain alkane mineralization.
  nodes:
  - node_id: oil_seep
    label: oil seep
    node_type: HABITAT
    grounding: ENVO:00002063
    description: Natural marine or terrestrial hydrocarbon seep where subsurface petroleum,
      short-chain gaseous alkanes, and longer-chain liquid or solid hydrocarbons migrate
      to the sediment or soil surface.
  - node_id: seep_methane_short_and_long_chain_alkane_and_sulfate_flux
    label: subsurface methane, C2-C4 short-chain alkane, C15-C30 saturated alkane,
      and sulfate flux
    node_type: ENVIRONMENTAL_FACTOR
    description: Advective upward flux of methane, ethane, propane, n-butane, and
      C15-C30 acyclic and branched alkanes intersecting high sulfate concentrations
      in seep sediments and soils.
  - node_id: oil_seep_anme_desulfosarcina_desulfobacteraceae_and_alkane_degrader_guild
    label: ANME-1/ANME-2 archaea, Desulfosarcina/Desulfococcus (strain BuS5) and Desulfobulbaceae
      SRB, and Acidisphaera/Acidiphilium guild
    node_type: COMMUNITY
    description: Hydrocarbon seep microbial community comprising ANME-1 and ANME-2
      archaea, Desulfobacteraceae (Desulfosarcina/Desulfococcus cluster including
      propane/butane-oxidizing strain BuS5) and Desulfobulbaceae sulfate-reducing
      bacteria underlying Beggiatoa mats, and acidophilic alkane-degrading Acidisphaera/Acidiphilium
      populations.
  - node_id: seep_mcra_dsrab_fumarate_alkane_addition_and_alkb_enzymes
    label: methyl coenzyme M reductase (mcrA), dissimilatory sulfite reductase (dsrAB),
      fumarate-addition propylsuccinate pathway enzymes, and alkane monooxygenase
      (alkB)
    node_type: GENE_OR_PROTEIN
    description: Archaeal methyl coenzyme M reductase (mcrA) and bacterial dissimilatory
      sulfite reductase (dsrAB) transcripts together with fumarate-dependent terminal/subterminal
      alkane-activating enzymes and alkane 1-monooxygenase (alkB), exemplified by
      verified UniProtKB Acidisphaera sp. C197 AlkB from Rainbow Springs hydrocarbon
      seep soil (UniProtKB:Q5RLH8), Desulfosarcina variabilis DsrA and DsrB (UniProtKB:Q93QV2,
      UniProtKB:Q93QV1), and Desulfosarcina alkanivorans DsrA (UniProtKB:B6F287).
    protein_examples:
    - accession: UniProtKB:Q5RLH8
      entry_name: Q5RLH8_9PROT
      recommended_name: Alkane 1-monooxygenase
      gene_symbol: alkB
      taxon_id: NCBITaxon:301143
      taxon_name: Acidisphaera sp. C197
      role_in_node: family_member
      sequence_length: 185
      crc64: FF52484096C040B9
      evidence:
      - reference: PMID:16204508
        snippet: This and the presence of an alkB gene homolog in this isolate confirmed
          the alkane degradation capability of one population indigenous to acidic
          hydrocarbon seep soils.
        notes: Exact UniProtKB entry (Q5RLH8_9PROT) for the alkane 1-monooxygenase
          (alkB) sequenced from the Rainbow Springs acidic hydrocarbon seep soil isolate
          Acidisphaera sp. C197 in PMID:16204508.
    - accession: UniProtKB:Q93QV2
      entry_name: Q93QV2_9BACT
      recommended_name: Dissimilatory sulfite reductase alpha subunit
      gene_symbol: dsrA
      taxon_id: NCBITaxon:2300
      taxon_name: Desulfosarcina variabilis
      role_in_node: subunit
      sequence_length: 371
      crc64: CFF608781DD52DA7
      evidence:
      - reference: PMID:20090951
        snippet: Likewise, 16S ribosomal rRNA, dsrAB (dissimilatory sulfite reductase)
          and mcrA (methyl coenzyme M reductase) mRNA transcripts of sulfate-reducing
          bacteria (Desulfobacteraceae and Desulfobulbaceae) and methane-cycling archaea
