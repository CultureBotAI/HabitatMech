causal_graphs:
- graph_id: marine_water_body_biological_carbon_pump
  title: Marine water body biological carbon pump
  description: Marine water bodies partition microbial activity between a sunlit euphotic
    layer where phytoplankton and cyanobacteria fix carbon and a darker interior where
    sinking particles are enzymatically hydrolyzed and remineralized. Particle-associated
    and free-living heterotrophs convert that organic matter to dissolved inorganic
    carbon and regenerated nutrients while consuming oxygen along the particle flux
    path.
  nodes:
  - node_id: marine_water_body
    label: marine water body
    node_type: HABITAT
    grounding: ENVO:00001999
  - node_id: euphotic_zone
    label: euphotic zone
    node_type: ENVIRONMENTAL_FACTOR
  - node_id: marine_phytoplankton
    label: marine phytoplankton
    node_type: TAXON
  - node_id: oxygenic_photosynthesis
    label: oxygenic photosynthesis
    node_type: PATHWAY
  - node_id: particulate_organic_carbon
    label: particulate organic carbon
    node_type: CHEMICAL
  - node_id: sinking_particles
    label: sinking particles
    node_type: ENVIRONMENTAL_FACTOR
