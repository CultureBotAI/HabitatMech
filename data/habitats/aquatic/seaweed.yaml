identifier: FOODON:03412266
label: seaweed
definition: 'A macroscopic, multicellular, marine algae (kingdom Protista) that belongs
  to one of several groups of multicellular algae: the red algae, green algae, and
  brown algae. As these three groups are not thought to have a common multicellular
  ancestor, the seaweeds are a polyphyletic group. In addition, some tuft-forming
  bluegreen algae (Cyanobacteria) are sometimes considered seaweed.'
