identifier: habitatmech:GOLD.67571e7dc1
label: coastal solar saltern
definition: An intertidal zone environment consisting of a series of shallow coastal
  evaporation ponds fed by marine water for salt production, forming a salinity gradient
  inhabited by halophilic bacteria, archaea, and microalgae.
