causal_graphs:
- graph_id: hydrothermal_vent_redox_chemolithoautotrophy
  title: Hydrothermal vent redox chemolithoautotrophy
  description: In the deep-sea marine setting represented here, heated, reduced vent
    fluids mix with oxidized seawater. Local gradients can favor sulfur- and hydrogen-oxidation
    capacities; in autotrophic organisms these metabolisms can support carbon fixation.
    The graph does not universalize this marine scenario to every hydrothermal vent
    or every hydrogen oxidizer.
  nodes:
  - node_id: hydrothermal_vent
    label: hydrothermal vent
    node_type: HABITAT
    grounding: ENVO:00000215
  - node_id: crustal_heat
    label: crustal heat
    node_type: ENVIRONMENTAL_FACTOR
  - node_id: hydrothermal_fluid
    label: hydrothermal fluid
    node_type: ENVIRONMENTAL_FACTOR
    grounding: ENVO:01000134
  - node_id: oxygenated_seawater
    label: oxygenated seawater
    node_type: ENVIRONMENTAL_FACTOR
  - node_id: mixing_zone
    label: vent-seawater mixing zone
    node_type: HABITAT
  - node_id: redox_gradient
    label: redox gradient
    node_type: ENVIRONMENTAL_PARAMETER
  - node_id: temperature_gradient
    label: temperature gradient
    node_type: ENVIRONMENTAL_PARAMETER
  - node_id: hydrogen
    label: hydrogen
    node_type: CHEMICAL
  - node_id: hydrogen_sulfide
    label: hydrogen sulfide
    node_type: CHEMICAL
  - node_id: sulfur_oxidation_capacity
    label: sulfur oxidation capacity
    node_type: CAPACITY
  - node_id: hydrogen_oxidation_capacity
    label: hydrogen oxidation capacity
    node_type: CAPACITY
  - node_id: sulfur_oxidation
    label: sulfur oxidation
    node_type: PATHWAY
  - node_id: hydrogen_oxidation
    label: hydrogen oxidation
    node_type: PATHWAY
  - node_id: inorganic_carbon_fixation
    label: inorganic carbon fixation
    node_type: BIOLOGICAL_PROCESS
  - node_id: chemosynthetic_primary_production
    label: chemosynthetic primary production
    node_type: COMMUNITY_PROCESS
  - node_id: surface_associated_growth
    label: surface-associated chemoautotroph growth
    node_type: BIOLOGICAL_PROCESS
  edges:
  - edge_id: vent_discharge_is_geothermally_heated
    subject: hydrothermal_vent
    predicate: is heated by
    object: crustal_heat
    description: Hydrothermal vents are fissures where crustal heat drives the discharge
      of hot fluids.
    evidence:
    - reference: PMID:30867583
      snippet: hydrothermal geochemistry
      notes: Dick 2019, Abstract, relates deep-sea vent microbiomes to geology and
        geochemistry; this edge is scoped to the marine vent scenario.
  - edge_id: crustal_heat_drives_fluid_discharge
    subject: crustal_heat
    predicate: heats
    object: hydrothermal_fluid
    description: Crustal heat heats circulating fluids that discharge through seafloor
      vent orifices in the represented marine setting.
    evidence:
    - reference: PMID:23720658
      snippet: seafloor vents inject hydrothermal fluids
      notes: Dick et al. 2013, Introduction, describes hot reduced fluids injected
        into the deep ocean, not a claim that heat drives a material as though that
        material were a discharge process.
  - edge_id: hydrothermal_fluid_supplies_hydrogen
    subject: hydrothermal_fluid
    predicate: supplies
    object: hydrogen
    description: Hydrothermal fluids can supply molecular hydrogen, with concentrations
      and microbial energy yields varying by geological setting.
    evidence:
    - reference: PMID:30532749
      snippet: enriched in hydrogen
      notes: Adam and Perner, Abstract, describes geological variation in hydrogen
        enrichment rather than a uniform concentration at every vent.
  - edge_id: hydrothermal_fluid_supplies_sulfide
    subject: hydrothermal_fluid
    predicate: supplies
    object: hydrogen_sulfide
    description: Hydrothermal fluids supply reduced sulfur species that can be oxidized
      by vent microorganisms.
    evidence:
    - reference: PMID:18503548
      snippet: reactions between seawater and rock
      notes: Nakagawa and Takai, Introduction, identifies geological sources of reduced
        donors including sulfide for deep-sea vent chemoautotrophs.
  - edge_id: hydrothermal_fluid_meets_seawater
    subject: hydrothermal_fluid
    predicate: mixes with
    object: oxygenated_seawater
    description: Hot reduced fluids mix with cold oxidizing seawater at and above
      seafloor vent openings.
    evidence:
    - reference: PMID:23720658
      snippet: rapidly mix with cold, oxidizing seawater
      notes: Dick et al. 2013, Introduction, explicitly describes the mixing of hot
        reduced fluid with cold oxidizing seawater.
  - edge_id: mixing_creates_redox_gradient
    subject: mixing_zone
    predicate: creates
    object: redox_gradient
    description: Vent-fluid and seawater mixing juxtaposes reduced electron donors
      with oxidants, creating steep redox gradients.
    evidence:
    - reference: PMID:30867583
      snippet: chemical disequilibrium
      notes: Dick 2019, Abstract, describes the reducing-fluid/oxidizing- seawater
        contrast that vent chemosynthesis exploits.
  - edge_id: mixing_creates_temperature_gradient
    subject: mixing_zone
    predicate: creates
    object: temperature_gradient
    description: Hydrothermal fluid cooling during seawater entrainment creates steep
      temperature gradients across vent habitats.
    evidence:
    - reference: PMID:30867583
      snippet: sharp contrasts in physical and chemical conditions
      notes: Dick 2019, Abstract, describes habitat contrasts; Adam and Perner explicitly
        describes thermal gradients during seawater entrainment.
    - reference: PMID:30532749
      snippet: forming thermal and chemical gradients
      notes: Abstract, fluid ascent and entrainment paragraph; this is a local mixing
        gradient, not a redefinition of the raw qualitative band.
  - edge_id: fluid_mixing_forms_reaction_zone
    subject: hydrothermal_fluid
    predicate: creates
    object: mixing_zone
    description: Hydrothermal-fluid discharge creates a mixing zone in which vent
      reductants encounter seawater oxidants.
    evidence:
    - reference: PMID:23720658
      snippet: forming hydrothermal plumes
      notes: Dick et al. 2013, Introduction, places plume formation at the mixing
        of discharged reduced fluids and ambient oxidizing seawater.
  - edge_id: sulfide_selects_sulfur_oxidizers
    subject: hydrogen_sulfide
    predicate: can favor
    object: sulfur_oxidation_capacity
    description: Sulfide availability together with oxidant supply can favor sulfur
      oxidation capacity; it is not a sufficient cause by itself.
    evidence:
    - reference: PMID:28375213
      snippet: oxygen and sulfide concentrations
      notes: Meier et al., Abstract, proposes oxygen/sulfide variation as a driver
        of observed Manus Basin niche differentiation; the association is not an isolated
        sulfide-selection experiment.
  - edge_id: sulfur_oxidizers_perform_sulfur_oxidation
    subject: sulfur_oxidation_capacity
    predicate: enables
    object: sulfur_oxidation
    description: Sulfur oxidation capacity enables organisms to use reduced sulfur
      as an energy source when suitable conditions and acceptors exist.
    evidence:
    - reference: PMID:28375213
      snippet: oxidation of reduced sulfur compounds
      notes: Meier et al., Abstract, identifies sulfur oxidation as a driver of carbon
        fixation in the studied marine vent context.
  - edge_id: hydrogen_selects_hydrogen_oxidizers
    subject: hydrogen
    predicate: can favor
    object: hydrogen_oxidation_capacity
    description: Available hydrogen can favor hydrogen oxidation capacity where compatible
      electron acceptors and physiological conditions occur.
    evidence:
    - reference: PMID:30532749
      snippet: hydrogen-oxidizing microorganisms
      notes: Adam and Perner, Abstract and hydrogen-oxidizer review sections, describes
        diverse organisms and conditions, not a single clade or proof that all hydrogen
        oxidizers are autotrophs.
  - edge_id: hydrogen_oxidizers_perform_hydrogen_oxidation
    subject: hydrogen_oxidation_capacity
    predicate: enables
    object: hydrogen_oxidation
    description: Hydrogen oxidation capacity enables hydrogen-based energy metabolism
      under suitable conditions; it does not alone imply autotrophy.
    evidence:
    - reference: PMID:30532749
      snippet: Hydrogen oxidation
      notes: Adam and Perner, Abstract, reviews the energy contribution; its full-text
        hydrogen-oxidizer section also includes heterotrophic examples.
  - edge_id: sulfur_oxidation_fuels_carbon_fixation
    subject: sulfur_oxidation
    predicate: can fuel
    object: inorganic_carbon_fixation
    description: Sulfur oxidation supplies energy for inorganic carbon fixation by
      vent chemolithoautotrophs.
    evidence:
    - reference: PMID:18503548
      snippet: oxidation of reduced compounds
      notes: Nakagawa and Takai, Abstract and Introduction, links reduced donor oxidation
        to carbon assimilation in chemoautotrophs, not all sulfur-oxidizing organisms.
  - edge_id: hydrogen_oxidation_fuels_carbon_fixation
    subject: hydrogen_oxidation
    predicate: can fuel
    object: inorganic_carbon_fixation
    description: Hydrogen oxidation can supply energy for carbon fixation in autotrophic
      vent microorganisms when compatible acceptors are available.
    evidence:
    - reference: PMID:29891698
      snippet: combination of nitrate and hydrogen
      notes: McNichol et al., Results and Discussion, p. 6757, reports increased isotope
        incorporation with combined nitrate/hydrogen amendment at Crab Spa. Methods,
        p. 6760, infers total donor electron equivalents rather than independently
        measuring hydrogen-specific carbon fixation.
    - reference: PMID:30532749
      snippet: autotrophic CO2 fixation
      notes: Abstract supports the capability in autotrophs; the review also includes
        heterotrophic hydrogen oxidizers, which are not covered by it.
  - edge_id: carbon_fixation_drives_primary_production
    subject: inorganic_carbon_fixation
    predicate: drives
    object: chemosynthetic_primary_production
    description: Microbial fixation of inorganic carbon generates new biomass in aphotic
      hydrothermal vent habitats.
    evidence:
    - reference: PMID:30867583
      snippet: fix inorganic carbon into biomass
      notes: Dick 2019, Abstract, describes carbon assimilation as the basis of deep-sea
        vent chemosynthetic production.
  - edge_id: primary_production_supports_surface_growth
    subject: chemosynthetic_primary_production
    predicate: can support
    object: surface_associated_growth
    description: Carbon-assimilating production can support growth of surface-associated
      chemoautotrophs in diffuse marine vent settings.
    evidence:
    - reference: PMID:28375213
      snippet: mainly attached to surfaces exposed to diffuse venting
      notes: Meier et al., Abstract, observes surface-associated Sulfurovum and identifies
        chemoautotrophic sulfur oxidation. The growth link is a bounded physiological
        interpretation, not a measured biofilm- formation response or a claim about
        all mineral/animal surfaces.
