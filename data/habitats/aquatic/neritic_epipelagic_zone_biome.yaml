identifier: ENVO:01000042
label: neritic epipelagic zone biome
definition: The neritic epipelagic zone biome comprises the marine water column that
  occurs above a continental shelf and extends from the surface of the ocean to a
  depth of ca. 200-250m. Throughout the zone the light field tends to be asymmetrical
  vertically, so that the direction and elevation of the sun can still be detected.
  The epipelagic zone encompasses the euphotic zone and, where and when it occurs,
  the seasonal thermocline.
