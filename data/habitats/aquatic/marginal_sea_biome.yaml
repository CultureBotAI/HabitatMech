identifier: ENVO:01000046
label: marginal sea biome
definition: The marginal sea biome comprises parts of an ocean partially enclosed
  by land such as islands, archipelagos, or peninsulas. Unlike mediterranean seas,
  marginal seas have ocean currents caused by ocean winds. Many marginal seas are
  enclosed by island arcs that were formed from the subduction of one oceanic plate
  beneath another.
