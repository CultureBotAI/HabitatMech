  changes: 'Confirmed UNGROUNDED: no ontology term fits this concept. ENVO:06105023
    ''biofouling'' kept as an xref. Process screen (#127): carried ENVO:06105023 ''biofouling''
    as a parent, which ENVO defines as ''a FOULING PROCESS during which biological
    matter accumulates on a solid surface'' and files under environmental system process.
    parent_habitats asserts the parent is a broader HABITAT, so the corpus was claiming
    a habitat is-a process — the thing MIxS rules out in the same sentence that rules
    out organisms and groups of organisms, and the reason that sentence is now quoted
    in CLAUDE.md.


    The concept is the fouling layer, not the fouling. It reached the term through
    the ambiguous-leaf rule: the marine path, and three of the four Biofouling paths
    tie at the same depth so none claimed it. Kept as an xref (#99), which records
    what upstream matched without asserting the record is a process. Not grounded
    to ENVO:00002034 ''biofilm'' either: biofouling includes macrofouling such as
    barnacles and tube worms, so biofilm is narrower than the concept rather than
    broader. (source concept habitatmech:GOLD.4bd2954af9)'
