label: enhanced biological phosphorus removal bioreactor
definition: A bioreactor configured with alternating anaerobic and aerobic phases
  to enrich polyphosphate-accumulating organisms (such as Candidatus Accumulibacter)
  for enhanced biological phosphorus removal from wastewater.
