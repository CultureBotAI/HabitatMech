      glycogen-accumulating organisms (GAOs).
  - node_id: accumulibacter_ppk1_laterally_acquired_ppk2_phou_pst_and_pha_glycogen_genes
    label: Candidatus Accumulibacter polyphosphate kinases (ppk1, PPK2), PhoU-dysregulated
      Pst transporter, and Defluviicoccus PHA/glycogen genes
    node_type: GENE_OR_PROTEIN
    description: Clade-defining polyphosphate kinase 1 (ppk1; UniProtKB:A0ABX1TZ70),
      horizontally acquired polyphosphate kinase 2 (ppk2; UniProtKB:A0ABX1U3B6), dysregulated
      PhoU phosphate-signaling protein (UniProtKB:A0A5S4EKM0) and high-affinity Pst
      phosphate transporter in Candidatus Accumulibacter phosphatis alongside glycogen
      synthase (glgA; UniProtKB:A0A7H1N0L1), anaerobic polyhydroxyalkanoate polymerase
      (phaC; UniProtKB:A0A7H1N2D6), and low-affinity pit transporter genes in Defluviicoccus
      vanus.
