identifier: habitatmech:GOLD.f07ee97491
label: sulfur autotrophic denitrification bioreactor
definition: A bioreactor engineered for autotrophic nitrate and nitrite removal in
  which sulfur-oxidizing chemolithoautotrophic denitrifiers use elemental sulfur,
  sulfide, or thiosulfate as electron donors to reduce nitrogen oxides to dinitrogen
  gas.
