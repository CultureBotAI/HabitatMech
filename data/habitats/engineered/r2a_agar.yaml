label: R2A agar medium
definition: A culture medium solidified with agar and formulated with low concentrations
  of yeast extract, proteose peptone, casamino acids, glucose, soluble starch, and
  pyruvate (Reasoner's 2A agar) for recovering heterotrophic bacteria from potable
  and environmental waters.
