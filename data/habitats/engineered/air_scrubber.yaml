  curator: codex-gpt-5
  action: DEFINED
  changes: 'Defined as ''air scrubber'' under ENVO:00003074 ''manufactured product''.
    Scope correction (#1887; structured review 20261010T225034Z-air_scrubber F1).
    EPA describes spray towers, venturi and other wet scrubbers (https://www.epa.gov/air-emissions-monitoring-knowledge-base/monitoring-control-technique-wet-scrubber-particulate-0);
    packing and recirculation are not universal. The prior research report inferred
    a packed wet design from context without direct GOLD member evidence. Retain the
    generic scrubbing device without assuming a liquid medium, packing, recirculation,
    biofilm or biological degradation. Remove unverified exact aliases air washer,
    gas scrubber and wet scrubber rather than asserting identical scope. Keep ENVO:00003074
    ''manufactured product'' and parent_mode=REPLACE: a device is not a portion of
    Indoor Air. No exact identity with ENVO:00003968 ''air filter'' or member-level
    design certification is asserted; its biofilm child remains separately tracked
    in #1637.'
