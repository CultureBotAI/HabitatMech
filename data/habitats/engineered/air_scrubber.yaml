  changes: Defined as 'air scrubber' under ENVO:00003074 'manufactured product'. Definition
    authored from the record's committed deep-research report under research/habitats/,
    read in full; no new paid research was commissioned. The report reads GOLD's Environmental
    > Air > Indoor Air > Air scrubber leaf as an agricultural or industrial wet exhaust
    scrubber whose wetted packing, biofilm, and recirculating liquid form microbial
    habitats. ENVO lacks a scrubber or air-pollution-control-device class; ENVO:00003074
    'manufactured product' is the tightest vendored genus, while ENVO:00002152 'biofilter'
    and ENVO:00003968 'air filter' are near misses that over-claim biological degradation
    or HVAC semantics. parent_mode=REPLACE drops GOLD's inherited Indoor Air parent
    because the scrubber treats an air stream but is not itself a portion of indoor
    air.
