- timestamp: '2026-09-06T00:00:00Z'
  curator: codex-gpt-5
  action: DEFINED
  changes: Defined as 'persistent organic pollutant bioremediation material' under
    ENVO:00010483 'environmental material'. Definition authored from the record's
    committed deep-research report under research/habitats/, read in full; no new
    paid research was commissioned. GOLD places the leaf under Engineered > Bioremediation
    and names a contaminant class rather than a sampled substance, so the record denotes
    the contaminated matrix being remediated, not the persistent organic pollutants
    themselves. ENVO:00010483 'environmental material' is the tightest vendored genus
    broad enough to cover POP-contaminated soil, sediment, sludge and water; ENVO:00002116
    'contaminated soil' and ENVO:03600001 'chemically contaminated sediment' remain
    narrower material-specific near misses, and ENVO:00002204 'anthropogenic contamination
    feature' is a geographic feature rather than a material. The definition uses criteria-based
    persistent organic pollutants instead of the current Stockholm Convention list
    because PAHs sit under this source path in GOLD and are covered by CLRTAP rather
    than Stockholm.
