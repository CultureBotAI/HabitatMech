- timestamp: '2026-09-07T00:00:00Z'
  curator: claude-opus-5
  action: GROUND
  changes: 'Grounded to ENVO:01000371 ''agricultural waste material'' (BROAD). PREGO
    grounded this concept to ENVO''s agricultural waste, which ENVO has since obsoleted
    and marked as replaced by this term. BROAD rather than EXACT: the obsolete term
    was defined as wastewater produced in the course of agricultural activities, while
    the replacement covers manure, slaughterhouse and harvest waste, run-off, salt
    and silt as well. The label synonym shows they share a name, not a scope. Merges
    with the existing agricultural waste material record, whose CLOSE grounding from
    the GOLD path stands unchanged. (source concept habitatmech:PREGO.ae82b5486e)'
