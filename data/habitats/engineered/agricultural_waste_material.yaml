identifier: ENVO:01000371
label: agricultural waste material
definition: Agricultural waste is waste produced as a result of various agricultural
  operations. It includes manure and other wastes from farms, poultry houses and slaughterhouses;
  harvest waste; fertilizer run- off from fields; pesticides that enter into water,
  air or soils; and salt and silt drained from fields.
