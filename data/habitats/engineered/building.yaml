causal_graphs:
- graph_id: building_surface_human_air_assembly
  title: Study-scoped microbial dispersal and surface succession in buildings
  description: Separate studies support occupant-source inference in sampled homes,
    ventilation-associated airborne dispersal in a university building, and surface
    succession after experimental restroom decontamination. These contexts are not
    interchangeable or universal properties of buildings. Temporal succession does
    not identify surviving cells as its source, and airborne observations do not establish
    deposition onto surfaces.
  nodes:
  - node_id: building
    label: building
    node_type: HABITAT
    grounding: ENVO:00000073
  - node_id: indoor_surfaces
    label: sampled restroom surfaces
    node_type: HABITAT
  - node_id: human_occupancy
    label: occupancy of sampled homes
    node_type: ENVIRONMENTAL_FACTOR
  - node_id: occupant_deposition
    label: occupant-to-home microbial transfer inferred from source tracking
    node_type: COMMUNITY_PROCESS
  - node_id: ventilation_strategy
    label: ventilation strategy in the sampled university building
    node_type: ENVIRONMENTAL_FACTOR
  - node_id: outdoor_air_inoculation
    label: outdoor-to-indoor airborne dispersal
    node_type: COMMUNITY_PROCESS
  - node_id: cleaning_disturbance
    label: experimental restroom surface decontamination
    node_type: EXPERIMENTAL_FACTOR
  - node_id: surface_recolonization
    label: post-decontamination restroom surface succession
    node_type: COMMUNITY_PROCESS
  edges:
  - edge_id: building_contains_indoor_surfaces
    subject: building
    predicate: contains in sampled setting
    object: indoor_surfaces
    description: The sampled university building contained the restroom surfaces examined
      in the decontamination and succession study.
    evidence:
    - reference: PMID:25398865
      snippet: floors, toilet seats, and soap dispensers
      notes: Abstract and Materials and Methods, Sample collection. Gibbons and colleagues
        sampled these surfaces in four public restrooms, not indoor air; this does
        not characterize all building surfaces.
  - edge_id: building_hosts_human_occupancy
    subject: building
    predicate: hosts in sampled setting
    object: human_occupancy
    description: The longitudinal household study followed occupants and their homes,
      including households that moved; unoccupied buildings were not established as
      equivalent contexts.
    evidence:
    - reference: PMID:25170151
      snippet: seven families and their homes
      notes: Abstract. Lax and colleagues followed seven families over six weeks,
        including three moves; this edge describes the sampled setting.
  - edge_id: human_occupancy_supports_occupant_source_inference
    subject: human_occupancy
    predicate: supports source inference for
    object: occupant_deposition
    description: Longitudinal household profiles and source analyses supported occupant-to-home
      microbial transfer. This is source inference, not a direct measurement of the
      rate or route of microbial deposition.
    evidence:
    - reference: PMID:25170151
      snippet: the home microbiome was largely sourced from humans
      notes: Abstract. Source analyses and convergence after house moves support this
        bounded inference; they do not establish material-specific selection or a
        universally dominant source in every building.
  - edge_id: building_has_ventilation_strategy
    subject: building
    predicate: has in sampled setting
    object: ventilation_strategy
    description: The university building in the airborne time-series study operated
      with mechanical and natural ventilation.
    evidence:
    - reference: PMID:23621155
      snippet: mechanically and naturally ventilated
      notes: Abstract. Meadow and colleagues studied a hybrid HVAC setting; ventilation
        is an operating condition, not an autonomous building action.
  - edge_id: ventilation_introduces_outdoor_air
    subject: ventilation_strategy
    predicate: modulates
    object: outdoor_air_inoculation
    description: Indoor airborne bacterial changes followed outdoor changes with lags
      associated with ventilation strategy in the sampled university building. This
      edge concerns airborne dispersal only.
    evidence:
    - reference: PMID:23621155
      snippet: a time lag associated with differing ventilation strategies
      notes: Abstract. The time series supports ventilation-dependent coupling of
        indoor and outdoor air; surface deposition and persistence were not measured
        by this study.
  - edge_id: indoor_surfaces_undergo_cleaning_disturbance
    subject: indoor_surfaces
    predicate: undergoes in experiment
    object: cleaning_disturbance
    description: The study experimentally decontaminated selected restroom surfaces
      before longitudinal sampling.
    evidence:
    - reference: PMID:25398865
      snippet: each surface was decontaminated
      notes: Materials and Methods, Eight-week study. The specified surface treatment
        is not evidence about all routine building cleaning.
  - edge_id: cleaning_precedes_surface_succession
    subject: cleaning_disturbance
    predicate: precedes observed
    object: surface_recolonization
    description: Restroom floor communities developed a late-successional composition
      within five to eight hours after decontamination. Temporal ordering does not
      distinguish surviving-cell reseeding from new inputs.
    evidence:
    - reference: PMID:25398865
      snippet: within 5 to 8 h
      notes: Abstract and Results and Discussion, Longitudinal analysis surface-associated
        microbial succession. The time series documents succession, not an isolated
        nutrient, moisture, or material-selection mechanism or a causal survivor reservoir.
