label: partial-nitrification anammox bioreactor
definition: A bioreactor engineered for autotrophic nitrogen removal from wastewater
  by coupling partial nitritation by aerobic ammonia-oxidizing bacteria with anaerobic
  ammonium oxidation (anammox) to dinitrogen gas.
