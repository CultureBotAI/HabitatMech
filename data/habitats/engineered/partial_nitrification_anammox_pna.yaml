  - node_id: coupled_nitritation_and_anammox_dinitrogen_production
    label: coupled partial nitritation and hydrazine-mediated anaerobic ammonium oxidation
      to N2
    node_type: COMMUNITY_PROCESS
    description: Autotrophic conversion of ammonium and nitrite through nitric oxide
      and hydrazine intermediates into dinitrogen gas (N2) with high total nitrogen
      removal efficiency.
  edges:
  - edge_id: pna_maintains_controlled_low_dissolved_oxygen_and_airflow_regime
    subject: partial_nitrification_anammox_pna
    predicate: maintains
    object: controlled_low_dissolved_oxygen_and_airflow_regime
    description: One-stage PNA reactors use airflow control or oxygen-permeable membranes
      to maintain ultra-low DO (0.02-0.10 mg/L) and suppress nitrite-oxidizing bacteria.
    evidence:
    - reference: PMID:41577104
      snippet: Direct control of the airflow rate, rather than using dissolved oxygen
        (DO) as an indicator, successfully suppressed nitrite-oxidizing bacteria (NOB).
        Additionally, long-term addition of exogenous hydrazine (N2H4) effectively
        suppressed NOB, enhanced anammox activity, and strengthened the granulation
        process, with these effects persisting even after N2H4 addition ceased.
      notes: Airflow control and hydrazine addition suppress NOB and rehabilitate
        nitrogen removal up to 0.8 kg N m-3 d-1 in one-stage granular PNA reactors
        (PMID:41577104).
    - reference: PMID:42285533
      snippet: Dead-end aeration maintained ultra-low DO (0.02-0.10 mg/L), effectively
        inhibiting NOB while avoiding excessive FA accumulation.
      notes: Membrane-regulated dead-end aeration maintains ultra-low DO (0.02-0.10
        mg/L) to inhibit NOB in one-stage PN/anammox reactors (PMID:42285533).
  - edge_id: low_do_regime_selects_for_stratified_aob_and_anammox_consortium
    subject: controlled_low_dissolved_oxygen_and_airflow_regime
    predicate: selects for
    object: stratified_aob_and_anammox_brocadia_kuenenia_consortium
    description: DO limitation and EPS-rich granulation select against NOB (Nitrospira)
      and establish microbial stratification with AOB in the outer layer and anammox
      bacteria (Candidatus Brocadia) in the core.
    evidence:
    - reference: PMID:42285533
      snippet: Enhanced sludge granulation and a high proportion of tightly bound
        EPS (89%) supported microbial stratification, with ammonia-oxidizing bacteria
        (AOB) enriched in the outer layer and anammox bacteria in the core.
      notes: Granular PNA sludge stratifies into outer-layer AOB and core anammox
        bacteria (PMID:42285533).
    - reference: PMID:42946263
      snippet: Microbial community analysis was consistent with these observations,
        wherein significant reduction in abundance of NOB (Nitrospira) was observed
        during AMX phase (4.6%) as compared to high-nitrification stage (59.8%). Also,
        during the AMX phase, the reactor was enriched with Candidatus Brocadia genus
        with a relative abundance of 20.9%.
      notes: DO saturation below 45% reduces Nitrospira NOB from 59.8% to 4.6% and
        enriches Candidatus Brocadia to 20.9% (PMID:42946263).
  - edge_id: stratified_anammox_consortium_expresses_hydrazine_synthase_and_dehydrogenase_complexes
    subject: stratified_aob_and_anammox_brocadia_kuenenia_consortium
    predicate: expresses
    object: anammox_hydrazine_synthase_and_dehydrogenase_complexes
    description: Anammox bacteria express the central enzyme complexes that catalyze
      hydrazine (N2H4) synthesis from nitric oxide and ammonium and its oxidation
      to dinitrogen gas.
    evidence:
    - reference: PMID:21964329
      snippet: Here we show that N(2)H(4) is produced from the anammox substrates
        ammonium and nitrite and that nitric oxide (NO) is the direct precursor of
        N(2)H(4). We resolved the genes and proteins central to anammox metabolism
        and purified the key enzymes that catalyse N(2)H(4) synthesis and its oxidation
        to N(2).
      notes: Kartal et al. 2011 (Nature, PMID:21964329) resolved the central anammox
        genes and purified the hydrazine synthase and hydrazine-oxidizing enzymes
        in Candidatus Kuenenia stuttgartiensis.
  - edge_id: hydrazine_synthase_and_anammox_consortium_drive_coupled_nitritation_and_dinitrogen_production
    subject: anammox_hydrazine_synthase_and_dehydrogenase_complexes
    predicate: drives
    object: coupled_nitritation_and_anammox_dinitrogen_production
    description: Hydrazine synthesis and oxidation coupled with AOB nitritation drive
      autotrophic dinitrogen gas production and 80-93.5% total nitrogen removal in
      PNA reactors.
    evidence:
    - reference: PMID:21964329
      snippet: Two distinct microbial processes, denitrification and anaerobic ammonium
        oxidation (anammox), are responsible for the release of fixed nitrogen as
        dinitrogen gas (N(2)) to the atmosphere.
      notes: Anammox enzymatic catalysis releases fixed ammonium and nitrite nitrogen
        as N2 gas (PMID:21964329).
    - reference: PMID:42285533
      snippet: Over 200 days of operation, dead-end aeration enabled stable PN/anammox
        coupling, achieving a high total nitrogen removal efficiency of 93.5 ± 3.9%,
        compared with 33.7 ± 22.4% under cross-flow aeration.
      notes: Coupled PN/anammox achieves 93.5% total nitrogen removal efficiency (PMID:42285533).
