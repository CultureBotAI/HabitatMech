causal_graphs:
- graph_id: partial_nitrification_anammox_do_control_and_stratified_nitrogen_removal
  title: Partial-nitrification anammox dissolved oxygen control, NOB suppression,
    and stratified autotrophic nitrogen removal mechanism
  description: Partial-nitrification anammox (PNA) bioreactors regulate airflow and
    maintain low dissolved oxygen (0.02-0.10 mg/L in membrane-aerated granules or
    <45% DO saturation in packed beds) to suppress nitrite-oxidizing bacteria (NOB
    such as Nitrospira) while supporting redox-stratified granules and biofilms with
    ammonia-oxidizing bacteria (AOB) in outer oxic layers supplying nitrite to core
    anammox bacteria (Candidatus Brocadia, Candidatus Kuenenia) that express hydrazine
    synthase and hydrazine-oxidizing enzymes to convert ammonium and nitrite via nitric
    oxide and hydrazine (N2H4) into dinitrogen gas.
  nodes:
  - node_id: partial_nitrification_anammox_pna
    label: partial-nitrification anammox bioreactor
    node_type: HABITAT
    grounding: habitatmech:GOLD.5f3cbd7563
    description: Autotrophic nitrogen-removal bioreactor coupling partial nitritation
      of ammonium to nitrite with anaerobic ammonium oxidation (anammox).
  - node_id: controlled_low_dissolved_oxygen_and_airflow_regime
    label: controlled low dissolved oxygen and airflow regime suppressing NOB
    node_type: ENVIRONMENTAL_PARAMETER
    description: Strict oxygen delivery and airflow control (ultra-low DO of 0.02-0.10
      mg/L or <45% bulk DO saturation) that suppresses nitrite-oxidizing bacteria
      and prevents nitrate build-up.
  - node_id: stratified_aob_and_anammox_brocadia_kuenenia_consortium
    label: stratified outer-layer AOB and core anammox Candidatus Brocadia/Kuenenia
      consortium
    node_type: COMMUNITY
    description: Spatially stratified granular or biofilm consortium with ammonia-oxidizing
      bacteria (AOB) in the outer layer and anammox Planctomycetes (such as Candidatus
      Brocadia and Candidatus Kuenenia) in the anoxic core.
  - node_id: anammox_hydrazine_synthase_and_dehydrogenase_complexes
    label: anammox hydrazine synthase and hydrazine-oxidizing enzyme complexes
    node_type: GENE_OR_PROTEIN
    description: Key anammox enzyme complexes purified from Kuenenia stuttgartiensis
      (NCBITaxon:174633) that catalyze hydrazine (N2H4) synthesis from nitric oxide
      and ammonium — heterotrimeric hydrazine synthase subunits HzsA (UniProtKB:Q1Q0T2,
      HZSA_KUEST, kuste2861, 809 aa), HzsB (UniProtKB:Q1Q0T4, HZSB_KUEST, kuste2859,
      386 aa), and HzsG (UniProtKB:Q1Q0T3, HZSG_KUEST, kuste2860, 353 aa) — and its
      oxidation to dinitrogen gas (N2) via hydrazine dehydrogenase Hdh (UniProtKB:Q1PW30,
      HDH_KUEST, kustc0694, 582 aa). Multi-subunit enzyme complexes in K. stuttgartiensis
      represented by all four Swiss-Prot reviewed subunits purified in PMID:21964329.
    protein_examples:
    - accession: UniProtKB:Q1Q0T2
      entry_name: HZSA_KUEST
      recommended_name: Hydrazine synthase subunit alpha
      locus_tag: kuste2861
      taxon_id: NCBITaxon:174633
      taxon_name: Kuenenia stuttgartiensis
      role_in_node: subunit
      sequence_length: 809
      crc64: 4D60D075EB87A7CF
      evidence:
      - reference: PMID:21964329
        snippet: Here we show that N(2)H(4) is produced from the anammox substrates
          ammonium and nitrite and that nitric oxide (NO) is the direct precursor
          of N(2)H(4). We resolved the genes and proteins central to anammox metabolism
          and purified the key enzymes that catalyse N(2)H(4) synthesis and its oxidation
          to N(2).
        notes: Swiss-Prot reviewed Hydrazine synthase subunit alpha (kuste2861) purified
          from Kuenenia stuttgartiensis and directly cross-referenced to PMID:21964329.
    - accession: UniProtKB:Q1Q0T4
