identifier: habitatmech:GOLD.0d77d00b06
label: upflow anaerobic sludge blanket bioreactor
definition: A bioreactor in which wastewater flows upward through a dense blanket
  of self-immobilized anaerobic microbial granules that degrade organic pollutants
  and produce biogas.
definition_source: HabitatMech
habitat_category: ENGINEERED
grounding_status: UNGROUNDED
mapping_status: REVIEWED
