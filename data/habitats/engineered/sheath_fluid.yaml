identifier: habitatmech:GOLD.86621a7ef6
label: flow cytometer sheath fluid
definition: A chemical product consisting of buffered saline or ultrapure water used
  in a flow cytometer or fluorescence-activated cell sorter (FACS) to hydrodynamically
  focus suspended cells, which can introduce background reagent microbial DNA during
  single-cell genomics.
