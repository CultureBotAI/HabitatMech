label: anaerobic-aerobic sequencing batch enhanced biological phosphorus removal bioreactor
definition: A bioreactor operated as a sequencing batch reactor cycling through alternating
  anaerobic and aerobic reaction phases to achieve enhanced biological phosphorus
  removal from wastewater.
