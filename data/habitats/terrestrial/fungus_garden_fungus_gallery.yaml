identifier: habitatmech:GOLD.98c192f558
label: insect fungus garden
definition: An environmental system determined by an organism that consists of a substrate
  structure or gallery cultivated by fungicultural insects, such as leaf-cutter ants,
  fungus-growing termites, or ambrosia beetles, to farm symbiotic fungi and associated
  microbial consortia.
