identifier: ENVO:00000292
label: watershed
definition: The separation between neighbouring drainage basins (catchments). In hilly
  country, the divide lies along topographical peaks and ridges, but in flat country
  or on a high plateau (especially where the ground is marshy) the divide may be invisible
  - just a more or less notional line on the ground on either side of which falling
  raindrops will start a journey to different rivers, and even to different sides
  of a country or continent.
