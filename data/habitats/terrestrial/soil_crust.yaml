label: soil crust
definition: A soil consisting of a coherent surface crust layer at the uppermost millimeters
  of soil, formed either by biological soil crust (biocrust) communities of cyanobacteria,
  algae, lichens, bryophytes, and heterotrophic microbes or by physical raindrop-impact
  and mineral crusting processes.
