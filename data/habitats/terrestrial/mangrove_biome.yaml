identifier: ENVO:01000181
label: mangrove biome
definition: A mangrove biome is a terrestrial biome which includes, across its spatial
  extent, mangrove plants (Rhizophoraceae). Mangrove plants are able to withstand
  high levels of salinity as well as regions of anoxia and frequent tidal inundation.
  Mangrove biomes often occur near tropical and sub-tropical estuaries and depositional
  marine coastal environments where fine sediments (often with high organic content)
  collect in areas protected from high energy wave action.
