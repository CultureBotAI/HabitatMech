identifier: ENVO:00000262
label: steppe
definition: A plain without trees (apart from those near rivers and lakes); it is
  similar to a prairie, although a prairie is generally considered as being dominated
  by tall grasses, while short grasses are said to be normal in the steppe. It may
  be semi-desert, or covered with grass or shrubs or both, depending on the season
  and latitude.
