    label: terrestrial biome
    node_type: HABITAT
    grounding: ENVO:00000446
  - node_id: land_surface
    label: land surface
    node_type: HABITAT
  - node_id: terrestrial_plants
    label: terrestrial plants
    node_type: TAXON
  - node_id: root_exudates
    label: root exudates
    node_type: CHEMICAL
