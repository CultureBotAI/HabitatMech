causal_graphs:
- graph_id: terrestrial_biome_root_litter_soil_pulses
  title: Terrestrial biome root-litter soil pulses
  description: Terrestrial biomes couple plant primary production to spatially heterogeneous
    soils through root exudation, litter deposition, and episodic soil water films.
    Roots and litter supply labile and polymeric organic matter, soil pores create
    isolated microbial microsites, and drying-rewetting pulses impose water stress
    while stimulating bacteria and fungi that mineralize plant carbon belowground.
  nodes:
