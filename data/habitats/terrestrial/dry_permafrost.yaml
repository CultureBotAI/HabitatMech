identifier: habitatmech:GOLD.52092cfbb2
label: dry permafrost
definition: A permafrost containing negligible ice cement and extremely low liquid
  water availability (characteristic of hyperarid polar cold deserts such as the McMurdo
  Dry Valleys), where ice-free pore spaces create cold, hyperarid conditions for cryophilic
  microorganisms.
