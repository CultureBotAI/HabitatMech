causal_graphs:
- graph_id: grassland_soil_root_drought_carbon_pulses
  title: Grassland soil root drought carbon pulses
  description: Grassland soils are structured by dense herbaceous root systems, moderate
    organic inputs, and recurrent shifts in water availability. Root exudates and
    root litter feed rhizosphere bacteria, arbuscular mycorrhizal fungi couple roots
    to nutrient cycling, and drought followed by rewetting redistributes soluble carbon
    and shifts the bacteria and fungi responsible for decomposition, nitrogen cycling,
    and extracellular enzyme production.
  nodes:
  - node_id: grassland_soil
    label: grassland soil
    node_type: HABITAT
    grounding: ENVO:00005750
  - node_id: grassland_plant_cover
    label: grassland plant cover
    node_type: HABITAT
  - node_id: dense_fine_roots
    label: dense fine roots
    node_type: HABITAT
  - node_id: root_exudates
    label: root exudates
    node_type: CHEMICAL
  - node_id: root_litter
    label: root litter
    node_type: CHEMICAL
  - node_id: rhizosphere_bacteria
    label: rhizosphere bacteria
    node_type: TAXON
  - node_id: arbuscular_mycorrhizal_fungi
    label: arbuscular mycorrhizal fungi
    node_type: TAXON
  - node_id: soil_organic_matter
    label: soil organic matter
    node_type: CHEMICAL
  - node_id: extracellular_enzymes
    label: extracellular enzymes
    node_type: GENE_OR_PROTEIN
  - node_id: polymer_decomposition
    label: polymer decomposition
