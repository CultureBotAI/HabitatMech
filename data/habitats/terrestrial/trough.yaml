identifier: ENVO:00000499
label: trough
definition: A linear structural depression that extends laterally over a distance,
  while being less steep than a trench. A trough can be a narrow basin or a geologic
  rift. There are various oceanic troughs, troughs found under oceans; examples include
  the rift along the mid-oceanic ridge and the Cayman Trough.
