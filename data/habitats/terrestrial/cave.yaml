  - node_id: cave_sulfurovum_thiobacillus_nitrosomonas_nitrospira_and_pseudonocardia_guild
    label: chemolithoautotrophic Sulfurovum/Sulfuricurvum, Thiobacillus, Nitrosomonas/Nitrospira,
