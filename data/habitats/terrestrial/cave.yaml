    node_type: COMMUNITY
    description: Subterranean cave biofilm and sediment community comprising Sulfurovum-like
      and Sulfuricurvum Epsilonproteobacteria, Thiobacillus sulfur oxidizers, Nitrosomonas,
      Nitrospira, and Candidatus Nitrotoga nitrifiers, and karst cave cbbL-harboring
      Pseudonocardia, Bradyrhizobium, Mesorhizobium, and Variovorax.
  - node_id: cave_sqr_soxb_amoa_nifh_and_rubisco_cbbl_chemolithoautotrophic_enzymes
    label: sulfide-quinone oxidoreductase (Sqr), Sox pathway proteins (soxB), ammonia
      monooxygenase (amoA), nitrogenase (NifH), 4-hydroxybutyryl-CoA dehydratase,
      and RuBisCO (cbbL)
    node_type: GENE_OR_PROTEIN
    description: Sulfurovum sulfide-quinone oxidoreductase (Sqr), Gammaproteobacteria/Betaproteobacteria
      Sox complex (soxB), Nitrosomonas ammonia monooxygenase (amoA), nitrogenase NifH,
      4-hydroxybutyryl-CoA dehydratase, and Calvin-Benson-Bassham cycle ribulose-1,5-bisphosphate
      carboxylase/oxygenase large subunit (cbbL/RuBisCO).
  - node_id: subterranean_dark_co2_fixation_sulfur_oxidation_and_nitrification_primary_production
    label: dark chemolithoautotrophic CO2 fixation, incomplete/complete sulfide oxidation
      to S(0) and sulfate, and ammonia/nitrite oxidation
    node_type: COMMUNITY_PROCESS
    description: Subterranean primary production driven by Sqr- and Sox-catalyzed
      sulfide oxidation and AmoA-catalyzed nitrification coupled to RuBisCO (cbbL)
      and 3-hydroxypropionate/4-hydroxybutyrate dark inorganic carbon assimilation.
  edges:
  - edge_id: cave_maintains_aphotic_oligotrophic_and_sulfidic_co2_geochemical_regime
    subject: cave
    predicate: maintains
    object: aphotic_oligotrophic_karst_co2_and_sulfide_ammonium_redox_interface
    description: Subterranean karst and sulfidic caves maintain aphotic, nutrient-deficient
      carbonate surfaces, elevated CO2, and high-sulfide/low-oxygen redox niches.
    evidence:
    - reference: PMID:32471344
      snippet: Karst caves are considered as extreme environments with nutrition deficiency,
        darkness, and oxygen deprivation, and they are also the sources of biodiversity
        and metabolic pathways.
      notes: Subterranean karst caves maintain permanent darkness, oligotrophy, and
        localized oxygen deprivation (PMID:32471344).
    - reference: PMID:25620962
      snippet: The Frasassi and Acquasanta Terme cave systems in Italy host isolated
        lithoautotrophic ecosystems characterized by sulfur-oxidizing biofilms with
        up to 50% S(0) by mass. Filamentous Epsilonproteobacteria are among the principal
        biofilm architects in Frasassi and Acquasanta Terme streams, colonizing high-sulfide,
        low-oxygen niches relative to other major biofilm-forming populations.
      notes: Sulfidic cave streams create isolated aphotic high-sulfide, low-oxygen
        geochemical niches (PMID:25620962).
  - edge_id: aphotic_cave_redox_regime_selects_for_chemolithoautotrophic_sulfur_and_nitrogen_guilds
    subject: aphotic_oligotrophic_karst_co2_and_sulfide_ammonium_redox_interface
    predicate: selects for
    object: cave_sulfurovum_thiobacillus_nitrosomonas_nitrospira_and_pseudonocardia_guild
    description: Dark sulfidic and oligotrophic karst cave niches select for Sulfurovum-like
      Epsilonproteobacteria, Thiobacillus, Nitrosomonas, Nitrospira, Candidatus Nitrotoga,
      and cbbL-bearing Pseudonocardia and Alphaproteobacteria.
    evidence:
    - reference: PMID:25620962
      snippet: Metagenomic sequencing of eight biofilm samples indicated the presence
        of diverse and abundant Epsilonproteobacteria. Populations of Sulfurovum-like
        organisms were the most abundant Epsilonproteobacteria regardless of differences
        in biofilm morphology, temperature, or water chemistry.
      notes: High-sulfide, low-oxygen cave stream niches select for abundant Sulfurovum-like
        and Sulfuricurvum Epsilonproteobacteria (PMID:25620962).
    - reference: PMID:19474813
      snippet: DNA-based stable-isotope probing analyses using 13C-bicarbonate showed
        that Thiobacillus spp. were most active in assimilating CO2 and also implied
        that ammonia and nitrite oxidizers were active during incubations. Nitrosomonas
        spp. were detected in both 16S rRNA and amoA gene libraries from the 'heavy'
        DNA and sequences related to nitrite-oxidizing bacteria Nitrospira and Candidatus
        'Nitrotoga' were also detected in the 'heavy' DNA, which suggests that ammonia/nitrite
        oxidation may be another major primary production process in this unique ecosystem.
      notes: Dark chemolithoautotrophic conditions in Movile Cave select for active
        CO2-assimilating Thiobacillus, Nitrosomonas, Nitrospira, and Candidatus Nitrotoga
        (PMID:19474813).
    - reference: PMID:42962793
      snippet: 'High-throughput sequencing of the cbbL gene further revealed pronounced
        habitat-specific community structures: overlying soils exhibited the highest
        diversity and enrichments of Mesorhizobium, Variovorax, and Bradyrhizobium,
        whereas sediments were dominated by Pseudonocardia.'
      notes: Oligotrophic karst cave sediments select for cbbL-encoding autotrophic
        Pseudonocardia communities (PMID:42962793).
  - edge_id: cave_guild_expresses_sqr_soxb_amoa_nifh_and_rubisco_cbbl
    subject: cave_sulfurovum_thiobacillus_nitrosomonas_nitrospira_and_pseudonocardia_guild
    predicate: expresses
    object: cave_sqr_soxb_amoa_nifh_and_rubisco_cbbl_chemolithoautotrophic_enzymes
    description: Cave chemolithoautotrophs harbor and express sulfide-quinone oxidoreductase
      (Sqr), Sox proteins (soxB), ammonia monooxygenase (amoA), nitrogenase NifH,
      4-hydroxybutyryl-CoA dehydratase, and RuBisCO (cbbL).
    evidence:
    - reference: PMID:19474813
      snippet: Microbial diversity in Movile Cave (Romania) was studied using bacterial
        and archaeal 16S rRNA gene sequence and functional gene analyses, including
        ribulose-1,5-bisphosphate carboxylase/oxygenase (RuBisCO), soxB (sulfate thioesterase/thiohydrolase)
        and amoA (ammonia monooxygenase). Sulfur oxidizers from both Gammaproteobacteria
        and Betaproteobacteria were detected in 16S rRNA, soxB and RuBisCO gene libraries.
      notes: Movile Cave sulfur- and ammonia-oxidizing guilds harbor functional RuBisCO,
        soxB, and amoA genes (PMID:19474813).
    - reference: PMID:25620962
      snippet: Multiple homologs of sulfide-quinone oxidoreductase (Sqr), together
        with incomplete or absent Sox pathways, suggest that cave Sulfurovum-like
        Epsilonproteobacteria oxidize sulfide incompletely to S(0) using either O2
        or nitrate as a terminal electron acceptor, consistent with previous evidence
        that they are most successful in niches with high dissolved sulfide to oxygen
        ratios. In contrast, we recovered homologs of the complete complement of Sox
        proteins affiliated Gammaproteobacteria and with less abundant Sulfuricurvum
        spp. and Arcobacter spp., suggesting that these populations are capable of
        the complete oxidation of sulfide to sulfate.
      notes: Cave Sulfurovum-like Epsilonproteobacteria encode multiple Sqr homologs
        while Gammaproteobacteria, Sulfuricurvum, and Arcobacter encode complete Sox
        enzyme complexes (PMID:25620962).
    - reference: PMID:32471344
      snippet: The prediction of function showed that various enzymes, including ribulose-bisphosphate
        carboxylase, 4-hydroxybutyryl-CoA dehydratase, nitrogenase NifH, and Nitrite
        reductase, involved in carbon and nitrogen cycles were detected in Zhijin
        cave.
      notes: Karst cave bacterial communities encode ribulose-bisphosphate carboxylase,
        4-hydroxybutyryl-CoA dehydratase, nitrogenase NifH, and nitrite reductase
        (PMID:32471344).
  - edge_id: cave_sqr_sox_amoa_and_cbbl_enzymes_catalyze_dark_carbon_fixation_and_sulfur_cycling
    subject: cave_sqr_soxb_amoa_nifh_and_rubisco_cbbl_chemolithoautotrophic_enzymes
    predicate: catalyzes
    object: subterranean_dark_co2_fixation_sulfur_oxidation_and_nitrification_primary_production
    description: Sqr, Sox, AmoA, and RuBisCO (cbbL) enzymes catalyze sulfide oxidation
      to elemental sulfur and sulfate, nitrification, and dark inorganic carbon assimilation
      that sustain subterranean cave food webs.
    evidence:
    - reference: PMID:19474813
      snippet: The results provided molecular biological evidence to support the hypothesis
        that Movile Cave is driven by chemolithoautotrophy, mainly through sulfur
        oxidation by sulfur-oxidizing bacteria and reveal that ammonia- and nitrite-oxidizing
        bacteria may also be major primary producers in Movile Cave.
      notes: Chemolithoautotrophic sulfur oxidation and ammonia/nitrite oxidation
        drive primary production in Movile Cave (PMID:19474813).
    - reference: PMID:42962793
      snippet: Microcosm incubations under a CO2 gradient further demonstrated a nonlinear
        response of microbial carbon fixation, with both the microbial inorganic carbon
        incorporation rate (1.29 mg C kg-1 d-1) and cbbL abundance (1.77 × 106 copies
        g-1) peaking at 2000 ppm CO2.
      notes: cbbL-encoded RuBisCO drives measurable dark inorganic carbon incorporation
        (1.29 mg C kg-1 d-1) in karst cave sediments (PMID:42962793).
