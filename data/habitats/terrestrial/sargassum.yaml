label: stranded Sargassum wrack environment
definition: An environmental system determined by an organism of the brown macroalgal
  genus Sargassum deposited onshore in a coastal terrestrial beach wrack zone, where
  decomposing macroalgal biomass supports halotolerant, alginate-degrading, and sulfate-reducing
  microorganisms.
