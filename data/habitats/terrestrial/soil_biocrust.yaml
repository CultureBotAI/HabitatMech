identifier: ENVO:01000910
label: soil biocrust
definition: A biocrust which is formed by photosynthetic microbial assemblages colonising
  the surface layer of a portion of arid soil. Through their successional dynamics,
  these communities reduce the soil surface's albedo, impart it with stability against
  erosion, modify its hydrology, and promote its fertility.
