identifier: ENVO:00000264
label: seamount
definition: A mountain rising from the ocean seafloor that does not reach to the water's
  surface (sea level), and thus is not an island. Typically formed from volcanoes
  that rise abruptly and are usually found rising from a seafloor of 1,000 - 4,000
  meters depth. Independent features that rise to at least 1,000 meters above the
  seafloor.
