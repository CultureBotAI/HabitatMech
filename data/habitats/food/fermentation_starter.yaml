  curator: codex-gpt-5
  action: ANNOTATION_CORRECTED
  changes: 'Corrected synonym_type for ''Daqu'' (ENVO) from ''EXACT_SYNONYM'' to ''NARROW_SYNONYM''.
    Evidence: https://pubmed.ncbi.nlm.nih.gov/24863368/. Local reviewed disagreement
    with ENVO hasExactSynonym (revision a2455d1a77e46bb8a664d65a157166b539269042):
    Daqu is a cereal-pulse solid-state starter for liquor/vinegar, whereas the generic
    class also includes independently inspected brewing and dairy inocula (https://bacdive.dsmz.de/strain/17184
    and https://bacdive.dsmz.de/strain/14691). Retain the term as a narrower synonym,
    not a claim that all starters are Daqu. Original inventory, generic identity,
    source attestations and status remain unchanged. https://github.com/CultureBotAI/HabitatMech/issues/2057;
    review 20261014T111500Z-fermentation_starter F2.'
