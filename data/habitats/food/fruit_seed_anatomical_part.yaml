definition: 'The part of a flowering plant that typically contains the embryo with
  its protective coat and stored food and that can develop into a new plant under
  the proper conditions; fertilised and mature ovule (Source: Webster''s).  Seeds
  and fruits commonly called seeds include: grain, kernel, berry, ear, corn, nut.
