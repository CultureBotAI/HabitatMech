  - node_id: soy_sauce_aspergillus_oryzae_tetragenococcus_halophilus_and_zygosaccharomyces_rouxii_guild
    label: Aspergillus oryzae, Tetragenococcus halophilus, and Zygosaccharomyces rouxii
      soy sauce fermentation guild
    node_type: COMMUNITY
    description: Dominant halophilic soy sauce microbiota comprising koji molds Aspergillus
      oryzae and A. sojae, salt-tolerant lactic acid bacteria Tetragenococcus halophilus
      and Weissella spp., and osmotolerant yeast Zygosaccharomyces rouxii.
  - node_id: koji_protease_peptidase_glutaminase_umami_tca_enzymes_and_ha_resistant_gapdh
    label: proteases, peptidases, glutaminases, aspartate aminotransferase, citrate
      synthase/aconitase/IDH, and Tetragenococcus GAPDH
    node_type: GENE_OR_PROTEIN
    description: Soybean-hydrolyzing proteases, peptidases, and glutaminases, umami
      amino-acid metabolic enzymes (aspartate aminotransferase, citrate synthase,
      aconitase, isocitrate dehydrogenase) from Aspergillus oryzae and Zygosaccharomyces
      rouxii, and glyceraldehyde-3-phosphate dehydrogenase (GAPDH) in Tetragenococcus
      halophilus.
  - node_id: soy_protein_hydrolysis_umami_amino_acid_biosynthesis_and_moromi_lactic_fermentation
    label: soy protein hydrolysis, umami amino acid biosynthesis, and heptelidic acid-tolerant
      lactic acid fermentation
    node_type: COMMUNITY_PROCESS
    description: Enzymatic hydrolysis of soy/wheat proteins into peptides and glutamate,
      TCA/transaminase-driven synthesis of umami flavor amino acids across 0-120 days
      of fermentation, and GAPDH-dependent lactic acid fermentation in high-salt moromi.
  edges:
  - edge_id: soy_sauce_maintains_high_salt_moromi_and_heptelidic_acid_environment
    subject: soy_sauce
    predicate: maintains
    object: high_salt_soy_sauce_moromi_and_koji_heptelidic_acid_matrix
    description: Soy sauce brewing creates a prolonged high-salt moromi fermentation
      environment where Aspergillus oryzae RIB40 produces heptelidic acid under high-salt
      conditions.
    evidence:
    - reference: PMID:29629630
      snippet: We isolated and identified heptelidic acid (HA), an inhibitor of glyceraldehyde-3-phosphate
        dehydrogenase (GAPDH), produced by A. oryzae RIB40 as the growth inhibitor
        of the salt-tolerant lactic acid bacteria. The growth inhibition of T. halophilus
        D10 by HA was suggested to be associated with the direct inhibition of GAPDH
        activity under high salt environment.
      notes: Soy sauce moromi brewed with Aspergillus oryzae contains heptelidic acid
        under a high-salt environment (PMID:29629630).
  - edge_id: moromi_matrix_selects_for_aspergillus_tetragenococcus_and_zygosaccharomyces_succession
    subject: high_salt_soy_sauce_moromi_and_koji_heptelidic_acid_matrix
    predicate: selects for
    object: soy_sauce_aspergillus_oryzae_tetragenococcus_halophilus_and_zygosaccharomyces_rouxii_guild
    description: Soy sauce fermentation selects for a staged succession of Aspergillus
      oryzae, Tetragenococcus halophilus, Weissella spp., and Zygosaccharomyces rouxii
      across early (0-15 d), mid (60-90 d), and late (90-120 d) moromi stages.
    evidence:
    - reference: PMID:38024365
      snippet: Metagenomic analysis revealed that Tetragenococcus halophilus, Weissella
        confusa, Weissella paramesenteroides, Enterobacter hormaechei, and Aspergillus
        oryzae were the dominant microbiota.
      notes: Tetragenococcus halophilus, Weissella spp., and Aspergillus oryzae dominate
        the Cantonese soy sauce metagenome alongside Zygosaccharomyces rouxii (PMID:38024365).
    - reference: PMID:38024365
      snippet: Among them, early fermentation (0-15d) was dominated by A. oryzae and
        T. halophilus, mid-term fermentation (60-90d) was dominated by Z. rouxii,
        A. oryzae, and T. halophilus, and late fermentation (90-120d) was dominated
        by A. oryzae, Z. rouxii, and T. halophilus.
      notes: Aspergillus oryzae, Tetragenococcus halophilus, and Zygosaccharomyces
        rouxii dominate sequential 0-120 d fermentation stages of soy sauce (PMID:38024365).
  - edge_id: soy_sauce_guild_expresses_hydrolases_umami_enzymes_and_mutant_gapdh
    subject: soy_sauce_aspergillus_oryzae_tetragenococcus_halophilus_and_zygosaccharomyces_rouxii_guild
    predicate: expresses
    object: koji_protease_peptidase_glutaminase_umami_tca_enzymes_and_ha_resistant_gapdh
    description: Aspergillus oryzae, A. sojae, and Zygosaccharomyces rouxii supply
      proteases, peptidases, glutaminases, aspartate aminotransferase, citrate synthase,
      aconitase, and isocitrate dehydrogenase, while Tetragenococcus halophilus strains
      carry GAPDH variants.
    evidence:
    - reference: PMID:25073685
      snippet: Several key hydrolases in soy sauce fermentation such as proteases,
        peptidases, and glutaminases are supplied by Aspergillus sojae or Aspergillus
        oryzae. The genes encoding these hydrolases were successfully expressed in
        salt-tolerant yeast Zygosaccharomyces rouxii.
      notes: Aspergillus sojae and Aspergillus oryzae supply key proteases, peptidases,
        and glutaminases in soy sauce fermentation (PMID:25073685).
    - reference: PMID:38024365
      snippet: Kyoto Encyclopedia of Genes and Genomes analysis revealed that the
        main enzymes involved in the metabolism of umami amino acids were aspartate
        aminotransferase, citrate synthase, aconitase, and isocitrate dehydrogenase,
        which were produced by Z. rouxii and A. oryzae during early fermentation (0-15
        d) and the middle fermentation stage (60-90 d).
      notes: Metaproteomics identified aspartate aminotransferase, citrate synthase,
        aconitase, and isocitrate dehydrogenase secreted by Z. rouxii and A. oryzae
        during soy sauce fermentation (PMID:38024365).
    - reference: PMID:29629630
      snippet: The difference in the susceptibility to HA among various strains of
        T. halophilus was caused by the mutations in the gene encoding GAPDH.
      notes: Mutations in the Tetragenococcus halophilus GAPDH gene determine strain
        resistance to A. oryzae heptelidic acid in soy sauce moromi (PMID:29629630).
  - edge_id: hydrolases_and_gapdh_catalyze_umami_amino_acid_and_lactic_acid_fermentation
    subject: koji_protease_peptidase_glutaminase_umami_tca_enzymes_and_ha_resistant_gapdh
    predicate: catalyzes
    object: soy_protein_hydrolysis_umami_amino_acid_biosynthesis_and_moromi_lactic_fermentation
    description: Secreted hydrolases and TCA/aminotransferase enzymes drive umami
      flavor amino acid formation while heptelidic-acid-resistant GAPDH enables Tetragenococcus
      halophilus growth and lactic acid fermentation in soy sauce moromi.
    evidence:
    - reference: PMID:38024365
      snippet: Using the Top 15 dominant microbiota identified by metagenomics as
        the database, LTQ Orbitrap Velos Pro ETD mass spectrometry was used to obtain
        metaproteomic information about the microbes in the soy sauce, and the results
        indicated that the active enzymes involved in the metabolism of amino acids
        were secreted by microorganisms such as A. oryzae, T. halophilus, and Zygosaccharomyces
        rouxii.
      notes: Active enzymes secreted by A. oryzae, T. halophilus, and Z. rouxii drive
        flavor and umami amino acid metabolism in soy sauce (PMID:38024365).
    - reference: PMID:29629630
      snippet: In soy sauce brewing, the results of the fermentation of lactic acid
        greatly affect the quality of soy sauce. The soy sauce moromi produced with
        Aspergillus oryzae RIB40 allows the growth of Tetragenococcus halophilus NBRC
        12172 but not T. halophilus D10.
      notes: Heptelidic acid-tolerant GAPDH in Tetragenococcus halophilus NBRC 12172
        sustains lactic acid fermentation essential for soy sauce quality in A. oryzae
        moromi (PMID:29629630).
