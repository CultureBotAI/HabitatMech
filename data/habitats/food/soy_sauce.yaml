causal_graphs:
- graph_id: soy_sauce_koji_moromi_aspergillus_tetragenococcus_zygosaccharomyces_hydrolase_gapdh_fermentation
  title: Soy sauce high-salt koji/moromi brine and heptelidic acid gradient, Aspergillus
    oryzae / Tetragenococcus halophilus / Zygosaccharomyces rouxii succession, and
    protease/glutaminase/GAPDH/TCA umami fermentation mechanism
  description: Brewed soy sauce fermentation progresses from solid-state soybean/wheat
    koji to a prolonged 120-day high-salt liquid moromi mash containing mold-derived
    secondary metabolites including the sesquiterpene lactone heptelidic acid (HA).
    This high-salt moromi environment selects for a halophilic microbial succession
    dominated by the koji mold Aspergillus oryzae (or A. sojae), the salt-tolerant
    lactic acid bacterium Tetragenococcus halophilus (alongside Weissella spp.), and
    the osmotolerant yeast Zygosaccharomyces rouxii. Aspergillus oryzae and Zygosaccharomyces
    rouxii secrete proteases, peptidases, glutaminases, aspartate aminotransferase,
    citrate synthase, aconitase, and isocitrate dehydrogenase to hydrolyze soybean
    proteins and synthesize umami flavor amino acids, while adapted Tetragenococcus
    halophilus strains carry resistance mutations in glyceraldehyde-3-phosphate dehydrogenase
    (GAPDH) that overcome A. oryzae heptelidic acid inhibition to sustain lactic acid
    fermentation under high-salt moromi conditions.
  nodes:
