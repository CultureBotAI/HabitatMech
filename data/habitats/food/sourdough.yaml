identifier: habitatmech:GOLD.3153798c1a
label: active sourdough starter
definition: A fermentation starter which consists of cereal flour and water acidified
  by the growth of lactic acid bacteria and yeasts, and which is maintained in a metabolically
  active state by repeated backslopping until baking ends it.
