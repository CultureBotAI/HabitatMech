identifier: FOODON:03544454
label: 44540 - starter cultures (efsa foodex2)
definition: The group includes any type of bacteria used as starter cultures, i.e.
  a microbial preparation based on bacteria used in food production intentionally
  inoculated in a raw material to initiate and carry out fermentations. For example,
  starter cultures are used in meat and dairy technology. The part consumed/analysed
  is by default the whole marketed unit or a homogeneous representative portion.[https://en.wikipedia.org/wiki/Starter_cultures]
  and [https://www.google.co.uk/search?tbm=isch&q=Starter cultures]
