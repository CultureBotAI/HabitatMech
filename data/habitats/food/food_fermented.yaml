- timestamp: '2026-08-17T00:00:00Z'
  curator: claude-opus-5
  action: GROUND
  changes: 'Grounded to FOODON:00001258 ''food (fermented)'' (CLOSE). Definitions-from-research
    pass (#110): the third case where the research found an existing term rather than
    a gap, after Cnidaria (#123) and Fungi (#124). FOODON:00001258 ''food (fermented)''
    — ''food material which has been fermented'' — is in the vendored slice, and the
    corpus ALREADY grounds the equivalent BacDive ''Fermented'' bin to it. Leaving
    this minted published two HabitatMech identifiers for one concept and split 173
    Madin taxa from the 242 BacDive strains that belong on the same record. CLOSE
    rather than EXACT because the bin misses both ways: it under-covers FoodOn, which
    includes post-fermentation-killed products such as baked bread that are never
    an isolation source, and over-covers it with malted barley and vinegar pickles.
    ENVO is not an option here at all — it obsoleted its food branch and redirects
    to FoodOn. (source concept habitatmech:BACDIVE.2b1959f1f0)'
