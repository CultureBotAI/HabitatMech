identifier: BTO:0000155
label: bronchoalveolar lavage fluid
definition: A technique by which cells and fluid from bronchioles and lung alveoli
  are removed for diagnosis of disease or evaluation of treatment. A bronchoscope
  is wedged into a bronchus and sterile saline is pumped in and then removed along
  with the fluid and cells to be analyzed.
