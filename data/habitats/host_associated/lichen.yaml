  changes: 'Confirmed UNGROUNDED: no ontology term fits this concept. FOODON:03412345
    ''lichen'' kept as an xref. Organism-identity screen (#109): grounded EXACT to
    FOODON:03412345 ''lichen'', which is a composite organism arising from algae or
    cyanobacteria living among fungal filaments — an organism, not a place. The screen
    that exists to catch exactly this reported 0 for months because it tested only
    NCIT and mesh ancestry and only the record''s identity; widening it to UBERON:0000468
    and to parent_habitats surfaced this family. The GOLD path says host-associated,
    so the concept is the environment the organism provides, which is the same family
    as the sponge, nematode and reptile term requests. The organism term is kept as
    an xref (#99) rather than an identity. (source concept habitatmech:GOLD.5e1a5d695c)'
