identifier: UBERON:0022277
label: hepatic flexure of colon
definition: Hepatic (or the right colic) flexure is the sharp bend between the ascending
  and the transverse colon. The right colic flexure is adjacent to the liver, and
  is therefore also known as the hepatic flexure. Thus, the left colic flexure is
  also known as the splenic flexure (as it is close to the spleen). The hepatic flexure
  lies in the right upper quadrant of the abdomen in humans.
