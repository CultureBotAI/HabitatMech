    node_type: COMMUNITY_PROCESS
    description: Hydrolysis of pit membrane pectins and fucosylated xyloglucans allowing
      Xylella fastidiosa to breach intervessel pit membranes, alter air-seeding thresholds,
      reduce stem hydraulic conductivity, and Regulated adhesiveness vs motility via
