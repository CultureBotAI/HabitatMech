  edges:
  - edge_id: xylem_vessel_maintains_pectic_and_xyloglucan_pit_membranes
    subject: xylem_vessel
    predicate: maintains
    object: intervessel_pit_membrane_pectic_and_fucosylated_xyloglucan_matrix
    description: Xylem vessels are separated from adjacent vessels and parenchyma
      cells by pit membranes composed of pectic and fucosylated xyloglucan/cellulosic
      substrates.
    evidence:
    - reference: PMID:31216219
      snippet: X. fastidiosa is xylem-limited and interfaces primarily with pit membranes
        (PMs) that separate xylem vessels from one another and from adjacent xylem
        parenchyma cells. PMs are composed of both pectic and cellulosic substrates,
        and dissolution of PMs is facilitated by X. fastidiosa cell wall-degrading
        enzymes.
      notes: Intervessel pit membranes separating xylem vessels consist of pectic
        and cellulosic/fucosylated xyloglucan substrates (PMID:31216219).
  - edge_id: pit_membrane_vascular_niche_selects_for_xylem_limited_xylella_fastidiosa
    subject: intervessel_pit_membrane_pectic_and_fucosylated_xyloglucan_matrix
    predicate: selects for
    object: xylem_limited_xylella_fastidiosa_vascular_colonizer_guild
    description: The xylem vessel network and pit membrane surfaces support colonization
      and biofilm formation by the xylem-limited bacterium Xylella fastidiosa.
    evidence:
    - reference: PMID:17427811
      snippet: X. fastidiosa systemically colonizes the xylem elements of grapevines
        and is able to breach the pit pore membranes separating xylem vessels by unknown
        mechanisms.
      notes: Xylella fastidiosa is a specialized colonizer of grapevine xylem vessel
        elements (PMID:17427811).
    - reference: PMID:33905519
      snippet: Xylella fastidiosa (Xf) is the xylem-dwelling bacterial agent associated
        with Pierce's disease (PD), which leads to significant declines in productivity
        in agriculturally important species like grapevine (Vitis vinifera). Xf spreads
        through the xylem network by digesting the pit membranes (PMs) between adjacent
        vessels, thereby potentially changing the hydraulic properties of the stem.
      notes: Xylella fastidiosa dwells in the xylem network and forms biofilms on
        intervessel pit membrane surfaces (PMID:33905519).
  - edge_id: xylella_fastidiosa_expresses_pgla_engxca1_engxca2_and_rpff
    subject: xylem_limited_xylella_fastidiosa_vascular_colonizer_guild
    predicate: expresses
    object: xylella_pgla_polygalacturonase_engxca1_engxca2_and_rpff_dsf_synthase
    description: Xylella fastidiosa expresses the pglA polygalacturonase gene, beta-1,4-endoglucanases
      EngXCA1 and EngXCA2, and RpfF (rpfF)-dependent diffusible signal factor (DSF).
    evidence:
    - reference: PMID:17427811
      snippet: These genes include several beta-1,4 endoglucanases, several xylanases,
        several xylosidases, and one polygalacturonase (PG). In this study, we demonstrated
        that the pglA gene encodes a functional PG.
      notes: Xylella fastidiosa encodes a functional polygalacturonase via the pglA
        gene alongside beta-1,4-endoglucanases (PMID:17427811).
    - reference: PMID:31216219
      snippet: Here, we demonstrate that two X. fastidiosa β-1,4-endoglucanases (EGases),
        EngXCA1 and EngXCA2, also play a role in how X. fastidiosa interfaces with
        grapevine PMs.
      notes: Xylella fastidiosa produces the beta-1,4-endoglucanases EngXCA1 and EngXCA2
        targeting fucosylated xyloglucans in pit membranes (PMID:31216219).
    - reference: PMID:28777044
      snippet: Expression of genes contributing to xylem colonization are suppressed,
        while those necessary for insect vector acquisition are increased with increasing
        concentrations of diffusible signal factor (DSF), whose production is dependent
        on RpfF.
      notes: RpfF (rpfF) synthesizes diffusible signal factor (DSF) that regulates
        adhesiveness and motility gene expression in xylem-colonizing Xylella fastidiosa
        (PMID:28777044).
  - edge_id: pgla_and_engxca_catalyze_pit_membrane_digestion_and_systemic_xylem_spread
    subject: xylella_pgla_polygalacturonase_engxca1_engxca2_and_rpff_dsf_synthase
    predicate: catalyzes
    object: pit_membrane_dissolution_intervessel_migration_and_hydraulic_conductivity_loss
    description: PglA and EngXCA1/EngXCA2 hydrolyze pit membrane pectins and fucosylated
      xyloglucans to enable systemic xylem colonization and reduce stem hydraulic
      conductivity, while RpfF-produced DSF modulates adhesiveness vs dispersal.
    evidence:
    - reference: PMID:17427811
      snippet: A mutant in pglA lost pathogenicity and was compromised in its ability
        to systemically colonize Vitis vinifera grapevines. The results indicate that
        PG is required for X. fastidiosa to successfully infect grapevines and is
        a critical virulence factor for X. fastidiosa pathogenesis in grapevine.
      notes: Loss of pglA abolishes systemic xylem vessel colonization and pathogenicity
        of Xylella fastidiosa in grapevine (PMID:17427811).
    - reference: PMID:31216219
      snippet: The loss of EngXCA1 and EngXCA2 in tandem reduces both X. fastidiosa
        virulence and population size and slows the rate of PD symptom development
        and progression.
      notes: Tandem deletion of EngXCA1 and EngXCA2 impairs pit membrane xyloglucan
        dissolution, xylem population size, and disease progression (PMID:31216219).
    - reference: PMID:33905519
      snippet: PM damage only occurred in stems perfused with polygalacturonase. Although
        the damaged PM area was small (2%-9% of the total pit aperture area), membrane
        digestion led to significant changes in the median air-seeding thresholds,
        and most importantly, shifted frequency distribution. Finally, enzyme perfusion
        also resulted in a universal reduction in stem hydraulic conductivity, suggesting
        the development of tyloses may not be the only contributing factor to reduced
        hydraulic conductivity in infected grapevine.
      notes: Polygalacturonase digestion of intervessel pit membranes alters air-seeding
        thresholds and reduces stem hydraulic conductivity (PMID:33905519).
