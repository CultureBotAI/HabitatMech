causal_graphs:
- graph_id: xylem_vessel_xylella_fastidiosa_pgla_engxca_pit_membrane_digestion_and_rpff_dsf_signaling
  title: Plant xylem vessel pit membrane pectin/xyloglucan barrier, Xylella fastidiosa
    colonization, and PglA polygalacturonase / EngXCA1-EngXCA2 endoglucanase / RpfF-DSF
    systemic movement mechanism
  description: Plant xylem vessels transport water and mineral sap across vascular
    networks partitioned by intervessel pit membranes (PMs) composed of homogalacturonan
    pectins and fucosylated xyloglucan/cellulosic polymers. This xylem-limited vascular
    niche selects for specialized vascular bacteria including Xylella fastidiosa,
    the causal agent of Pierce's disease in Vitis vinifera grapevines. Xylella fastidiosa
    encodes and secretes polygalacturonase PglA (pglA) and beta-1,4-endoglucanases
    EngXCA1 and EngXCA2 under the regulation of the diffusible signal factor (DSF)
    synthase RpfF (rpfF). PglA and EngXCA1/EngXCA2 enzymatically digest intervessel
    pit membrane pectins and fucosylated xyloglucans, breaching pit pore membranes
    to enable vessel-to-vessel systemic colonization while reducing stem hydraulic
    conductivity and air-seeding thresholds.
