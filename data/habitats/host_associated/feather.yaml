identifier: BTO:0000447
label: feather
definition: Any of the light horny epidermal outgrowths that form the external covering
  of the body of birds and that consist of a shaft bearing on each side a series of
  barbs which bear barbules which in turn bear barbicels commonly ending in hooked
  hamuli and interlocking with the barbules of an adjacent barb to link the barbs
  into a continuous vane.
