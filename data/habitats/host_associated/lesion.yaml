  action: DEFINED
  changes: 'Defined as ''human skin lesion environment'' under ENVO:2100003 ''skin
    environment''. Definition authored from the record''s committed deep-research
    report under research/habitats/, read in full; no new paid research was commissioned.
    GOLD''s Host-associated > Mammals: Human > Integumentary system > Skin > Lesion
    leaf is interpreted as a human lesional skin site rather than a disease, neurological
    lesion, plant lesion, or generic NCIT:C3824 lesion. ENVO:2100003 ''skin environment''
    is the tightest vendored genus because ENVO lacks lesion-, wound-, and other pathological-skin-environment
