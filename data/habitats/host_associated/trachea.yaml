identifier: BTO:0001388
label: trachea
definition: '1: The cartilaginous and membranous tube descending from the larynx and
  branching into the right and left main bronchi. It is kept patent by a series of
  about twenty transverse horseshoe-shaped cartilages. Called also windpipe. 2: One
  of a system of minute tubes ramifying throughout the body of a terrestrial arthropod
  and delivering air to the tissues. Called also tracheal tubule.'
