identifier: habitatmech:GOLD.ddb34837bf
label: human renal calculus
definition: An anatomical entity environment consisting of a mineralized concretion
  (kidney stone or nephrolith, composed of calcium oxalate, struvite, uric acid, or
  apatite) formed in the human renal pelvis or calyces, often associated with urease-producing
  or biofilm-forming uropathogenic bacteria.
