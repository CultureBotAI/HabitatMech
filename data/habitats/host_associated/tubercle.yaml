identifier: BTO:0002173
label: tubercle
definition: The adult male dorsal surface of Schistosoma is covered in small bosses
  called tubercles that provide purchase against the blood vessel wall when the worm
  is crawling up the mesenteric veins carrying the female in its ventral groove. Each
  tubercle has a thin, 2-3 micron, covering of the syncytial tegument. Enclosed entirely
  within the tegument cytoplasm of the tubercle are a series of spines, made of actin,
  which assist in gripping the blood vessel. The tegument is normally closely apposed
  to the underlying circular muscle layer, and separated from it only by an extracellular
  matrix of collagen fibres. The tubercle is the exception, where the tegument is
  lifted up by numerous extensions of parenchymal cells. The parenchymal cell bodies
  lie below the muscle layers and send out narrow extensions of cytoplasm which insinuate
  between the muscles to form the packing for the tubercle.
