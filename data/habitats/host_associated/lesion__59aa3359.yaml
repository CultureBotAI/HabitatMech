identifier: habitatmech:GOLD.be021eb56c
label: fish skin lesion environment
definition: A skin environment which is determined by a focal region of fish skin
  whose mucus layer and epidermis have been breached or eroded by injury or disease,
  exposing dermal, scale-pocket, or muscle tissue and exudate directly to the surrounding
  water.
