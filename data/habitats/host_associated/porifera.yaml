curation_history:
- timestamp: '2026-08-16T00:00:00Z'
  curator: claude-opus-5
  action: CONFIRM_UNGROUNDED
  changes: 'Confirmed UNGROUNDED: no ontology term fits this concept. NCBITaxon:6040
    ''Porifera'' kept as an xref. Host-taxon reversal (#114): this was NOT_APPLICABLE
    on the reasoning that ''a host taxon is not a habitat''. That reasoning is wrong,
    and the corpus already contradicted it — the same kind of concept was treated
    as a habitat for Sponge, Nematoda, Reptilia, Mammals, Birds and Fish, which keep
    their own identity and a term request for an <X>-associated environment. Host-associated
    > Porifera was NOT_APPLICABLE while its own child Porifera > Sponge was a term
    request.An organism acting as a host IS a habitat: it is where the microbe lives,
    and ENVO models exactly this at plant-associated, animal-associated and fungi-associated
    environment. What is not a habitat is the TAXON TERM — a phylum is a class of
    organisms, not a place — so the taxon stays an xref (#99) and the concept keeps
    its own identity as a term-request candidate. NOT_APPLICABLE said the concept
    is not a habitat, which is a stronger and false claim. (source concept habitatmech:GOLD.64acf9132c)'
- timestamp: '2026-08-16T05:58:02Z'
  curator: seed_from_sources
  action: SEEDED_FROM_SOURCES
  changes: 'Seeded from data/raw/ inventories; attested by BACDIVE, GOLD. Grounding:
    UNGROUNDED.'
- timestamp: '2026-08-21T00:00:00Z'
  curator: codex-gpt-5
  action: SAME_AS
  changes: 'Merged into habitatmech:GOLD.64acf9132c ''Porifera'': the same concept
    under another source''s name. Adversarial review follow-up (#158): GOLD''s Host-associated
    > Porifera > Sponge and Host-associated > Porifera name the same sponge host concept.
    Keeping both produced two HabitatMech records with the same curated label but
    conflicting parents and definitions, while the ROBOT export silently collapsed
    them. Merge onto the Porifera identifier because its curated definition uses the
    more specific existing parent ENVO:01001176 environment associated with an aquatic
    invertebrate. Both GOLD attestations remain on the merged record. (source concept
    habitatmech:GOLD.affd2445ea)'
- timestamp: '2026-08-28T00:00:00Z'
  curator: claude-opus-5
  action: SAME_AS
  changes: 'Merged into habitatmech:GOLD.64acf9132c ''sponge-associated environment'':
    the same concept under another source''s name. Novel-concept merge (#116) found
    while authoring definitions from the committed research report (#110): BacDive''s
    ''Porifera-Sponges'' and the GOLD survivor are the same habitat - a sponge acting
    as host - and the GOLD record already carries the authored definition ''sponge-associated
    environment'' over 413 assertions. The report reached the same conclusion independently,
    recommending that one term request cover all three source concepts rather than
    being filed three times. Writing a second definition here would have been rejected
    by the duplicate-requested_label rule (#161), and correctly so: this is a genuine
    duplicate, not a path-distinguished leaf. Do not sum the 86 BacDive strains with
    the GOLD organism counts - different assertion_unit. (source concept habitatmech:BACDIVE.18f9382d8d)'
- timestamp: '2026-09-02T00:00:00Z'
  curator: claude-opus-5
  action: DEFINED
  changes: 'Defined as ''sponge-associated environment'' under ENVO:01001002 ''animal-associated
    environment''. Definition drafted from the record''s deep-research report under
    research/habitats/ and read against it; the report''s proposed wording, genus
    and near-miss table are the evidence. Parented to the aquatic-invertebrate term
    rather than to animal-associated environment, which the report identified as the
    more specific existing genus. Genus moved from ENVO:01001176 ''environment associated
    with an aquatic invertebrate'' to ENVO:01001002 (#210), with the whole aquatic-invertebrate
    host family rather than record by record - #210 was filed over three records and
    the genus is actually held by five, so fixing only the three would have rebuilt
    the same split it reports. Both terms are true of the concept, so this chooses
    between two true genera on what each drags in: ENVO asserts ENVO:01001176 under
    ENVO:01001002 AND ENVO:01001055 ''environment associated with an animal part or
    small animal'', so the tighter genus makes every descendant inherit a size-and-partonomy
    restriction that is false of a whole adult sponge, ascidian, oyster, giant clam
    or sea urchin. ENVO''s own modelling is the decisive evidence: ENVO:01001179 ''cnidarian-associated
    environment'' - the closest analogue, a taxon-scoped class over aquatic invertebrates
    - is asserted under ENVO:01001002 ALONE, and ENVO:01001176 has no children in
    the slice at all. Not carried as an xref: it is genuinely broader, so recording
    it would re-import the ancestry this declines.'
