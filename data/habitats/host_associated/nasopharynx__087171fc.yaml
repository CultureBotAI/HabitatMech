causal_graphs:
- graph_id: nasopharynx_corynebacterium_gatekeeper_colonization_resistance
  title: Nasopharyngeal mucosal interface and Corynebacterium gatekeeper colonization
    resistance mechanism
  description: The upper respiratory nasopharyngeal mucosa forms an aerated, lipid-
    and mucin-coated epithelial interface colonized by commensal Corynebacterium species
    (C. accolens, C. pseudodiphtheriticum) that act as respiratory gatekeepers by
    competitively blocking epithelial adherence, hydrolyzing host surface triacylglycerols
    via LipS1 into bactericidal free fatty acids that inhibit Streptococcus pneumoniae,
    and secreting protease factors that block Staphylococcus aureus hemolytic toxins.
  nodes:
  - node_id: nasopharynx
    label: nasopharynx
    node_type: HABITAT
    grounding: UBERON:0001728
    description: Uppermost portion of the pharynx posterior to the nasal cavity that
      conducts inspired air and serves as a primary mucosal reservoir for upper respiratory
      tract bacteria.
  - node_id: upper_airway_mucosal_and_triacylglycerol_surface
    label: upper airway respiratory epithelium and surface triacylglycerols
    node_type: CHEMICAL
    description: Aerated nasopharyngeal and nasal mucosal surface supplying epithelial
      attachment sites and host surface triacylglycerols (TAGs).
  - node_id: commensal_airway_corynebacterium_guild
    label: commensal Corynebacterium accolens and C. pseudodiphtheriticum guild
    node_type: TAXON
    description: Benign upper-airway Corynebacterium species that colonize the nasal
      and nasopharyngeal epithelium.
  - node_id: lips1_free_fatty_acid_and_protease_secretion
    label: LipS1 free fatty acid release and anti-toxin protease activity
    node_type: COMMUNITY_PROCESS
    description: Hydrolysis of host triacylglycerols by Corynebacterium accolens LipS1
      into antipneumococcal oleic/free fatty acids alongside secretion of protease
      factors that block Staphylococcus aureus pore-forming toxins.
  - node_id: respiratory_pathogen_gatekeeper_resistance
    label: gatekeeper resistance against Streptococcus pneumoniae and Staphylococcus
      aureus
    node_type: COMMUNITY_PROCESS
    description: Inhibition of epithelial adherence, growth, and virulence of opportunistic
      respiratory pathogens (Streptococcus pneumoniae and Staphylococcus aureus) in
      the upper airway.
  edges:
  - edge_id: nasopharynx_provides_upper_airway_mucosal_and_triacylglycerol_surface
    subject: nasopharynx
    predicate: supplies
    object: upper_airway_mucosal_and_triacylglycerol_surface
    description: Man et al. 2017 (Nat Rev Microbiol) describe the niche-specific mucosal
      habitats spanning the upper and lower respiratory tract.
    evidence:
    - reference: PMID:28316330
      snippet: The human respiratory tract spans from the nostrils to the lung alveoli
        and is inhabited by niche-specific communities of bacteria.
      notes: Man et al. 2017 (Nat Rev Microbiol) describe the niche-specific mucosal
        habitats spanning the upper and lower respiratory tract.
  - edge_id: upper_airway_mucosal_and_triacylglycerol_surface_selects_for_commensal_airway_corynebacterium_guild
    subject: upper_airway_mucosal_and_triacylglycerol_surface
    predicate: selects for
    object: commensal_airway_corynebacterium_guild
    description: Host surface triacylglycerols in the upper airway support lipid-requiring
      commensal Corynebacterium accolens.
    evidence:
    - reference: PMID:26733066
      snippet: Corynebacterium accolens, a benign lipid-requiring species, inhibits
        pneumococcal growth during in vitro cocultivation on medium supplemented with
        human skin surface triacylglycerols (TAGs) that are likely present in the
        nostrils.
      notes: Host surface triacylglycerols in the upper airway support lipid-requiring
        commensal Corynebacterium accolens.
    - reference: PMID:39705185
      snippet: Species of <i>Corynebacterium,</i> which are largely present as commensals
        in the upper airway and other body sites, are associated with lower colonization
        rates of opportunistic bacterial pathogens such as <i>Streptococcus pneumoniae</i>
        and <i>Staphylococcus aureus</i>.
      notes: Commensal Corynebacterium species colonize the upper airway and inversely
        correlate with S. pneumoniae and S. aureus colonization.
  - edge_id: commensal_airway_corynebacterium_guild_drives_lips1_free_fatty_acid_and_protease_secretion
    subject: commensal_airway_corynebacterium_guild
    predicate: drives
    object: lips1_free_fatty_acid_and_protease_secretion
    description: Corynebacterium accolens LipS1 hydrolyzes host triacylglycerols to
      release antipneumococcal oleic acid and free fatty acids.
    evidence:
    - reference: PMID:26733066
      snippet: This inhibition depends on LipS1, a TAG lipase necessary for C. accolens
        growth on TAGs such as triolein. We determined that C. accolens hydrolysis
        of triolein releases oleic acid, which inhibits pneumococcus, as do other
        free fatty acids (FFAs) that might be released by LipS1 from human skin surface
        TAGs.
      notes: Corynebacterium accolens LipS1 hydrolyzes host triacylglycerols to release
        antipneumococcal oleic acid and free fatty acids.
    - reference: PMID:39705185
      snippet: <i>Corynebacterium</i> lipase activity was bactericidal against <i>S.
        pneumoniae</i>, but not <i>S. aureus</i>. Instead, the hemolytic activity
        of pore-forming toxins produced by <i>S. aureus</i> was directly blocked by
        a novel <i>Corynebacterium</i>-secreted factor with protease activity.
      notes: Upper airway Corynebacterium spp. combine bactericidal lipase activity
        against S. pneumoniae with secreted protease activity that neutralizes S.
        aureus hemolytic toxins.
  - edge_id: lips1_free_fatty_acid_and_protease_secretion_drives_respiratory_pathogen_gatekeeper_resistance
    subject: lips1_free_fatty_acid_and_protease_secretion
    predicate: drives
    object: respiratory_pathogen_gatekeeper_resistance
    description: Man et al. 2017 establish the respiratory microbiota gatekeeper model
      of pathogen colonization resistance.
    evidence:
    - reference: PMID:28316330
      snippet: The microbiota of the respiratory tract probably acts as a gatekeeper
        that provides resistance to colonization by respiratory pathogens.
      notes: Man et al. 2017 establish the respiratory microbiota gatekeeper model
        of pathogen colonization resistance.
    - reference: PMID:39705185
      snippet: Adherence of both pathogens to human respiratory tract epithelial cells
        was significantly impaired following pre-exposure to C. <i>pseudodiphtheriticum</i>
        or <i>Corynebacterium accolens</i>, and this effect was dependent on live
        <i>Corynebacterium</i> colonizing the epithelial cells.
      notes: Live C. pseudodiphtheriticum and C. accolens colonization directly impairs
        S. pneumoniae and S. aureus adherence to respiratory epithelial cells.
