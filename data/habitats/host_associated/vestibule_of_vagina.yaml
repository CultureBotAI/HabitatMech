identifier: UBERON:0008330
label: vestibule of vagina
definition: The space posterior to the glans clitoridis, between the labia minora;
  located within the vestibule are the openings of the vagina, the urethra, and the
  ducts of the lesser vestibular glands, the greater vestibular (Bartholin's) glands,
  and the paraurethral (Skene's) glands, which release mucus into the vestibule to
  maintain a moist, lubricated vestibular environment; the vestibule is also moistened
  by secretions from the cervical mucus glands located in the inferior region of the
  uterus.
