identifier: UBERON:0001679
label: ethmoid bone
definition: A bone in the skull that separates the nasal cavity from the brain. As
  such, it is located at the roof of the nose, between the two orbits. The cubical
  bone is lightweight due to a spongy construction. The ethmoid bone is one of the
  bones that makes up the orbit of the eye[WP].
