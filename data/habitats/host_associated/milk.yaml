causal_graphs:
- graph_id: milk_carbohydrate_lactic_acid_assembly
  title: Milk carbohydrate lactic-acid assembly
  description: Mammary glands secrete milk as a nutrient-rich aqueous emulsion containing
    lactose, oligosaccharides, fat globules, proteins, antimicrobial bioactives, and
    low-abundance milk microbiota. Milk sugars select saccharolytic lactic-acid bacteria
    and bifidobacteria, while fermentation converts carbohydrates into lactate and
    acetate that can acidify the milk habitat and reshape downstream community structure.
  nodes:
  - node_id: milk
    label: milk
    node_type: HABITAT
    grounding: UBERON:0001913
  - node_id: mammary_gland
    label: mammary gland
    node_type: HABITAT
    grounding: UBERON:0001911
  - node_id: aqueous_emulsion
    label: aqueous fat-protein emulsion
    node_type: ENVIRONMENTAL_FACTOR
  - node_id: lactose
