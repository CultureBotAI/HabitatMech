label: human right lymphatic duct
definition: An anatomical entity environment consisting of the major lymphatic vessel
  (right lymphatic duct) that drains lymph from the right upper limb, right hemithorax,
  and right side of the head and neck into the right subclavian and internal jugular
  junction.
