label: annelid cuticle epibiont environment
definition: An environment associated with an animal part or small animal located
  on the external epidermal cuticle of an annelid worm (such as Alvinella or stilbonematine-like
  marine worms) colonized by filamentous sulfur-oxidizing epibiotic bacteria.
