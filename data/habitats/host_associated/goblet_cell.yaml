identifier: BTO:0001540
label: goblet cell
definition: A unicellular mucous gland found in the epithelium of various mucous membranes,
  especially that of the respiratory passages and intestines. Droplets of mucigen
  collect in the upper part of the cell and distend it, while the basal end remains
  slender, and the cell assumes the shape of a goblet.
