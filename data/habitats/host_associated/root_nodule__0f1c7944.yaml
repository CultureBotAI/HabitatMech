causal_graphs:
- graph_id: root_nodule_symbiotic_nitrogen_fixation
  title: Root nodule symbiotic nitrogen fixation
  description: Plant root nodules are organ-level microbial habitats formed when roots
    recruit compatible nitrogen-fixing bacteria. Rhizobial Nod-factor signaling induces
    root-hair infection and nodule organogenesis, infection threads carry bacteria
    into developing nodule cells, symbiosomes house differentiated bacteroids, and
    the plant-controlled low-oxygen nodule cytoplasm allows nitrogenase to reduce
    atmospheric N2 to ammonia. Actinorhizal nodules use Frankia rather than rhizobia
    but converge on the same protected intracellular nitrogen-fixation habitat.
  nodes:
