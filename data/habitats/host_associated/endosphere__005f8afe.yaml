identifier: habitatmech:GOLD.af0c4ac629
label: root endosphere
definition: An environment associated with a plant part or small plant that comprises
  the internal tissues of a plant root interior to the rhizoplane and epidermis, inhabited
  by root endophytic microorganisms.
definition_source: HabitatMech
habitat_category: HOST_ASSOCIATED
grounding_status: UNGROUNDED
mapping_status: REVIEWED
