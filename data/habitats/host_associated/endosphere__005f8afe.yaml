    subject: endosphere__005f8afe
    predicate: maintains
    object: host_root_interior_drought_water_deficit_and_nitrogen_limitation_regime
    description: The root endosphere imposes strong host-compartment filtering and
      transmits soil water-deficit and nitrogen-reduction stresses to internal root-colonizing
      bacteria.
    evidence:
    - reference: PMID:32220847
      snippet: Compared to those of the rhizosphere, endosphere microbiomes had lower
        diversity but contained several taxa with higher relative abundance; many
        of these taxa were also present in the roots of other desert plants.
      notes: The root endosphere filters rhizosphere diversity into a lower-diversity,
        high-abundance internal endophytic microbiome in desert plants (PMID:32220847).
    - reference: PMID:36977576
      snippet: Slight yet significant microbial responses to irrigation treatments
        were observed in all three microhabitats. The root endophytic bacterial community
        was most responsive to water stress.
      notes: Among bulk soil, rhizosphere, and root endosphere compartments, the root
        endosphere microbiome is the most responsive to water-deficit stress (PMID:36977576).
