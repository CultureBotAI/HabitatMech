    - reference: PMID:26882089
      snippet: 'B. azoricus is a bivalve that lives close to hydrothermal chimney
        in the Mid-Atlantic Ridge (MAR). They harbour in specialized gill cells two
        types of endosymbiont (gram-bacteria): sulphide oxidizing bacteria (SOX) and
        methanotrophic bacteria (MOX).'
      notes: Bathymodiolus azoricus near hydrothermal chimneys harbors sulfide-oxidizing
        (SOX) and methanotrophic (MOX) endosymbionts inside specialized gill cells
        (PMID:26882089).
  - edge_id: gill_bacteriocyte_flux_selects_for_gammaproteobacterial_mox_and_sox_symbionts
    subject: gill_bacteriocyte_hydrothermal_seep_methane_and_sulfide_flux
    predicate: selects for
    object: bathymodiolus_gill_gammaproteobacterial_mox_and_sox_endosymbiont_guild
    description: Hydrothermal vent and cold-seep methane and sulfide fluxes select
      for Gammaproteobacteria methanotrophic (MOX) and thioautotrophic (SOX) endosymbionts
      in Bathymodiolus gills.
    evidence:
    - reference: PMID:17205805
      snippet: Phylogenetic analysis of the pmoA placed this endosymbiont within the
        Gammaproteobacteria, in a cluster including the methanotrophic bacterial genus
        Methylobacter and other methanotrophic Bathymodiolus gill symbionts. These
        results provide evidence for the existence of two types of endosymbionts (thioautotrophic
        and methanotrophic) in the gills of B. azoricus and demonstrate that, apart
        from the phylogenetic analysis of 16S rRNA genes, parallel analysis of functional
        genes is essential.
      notes: Bathymodiolus azoricus gills harbor both Mytilidae-cluster thioautotrophic
        and Methylobacter-cluster methanotrophic Gammaproteobacteria endosymbionts
        (PMID:17205805).
    - reference: PMID:17504480
      snippet: Comparative 16S rRNA sequence analysis confirmed a single methanotroph-related
        symbiont in 'B.' childressi and a dual symbiosis with a methanotroph- and
        thiotroph-related symbiont in B. brooksi.
      notes: Gulf of Mexico cold-seep Bathymodiolus gills select for methanotrophic
        and thiotrophic endosymbionts whose densities vary across seep sites (PMID:17504480).
