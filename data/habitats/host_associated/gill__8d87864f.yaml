      six i-type lysozyme paralogs (Ba-lysozymes).
    evidence:
    - reference: PMID:16761196
      snippet: Fluorescence in situ hybridization demonstrated simultaneous occurrence
        of the symbiont-specific 16S rDNA, cbbL and pmoA, but not sopT, in the mussel
        gill. This is the first molecular and visual evidence for a methanotrophic
        bacterial endosymbiont that bears the RuBisCO cbbL gene relevant to autotrophic
        CO(2) fixation.
      notes: FISH and gene sequencing demonstrate co-occurrence of pmoA and form I
        RuBisCO cbbL in Bathymodiolus gill methanotrophic endosymbionts (PMID:16761196).
    - reference: PMID:26882089
      snippet: Results show the presence of 6 paralogs in B. azoricus. In absence
        of symbionts, 3 paralogs are up-regulated while others are not differentially
        expressed. Moreover the global activity of lysozyme is increasing with the
        loss of symbiont.
      notes: Bathymodiolus azoricus gills express six i-type lysozyme paralogs (Ba-lysozymes)
        that are differentially regulated according to endosymbiont presence (PMID:26882089).
  - edge_id: pmoa_cbbl_and_lysozymes_catalyze_host_carbon_nutrition_and_symbiont_regulation
    subject: endosymbiont_pmoa_rubisco_cbbl_and_host_gill_ba_lysozyme_paralogs
    predicate: catalyzes
    object: gill_methanotrophic_thioautotrophic_carbon_nutrition_and_lysozyme_symbiont_homeostasis
    description: Symbiont pmoA and RuBisCO cbbL drive methanotrophy and autotrophic
      CO2 fixation for mussel carbon nutrition, while host i-type lysozymes regulate
      gill endosymbiont abundance.
    evidence:
    - reference: PMID:17504480
      snippet: A gene characteristic of methane-oxidzing bacteria, pmoA, was identified
        in all three mussel species confirming the methanotrophic potential of their
        symbionts. Stable isotope analyses of lipids and whole tissue also confirmed
        the importance of methanotrophy in the carbon nutrition of all of the mussels.
      notes: pmoA-mediated methanotrophy in gill endosymbionts supplies carbon nutrition
        to Bathymodiolus lipids and tissues (PMID:17504480).
    - reference: PMID:26882089
      snippet: Moreover the global activity of lysozyme is increasing with the loss
        of symbiont. All together these results suggest that lysozyme may play a crucial
        role in symbiont regulation.
      notes: Host gill i-type lysozyme activity regulates endosymbiont dynamics in
        Bathymodiolus azoricus (PMID:26882089).
