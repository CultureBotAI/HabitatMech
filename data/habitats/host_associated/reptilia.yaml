  action: REVIEW
  changes: 'Reviewed and endorsed the seeder''s own resolution. xref-only review (#43):
    kg-microbe maps this to NCBITaxon:8504, which is OVER-NARROW — Lepidosauria excludes
    turtles and crocodilians, which Reptilia includes. The record carries no xref
    for it: this is a GOLD path and the mapping-table route did not apply, so the
    concept stays UNGROUNDED and the only trace of the mapping is upstream. Reported
    as kg-microbe#790. Path: Host-associated > Reptilia (source concept habitatmech:GOLD.1b11698aaa)'
- timestamp: '2026-08-16T00:00:00Z'
  curator: claude-opus-5
  action: DEFINED
  changes: 'Defined as ''reptile-associated environment'' under ENVO:01001002 ''animal-associated
    environment''. The habitat is the host clade, and it is the entire content of
    the concept: GOLD organises host-associated isolates by host and every anatomical
    path hangs off it. Not grounded to the parent, because every clade would then
    merge onto one record. Same pattern ENVO already has at plant-, animal- and fungi-associated
    environment. kg-microbe maps this to NCBITaxon:8504 Lepidosauria, which is over-narrow
    — it excludes turtles and crocodilians that Reptilia covers — so the taxon route
    does not solve it either.'
- timestamp: '2026-08-16T05:58:02Z'
