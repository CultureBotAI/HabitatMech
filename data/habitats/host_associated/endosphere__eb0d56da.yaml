label: leaf endosphere
definition: An environment associated with a plant part or small plant that comprises
  the internal tissues of a plant leaf (including mesophyll, intercellular apoplastic
  spaces, and leaf vasculature) interior to the epidermis, inhabited by foliar endophytic
  microorganisms.
