identifier: BTO:0000121
label: bile
definition: A fluid secreted by the liver and poured into the small intestine via
  the bile ducts. Important constituents are conjugated bile salts, cholesterol, phospholipid,
  bilirubin diglucuronide, and electrolytes. Bile is alkaline due to its bicarbonate
  content, is golden brown to greenish yellow in color, and has a bitter taste. Bile
  secreted by the liver is concentrated in the gallbladder.
