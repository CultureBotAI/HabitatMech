label: annelid intracellular endosymbiont environment
definition: An environment associated with an animal part or small animal comprising
  specialized bacteriocyte cells or trophosome tissues of an annelid worm (such as
  gutless oligochaetes or siboglinid tubeworms) housing intracellular bacterial endosymbionts.
