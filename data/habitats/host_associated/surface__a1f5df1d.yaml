  action: DEFINED
  changes: 'Defined as ''aerial plant surface environment'' under ENVO:01001001 ''plant-associated
    environment''. Definition authored from the record''s committed deep-research
    report under research/habitats/, read in full; no new paid research was commissioned.
    GOLD''s Host-associated > Plants > Phyllosphere > Surface source is interpreted
    as the organ-unspecified exterior face of above-ground plant structures because
    GOLD already keeps leaf-specific Phylloplane/Leaf and Phylloplane/Leaf surface
    sibling records. ENVO:01001001 ''plant-associated environment'' is the tightest
    vendored genus broad enough to cover aerial plant surfaces without asserting a
    biofilm; ENVO:01001032 ''environment determined by a biofilm on a plant surface''
    is narrower, PO:0005679 and PO:0006016 name epidermal tissues rather than a surface
    environment, and UBERON:0002416 is the retired animal-integument false match from
    #62. ADD preserves the source-inherited Phyllosphere parent.'
