  action: DEFINED
  changes: 'Defined as ''microbe-associated environment'' under ENVO:01001000 ''environmental
    system determined by an organism''. The habitat is the host clade, and it is the
    entire content of the concept: GOLD organises host-associated isolates by host
    and every anatomical path hangs off it. Not grounded to the parent, because every
    clade would then merge onto one record. Same pattern ENVO already has at plant-,
    animal- and fungi-associated environment. A microorganism as host for another
    microbe. ENVO''s organism-determined branch has plant, animal and fungi children
    but nothing for a microbial host, which is the commonest host of all in this corpus''s
    sources.'
