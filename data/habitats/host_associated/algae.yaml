curation_history:
- timestamp: '2026-08-16T00:00:00Z'
  curator: claude-opus-5
  action: CONFIRM_UNGROUNDED
  changes: 'Confirmed UNGROUNDED: no ontology term fits this concept. FOODON:03411301
    ''algae'' kept as an xref. Non-habitat screen (#12): ''Host-associated > Algae''
    was grounded EXACT to FOODON:03411301 ''algae'', which FOODON defines as ''an
    informal term for a large, diverse group of photosynthetic eukaryotic ORGANISMS''.
    An organism is not a habitat, and because the seeder derives a GOLD child''s parent
    from its path node, that identity also became the parent_habitats entry of 14
    records under Host-associated > Algae — publishing ''is-a algae the organism group''
    as a broader-habitat claim 14 times over. The existing organism-identity screen
    could not see it: it tests ancestry against NCIT and mesh roots, and FOODON files
    both the organism and the material under one ''organism material'' root, so there
    is no structural signal to test. The concept itself is real — algae as host —
    and is the same family as the sponge, nematode and reptile requests, so it becomes
    a term request with the FOODON term kept as an xref (#99) rather than an identity.
    (source concept habitatmech:GOLD.02383c20a7)'
- timestamp: '2026-08-16T05:58:02Z'
  curator: seed_from_sources
  action: SEEDED_FROM_SOURCES
  changes: 'Seeded from data/raw/ inventories; attested by GOLD, MADIN. Grounding:
    UNGROUNDED.'
- timestamp: '2026-08-17T00:00:00Z'
  curator: claude-opus-5
  action: DEFINED
  changes: 'Defined as ''alga-associated environment'' under ENVO:01001000 ''environmental
    system determined by an organism''. Definition drafted from the record''s deep-research
    report under research/habitats/ and read against it; the report''s proposed wording,
    genus and near-miss table are the evidence. Parented to the organism root rather
    than the plant one: algae are polyphyletic and not all of them are green plants.'
- timestamp: '2026-08-24T00:00:00Z'
  curator: codex-gpt-5
  action: SAME_AS
  changes: 'Merged into habitatmech:GOLD.02383c20a7 ''Algae'': the same concept under
    another source''s name. Novel-concept merge (#183): Madin''s host_algae category
    and GOLD''s Host-associated > Algae node denote the same broad habitat, an alga
    acting as microbial host. Keeping both split Madin''s 88 TAXON assertions from
    the already-defined GOLD record. Madin''s flat category includes unresolved algal
    lineages and laboratory cultures, so its evidence remains a separate source attestation
    and is not pushed down to a GOLD child. The category override records Madin''s
    own Host_associated classification rather than the seeder''s prior OTHER fallback.
    (source concept habitatmech:MADIN.5eeeec4db2)'
