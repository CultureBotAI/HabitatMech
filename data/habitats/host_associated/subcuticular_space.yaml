label: annelid subcuticular space
definition: An environment associated with an animal part or small animal comprising
  the extracellular space between the outer collagenous cuticle and the underlying
  epidermal cells of an annelid worm, frequently inhabited by chemoautotrophic or
  heterotrophic bacterial symbionts.
