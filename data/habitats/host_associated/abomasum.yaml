identifier: UBERON:0007358
label: abomasum
definition: The fourth stomach of ruminating animals, which is an elongated pear-shaped
  sac lying on the floor of the abdomen, on the right-hand side, and roughly between
  the seventh and twelfth ribs. It leads to the beginning of the small intestine.
  (Adapted From Black's Veterinary Dictionary, 17th ed).
