identifier: BTO:0000062
label: amastigote
definition: Any of the bodies representing the morphologic (leishmanial) stage in
  the life cycle of all trypanosomatid protozoa resembling the typical adult form
  of members of the genus Leishmania, in which the oval or round cell has a nucleus,
  kinetoplast, and basal body but lacks a free-flowing flagellum, the flagellum being
  either very short or entirely absent.
