causal_graphs:
- graph_id: sputum_cf_bronchiectasis_airway_mucus_pseudomonas_muca_algu_algd_lasr_lasb_biofilm_viscoelasticity
  title: Sputum chronic airway mucus and iron-limited inflammatory milieu, mucoid
    and MDR Pseudomonas aeruginosa selection, and mucA/algU/algD/lasR/lasB/toxA alginate-protease-pyoverdine
    viscoelastic biofilm mechanism
  description: Expectorated and lower-respiratory-tract sputum in patients with cystic
    fibrosis (CF) and non-CF bronchiectasis constitutes a nutrient-rich yet iron-restricted,
    neutrophil-infiltrated, antibiotic-exposed mucus matrix. Chronic residence in
    this sputum niche selects for persistent and multidrug-resistant Pseudomonas aeruginosa
    populations, including mucoid variants carrying loss-of-function mutations in
    the anti-sigma factor gene mucA. Derepression of the alternative sigma factor
    algU (sigma22) together with quorum-sensing regulation via lasR drives co-accumulation
    of alginate biosynthesis transcripts (algD), elastase (lasB), LasA protease (lasA),
    exotoxin A (toxA), and pyoverdine (PVD) siderophore biosynthesis, generating alginate-encased
    biofilms that increase sputum elasticity, viscosity, and stiffness and impair
    mucociliary clearance.
