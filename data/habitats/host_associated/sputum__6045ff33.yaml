    description: Sputum in chronic pulmonary infections presents an iron-demanding,
      inflammatory airway mucus environment under strong antimicrobial selection.
    evidence:
    - reference: PMID:36466220
      snippet: In cystic fibrosis individuals, chronic lung infections and hospital-acquired
        pneumonia are caused by Pseudomonas aeruginosa. P. aeruginosa generates siderophores
        such as pyoverdine (PVD) as iron uptake systems to cover its needs of iron
        ions for growth and infection.
      notes: Pulmonary sputum infections require siderophore-mediated iron acquisition
        by Pseudomonas aeruginosa to support bacterial growth (PMID:36466220).
    - reference: PMID:9317008
      snippet: Pseudomonas aeruginosa causes a chronic infection in the lungs of individuals
        with cystic fibrosis.
      notes: Cystic fibrosis lower-airway sputum sustains chronic Pseudomonas aeruginosa
        colonization (PMID:9317008).
