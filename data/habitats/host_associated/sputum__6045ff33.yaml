      evidence:
      - reference: PMID:22842599
        snippet: In our study, 119 strains of P. aeruginosa were isolated from sputa
          of 96 cystic fibrosis patients and 84/119 showed nonmucoid phenotype, while
          35/119 showed mucoid phenotypes. mucA gene was amplified and sequenced in
          all strains revealing mutations in 29/35 mucoid strains (82%) and in one
          non-mucoid strain.
        notes: Reviewed Pseudomonas aeruginosa PAO1 anti-sigma factor MucA (mucA,
          PA0763; 194 aa) whose loss-of-function mutations in 82% of mucoid cystic
          fibrosis sputum strains derepress AlgU and alginate overproduction (PMID:22842599).
      - reference: PMID:31212120
        snippet: Pseudomonas aeruginosa could acquire a mucoid phenotype due to mutations
          in mucA (mucoid Pseudomonas aeruginosa - mPA) that is a hallmark of poor
          prognosis in patients with bronchiectasis.
        notes: Mutations in mucA generate the mucoid P. aeruginosa phenotype that
          increases sputum elasticity, viscosity, and stiffness in bronchiectasis
