    object: pseudomonas_muca_algu_algd_lasr_lasb_lasa_toxa_and_pyoverdine_system
    description: Sputum P. aeruginosa populations express algU-regulated alginate
      synthesis genes, co-accumulate algD, lasB, lasA, and toxA transcripts in situ,
      and harbor lasR to produce pyoverdine.
    evidence:
    - reference: PMID:9317008
      snippet: We measured the transcript accumulation of algD, a marker of alginate,
        toxA, the structural gene for exotoxin A, lasB, the structural gene for elastase,
        and lasA, the structural gene for LasA protease, from the sputum bacterial
        populations of 23 patients. In the 131 samples tested, we frequently detected
        transcripts from the four genes.
      notes: Sputum P. aeruginosa populations actively accumulate algD, toxA, lasB,
        and lasA transcripts in vivo with positive correlation between algD and lasB/lasA
        (PMID:9317008).
    - reference: PMID:36466220
      snippet: Virulence factors of ten multidrug resistant isolates of P. aeruginosa,
        such as biofilm generation, PVD production, and lasR gene were detected. From
        results, all 10P. aeruginosa isolates can produce biofilm, PVD, and contain
        lasR gene.
      notes: Multidrug-resistant sputum P. aeruginosa isolates harbor the lasR quorum-sensing
        gene and produce pyoverdine and biofilms (PMID:36466220).
  - edge_id: sputum_pseudomonas_genes_catalyze_alginate_overproduction_and_viscoelastic_stiffening
    subject: pseudomonas_muca_algu_algd_lasr_lasb_lasa_toxa_and_pyoverdine_system
    predicate: catalyzes
    object: alginate_exopolysaccharide_overproduction_iron_scavenging_and_sputum_viscoelastic_stiffening
    description: Loss-of-function mucA mutations and algU/algD activation drive alginate
      exopolysaccharide overproduction, increasing sputum elasticity, viscosity, and
      stiffness.
    evidence:
    - reference: PMID:22842599
      snippet: Alginate biosynthesis in Pseudomonas aeruginosa is a highly regulated
        process in which algU and mucA genes are key elements. Mutations in mucA gene
        determine alginate operon overexpression and exopolysaccharide overproduction.
      notes: Mutations in mucA alter algU expression and drive alginate operon overexpression
        and exopolysaccharide overproduction enabling survival in CF lungs (PMID:22842599).
    - reference: PMID:31212120
      snippet: Compared with the NOR group, the mPA group showed higher elasticity
        (median 10.30 vs. 5.70, p = 0.023), viscosity (2.40 vs. 1.50, p = 0.039),
        and stiffness (10.70 vs. 6.00, p = 0.024).
      notes: Mucoid P. aeruginosa colonization significantly increases the elasticity,
        viscosity, and stiffness of expectorated sputum (PMID:31212120).
