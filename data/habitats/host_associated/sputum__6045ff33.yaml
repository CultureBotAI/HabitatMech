        35/119 showed mucoid phenotypes. mucA gene was amplified and sequenced in
        all strains revealing mutations in 29/35 mucoid strains (82%) and in one non-mucoid
        strain.
      notes: Sputum of cystic fibrosis patients selects for mucoid P. aeruginosa strains,
        82% of which carry mutations in mucA (PMID:22842599).
    - reference: PMID:31212120
      snippet: Pseudomonas aeruginosa could acquire a mucoid phenotype due to mutations
