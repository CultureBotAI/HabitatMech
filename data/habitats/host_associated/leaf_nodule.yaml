identifier: habitatmech:GOLD.3988adca86
label: leaf nodule
definition: An environment associated with a plant part or small plant consisting
  of a specialized symbiotic nodule or gland structure within the lamina of a plant
  leaf (as in Psychotria, Pavetta, Ardisia, or Dioscorea) that houses obligate bacterial
  leaf endophytes.
