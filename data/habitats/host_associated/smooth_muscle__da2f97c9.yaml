label: smooth muscle
definition: Muscle tissue that lacks cross striations, that is made up of elongated
  spindle-shaped cells having a central nucleus, and that is found in vertebrate visceral
  structures (as the stomach and bladder) as thin sheets performing functions not
  subject to conscious control by the mind and in all or most of the musculature of
  invertebrates other than arthropods.
