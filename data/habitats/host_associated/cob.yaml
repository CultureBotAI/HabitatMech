label: cob
definition: The central axis/core of the ear (distal end of the lateral branch/ear
  shoot) upon which the kernels (caryopses) are borne. The cob is similar to the central
  spike of the tassel (male inflorescence) in that it produces multiple rows of paired
  spikelets (polystichous phyllotaxy).
