label: nasal cavity
definition: The portion of the passages of the respiratory system extending from the
  nares to the pharynx. It is divided into left and right halves by the nasal septum;
  its floor is the hard palate, which separates it from the oral cavity; and its lateral
  walls contain the nasal conchae and nasal meatus.
