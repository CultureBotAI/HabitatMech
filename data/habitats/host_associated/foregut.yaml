identifier: BTO:0000507
label: foregut
definition: '1: The anterior part of the embryonic alimentary canal of a vertebrate
  from which the pharynx, lungs, esophagus, stomach, liver, pancreas, and duodenum
  develop. 2: The first part of the alimentary canal of an arthropod or annelid, which
  includes the buccal cavity, esophagus, crop, and gizzard.'
