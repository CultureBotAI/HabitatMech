identifier: BTO:0002246
label: globus pallidus
definition: The smaller and more medial part of the lentiform nucleus of the brain,
  separated from the putamen by the lateral medullary lamina. In official anatomic
  nomenclature, it is divided by the medial medullary lamina into two parts, lateral
  and medial, both of which have extensive connections with the corpus striatum, thalamus,
  and mesencephalon. The paleostriatum is the phylogenetically older part of the corpus
  striatum represented by the globus pallidus.
