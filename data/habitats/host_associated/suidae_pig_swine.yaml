curation_history:
- timestamp: '2026-08-16T00:00:00Z'
  curator: claude-opus-5
  action: CONFIRM_UNGROUNDED
  changes: 'Confirmed UNGROUNDED: no ontology term fits this concept. Host-taxon reversal
    (#114): this was NOT_APPLICABLE on the reasoning that ''a host taxon is not a
    habitat''. That reasoning is wrong, and the corpus already contradicted it — the
    same kind of concept was treated as a habitat for Sponge, Nematoda, Reptilia,
    Mammals, Birds and Fish, which keep their own identity and a term request for
    an <X>-associated environment. Host-associated > Porifera was NOT_APPLICABLE while
    its own child Porifera > Sponge was a term request.An organism acting as a host
    IS a habitat: it is where the microbe lives, and ENVO models exactly this at plant-associated,
    animal-associated and fungi-associated environment. What is not a habitat is the
    TAXON TERM — a phylum is a class of organisms, not a place — so the taxon stays
    an xref (#99) and the concept keeps its own identity as a term-request candidate.
    NOT_APPLICABLE said the concept is not a habitat, which is a stronger and false
    claim. Category set to HOST_ASSOCIATED (#200): the row already claims ENVO:01001002
    ''animal-associated environment'' as the nearest broader term, which is the claim
    that a living animal host defines the habitat, and every other record carrying
    that parent is HOST_ASSOCIATED. The category column was left blank here, so the
    seeder''s default stood and five domestic-mammal hosts stayed in OTHER while their
    siblings did not. The reasoning above is unchanged. (source concept habitatmech:BACDIVE.3a13ee8a57)'
- timestamp: '2026-08-16T05:58:02Z'
  curator: seed_from_sources
  action: SEEDED_FROM_SOURCES
  changes: 'Seeded from data/raw/ inventories; attested by BACDIVE. Grounding: UNGROUNDED.'
- timestamp: '2026-08-17T00:00:00Z'
  curator: claude-opus-5
  action: DEFINED
  changes: Defined as 'suid-associated environment' under ENVO:01001002 'animal-associated
    environment'. Definition drafted from the record's deep-research report under
    research/habitats/ and read against it; the report's proposed wording, genus and
    near-miss table are the evidence. The report's proposed genus was 'mammal-associated
    environment', which does not exist and is itself requested in this batch; parented
    to animal-associated environment until it does. Its first-listed genus CURIE was
    ENVO:00003042 piggery, which is the farm building rather than the host, and is
    not what the definition says.
