  curator: codex-gpt-5
  action: DEFINED
  changes: 'Defined as ''molluscan gill extracellular environment'' under ENVO:01001055
    ''environment associated with an animal part or small animal''. Definition authored
    from the existing item-level #108 decision and the committed Mollusca and Bivalves
    reports under research/habitats/; no new paid research was commissioned. GOLD''s
    Host-associated > Mollusca > Respiratory system > Gills > Extracellular source
    denotes the extracellular compartment of molluscan gill tissue, not GO:0005615
    ''extracellular space'' as a habitat identity, the whole gill, the gill surface
    without the extracellular qualifier, the intracellular compartment of a symbiont-bearing
    gill cell, or annelid egg-capsule extracellular habitats. ENVO:01001055 ''environment
    associated with an animal part or small animal'' is the tightest safe vendored
    genus because ENVO lacks a general extracellular host environment or molluscan
    gill extracellular environment class; unlike whole-host invertebrate term requests
    that avoid importing an animal-part restriction, that restriction is true here
    because the determinant is molluscan gill tissue. parent_mode=REPLACE drops the
    source-inherited Gills parent because the extracellular environment is determined
    by gill tissue but is not a kind of whole gill.'
