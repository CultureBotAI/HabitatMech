label: swim bladder
definition: A thin membranous, sometimes alveolated sac in the dorsal portion of the
  abdominal cavity. Contains a varying mixture of gases, not identical to the composition
  of air. May be one, two or three chambered. May be connected to the gut by a tube,
  the ductus pneumaticus (then called physostomous) or unconnected (then called physoclistous).
