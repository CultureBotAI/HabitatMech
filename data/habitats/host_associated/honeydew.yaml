identifier: habitatmech:GOLD.e799433ca6
label: insect honeydew
definition: An environmental material consisting of sugar-rich liquid excreted from
  the hindgut of phloem-sap-feeding hemipteran insects (such as aphids, whiteflies,
  and scale insects) that contains insect gut symbionts and supports phyllosphere
  microbes.
