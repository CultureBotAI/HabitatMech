identifier: BTO:0001458
label: apocrine sweat gland
definition: A type of large, branched, specialized sudoriferous gland (glandula sudorifera)
  that empties into the upper portion of a hair follicle instead of directly onto
  the skin surface; found only on certain areas of the body, such as around the anus
  and in the axilla; after puberty they produce a viscous secretion that is acted
  on by bacteria to produce a characteristic acrid odor.
