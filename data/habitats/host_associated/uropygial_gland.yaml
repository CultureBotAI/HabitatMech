causal_graphs:
- graph_id: uropygial_gland_enterococcus_faecalis_mr10_as48_bacteriocin_feather_and_egg_defense
  title: Avian uropygial gland lipid secretion, Enterococcus faecalis mutualistic
    symbiont selection, and enterocin MR10A/MR10B and AS-48 bacteriocin-mediated feather
    and eggshell protection mechanism
  description: The avian uropygial (preen) gland is a holocrine secretory organ at
    the base of the tail that produces hydrophobic fatty secretions, which in nesting
    females and nestlings of the hoopoe (Upupa epops) harbor dense mutualistic bacterial
    communities dominated by Enterococcus faecalis (including strain MRR 10-3). Uropygial-gland
    Enterococcus faecalis strains encode and secrete the broad-spectrum bacteriocins
    enterocin MR10A (5201.58 Da) and MR10B (5207.7 Da) — homologous to enterocins
    L50A and L50B — together with enterocin AS-48. When preened onto plumage or smeared
    into specialized eggshell crypts, these bacteriocin-producing enterococci inhibit
    keratinolytic Bacillus licheniformis feather degradation and reduce trans-shell
    pathogen colonization to increase hatching success.
