identifier: UBERON:0022276
label: splenic flexure of colon
definition: The splenic (or left colic) flexure is a sharp bend between the transverse
  and the descending colon in the left upper quadrant of humans. The left colic flexure
  is near the spleen, and hence called the splenic flexure. There are two colic flexures
  in the transverse colon &mdash; the other being the hepatic flexure in the right
  upper quadrant.
