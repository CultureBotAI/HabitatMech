curation_history:
- timestamp: '2026-08-12T00:00:00Z'
  curator: claude-opus-5
  action: CONFIRM_UNGROUNDED
  changes: 'Confirmed UNGROUNDED: no ontology term fits this concept. Nearest broader
    term ENVO:01001002 ''animal-associated environment'' attached as a parent. Sponges
    as host. ENVO:01000161 marine sponge reef is the reef environment, not the sponge
    as a host, so it is not a substitute. Parented to animal-associated environment.
    ENVO term request. (source concept habitatmech:GOLD.affd2445ea)'
- timestamp: '2026-08-16T00:00:00Z'
  curator: claude-opus-5
  action: DEFINED
  changes: 'Defined as ''sponge-associated environment'' under ENVO:01001002 ''animal-associated
    environment''. The habitat is the host clade, and it is the entire content of
    the concept: GOLD organises host-associated isolates by host and every anatomical
    path hangs off it. Not grounded to the parent, because every clade would then
    merge onto one record. Same pattern ENVO already has at plant-, animal- and fungi-associated
    environment. ENVO:01000161 ''marine sponge reef'' is the reef the sponges build,
    not the sponge as a host, so it is not a substitute.'
- timestamp: '2026-08-16T05:58:02Z'
  curator: seed_from_sources
