identifier: UBERON:0010409
label: ocular surface region
definition: The integrated unit (of the eye) that consists of the conjunctiva, the
  corneal surface, and the ocular mucosal adnexa including the lid margins and the
  meibomian gland openings, the lacrimal glands and the lacrimal drainage system,
  all which are critical to maintain ocular surface integrity and provide protection
  from external antigens and pathogenic microorganisms.
