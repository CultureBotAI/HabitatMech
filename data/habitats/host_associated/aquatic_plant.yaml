curation_history:
- timestamp: '2026-08-14T00:00:00Z'
  curator: claude-opus-5
  action: CONFIRM_UNGROUNDED
  changes: 'Confirmed UNGROUNDED: no ontology term fits this concept. Grounding-cohort
    review (#62): was FOODON:03401156 ''50122200 - aquatic plants prepared/processed
    (gs1 gpc)'', a UNSPSC commodity code for prepared food. An aquatic plant as an
    isolation source is a living host, not a prepared foodstuff, and no term in the
    slice names it. Category set to HOST_ASSOCIATED (#110): the curated definition
    parents this to ENVO:01001000 ''environmental system determined by an organism''
    - a living macrophyte host - and 31 of the 33 records under that parent are HOST_ASSOCIATED.
    (source concept habitatmech:BACDIVE.38260eea00)'
- timestamp: '2026-08-16T05:58:02Z'
  curator: seed_from_sources
  action: SEEDED_FROM_SOURCES
  changes: 'Seeded from data/raw/ inventories; attested by BACDIVE. Grounding: UNGROUNDED.'
- timestamp: '2026-10-04T00:00:00Z'
  curator: codex-gpt-5
  action: DEFINED
  changes: 'Defined as ''aquatic macrophyte-associated environment'' under ENVO:01001000
    ''environmental system determined by an organism''. Rationale corrected under
    #1342; definition, label, synonym and genus retained from claude-opus-5''s 2026-08-28
    curation based on the committed deep-research report, read in full. Aquatic bryophytes
    are plants: NCBITaxon:3208 (Bryophyta) lies within Viridiplantae and Embryophyta
    (https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=3208). Green algae
    are also Viridiplantae; macroalgae must not all be described as non-plants. Retain
    ENVO:01001000 rather than narrow to ENVO:01001001 ''plant-associated environment''
    because the source includes seaweed without an identified algal lineage (https://bacdive.dsmz.de/strain/158685);
    that evidence does not establish that every macrophyte host is a green plant.
    This wording correction does not resolve the digester and field-water source-scope
    finding in #1341 or endorse those associations as living-host observations. No
    new paid research was commissioned.'
