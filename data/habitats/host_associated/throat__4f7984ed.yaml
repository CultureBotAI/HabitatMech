identifier: UBERON:0000341
label: throat
definition: In anatomy, the throat is the anterior part of the neck, in front of the
  vertebral column. It consists of the pharynx and larynx. An important feature of
  the throat is the epiglottis, a flap which separates the esophagus from the trachea
  and prevents inhalation of food or drink. The throat contains various blood vessels,
  various pharyngeal muscles, the trachea (windpipe) and the esophagus. The hyoid
  bone and the clavicle are the only bones located in the throat of mammals. It is
  sometimes considered a synonym for fauces. [WP,unvetted].
