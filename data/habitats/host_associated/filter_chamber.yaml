identifier: habitatmech:GOLD.6e59a6cbb1
label: hemipteran midgut filter chamber
definition: A midgut anatomical specialization in sap-feeding hemipteran insects in
  which the anterior midgut, posterior midgut, and proximal Malpighian tubules are
  enclosed within a common sheath to bypass excess dietary water directly to the hindgut.
