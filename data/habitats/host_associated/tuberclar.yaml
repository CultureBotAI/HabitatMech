- timestamp: '2026-09-10T00:00:00Z'
  curator: codex-gpt-5
  action: CONFIRM_UNGROUNDED
  changes: 'Confirmed UNGROUNDED: no ontology term fits this concept. Item-level tubercle
    report read in full before definition authoring. The earlier disjoint decision
    stands: BTO:0002173 is a Schistosoma body-part homonym, and the UBERON and PO
    tubercle terms name generic normal anatomical protrusions and plant protuberances,
    while PREGO''s source string points at a mycobacterial tubercle. No vendored ontology
    term names the infectious granulomatous lesion itself, so the record remains UNGROUNDED.
    Category set to HOST_ASSOCIATED because this habitat is formed within host tissue
    rather than an external OTHER source. (source concept habitatmech:PREGO.c312b0d6fc)'
- timestamp: '2026-09-10T00:00:00Z'
  curator: codex-gpt-5
  action: DEFINED
  changes: Defined as 'tuberculous granuloma' under ENVO:2100000 'anatomical entity
    environment'. Definition authored from the record's committed deep-research report
    under research/habitats/, read in full; no new paid research was commissioned.
    The report interprets PREGO's BTO:0002173 'tubercle' source as the tuberculosis
    pathology sense because the PREGO synonyms include tubercle while the high-scoring
    taxa are dominated by Mycobacterium tuberculosis complex genomes. The BTO, UBERON,
    and PO tubercle terms are homonyms for schistosome bosses, normal anatomical protrusions,
    and plant protrusions; ENVO lacks a tuberculous granuloma or infectious lesion
    class, so ENVO:2100000 'anatomical entity environment' is the tightest vendored
    genus for a pathological host-tissue structure. The definition is intentionally
    restricted to Mycobacterium tuberculosis complex granulomas because the lone Mycobacterium
    leprae PREGO taxon is likely lexical spillover from PREGO's co-mention method
    rather than evidence for a leprosy lesion habitat.
