label: amniotic fluid
definition: Fluid within the amniotic cavity produced by the amnion during the early
  embryonic period, and later by the lungs and kidneys; at first crystal clear, it
  later becomes cloudy. It protects the embryo and fetus from injury. The amount at
  term normally varies from 500 to 1500 mL.
