identifier: BTO:0005655
label: Th17 cell
definition: A subset of T helper cells producing interleukin 17. They are developmentally
  distinct from Th1 and Th2 cells. They create inflammation and tissue injury in autoimmune
  disease such as multiple sclerosis (which was previously thought to be caused by
  Th1 cells), psoriasis, autoimmune uveitis, juvenile diabetes, rheumatoid arthritis,
  and Crohns disease.
