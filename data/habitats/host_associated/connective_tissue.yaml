identifier: BTO:0000421
label: connective tissue
definition: The tissue which binds together and is the support of the various structures
  of the body. It is made up of fibroblasts, fibroglia, collagen fibrils, and elastic
  fibrils. It is derived from the mesoderm and in a broad sense includes the collagenous,
  elastic, mucous, reticular, osseous, and cartilaginous tissue. Some also include
  the blood in this group of tissues. Connective tissue is classified according to
  concentration of fibers as loose (areolar) and dense, the latter having more abundant
  fibers than the former.
