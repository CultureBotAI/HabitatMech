causal_graphs:
- graph_id: fungi_associated_hyphae_mycosphere_dispersal
  title: Fungi-associated hyphae mycosphere dispersal
  description: Fungal structures create host-associated microsites by extending hyphae
    through soil and organic matter, releasing fungal exudates, exposing chitin-rich
    cell walls, and forming hydrated surfaces that bacteria can colonize. These hyphal
    traits recruit mycosphere bacteria, provide fungal highways for motile dispersers,
    support fungus-feeding chitinolytic bacteria, and contain intracellular niches
    for endofungal symbionts.
  nodes:
  - node_id: fungi_associated_environment
    label: fungi-associated environment
    node_type: HABITAT
    grounding: ENVO:01001041
  - node_id: fungal_structure
    label: fungal structure
    node_type: HABITAT
  - node_id: fungal_hyphae
    label: fungal hyphae
    node_type: ENVIRONMENTAL_FACTOR
  - node_id: hyphal_exudates
    label: hyphal exudates
    node_type: CHEMICAL
  - node_id: hyphal_water_films
    label: hyphal water films
    node_type: ENVIRONMENTAL_FACTOR
  - node_id: chitin_cell_wall
    label: chitin-rich cell wall
    node_type: CHEMICAL
  - node_id: fungal_cytoplasm
    label: fungal cytoplasm
    node_type: HABITAT
