identifier: habitatmech:GOLD.57ff7fe01d
label: carnivorous plant pitcher fluid
definition: An environment associated with a plant part or small plant consisting
  of the digestive aqueous fluid pooled inside the modified ascidiate leaf trap (pitcher)
  of a carnivorous pitcher plant, inhabited by a specialized phytotelmata food web
  and digestive microbiome.
