identifier: BTO:0001172
label: reticulate body
definition: The noninfectious intracellular form of Chlamydia, consisting of fibrillar
  nuclear material and more ribosomes that occur in elementary bodies, surrounded
  by a thin trilaminar wall. Reticulate bodies reproduce within vacuoles in the host
  cell; following the reproductive cycle, reticulate bodies condense into elementary
  bodies, which are released from the cell.
