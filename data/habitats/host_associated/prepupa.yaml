  curator: claude-opus-5
  action: CONFIRM_UNGROUNDED
  changes: 'Confirmed UNGROUNDED: no ontology term fits this concept. UBERON:0003142
    ''prepupa'' kept as an xref. Life-stage review (#112), applying the rule #114
    settled: the whole host ORGANISM gets its own identity plus an <X>-associated
    environment term, while PARTS of a host ground to the anatomy term as gut, skin
    and lung already do. A larva, pupa, prepupa or embryo is the whole organism at
    a stage, not a part of one, so UBERON:0003142 ''prepupa'' is the organism rather
    than the place — the same shape as Mollusca, Porifera and the host clades. Kept
    as an xref (#99); the concept keeps its own identity as a term-request candidate.This
    is the line that makes both calls fall out of one rule, rather than an exception
    for terms that happen to live in UBERON: a cocoon is a STRUCTURE an insect builds
    and stays grounded, because it is not the organism. (source concept habitatmech:GOLD.ccdfcd10b9)'
- timestamp: '2026-09-10T00:00:00Z'
  curator: codex-gpt-5
  action: DEFINED
  changes: 'Defined as ''insect prepupa-associated environment'' under ENVO:01001002
    ''animal-associated environment''. Definition authored from the record''s committed
    deep-research report under research/habitats/, read in full; no new paid research
    was commissioned. GOLD''s Host-associated > Arthropoda: Insects > Prepupa source
    denotes an insect acting as a whole-host microbial habitat under #112/#114, not
    UBERON:0003142 or BTO:0001110 organism-at-stage identities, BTO:0001459 white
    prepupa, UBERON:0013198 cocoon, the pupal meconium, a larva/pupa/nymph sibling,
    a time interval, rearing substrate, or insect food product. The wording uses the
    report''s functional non-feeding, post-larval, pre-pupal reading to span dipteran,
    black soldier fly, and hymenopteran prepupa usages while avoiding UBERON''s stricter
    pupariation boundary. ENVO:01001002 is the tightest vendored genus until insect-associated
    environment is minted, and the source-inherited HabitatMech parent preserves the
    narrower insect restriction; GOLD has only two anonymous organism assertions;
    the BTO:0000954 Nymph/Instar outlier was settled in #276.'
