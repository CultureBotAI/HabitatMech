  action: DEFINED
  changes: 'Defined as ''protozoan-associated environment'' under ENVO:01001000 ''environmental
    system determined by an organism''. Definition drafted from the record''s deep-research
    report under research/habitats/ and read against it; the report''s proposed wording,
    genus and near-miss table are the evidence. Parented to the organism root rather
    than the animal one: a protozoan is not an animal.'
