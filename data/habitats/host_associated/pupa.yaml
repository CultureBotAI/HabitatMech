- timestamp: '2026-08-17T00:00:00Z'
  curator: claude-opus-5
  action: CONFIRM_UNGROUNDED
  changes: 'Confirmed UNGROUNDED: no ontology term fits this concept. UBERON:0003143
    ''pupa'' kept as an xref. Life-stage review (#112), applying the rule #114 settled:
    the whole host ORGANISM gets its own identity plus an <X>-associated environment
    term, while PARTS of a host ground to the anatomy term as gut, skin and lung already
    do. A larva, pupa, prepupa or embryo is the whole organism at a stage, not a part
    of one, so UBERON:0003143 ''pupa'' is the organism rather than the place — the
    same shape as Mollusca, Porifera and the host clades. Kept as an xref (#99); the
    concept keeps its own identity as a term-request candidate.This is the line that
    makes both calls fall out of one rule, rather than an exception for terms that
    happen to live in UBERON: a cocoon is a STRUCTURE an insect builds and stays grounded,
    because it is not the organism. (source concept habitatmech:GOLD.da1f99888c)'
- timestamp: '2026-09-10T00:00:00Z'
  curator: codex-gpt-5
  action: DEFINED
  changes: 'Defined as ''insect pupa-associated environment'' under ENVO:01001002
    ''animal-associated environment''. Definition authored from the record''s committed
    deep-research report under research/habitats/, read in full; no new paid research
    was commissioned. GOLD''s Host-associated > Arthropoda: Insects > Pupa source
    denotes a holometabolous insect acting as a whole-host microbial habitat under
    #112/#114, not UBERON:0003143 or BTO:0001143 organism-at-stage identities, UBERON:0013198
    cocoon, a puparium, a narrower chrysalis or tumbler subtype, pupation substrate,
    an insect food product, or a life-cycle interval. ENVO:01001002 is the tightest
    vendored genus until insect-associated environment is minted, and the source-inherited
    HabitatMech parent preserves the narrower insect restriction; GOLD has no direct
    or child assertions under Pupa, but the concept is structurally load-bearing for
    Cocoon and Whole body children and the pupal microbiome literature documents the
    non-feeding metamorphic host as a distinct habitat. Insect Meconium grounding
    is tracked separately in #309.'
