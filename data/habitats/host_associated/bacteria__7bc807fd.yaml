identifier: habitatmech:GOLD.a89688e0ba
label: endosymbiotic bacterium-associated environment
definition: An environmental system determined by an organism which comprises the
  cytoplasm, periplasm, or outer cell surface of a bacterial cell that is itself an
  endosymbiont inside another organism, as inhabited by other, taxonomically distinct
  microorganisms.
