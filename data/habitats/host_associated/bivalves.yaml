- timestamp: '2026-09-02T00:00:00Z'
  curator: claude-opus-5
  action: DEFINED
  changes: 'Defined as ''bivalve-associated environment'' under ENVO:01001002 ''animal-associated
    environment''. Definition authored from the record''s committed deep-research
    report under research/habitats/, read in full; the report''s proposed sentence,
    genus and near-miss table are the evidence. No new research was commissioned.
    FOODON:03412113 ''bivalve'' is a food-product class rather than a host organism,
    so it is the wrong kind of term entirely and is not used. ADD keeps the GOLD parent
    and the already-present ENVO:01001002, of which the tighter genus is a descendant.
    Dropped the exact synonym ''Bivalvia-associated environment'' (#213): it was coined
    at authoring time to mirror the requested label, is attested by no source and
    proposed by no report, and an exact synonym asserts that people actually use the
    name. Genus moved from ENVO:01001176 ''environment associated with an aquatic
    invertebrate'' to ENVO:01001002 (#210), with the whole aquatic-invertebrate host
    family rather than record by record - #210 was filed over three records and the
    genus is actually held by five, so fixing only the three would have rebuilt the
    same split it reports. Both terms are true of the concept, so this chooses between
    two true genera on what each drags in: ENVO asserts ENVO:01001176 under ENVO:01001002
    AND ENVO:01001055 ''environment associated with an animal part or small animal'',
    so the tighter genus makes every descendant inherit a size-and-partonomy restriction
    that is false of a whole adult sponge, ascidian, oyster, giant clam or sea urchin.
    ENVO''s own modelling is the decisive evidence: ENVO:01001179 ''cnidarian-associated
    environment'' - the closest analogue, a taxon-scoped class over aquatic invertebrates
    - is asserted under ENVO:01001002 ALONE, and ENVO:01001176 has no children in
    the slice at all. Not carried as an xref: it is genuinely broader, so recording
    it would re-import the ancestry this declines.'
