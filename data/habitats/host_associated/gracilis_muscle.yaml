identifier: BTO:0000536
label: gracilis muscle
definition: The Gracilis is the most superficial muscle on the medial side of the
  thigh. It is thin and flattened, broad above, narrow and tapering below. It arises
  by a thin aponeurosis from the anterior margins of the lower half of the symphysis
  pubis and the upper half of the pubic arch. The fibers run vertically downward,
  and end in a rounded tendon, which passes behind the medial condyle of the femur,
  curves around the medial condyle of the tibia, where it becomes flattened, and is
  inserted into the upper part of the medial surface of the body of the tibia, below
  the condyle.
