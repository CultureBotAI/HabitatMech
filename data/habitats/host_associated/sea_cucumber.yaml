- timestamp: '2026-08-16T00:00:00Z'
  curator: claude-opus-5
  action: CONFIRM_UNGROUNDED
  changes: 'Confirmed UNGROUNDED: no ontology term fits this concept. FOODON:02022154
    ''sea cucumber'' kept as an xref. Organism-identity screen (#109): grounded EXACT
    to FOODON:02022154 ''sea cucumber'', which is an echinoderm — an organism, not
    a place. The screen that exists to catch exactly this reported 0 for months because
    it tested only NCIT and mesh ancestry and only the record''s identity; widening
    it to UBERON:0000468 and to parent_habitats surfaced this family. The GOLD path
    says host-associated, so the concept is the environment the organism provides,
    which is the same family as the sponge, nematode and reptile term requests. The
    organism term is kept as an xref (#99) rather than an identity. (source concept
    habitatmech:GOLD.67b0fd9ee7)'
- timestamp: '2026-08-16T05:58:02Z'
  curator: seed_from_sources
  action: SEEDED_FROM_SOURCES
  changes: 'Seeded from data/raw/ inventories; attested by GOLD. Grounding: UNGROUNDED.'
- timestamp: '2026-09-02T00:00:00Z'
  curator: claude-opus-5
  action: DEFINED
  changes: 'Defined as ''sea cucumber-associated environment'' under ENVO:01001002
    ''animal-associated environment''. Definition authored from the record''s committed
    deep-research report under research/habitats/, read in full; no new research was
    commissioned. Flagged in the sea urchin report months before its own was read,
    and authored with the echinoderm rung above it rather than alone (#222). This
    report recommends ENVO:01001002 directly, so no override is needed here. ENVO:01001187
    ''holothurian digestive tract'' and ENVO:01001188 ''holothurian digestive tract
    contents'' are in the slice and are deliberately NOT parents: both are organ-scoped
    and therefore NARROWER than this whole-host concept, and parent_habitats means
    strictly broader. The record''s 17 ORGANISM assertions carry no compartment breakdown
    upstream, so there is nothing to attach them to. FOODON:02022154 ''sea cucumber''
    stays an xref.'
