identifier: UBERON:0008805
label: gingival groove
definition: 'The gingival sulcus is an area of potential space between a tooth and
  the surrounding gingival tissue and is lined by sulcular epithelium. The depth of
  the sulcus (Latin for groove) is bounded by two entities: apically by the gingival
  fibers of the connective tissue attachment and coronally by the free gingival margin.'
