  changes: 'Marked NOT_APPLICABLE: the source concept does not denote a habitat. BTO:0002292
    kept as an xref. ITEM cellular-organelle review #2334: PREGO BTO:0002292 (''flagellum'',
    ''Long, slender, threadlike, whiplike extension of certain cells or unicellular
    organisms used mainly for movements...'') denotes a subcellular motility appendage
    of flagellated microbes and cells (attested across 140 flagellated bacterial taxa
    such as Escherichia coli, Salmonella enterica, and Bacillus) rather than an external
    microbial habitat or host anatomical site, and its BTO subclass parent BTO:0000464
    (''flagellate'') is a whole-organism form. Mark NOT_APPLICABLE on the minted concept
    habitatmech:PREGO.267811fd7a in HOST_ASSOCIATED while preserving BTO:0002292 as
    an xref and retaining all 140 PREGO taxon rows. https://purl.obolibrary.org/obo/BTO_0002292
    (source concept habitatmech:PREGO.267811fd7a)'
