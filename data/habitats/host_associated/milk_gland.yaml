identifier: BTO:0005704
label: milk gland
definition: Larval nutrition is provided via a modified accessory gland, a milk gland,
  that empties into the uterus. The milk gland is connected to the dorsal side of
  the uterus and expands throughout the abdominal cavity of the fly as bifurcating
  tubules intertwining with fat body tissue. The lumen of the milk gland is surrounded
  by secretory and epithelial cells.
