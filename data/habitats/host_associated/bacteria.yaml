curation_history:
- timestamp: '2026-08-12T00:00:00Z'
  curator: claude-opus-5
  action: CONFIRM_UNGROUNDED
  changes: 'Confirmed UNGROUNDED: no ontology term fits this concept. GOLD''s Host-associated
    > Microbial > Bacteria: bacteria acting as host for another microbe. No environment
    term exists for a microbial host; ENVO''s organism-associated terms cover plants
    and animals only. ENVO term request. (source concept habitatmech:GOLD.029baaef9e)'
- timestamp: '2026-08-16T00:00:00Z'
  curator: claude-opus-5
  action: DEFINED
  changes: 'Defined as ''bacterium-associated environment'' under ENVO:01001000 ''environmental
    system determined by an organism''. The habitat is the host clade, and it is the
    entire content of the concept: GOLD organises host-associated isolates by host
    and every anatomical path hangs off it. Not grounded to the parent, because every
    clade would then merge onto one record. Same pattern ENVO already has at plant-,
    animal- and fungi-associated environment. GOLD''s child of Microbial. Parented
    to the organism root here because its natural parent, microbe-associated environment,
    is requested in this same batch and does not exist yet — editors should re-parent
    it if both are minted.'
- timestamp: '2026-08-16T05:58:02Z'
  curator: seed_from_sources
  action: SEEDED_FROM_SOURCES
