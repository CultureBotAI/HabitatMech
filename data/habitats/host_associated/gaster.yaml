label: gaster environment
definition: An animal-associated environment which consists of the gaster of an apocritan
  hymenopteran, the posterior part of the metasoma formed by all abdominal segments
  behind the petiole or postpetiole, sampled as an intact body region rather than
  as dissected organs.
