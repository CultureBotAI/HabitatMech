identifier: habitatmech:GOLD.453b1756ab
label: accessory nidamental gland
definition: A reproductive gland in the mantle cavity of female decapodiform cephalopods
  that develops epithelium-lined tubules supporting an extracellular bacterial consortium.
  Developing glands can precede sexual maturity and dense colonization; mature glands
  can supply bacteria to egg jelly.
