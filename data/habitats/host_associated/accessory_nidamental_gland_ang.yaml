    node_type: COMMUNITY_PROCESS
    description: Maternal transmission of ANG bacteria and antimicrobial metabolites
      (indigoidine, lincomycin, mycinamicin-like compounds) into the squid egg jelly
      coat, inhibiting marine vibrios and preventing lethal Fusarium keratoplasticum
      fungal biofouling during embryogenesis.
  edges:
  - edge_id: ang_maintains_epithelium_lined_tubules_for_microbial_recruitment_and_egg_coating
    subject: accessory_nidamental_gland_ang
    predicate: maintains
    object: ang_epithelium_lined_tubule_network_and_egg_jelly_coat_secretion
    description: The female bobtail squid accessory nidamental gland develops epithelium-lined
      tubules in response to environmental bacteria and deposits its symbionts into
      the egg jelly coat.
    evidence:
    - reference: PMID:22504817
      snippet: Transmission electron microscopy (TEM) analysis of the ANG revealed
        dense bacterial assemblages of rod- and coccus-shaped cells segregated by
        morphology into separate, epithelium-lined tubules. The host epithelium was
        morphologically heterogeneous, containing ciliated and nonciliated cells with
        various brush border thicknesses.
      notes: Collins et al. 2012 (PMID:22504817) characterized the ciliated and nonciliated
        epithelium-lined tubule architecture of the Euprymna scolopes ANG.
    - reference: PMID:36656023
      snippet: Under conditions where hosts were exposed to depleted environmental
        bacteria, ANGs were completely absent or stunted, a result independent of
        the presence of the light organ symbiont V. fischeri. When squid were raised
        in the laboratory with substrate from the host's natural environment containing
        the native microbiota, normal ANG development was observed, and the bacterial
        communities were similar to wild-caught animals.
      notes: Exposure to environmental microbiota is required for mature morphogenesis
        of the accessory nidamental gland in Euprymna scolopes (PMID:36656023).
  - edge_id: ang_tubules_select_for_roseobacter_leisingera_and_verrucomicrobia_consortium
    subject: ang_epithelium_lined_tubule_network_and_egg_jelly_coat_secretion
    predicate: selects for
    object: ang_roseobacter_leisingera_phaeobacter_and_verrucomicrobia_consortium
    description: ANG tubules selectively recruit and spatially partition Rhodobacterales
      (Phaeobacter and Leisingera sp. JC1), Rhizobiales, Verrucomicrobia, and Flavobacteria.
    evidence:
    - reference: PMID:22504817
      snippet: A census of 16S rRNA genes suggested that Rhodobacterales, Rhizobiales,
        and Verrucomicrobia bacteria were prevalent, with members of the genus Phaeobacter
        dominating the consortium. Analysis of 454-shotgun sequencing data confirmed
        the presence of members of these taxa and revealed members of a fourth, Flavobacteria
        of the Bacteroidetes phylum. 16S rRNA fluorescent in situ hybridization (FISH)
        revealed that many ANG tubules were dominated by members of specific taxa,
        namely, Rhodobacterales, Verrucomicrobia, or Cytophaga-Flavobacteria-Bacteroidetes,
        suggesting symbiont partitioning to specific host tubules.
      notes: 16S rRNA, 454-shotgun metagenomics, and FISH demonstrated tubule-partitioned
        dominance of Rhodobacterales (Phaeobacter), Rhizobiales, Verrucomicrobia,
        and Flavobacteria in the Euprymna scolopes ANG (PMID:22504817).
    - reference: PMID:36656023
      snippet: Squid raised with natural substrate supplemented with a specific ANG
        bacterial strain, Leisingera sp. JC1, had high proportions of this strain
        in the ANG, suggesting that once ANG development is initiated, specific strains
        can be introduced and subsequently colonize the organ.
      notes: Leisingera sp. JC1 colonizes developing Euprymna scolopes ANG tubules
        to high relative abundance (PMID:36656023).
  - edge_id: ang_consortium_encodes_indigoidine_and_antifungal_secondary_metabolite_pathways
    subject: ang_roseobacter_leisingera_phaeobacter_and_verrucomicrobia_consortium
    predicate: expresses
    object: leisingera_indigoidine_biosynthetic_gene_cluster_and_ang_antifungal_pathways
    description: ANG symbiont Leisingera sp. JC1 encodes and expresses the indigoidine
      biosynthetic gene cluster, siderophores, and quorum-sensing acyl-HSLs, while
      the ANG consortium produces lincomycin and mycinamicin-like antifungal metabolites.
    evidence:
    - reference: PMID:27660622
      snippet: Genome and biochemical analyses revealed the potential for and production
        of a number of secondary metabolites, including siderophores and acyl-homoserine
        lactones involved with quorum sensing. The complete biosynthetic gene cluster
        for the pigment indigoidine was detected in the genome and mass spectrometry
        confirmed the production of this compound.
      notes: Whole-genome sequencing and mass spectrometry of ANG symbiont Leisingera
        sp. JC1 confirmed the complete indigoidine biosynthetic gene cluster and siderophore/acyl-HSL
        production (PMID:27660622).
    - reference: PMID:31662458
      snippet: Several secondary metabolites were identified from ANG/JC bacteria
        and egg clutches, including the known antimicrobial lincomycin as well as
        a suite of glycerophosphocholines and mycinamicin-like compounds.
      notes: Mass spectral network analyses identified lincomycin, glycerophosphocholines,
        and mycinamicin-like antimicrobial compounds produced by ANG and egg jelly
        coat bacteria (PMID:31662458).
  - edge_id: indigoidine_and_ang_metabolites_protect_squid_eggs_from_vibrios_and_fungal_fouling
    subject: leisingera_indigoidine_biosynthetic_gene_cluster_and_ang_antifungal_pathways
    predicate: catalyzes
    object: egg_jelly_coat_deposition_and_antifungal_antibacterial_embryo_protection
    description: Indigoidine and antifungal secondary metabolites secreted with ANG
      bacteria into the egg jelly coat inhibit marine vibrios and protect developing
      squid embryos from Fusarium keratoplasticum biofouling.
    evidence:
    - reference: PMID:27660622
      snippet: Finally, both Leisingera sp. JC1 and secondary metabolite extracts
        of this strain had differential antimicrobial activity against a number of
        marine vibrios, suggesting that Leisingera sp. JC1 may play a role in host
        defense against other marine bacteria either in the eggs and/or ANG.
      notes: Leisingera sp. JC1 and its indigoidine-containing extracts inhibit competing
        marine vibrios (PMID:27660622).
    - reference: PMID:31662458
      snippet: Eggs treated with an antibiotic cocktail developed a microbial biomass
        primarily composed of the pathogenic fungus Fusarium keratoplasticum that
        infiltrated the JC, resulting in severely reduced hatch rates. Experimental
        manipulation of the eggs demonstrated that the JC was protective against this
        fungal fouling. A large proportion of the bacterial strains isolated from
        the ANG or JC inhibited F. keratoplasticum in culture (87.5%), while a similar
        proportion of extracts from these strains also exhibited antifungal activity
        against F. keratoplasticum and/or the human-pathogenic yeast Candida albicans
        (72.7%).
      notes: ANG bacteria deposited into the egg jelly coat inhibit Fusarium keratoplasticum
        (87.5% of isolates) and prevent lethal fungal egg fouling (PMID:31662458).
