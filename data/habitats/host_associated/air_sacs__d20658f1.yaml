- timestamp: '2026-09-10T00:00:00Z'
  curator: codex-gpt-5
  action: DEFINED
  changes: 'Defined as ''insect air sac'' under UBERON:0003127 ''open tracheal system
    trachea''. Definition authored from the record''s committed deep-research report
    under research/habitats/, read in full; no new paid research was commissioned.
    GOLD''s Host-associated > Arthropoda: Insects > Respiratory system > Trachea >
    Air sacs leaf denotes insect tracheal air sacs, not avian lung air sacs under
    UBERON:0009060, cetacean nasal air sacs under UBERON:0013175, swim bladders, honey
    sacs, air sac primordia, or vertebrate tracheae. UBERON:0003127 ''open tracheal
    system trachea'' is the tightest vendored genus because UBERON:6005043 ''insect
    trachea'' over-asserts tubular morphology for irregular punctate sacs and BTO:0003870
    ''insect tracheal system'' names the whole system rather than the sac. No causal
    graph was added because the report found larval Drosophila tracheal-microbiome
    evidence and metazoan air-sac parasite evidence, but no characterized microbial
    community sampled from insect air sacs themselves.'
