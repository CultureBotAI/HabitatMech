identifier: UBERON:0008250
label: cardiac stomach
definition: In starfishes the cardiac stomach is connected to a pyloric stomach which
  is located above it. Food can be brought into the stomach through the mouth or,
  in many species, the cardiac stomach can be extended out through the mouth to digest
  food outside the body. Suspension-feeding starfish use their tube feet to pass food
  to the mouth.
