identifier: BTO:0000367
label: duodenal mucosa
definition: The duodenal mucosa (and that of the rest of the intestines) is classified
  as simple columnar. The cells rest on a basal lamina, which you may be able to make
  out in this image as a bright line underneath the cells. They sit over the lamina
  propria, the loose collagenous CT, filled with cells, that constitutes the core
  of each villus.
