label: integumental system
definition: Connected anatomical system that forms a barrier between an animal and
  its environment. In vertebrates, the integumental system consists of the epidermis,
  dermis plus associated glands and adnexa such as hair and scales. In invertebrates,
  the integumental system may include cuticle.
