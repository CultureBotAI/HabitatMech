label: human gallstone
definition: An anatomical entity environment consisting of a cholesterol, pigment,
  or mixed biliary calculus (cholelith) in the human gallbladder or biliary tract,
  whose surface and interior can harbor chronic biofilm-forming enteric bacteria such
  as Salmonella enterica serovar Typhi.
