identifier: BTO:0003084
label: vaginal fluid
definition: The lubrication fluid contains water, pyridine, squalene, urea, acetic
  acid, lactic acid, complex alcohols and glycols, ketones, and aldehydes. The fluid
  is typically clear and more resembling of male pre-ejaculate than male ejaculate.
  The normal pH of vaginal fluid is between 3.8 and 4.5, whereas male semen is typically
  between 7.1 and 8.
