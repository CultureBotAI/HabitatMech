- timestamp: '2026-08-21T00:00:00Z'
  curator: codex-gpt-5
  action: CONFIRM_UNGROUNDED
  changes: 'Confirmed UNGROUNDED: no ontology term fits this concept. GO:0005622 ''intracellular
    anatomical structure'' kept as an xref. Non-habitat screen review (#108): the
    full path Host-associated > Mollusca > Respiratory system > Gills > Intracellular
    denotes the intracellular compartment of gill tissue, a real microbial habitat.
    The GO term describes the spatial compartment but is not itself a microbial-habitat
    identity, so it is retained only as an xref. (source concept habitatmech:GOLD.0ac09185d9)'
- timestamp: '2026-09-18T00:00:00Z'
  curator: codex-gpt-5
  action: DEFINED
  changes: 'Defined as ''molluscan gill intracellular environment'' under ENVO:01001055
    ''environment associated with an animal part or small animal''. Definition authored
    from the existing item-level #108 decision and the committed Mollusca and Bivalves
    reports under research/habitats/, read against Roeselers and Newton 2012 (PMID:22354364;
    DOI:10.1007/s00253-011-3819-9); no new paid research was commissioned. GOLD''s
    Host-associated > Mollusca > Respiratory system > Gills > Intracellular source
    denotes the intracellular compartment of symbiont-bearing molluscan gill bacteriocytes,
    not GO:0005622 ''intracellular anatomical structure'' as an identity, the whole
    gill, the extracellular gill-tissue compartment, the gill surface, or intracellular
    annelid trophosome endosymbionts. ENVO:01001055 ''environment associated with
    an animal part or small animal'' is the tightest safe vendored genus because ENVO
    lacks a general intracellular host environment or symbiont-bearing gill-cell environment
    class; unlike whole-host invertebrate term requests that avoid importing an animal-part
    restriction, that restriction is true here because the determinant is a molluscan
    gill cell (#345). parent_mode=REPLACE drops the source-inherited Gills parent
    because the intracellular environment lies within gill cells but is not a kind
    of gill.'
