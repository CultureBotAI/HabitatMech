identifier: BTO:0000801
label: macrophage
definition: Relatively long-lived phagocytic cell of mammalian tissues, derived from
  blood monocyte. Macrophages from different sites have distinctly different properties.
  Main types are peritoneal and alveolar macrophages, tissue macrophages (histiocytes),
  Kupffer cells of the liver, and osteoclasts. In response to foreign materials may
  become stimulated or activated. Macrophages play an important role in killing of
  some bacteria, protozoa, and tumour cells, release substances that stimulate other
  cells of the immune system, and are involved in antigen presentation. May further
  differentiate within chronic inflammatory lesions to epithelioid cells or may fuse
  to form foreign body giant cells or Langhans giant cells.
