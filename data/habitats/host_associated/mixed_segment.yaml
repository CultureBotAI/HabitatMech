identifier: habitatmech:GOLD.729ded00e9
label: termite gut mixed segment
definition: A midgut-hindgut junctional segment characteristic of higher termites
  (Termitidae) in which mesenteric midgut tissue and proctodeal hindgut epithelium
  run side by side enclosing an alkaline luminal pocket colonized by specialized gut
  clostridia.
