identifier: habitatmech:GOLD.f93dba43d8
label: mammalian digital dermatitis lesion
definition: A skin environment consisting of an ulcerative or papillomatous cutaneous
  lesion on the digital skin of a mammal, typically near the coronary band or interdigital
  cleft of ruminants, colonized by polymicrobial spirochete-rich consortia.
