identifier: FOODON:03412872
label: barramundi
definition: The barramundi or Asian sea bass, is a species of catadromous fish in
  the family Latidae of the order Perciformes. The species is widely distributed in
  the Indo-West Pacific region from South Asia to Papua New Guinea and Northern Australia.
  The fish is known as pla kapong in Thai and as bhetki in Bengali.
