identifier: habitatmech:GOLD.814eba298e
label: crustacean cuticular seta
definition: An environment associated with an animal part or small animal consisting
  of a cuticular bristle or hair-like projection (seta) on the exoskeleton of a crustacean
  (such as hydrothermal vent shrimp Rimicaris or Yeti crabs Kiwa), which serves as
  an attachment surface for dense filamentous epibiotic bacterial mats.
