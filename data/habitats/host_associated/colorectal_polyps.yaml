label: human adenomatous colorectal polyp
definition: A lesion consisting of an adenomatous polyp arising from glandular epithelium
  of the human colon or rectum, whose mucosal surface frequently harbors Fusobacterium
  nucleatum, enterotoxigenic Bacteroides fragilis, and biofilm-forming gut bacteria.
