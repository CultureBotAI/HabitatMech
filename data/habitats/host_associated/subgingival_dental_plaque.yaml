        notes: Reviewed Porphyromonas gingivalis ATCC 33277 major fimbrial subunit
          FimA type-1 (fimA, PGN_0180; 383 aa) purified from ATCC 33277 in PMID:14553921
          to demonstrate direct binding to Treponema denticola dentilisin.
