    not a place, and the GOLD path says host-associated, so the concept is the environment
    the alga provides. Same family as the sponge, nematode and reptile requests. The
    FOODON term is kept as an xref (#99), which records what the label matched without
    asserting the record is a phylum. (source concept habitatmech:GOLD.3e4ecbed63)'
