    UNGROUNDED.'
- timestamp: '2026-08-17T00:00:00Z'
  curator: claude-opus-5
  action: SAME_AS
  changes: 'Merged into habitatmech:GOLD.cd0b0940e5 ''Mammals: Human'': the same concept
    under another source''s name. Novel-concept merge (#116): BacDive''s ''Human''
    and GOLD''s ''Mammals: Human'' are the same habitat — a human acting as host —
    and both are novel, so neither has an ontology term to merge on. Before SAME_AS
    they were two permanent records holding 40,432 and 11,697 assertions for one concept,
    published as two pages, and the largest habitat in the corpus appeared nowhere
    as such. Merged onto the GOLD identifier because it carries the larger attestation
    and the deeper path; the choice of which id survives is arbitrary between two
    minted ids and is recorded here rather than left to ordering. Both keep their
    attestations on the merged record, so no evidence is lost. (source concept habitatmech:BACDIVE.c9b246fcbb)'
