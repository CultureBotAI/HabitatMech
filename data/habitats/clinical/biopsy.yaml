  curator: codex-gpt-5
  action: NOT_APPLICABLE
  changes: 'Marked NOT_APPLICABLE: the source concept does not denote a habitat. NCIT:C15189
    kept as an xref. ITEM sampling-method review (#1608): the BacDive Biopsy aggregate
    groups specimens by collection procedure, not a single anatomical habitat. NCI
    C15189 identifies the procedure, while C18202 separately identifies a biopsy specimen.
    BacDive strain 154980 records a maxillary bone biopsy with site categories; the
    aggregate tag alone does not determine a shared site. Preserve the procedure xref,
    CLINICAL category, source observations and exclusion-ledger membership. This corrects
    the former CONFIRM_UNGROUNDED habitat claim without denying that individual specimens
    or anatomical sites can host microbes. Evidence: https://api-evsrest.nci.nih.gov/api/v1/concept/ncit/C15189?include=full
    and https://bacdive.dsmz.de/strain/154980 . (source concept habitatmech:BACDIVE.3d4fdc29fb)'
