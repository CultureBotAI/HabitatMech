  action: CONFIRM_UNGROUNDED
  changes: 'Confirmed UNGROUNDED: no ontology term fits this concept. ITEM identity
    correction (#1744): Medical-environment denotes a clinical isolation context,
    not the narrower hospital building identity. The former GROUND/NARROW row admitted
    non-equivalence yet merged 438 strain assertions and 25 displayed associations
    into hospital. Restore the source mint and preserve those observations. BacDive
    153714 categorizes a patient-derived lavage isolate under Medical environment
    / Medical practice; this supports clinical context, not frozen cohort membership
    or a universal facility boundary. ENVO:00002173 ''hospital'' and ENVO:03501134
    ''healthcare facility'' are constructions; ENVO:03501331 ''healthcare environment''
    requires a facility-bounded environment, which this source tag does not establish.
    No exact replacement, broader parent or xref is asserted. Evidence: https://bacdive.dsmz.de/strain/153714
    and reports/yaml_record_review/20261008T183330Z-hospital.md. The original source-member
    join remains unverified. (source concept habitatmech:BACDIVE.5e52ea1bba)'
