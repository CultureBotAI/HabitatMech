identifier: ENVO:01000204
label: tropical
definition: A tropical condition is an environmental condition in which an environmental
  system receives high yearly solar irradiance per unit area and, on Earth, the Sun
  reaches a subsolar point at least once during the solar year. This results in a
  hot and moist year-round climate at low elevations, which have a monthly average
  temperature above 18 degrees Celsius.
