identifier: habitatmech:BACDIVE.71d5f01e03
label: cooling tower
definition: A human construction which rejects waste heat from a recirculating water
  loop by evaporating part of that water into an air stream drawn through the structure,
  and which retains the remaining water in an open basin between passes.
