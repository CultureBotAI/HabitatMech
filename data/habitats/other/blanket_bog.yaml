identifier: ENVO:00000511
label: blanket bog
definition: A peatland whose development is mostly independent of basins or topographical
  features where water collects; it simply covers the landscape like a blanket. Peat
  develops due to a continuous supply of water from rainfall, maintaining waterlogged
  conditions on the ground. Blanket bogs are ombrotrophic or rain fed, and as a result
  their pH lies between 3.5 and 4.2.
