curation_history:
- timestamp: '2026-08-14T00:00:00Z'
  curator: claude-opus-5
  action: CONFIRM_UNGROUNDED
  changes: 'Confirmed UNGROUNDED: no ontology term fits this concept. Cohort review
    (subset/disjoint mapping screen): a composite of two sites. UBERON:0001005 ''respiratory
    airway'' covers only the airways half and drops the oral cavity, and it is also
    the correct target for the separate ''Airways'' source — adopting it here would
    merge the two. No single term covers mouth plus airway; the respiratory-tract
    terms exclude the oral cavity. (source concept habitatmech:BACDIVE.3974b3f169)'
- timestamp: '2026-08-16T05:58:02Z'
  curator: seed_from_sources
  action: SEEDED_FROM_SOURCES
  changes: 'Seeded from data/raw/ inventories; attested by BACDIVE. Grounding: UNGROUNDED.'
- timestamp: '2026-08-17T00:00:00Z'
  curator: claude-opus-5
  action: DEFINED
  changes: Defined as 'upper aerodigestive tract environment' under ENVO:2100000 'anatomical
    entity environment'. Definition drafted from the record's deep-research report
    under research/habitats/ and read against it. BacDive's label names two sites
    and the upstream mapping to UBERON:0001005 'respiratory airway' covered only the
    airways half, dropping the oral cavity. The definition keeps the contiguous lumen
    both halves belong to.
