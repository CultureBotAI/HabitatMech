identifier: ENVO:01000156
label: biofilm material
definition: Material derived from a biofilm, an aggregate of microorganisms in which
  cells adhere to each other and/or to a surface. These adherent cells are frequently
  embedded within a self-produced matrix of extracellular polymeric substance (EPS).
  Biofilm EPS, which is also referred to as slime, is a polymeric conglomeration generally
  composed of extracellular DNA, proteins, and polysaccharides in various configurations.
