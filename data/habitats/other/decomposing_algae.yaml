  action: GROUND_AS_PARENT
  changes: 'ENVO:01001189 ''algal material'' attached as a parent, not adopted as
    the identity (NARROW). Judged separately from the three animal hosts of #194,
    because this is not a host organism: the algae are dead, so it is an environmental
    material rather than a living host, and HOST_ASSOCIATED does not apply. NOT_APPLICABLE
    was still wrong - decomposing algal material is a place microbes live. ENVO:01001189
    ''algal material'' is genuinely broader and needs no new term for four strains.
    Not ENVO:01001103 ''detritus'', whose definition requires dead PARTICULATE matter
    and so is not safely broader than a decomposing algal mass. The 2026-08-14 REVIEW
    row (#43) found NCBITaxon:2836 ''Bacillariophyta'' over-narrow - decomposing algae
    is not restricted to diatoms - and that wrong claim is dropped rather than carried,
    with the upstream mapping still described in the attestation note. Category left
    unset: no realm evidence in the source. (source concept habitatmech:BACDIVE.dded810572)'
