curation_history:
- timestamp: '2026-08-16T00:00:00Z'
  curator: claude-opus-5
  action: CONFIRM_UNGROUNDED
  changes: 'Confirmed UNGROUNDED: no ontology term fits this concept. Host-taxon reversal
    (#114): this was NOT_APPLICABLE on the reasoning that ''a host taxon is not a
    habitat''. That reasoning is wrong, and the corpus already contradicted it — the
    same kind of concept was treated as a habitat for Sponge, Nematoda, Reptilia,
    Mammals, Birds and Fish, which keep their own identity and a term request for
    an <X>-associated environment. Host-associated > Porifera was NOT_APPLICABLE while
    its own child Porifera > Sponge was a term request.An organism acting as a host
    IS a habitat: it is where the microbe lives, and ENVO models exactly this at plant-associated,
    animal-associated and fungi-associated environment. What is not a habitat is the
    TAXON TERM — a phylum is a class of organisms, not a place — so the taxon stays
    an xref (#99) and the concept keeps its own identity as a term-request candidate.
    NOT_APPLICABLE said the concept is not a habitat, which is a stronger and false
    claim. (source concept habitatmech:BACDIVE.18f9382d8d)'
