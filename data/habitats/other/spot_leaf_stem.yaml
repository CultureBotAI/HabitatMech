identifier: habitatmech:BACDIVE.31392c69b9
label: leaf-or-stem spot lesion environment
definition: An environment associated with a plant part or small plant which is determined
  by a discrete necrotic or chlorotic spot lesion on a leaf or stem of a living plant,
  and which is formed by a localized infection that does not spread systemically through
  the host.
