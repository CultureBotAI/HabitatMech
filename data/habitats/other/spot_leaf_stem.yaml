- timestamp: '2026-09-06T00:00:00Z'
  curator: codex-gpt-5
  action: DEFINED
  changes: Defined as 'leaf-or-stem spot lesion environment' under ENVO:01001057 'environment
    associated with a plant part or small plant'. Definition authored from the record's
    committed deep-research report under research/habitats/, read in full; no new
    paid research was commissioned. The report confirms BacDive's Infection > Plant
    infections > Spot (Leaf,Stem) source denotes a localized plant spot lesion rather
    than the healthy leaf or stem organ. ENVO:01001057 'environment associated with
    a plant part or small plant' is the tightest vendored genus while ENVO lacks a
    shared plant-infection-site environment parent. PO:0009047 'stem' drops the leaf
    disjunct and would collide with both Rot-Root,Stem and Stem-Branch; PO:0025034
    'leaf' drops the stem disjunct; ENVO:01000170 'indeterminate root nodule infection
    zone' is a symbiotic, root-specific near miss; disease, trait, and clinical necrotic-lesion
    terms are the wrong entity type.
