identifier: ENVO:00000367
label: IUCN national park
definition: An IUCN protected area which 1) primarily consists of ecosystems which
  are able to maintain their natural composition, structure, and function at a regional
  scale and which are deemed to be representative of a region's natural bio- and geodiversity,
  2) is sufficiently large to allow its constituent ecosystems to function, develop,
  and recover from natural perturbations without human intervention, and 3) is managed
  to preserve natural ecosystem integrity and functioning at a regional scale, while
  allowing human access for the purposes of conservation, cultural and spiritural
  activities, research, education, tourism, subsistence use by indigenous communities,
  and recreation.
