identifier: ENVO:01000205
label: subtropical
definition: A subtropical condition is an environmental condition in which an envrionmental
  system receives more solar irradiance than those with temperate conditions, but
  less than those with tropical conditions. At low elevations, this typically results
  in eight months of the year having average temperatures greater than or equal to
  10 degrees Celsius with the coldest monthly temperature averaging between 2 and
  13 degrees Celsius.
