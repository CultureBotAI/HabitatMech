identifier: ENVO:00000406
label: mid-ocean ridge
definition: An underwater mountain range, formed by plate tectonics. This uplifting
  of the ocean floor occurs when convection currents rise in the mantle beneath the
  oceanic crust and create magma where two tectonic plates meet at a divergent boundary.
  The mid-ocean ridges of the world are connected and form a single global mid-oceanic
  ridge system that is part of every ocean.
