- timestamp: '2026-08-16T00:00:00Z'
  curator: claude-opus-5
  action: GROUND
  changes: 'Grounded to ENVO:02000019 ''bodily fluid material'' (CLOSE). Term-request
    re-check (#12), after ENVO:01001000 showed these claims were never machine-rechecked:
    ''Fluids'' was left ungrounded after ENVO''s NCIT:C13452 ''Other Body Fluids and
    Secretions'' was refused as a residual bucket. That refusal was right and the
    conclusion was not: ENVO:02000019 ''bodily fluid material'' is a proper class
    — ''an organic material primarily composed of some natural bodily fluid or secretion
    such as blood, semen, saliva'' — and that is what BacDive''s bin holds, as its
    Digestive-fluid and Rumen-fluid children show. CLOSE rather than EXACT because
    BacDive''s is a sampling bin and ENVO''s is the material, which is the same framing
    difference CLOSE records elsewhere in the corpus. (source concept habitatmech:BACDIVE.6add57f329)'
