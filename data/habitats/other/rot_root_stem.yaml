identifier: habitatmech:BACDIVE.04ddbbeabe
label: root-or-stem rot environment
definition: An environment associated with a plant part or small plant which is determined
  by macerated or necrotic tissue of a root or stem undergoing in situ decomposition
  by an invading plant-pathogenic microorganism.
