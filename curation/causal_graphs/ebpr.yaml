causal_graphs:
- graph_id: ebpr_accumulibacter_defluviicoccus_ppk1_ppk2_phou_pst_polyphosphate_cycling
  title: EBPR bioreactor alternating anaerobic feed/aerobic famine cycling, Candidatus Accumulibacter
    phosphatis and Defluviicoccus selection, and PPK1/PPK2/PhoU-Pst polyphosphate accumulation mechanism
  description: Enhanced biological phosphorus removal (EBPR) wastewater treatment bioreactors subject
    activated sludge biomass to alternating anaerobic carbon-feed and aerobic famine regimes. This cyclic
    redox and substrate regime selects for polyphosphate-accumulating organisms (PAOs) of the lineage
    Candidatus Accumulibacter phosphatis (spanning at least five ppk1-defined clades) alongside competing
    glycogen-accumulating organisms (GAOs) of the genus Defluviicoccus (Ca. Defluviicoccus tetraformis,
    D. vanus, Ca. D. seviourii). Candidatus Accumulibacter expresses polyphosphate kinase 1 (ppk1) and
    a laterally acquired polyphosphate kinase 2 (PPK2) coupled with a dysregulated PhoU signaling protein
    that leaves the high-affinity phosphate transport (Pst) system constitutively active, condensing continuous
    inorganic phosphate uptake into intracellular polyphosphate reserves during aerobic famine while Defluviicoccus
    synthesizes glycogen and anaerobic polyhydroxyalkanoate (PHA).
  nodes:
