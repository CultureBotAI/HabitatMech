  - node_id: salt_marsh_thiodiazotropha_desulfobacteraceae_and_methanogen_guild
    label: Candidatus Thiodiazotropha, Desulfobacteraceae/Desulfobulbaceae SRB, and Methanomicrobiales/Methanosaeta
      guild
    node_type: COMMUNITY
    description: Salt marsh root, rhizosphere, and sediment prokaryotic community comprising Candidatus
      Thiodiazotropha sulfur-oxidizing diazotrophs, Desulfobacteraceae and Desulfobulbaceae sulfate-reducing
      bacteria, and Methanomicrobiales, Methanococcales, and Methanosaeta methanogens.
  - node_id: marsh_oxidative_dsrab_nifhdk_rubisco_and_mcra_enzymes
    label: oxidative and reductive dissimilatory sulfite reductase (dsrAB, dsrB), nitrogenase (nifHDK),
      RuBisCO, and methyl coenzyme M reductase A (mcrA)
    node_type: GENE_OR_PROTEIN
    description: Chemolithoautotrophic sulfur-oxidation genes (oxidative-dsrAB, dsrA; represented by Candidatus
      Thiodiazotropha endolucinida UniProtKB:A0A7Z0VL60), nitrogen-fixation genes (nifHDK, nifK; UniProtKB:A0A7Z0VLY7),
      and carbon-fixation RuBisCO (cbbL1; UniProtKB:A0A7Z0VJ95) in root-associated Candidatus Thiodiazotropha
      alongside sediment Desulfobacteraceae sulfate-reducing dsrB (UniProtKB:A0A850T8A4) and Methanosaeta
      methanogenic mcrA (UniProtKB:H3K2E3) genes.
