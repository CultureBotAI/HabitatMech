identifier: ENVO:00000054
causal_graphs:
- graph_id: saline_marsh_spartina_rhizosphere_thiodiazotropha_dsrab_nifhdk_and_mcra_cycling
  title: Saline marsh Spartina alterniflora rhizosphere sulfidic redox gradient, Candidatus Thiodiazotropha
    and SRB/methanogen guild selection, and coupled oxidative-dsrAB/nifHDK/mcrA cycling mechanism
  description: Tidal saline marshes vegetated by the foundation cordgrass Spartina alterniflora maintain
    steep rhizosphere and bulk-sediment redox gradients combining sulfidic, reduced sediment conditions
    with plant-derived organic substrates in the oxidized root zone. These gradients select for a core
    root and sediment microbiome dominated by sulfur-oxidizing symbionts of the genus Candidatus Thiodiazotropha
    alongside sulfate-reducing bacteria (Desulfobacteraceae and Desulfobulbaceae) and hydrogenotrophic/acetoclastic
    methanogens (Methanomicrobiales, Methanococcales, Methanosaeta). These guilds express oxidative and
    reductive dissimilatory sulfite reductase (oxidative-dsrAB, dsrA, dsrB), nitrogenase (nifHDK, nifK),
    ribulose-1,5-bisphosphate carboxylase/oxygenase (RuBisCO), and methyl coenzyme M reductase A (mcrA)
    to couple chemolithoautotrophic sulfide oxidation with carbon and nitrogen fixation in stressed roots
    while driving sediment sulfate reduction and methanogenesis.
  nodes:
  - node_id: saline_marsh
    label: saline marsh
    node_type: HABITAT
    grounding: ENVO:00000054
    description: Coastal intertidal saline marsh wetland vegetated by salt-tolerant macrophytes such as
      Spartina alterniflora and Phragmites australis.
  - node_id: spartina_rhizosphere_sulfidic_redox_and_root_carbon_gradient
