    label: freshwater inflow
    node_type: ENVIRONMENTAL_FACTOR
  - node_id: seawater_intrusion
    label: seawater intrusion
    node_type: ENVIRONMENTAL_FACTOR
  - node_id: tidal_mixing
    label: tidal mixing
    node_type: ENVIRONMENTAL_FACTOR
