identifier: ENVO:00002019
causal_graphs:
- graph_id: brackish_water_salinity_transition_osmoregulation
  title: Brackish water salinity-transition osmoregulation
  description: Brackish water forms where freshwater inflow and seawater
    intrusion create intermediate salinity and tidal salinity variability. These
    osmotic shifts filter freshwater and marine bacterioplankton, select
    osmoregulatory transport and compatible-solute strategies, and allow
    brackish-adapted estuarine populations to establish when growth outpaces
    hydrologic flushing.
  nodes:
  - node_id: brackish_water
    label: brackish water
    node_type: HABITAT
    grounding: ENVO:00002019
