      taxon_name: Prochlorococcus marinus (strain MIT 9313)
      role_in_node: family_member
      sequence_length: 275
      crc64: D25B7DA47B59E36C
      evidence:
      - reference: PMID:30742057
        snippet: The presence of Prochlorococcus was able to meet SAR11's central requirement for organic
          carbon, but not reduced sulfur. Prochlorococcus strain MIT9313, but not MED4, could meet the unique
          glycine requirement of SAR11, which could be due to the production and release of glycine betaine
          by MIT9313, as supported by comparative genomic evidence.
        notes: Sarcosine-dimethylglycine methyltransferase Sdmt (PMT_0551) completing glycine betaine
          biosynthesis in Prochlorococcus marinus strain MIT 9313 (PMID:30742057; genome sequence PMID:12917642).
    - accession: UniProtKB:Q4FLG1
