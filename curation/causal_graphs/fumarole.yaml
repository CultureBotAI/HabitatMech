identifier: ENVO:00000216
causal_graphs:
- graph_id: fumarole_acidic_geothermal_gas_methylacidiphilum_acidianus_xoxf_pmo3_ba3_sulfur_oxidation
  title: Fumarole and solfatara acidic geothermal CH4/C2-C3 alkane/H2S/S0 gas emissions, Methylacidiphilum
    fumariolicum and Acidianus/Sulfolobus guild selection, and XoxF/PMO3/ba3-oxidase/sulfur-oxidoreductase
    cycling mechanism
  description: Volcanic fumaroles and solfataras vent hot, extremely acidic geothermal steam and gases
    enriched in methane (CH4), short-chain alkanes and their hydrothermal oxidation products (ethane,
    propane, 2-propanol, acetone), hydrogen sulfide (H2S), and elemental sulfur (S0). These thermoacidic,
    gas-rich conditions select for thermoacidophilic verrucomicrobial methanotrophs such as Methylacidiphilum
    fumariolicum SolV alongside sulfur-metabolizing thermoacidophilic Crenarchaeota of the genera Acidianus
    and Sulfolobus. Methylacidiphilum fumariolicum SolV expresses lanthanide-dependent XoxF methanol dehydrogenase
    and its physiological electron acceptor cytochrome cGJ (cyt cGJ), acetone monooxygenase (PMO3), sulfide-oxidizing
    enzymes, and a sulfide-insensitive ba3-type terminal oxidase, while Acidianus and Sulfolobus express
    sulfur-oxidizing enzymes coupled to respiratory heme-copper oxidases as well as membrane-bound hydrogenase
    and sulfur reductase to drive simultaneous CH4, C3-compound, H2S, and elemental sulfur oxidation in
    solfataric steam vents.
