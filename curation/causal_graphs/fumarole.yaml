    node_type: COMMUNITY_PROCESS
    description: Detoxifying oxidation of H2S to elemental sulfur coupled with lanthanide-dependent methanotrophy,
      2-propanol/acetone oxidation, and aerobic/anaerobic elemental sulfur respiration in fumarolic habitats.
  edges:
  - edge_id: fumarole_maintains_thermoacidic_ch4_alkane_h2s_and_sulfur_emissions
    subject: fumarole
    predicate: maintains
    object: fumarolic_thermoacidic_ch4_short_chain_alkane_h2s_and_elemental_sulfur_emissions
    description: Geothermal fumaroles and solfataras emit methane, ethane, propane, oxidized C3 alcohols/ketones,
      H2S, and elemental sulfur under thermoacidic conditions.
    evidence:
    - reference: PMID:40626421
      snippet: Terrestrial and oceanic geothermal areas emit substantial amounts of hydrocarbons in the
        form of methane and the short-chain alkanes ethane and propane. Under hydrothermal conditions,
        these alkanes can also be oxidised to their respective alcohols and ketones, with a preference
        for the 2-position.
      notes: Geothermal vents and solfataras emit methane, ethane, propane, and hydrothermally oxidized
        2-alcohols and ketones (PMID:40626421).
    - reference: PMID:15168612
      snippet: The oxidation and reduction of elemental sulfur and reduced inorganic sulfur species are
        some of the most important energy-yielding reactions for microorganisms living in volcanic hot
        springs, solfataras, and submarine hydrothermal vents, including both heterotrophic, mixotrophic,
        and chemolithoautotrophic, carbon dioxide-fixing species.
      notes: Solfataras and volcanic vents provide elemental sulfur and reduced inorganic sulfur species
        as primary energy substrates (PMID:15168612).
  - edge_id: fumarolic_emissions_select_for_methylacidiphilum_and_acidianus_sulfolobus
    subject: fumarolic_thermoacidic_ch4_short_chain_alkane_h2s_and_elemental_sulfur_emissions
    predicate: selects for
    object: fumarole_methylacidiphilum_fumariolicum_and_acidianus_sulfolobus_guild
    description: Thermoacidic hydrocarbon and sulfur emissions in solfataras select for Methylacidiphilum
      fumariolicum SolV and sulfur-metabolizing Acidianus and Sulfolobus archaea.
    evidence:
    - reference: PMID:40626421
      snippet: The thermoacidophilic verrucomicrobial methanotroph Methylacidiphilum fumariolicum SolV,
        isolated from the Solfatara volcano, was previously shown to oxidise methane as well as the short-chain
        hydrocarbons propane and ethane.
      notes: Solfatara fumarolic emissions select for the thermoacidophilic verrucomicrobial methanotroph
        Methylacidiphilum fumariolicum SolV (PMID:40626421).
    - reference: PMID:15168612
      snippet: Elemental sulfur is the electron donor in aerobic archaea like Acidianus and Sulfolobus.
      notes: Solfatara elemental sulfur selects for thermoacidophilic Acidianus and Sulfolobus archaea
        (PMID:15168612).
  - edge_id: fumarole_guild_expresses_xoxf_cgj_pmo3_ba3_oxidase_and_sulfur_enzymes
    subject: fumarole_methylacidiphilum_fumariolicum_and_acidianus_sulfolobus_guild
    predicate: expresses
    object: solv_xoxf_mdh_cytochrome_cgj_pmo3_ba3_oxidase_and_archaeal_sulfur_oxidoreductases
    description: Methylacidiphilum fumariolicum SolV and solfataric archaea express lanthanide-dependent
      XoxF-MDH and cytochrome cGJ, PMO3 acetone monooxygenase, sulfide-insensitive ba3 terminal oxidase,
      and respiratory heme-copper oxidase/hydrogenase-sulfur reductase chains.
    evidence:
    - reference: PMID:40626421
      snippet: Transcriptomic analysis of these cultures showed that a gene cluster including a novel
        acetone monooxygenase (PMO3), previously identified in the closely related species Methylacidiphilum
        caldifontis, was highly upregulated under growth on C3 substrates.
      notes: Methylacidiphilum fumariolicum SolV strongly upregulates the PMO3 acetone monooxygenase gene
        cluster during growth on 2-propanol and acetone (PMID:40626421).
    - reference: PMID:37221165
      snippet: Strain SolV adapts to increasing H2S by expressing a sulfide-insensitive ba3-type terminal
        oxidase and grows as chemolithoautotroph using H2S as sole energy source.
      notes: Methylacidiphilum fumariolicum SolV expresses a sulfide-insensitive ba3-type terminal oxidase
        in response to H2S (PMID:37221165).
    - reference: PMID:38269599
      snippet: Herein, we report the cultivation of Ln-dependent methanotroph Methylacidiphilum fumariolicum
        SolV with nine different Lns, the isolation of the respective MDHs and the assessment of the enzyme
        activity using the dye-coupled assay. We compare these results with a protein-coupled assay using
        its physiological electron acceptor cytochrome cGJ (cyt cGJ ).
      notes: Methylacidiphilum fumariolicum SolV expresses lanthanide-dependent XoxF-MDH and its physiological
        electron acceptor cytochrome cGJ (PMID:38269599).
  - edge_id: fumarole_enzymes_catalyze_simultaneous_ch4_c3_and_sulfur_oxidation
    subject: solv_xoxf_mdh_cytochrome_cgj_pmo3_ba3_oxidase_and_archaeal_sulfur_oxidoreductases
    predicate: catalyzes
    object: simultaneous_thermoacidophilic_ch4_c3_and_h2s_s0_chemolithotrophic_oxidation
    description: SolV and archaeal oxidoreductases catalyze simultaneous CH4 and H2S oxidation to elemental
      sulfur, C3 compound oxidation, and aerobic/anaerobic elemental sulfur respiration.
    evidence:
    - reference: PMID:37221165
      snippet: Here, through extensive chemostat culturing we show that a single microorganism can oxidize
        CH4 and H2S simultaneously at equally high rates. By oxidizing H2S to elemental sulfur, the thermoacidophilic
        methanotroph Methylacidiphilum fumariolicum SolV alleviates the inhibitory effects of H2S on methanotrophy.
      notes: Methylacidiphilum fumariolicum SolV oxidizes H2S to elemental sulfur simultaneously with
        methane oxidation, relieving H2S inhibition of methanotrophy (PMID:37221165).
    - reference: PMID:15168612
      snippet: It is oxidized via sulfite and thiosulfate in a pathway involving both soluble and membrane-bound
        enzymes. This pathway was recently found to be coupled to the aerobic respiratory chain, eliciting
        a link between sulfur oxidation and oxygen reduction at the level of the respiratory heme copper
        oxidase. In contrast, elemental sulfur is the electron acceptor in a short electron transport
        chain consisting of a membrane-bound hydrogenase and a sulfur reductase in (facultatively) anaerobic
        chemolithotrophic archaea Acidianus and Pyrodictium species.
      notes: Acidianus and Sulfolobus enzymes catalyze aerobic sulfur oxidation via sulfite/thiosulfate
        to heme-copper oxidases and anaerobic H2-dependent sulfur reduction (PMID:15168612).
