  - node_id: fumarole_methylacidiphilum_fumariolicum_and_acidianus_sulfolobus_guild
    label: Methylacidiphilum fumariolicum SolV and thermoacidophilic Acidianus/Sulfolobus archaeal guild
    node_type: COMMUNITY
    description: Thermoacidophilic fumarole and solfatara community comprising verrucomicrobial methanotrophs
      (Methylacidiphilum fumariolicum SolV) and sulfur-oxidizing/reducing crenarchaeotes (Acidianus and
      Sulfolobus).
  - node_id: solv_xoxf_mdh_cytochrome_cgj_pmo3_ba3_oxidase_and_archaeal_sulfur_oxidoreductases
    label: lanthanide-dependent XoxF-MDH and cytochrome cGJ, PMO3 acetone monooxygenase, sulfide-insensitive
      ba3 terminal oxidase, and archaeal sulfur-oxidizing/reducing enzymes
    node_type: GENE_OR_PROTEIN
    description: Methylacidiphilum fumariolicum SolV lanthanide-dependent methanol dehydrogenase (XoxF-MDH)
      and electron acceptor cytochrome cGJ, C3-induced monooxygenase PMO3, and sulfide-insensitive ba3-type
      terminal oxidase alongside Acidianus/Sulfolobus sulfur oxidation enzymes, respiratory heme-copper
      oxidase, membrane-bound hydrogenase, and sulfur reductase.
  - node_id: simultaneous_thermoacidophilic_ch4_c3_and_h2s_s0_chemolithotrophic_oxidation
    label: simultaneous thermoacidophilic methane/C3-substrate oxidation, H2S detoxification to S0, and
