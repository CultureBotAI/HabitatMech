identifier: ENVO:00001999
causal_graphs:
- graph_id: marine_water_body_biological_carbon_pump
  title: Marine water body biological carbon pump
  description: Marine water bodies partition microbial activity between a
    sunlit euphotic layer where phytoplankton and cyanobacteria fix carbon and a
    darker interior where sinking particles are enzymatically hydrolyzed and
    remineralized. Particle-associated and free-living heterotrophs convert that
    organic matter to dissolved inorganic carbon and regenerated nutrients while
    consuming oxygen along the particle flux path.
