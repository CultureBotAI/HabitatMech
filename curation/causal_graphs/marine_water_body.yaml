identifier: ENVO:00001999
causal_graphs:
- graph_id: marine_water_body_biological_carbon_pump
  title: Marine water body biological carbon pump
  description: An oceanic pathway with illuminated surface water and sufficient
    depth for export below the euphotic zone, not a universal marine-waterbody
    structure. Buoyant particles and dark carbon fixation also contribute;
    this graph is not a complete carbon budget. Oxygen consumption is conditional
    on aerobic remineralization.
  nodes:
  - node_id: marine_water_body
    label: marine water body
    node_type: HABITAT
    grounding: ENVO:00001999
  - node_id: euphotic_zone
    label: euphotic zone
    node_type: ENVIRONMENTAL_FACTOR
  - node_id: marine_phytoplankton
    label: marine phytoplankton
    node_type: TAXON
  - node_id: oxygenic_photosynthesis
    label: oxygenic photosynthesis
    node_type: PATHWAY
  - node_id: particulate_organic_carbon
    label: particulate organic carbon
    node_type: CHEMICAL
  - node_id: sinking_particles
    label: sinking particles
    node_type: ENVIRONMENTAL_FACTOR
  - node_id: particle_associated_bacteria
    label: particle-associated bacteria
    node_type: TAXON
  - node_id: extracellular_enzymes
    label: extracellular enzymes
    node_type: TRAIT
  - node_id: dissolved_organic_matter
    label: dissolved organic matter
    node_type: CHEMICAL
  - node_id: free_living_heterotrophs
    label: free-living heterotrophic bacteria
    node_type: TAXON
  - node_id: dark_ocean
    label: dark ocean
    node_type: ENVIRONMENTAL_FACTOR
  - node_id: microbial_remineralization
    label: microbial remineralization
    node_type: COMMUNITY_PROCESS
  - node_id: oxygen_consumption
    label: oxygen consumption
    node_type: COMMUNITY_PROCESS
  - node_id: dissolved_inorganic_carbon
    label: dissolved inorganic carbon
    node_type: CHEMICAL
  - node_id: regenerated_nutrients
    label: regenerated nutrients
    node_type: CHEMICAL
  edges:
  - edge_id: marine_body_contains_euphotic_zone
    subject: marine_water_body
    predicate: contains
    object: euphotic_zone
    description: The illuminated surface ocean contains a euphotic zone.
    evidence:
    - reference: DOI:10.1038/ngeo1921
      notes: Fig. 1 caption; oceanic scope only.
  - edge_id: euphotic_zone_supports_marine_phytoplankton
    subject: euphotic_zone
    predicate: supports
    object: marine_phytoplankton
    description: Light supports marine phytoplankton production, subject also
      to nutrient availability; light alone is not sufficient.
    evidence:
    - reference: PMID:16163345
      notes: Multiple resource co-limitation, pp. 350-351; light/iron experiments
        and resource dependence, not an unconditional growth assertion.
  - edge_id: phytoplankton_perform_oxygenic_photosynthesis
    subject: marine_phytoplankton
    predicate: performs
    object: oxygenic_photosynthesis
    description: Photosynthetic marine phytoplankton use light to convert
      carbon dioxide and water into organic carbon and oxygen.
    evidence:
    - reference: https://www.fisheries.noaa.gov/west-coast/science-data/phytoplankton-northwest-us-shelf-ecosystem
      snippet: This energy converts water and carbon dioxide into carbohydrates (sugars) and oxygen.
      notes: NOAA Fisheries, What Is Primary Production?, first paragraph;
        inspected 2026-10-03. General reaction, not regional abundance extrapolation.
  - edge_id: photosynthesis_generates_particulate_carbon
    subject: oxygenic_photosynthesis
    predicate: generates
    object: particulate_organic_carbon
    description: Photosynthetic carbon fixation produces phytoplankton biomass
      contributing to particulate organic carbon.
    evidence:
    - reference: https://www.fisheries.noaa.gov/west-coast/science-data/phytoplankton-northwest-us-shelf-ecosystem
      notes: What Is Primary Production?, first paragraph, biomass production;
        inspected 2026-10-03.
  - edge_id: particulate_carbon_forms_sinking_particles
    subject: particulate_organic_carbon
    predicate: forms
    object: sinking_particles
    description: Aggregation, dead phytoplankton and faecal material contribute
      to sinking particles; not all particulate carbon sinks.
    evidence:
    - reference: DOI:10.1038/ngeo1921
      notes: Introduction, marine-snow discussion preceding Fig. 1.
  - edge_id: sinking_particles_enter_dark_ocean
    subject: sinking_particles
    predicate: enters
    object: dark_ocean
    description: Sinking particles export surface organic carbon below the
      oceanic euphotic zone.
    evidence:
    - reference: DOI:10.1038/ngeo1921
      notes: Introduction and Fig. 1 caption.
  - edge_id: sinking_particles_select_particle_bacteria
    subject: sinking_particles
    predicate: supports
    object: particle_associated_bacteria
    description: Sinking particles support concentrated particle-associated
      microbial activity.
    evidence:
    - reference: DOI:10.1038/ngeo1921
      snippet: Sinking particles serve as hotspots of microbial activity in the deep ocean
      notes: Microbial activity in the dark, opening paragraph; association,
        not experimental selection sufficiency. Legacy edge ID retained.
  - edge_id: particle_bacteria_express_extracellular_enzymes
    subject: particle_associated_bacteria
    predicate: expresses
    object: extracellular_enzymes
    description: Particle-associated bacteria release extracellular enzymes
      into their surroundings.
    evidence:
    - reference: DOI:10.1038/ngeo1921
      notes: Microbial activity in the dark, extracellular-enzyme release paragraph.
  - edge_id: enzymes_release_dissolved_organic_matter
    subject: extracellular_enzymes
    predicate: releases
    object: dissolved_organic_matter
    description: Extracellular hydrolysis produces smaller organic substrates
      available for cellular uptake; particle-to-water leakage is not quantified.
    evidence:
    - reference: PMID:21329211
      snippet: hydrolyzing substrates to sizes sufficiently small to be transported across cell membranes
      notes: Abstract, first sentence; limited to hydrolysis and uptake-sized
        products, not an assumed leakage flux from every particle.
  - edge_id: dissolved_organic_matter_supports_free_living_heterotrophs
    subject: dissolved_organic_matter
    predicate: supports
    object: free_living_heterotrophs
    description: Bioavailable dissolved organic substrates support free-living
      heterotrophs; much deep dissolved carbon is refractory.
    evidence:
    - reference: DOI:10.1038/ngeo1921
      notes: Microbial activity in the dark, free-living metabolism paragraph.
  - edge_id: heterotrophs_drive_microbial_remineralization
    subject: free_living_heterotrophs
    predicate: drives
    object: microbial_remineralization
    description: Heterotrophic marine microbes process organic matter through
      microbial remineralization.
    evidence:
    - reference: PMID:21329211
      notes: Abstract, first two sentences; general heterotrophic processing,
        without claiming a measured free-living share of deep-ocean respiration.
  - edge_id: dark_ocean_hosts_remineralization
    subject: dark_ocean
    predicate: hosts
    object: microbial_remineralization
    description: Oceanic waters below the euphotic zone host microbial
      remineralization.
    evidence:
    - reference: DOI:10.1038/ngeo1921
      notes: Introduction, first paragraph; Fig. 1 caption.
  - edge_id: remineralization_consumes_oxygen
    subject: microbial_remineralization
    predicate: drives
    object: oxygen_consumption
    description: Aerobic remineralization of exported organic carbon consumes
      dissolved oxygen in marine subsurface waters.
    evidence:
    - reference: PMID:16163345
      snippet: a large fraction of the available O2 is consumed
      notes: Fig. 2 caption, p. 351; organic-matter breakdown and oxygen use.
        The edge applies to aerobic respiration, not anaerobic pathways.
  - edge_id: remineralization_releases_dic
    subject: microbial_remineralization
    predicate: releases
    object: dissolved_inorganic_carbon
    description: Respiratory remineralization returns organic carbon to
      dissolved inorganic carbon.
    evidence:
    - reference: DOI:10.1038/ngeo1921
      notes: Introduction, first paragraph and Fig. 1 caption.
  - edge_id: remineralization_regenerates_nutrients
    subject: microbial_remineralization
    predicate: regenerates
    object: regenerated_nutrients
    description: Remineralization returns organic nitrogen and phosphorus to
      dissolved nutrient pools without imposing a universal nutrient ratio.
    evidence:
    - reference: PMID:16163345
      notes: Non-Redfield behaviour of phytoplankton, p. 349, opening paragraph;
        Fig. 2 caption, p. 351. Nutrient stoichiometry can vary.
