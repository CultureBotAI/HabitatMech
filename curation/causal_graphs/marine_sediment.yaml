identifier: ENVO:03000033
causal_graphs:
- graph_id: marine_sediment_sulfate_sulfur_cycling
  title: Marine sediment sulfate sulfur cycling
  description: Marine sediment receives settling organic particles and
    seawater sulfate; oxygen depletion in porewater selects sulfate-reducing
    microorganisms that mineralize organic carbon to sulfide, and the sulfide
    is either reoxidized by sulfur-cycling microorganisms or trapped with
    reactive iron as reduced sulfur minerals.
