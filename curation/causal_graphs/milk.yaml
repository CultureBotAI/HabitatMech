identifier: UBERON:0001913
causal_graphs:
- graph_id: milk_carbohydrate_lactic_acid_assembly
  title: Milk carbohydrate lactic-acid assembly
  description: Mammary glands secrete milk as a nutrient-rich aqueous emulsion
    containing lactose, oligosaccharides, fat globules, proteins, antimicrobial
    bioactives, and low-abundance milk microbiota. Milk sugars select
    saccharolytic lactic-acid bacteria and bifidobacteria, while fermentation
    converts carbohydrates into lactate and acetate that can acidify the milk
    habitat and reshape downstream community structure.
  nodes:
  - node_id: milk
    label: milk
    node_type: HABITAT
    grounding: UBERON:0001913
  - node_id: mammary_gland
    label: mammary gland
    node_type: HABITAT
    grounding: UBERON:0001911
  - node_id: aqueous_emulsion
    label: aqueous fat-protein emulsion
    node_type: STATE
  - node_id: lactose
    label: lactose
    node_type: CHEMICAL
  - node_id: milk_oligosaccharides
    label: milk oligosaccharides
    node_type: CHEMICAL
  - node_id: milk_fat_globules
    label: milk fat globules
    node_type: CHEMICAL
  - node_id: milk_proteins
    label: milk proteins
    node_type: CHEMICAL
  - node_id: antimicrobial_bioactives
    label: antimicrobial bioactives
    node_type: CHEMICAL
  - node_id: milk_microbiota
    label: milk microbiota
    node_type: COMMUNITY_PROCESS
  - node_id: lactic_acid_bacteria
    label: lactic-acid bacteria
    node_type: TAXON
  - node_id: bifidobacteria
    label: bifidobacteria
    node_type: TAXON
  - node_id: lactose_fermentation
    label: lactose fermentation
    node_type: PATHWAY
  - node_id: oligosaccharide_catabolism
    label: oligosaccharide catabolism
    node_type: PATHWAY
