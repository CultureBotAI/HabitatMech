causal_graphs:
- graph_id: accessory_nidamental_gland_leisingera_indigoidine_and_antifungal_egg_defense
  title: Cephalopod accessory nidamental gland tubule recruitment, Leisingera indigoidine/secondary metabolite
    biosynthesis, and egg clutch antifungal defense mechanism
  description: Female bobtail squids (Euprymna scolopes) and other cephalopod mollusks develop a specialized
    reproductive organ, the accessory nidamental gland (ANG), composed of morphologically heterogeneous
    ciliated and nonciliated epithelium-lined tubules whose morphogenesis requires exposure to environmental
    bacteria (including Verrucomicrobia). The spatially partitioned ANG tubules house dense bacterial
    assemblages dominated by Rhodobacterales (Roseobacter clade genera Phaeobacter and Leisingera sp.
    JC1), Rhizobiales, Verrucomicrobia, and Flavobacteria. ANG symbionts such as Leisingera sp. JC1 encode
    the complete biosynthetic gene cluster for the antimicrobial pigment indigoidine alongside siderophore,
    acyl-homoserine lactone quorum-sensing, and antifungal secondary metabolite pathways (producing lincomycin,
    mycinamicin-like compounds, and glycerophosphocholines), which are deposited into the egg jelly coat
    to inhibit marine vibrios and pathogenic fungal biofouling by Fusarium keratoplasticum.
