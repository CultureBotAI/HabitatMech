identifier: ENVO:00002012
causal_graphs:
- graph_id: hypersaline_osmoadaptation
  title: Hypersaline osmoadaptation
  description: High external salinity lowers water activity and selects for osmotic
    balancing strategies in halophilic microorganisms.
  nodes:
  - node_id: high_salinity
    label: high salinity
    node_type: ENVIRONMENTAL_PARAMETER
  - node_id: low_water_activity
    label: low water activity
    node_type: ENVIRONMENTAL_FACTOR
  - node_id: potassium_chloride_accumulation
    label: potassium chloride accumulation
    node_type: BIOLOGICAL_PROCESS
  - node_id: salt_adapted_intracellular_machinery
    label: salt-adapted intracellular machinery
    node_type: TRAIT
  - node_id: compatible_solute_accumulation
    label: compatible solute accumulation
    node_type: BIOLOGICAL_PROCESS
  edges:
  - edge_id: salinity_reduces_water_activity
    subject: high_salinity
    predicate: promotes
    object: low_water_activity
    description: High salt in hypersaline water makes low water activity the core
      osmotic constraint experienced by resident microbes.
    evidence:
    - reference: PMID:29529204
      snippet: low water activity of their environment
      notes: Gunde-Cimerman et al. review osmotic adaptation to hypersaline
        environments across Archaea, Bacteria, and Eukarya.
  - edge_id: low_water_activity_selects_salt_in
    subject: low_water_activity
    predicate: selects for
    object: potassium_chloride_accumulation
    description: One osmotic-balancing route is the salt-in strategy, in which
      halophiles accumulate intracellular potassium chloride.
    evidence:
    - reference: PMID:29529204
      snippet: accumulate salts, mainly KCl
      notes: The review identifies salt accumulation as an osmoadaptation
        strategy used by many halophilic Archaea and some Bacteria.
  - edge_id: salt_in_requires_salt_adapted_machinery
    subject: potassium_chloride_accumulation
    predicate: requires
    object: salt_adapted_intracellular_machinery
    description: Cells using molar intracellular salt require proteins that
      remain properly folded and active under those ionic conditions.
    evidence:
    - reference: PMID:18412960
      snippet: requires adaptation of the intracellular enzymatic machinery
      notes: This excerpt supports protein function at high salt. The review's
        separate acidity generalization is qualified by the primary
        counterevidence below.
    - reference: PMID:22527048
      snippet: the genomic analysis did not show unusually high contents of acidic amino acids
      notes: Primary analysis of three Halanaerobiales genomes did not confirm
        the predicted acidic proteomes despite the group's salt-in strategy.
        This counters a universal acidity requirement, not the need for
        intracellular machinery compatible with high salt.
  - edge_id: low_water_activity_selects_compatible_solutes
    subject: low_water_activity
    predicate: selects for
    object: compatible_solute_accumulation
    description: A second osmotic-balancing route is accumulation or synthesis
      of organic compatible solutes.
    evidence:
    - reference: PMID:29529204
      snippet: organic osmotic, so-called compatible solutes
      notes: The review contrasts organic compatible-solute accumulation with
        the salt-in strategy.
