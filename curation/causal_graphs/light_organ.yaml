  - node_id: syp_biofilm_aggregation_crypt_epithelial_remodeling_and_bioluminescent_symbiosis
    label: Syp-dependent surface biofilm aggregation, crypt dispersal, and Lux-induced crypt epithelial
      swelling and persistence
    node_type: COMMUNITY_PROCESS
    description: Transient SYP-matrix biofilm aggregation on the nascent light organ surface, dispersal
      into deep crypts, and LuxA/LuxI/LuxR-dependent bioluminescence that induces host crypt epithelial
      cell swelling and sustains 3-to-4-fold higher colonization levels.
  edges:
  - edge_id: light_organ_maintains_selective_recruitment_surface_and_crypt_niche
    subject: light_organ
    predicate: maintains
    object: nascent_light_organ_mucus_ciliated_field_and_crypt_microenvironment
    description: The juvenile Euprymna scolopes light organ uses V-type ATPase (VHA) proton pump activity
      on its ciliated epithelial fields to create an acidic, antimicrobial mucus microenvironment that
      promotes specific symbiont recruitment.
    evidence:
    - reference: PMID:39695176
      snippet: Recruitment of V. fischeri from the surrounding seawater is mediated by juvenile-specific
        ciliated fields on the organ's surface. These epithelia produce acidic mucus containing antimicrobials
        with low-pH optima, creating a chemical environment fostering specific recruitment of V. fischeri.
        We provide evidence that this critical acidic landscape is created by activity of VHA.
      notes: Hargadon et al. 2024 (PMID:39695176) demonstrated that host V-type ATPase (VHA) creates the
        acidic mucus landscape on the juvenile Euprymna scolopes light organ surface.
  - edge_id: light_organ_recruitment_niche_selects_for_vibrio_fischeri
    subject: nascent_light_organ_mucus_ciliated_field_and_crypt_microenvironment
    predicate: selects for
    object: vibrio_fischeri_monospecific_light_organ_symbiont_population
    description: Ciliary movements and VHA-acidified mucus on the nascent light organ surface selectively
      recruit Vibrio fischeri from ambient seawater into surface biofilm aggregates and deep crypt spaces.
    evidence:
    - reference: PMID:38270381
      snippet: Juvenile squid hatch aposymbiotically and selectively acquire their symbiont from natural
        seawater containing diverse environmental microbes. Successful pairing is facilitated by ciliary
        movements that direct bacteria to quiet zones on the surface of the squid's symbiotic light organ
        where V. fischeri forms a small aggregate or biofilm. Subsequently, the bacteria disperse from
        that aggregate to enter the organ, ultimately reaching and colonizing deep crypt spaces.
      notes: Ciliary currents and surface quiet zones selectively recruit Vibrio fischeri from seawater
        into transient aggregates that disperse into deep crypt spaces (PMID:38270381).
  - edge_id: vibrio_fischeri_expresses_rscs_syp_lapv_and_luxa_luxi_luxr_genes
    subject: vibrio_fischeri_monospecific_light_organ_symbiont_population
    predicate: expresses
    object: vibrio_fischeri_rscs_syp_lapv_and_luxa_luxi_luxr_bioluminescence_system
    description: Vibrio fischeri expresses the sensor kinase RscS to activate transcription of the syp
      polysaccharide locus (including sypN) and LapV adhesin during surface aggregation and induces luxA,
      luxI, and luxR inside the light organ crypts.
    evidence:
    - reference: PMID:17087775
      snippet: Previously, we identified in Vibrio fischeri a putative sensor kinase, RscS, required for
        initiating symbiotic colonization of its squid host Euprymna scolopes. Here, we analysed the role
        of rscS by isolating an allele, rscS1, with increased activity. Multicopy rscS1 activated transcription
        of genes within the recently identified symbiosis polysaccharide (syp) cluster.
      notes: RscS activates transcription of the symbiosis polysaccharide (syp) gene cluster in Vibrio
        fischeri (PMID:17087775).
    - reference: PMID:38270381
      snippet: Some of the most well-characterized matrix factors include the symbiosis polysaccharide
        (SYP), cellulose polysaccharide, and LapV adhesin.
      notes: Vibrio fischeri biofilm matrix assembly involves SYP polysaccharide, cellulose polysaccharide,
        and the LapV adhesin (PMID:38270381).
    - reference: PMID:10913092
      snippet: While the luminescence (lux) genes of symbiotic V. fischeri have been shown to be highly
        induced within the crypts, the role of these genes in the initiation and persistence of the symbiosis
        has not been rigorously examined. We have constructed and examined three mutants (luxA, luxI,
        and luxR), defective in either luciferase enzymatic or regulatory proteins.
      notes: Symbiotic Vibrio fischeri highly induces the luxA, luxI, and luxR luminescence genes within
        the light organ crypts (PMID:10913092).
  - edge_id: syp_and_lux_systems_drive_biofilm_aggregation_crypt_swelling_and_persistent_colonization
    subject: vibrio_fischeri_rscs_syp_lapv_and_luxa_luxi_luxr_bioluminescence_system
    predicate: catalyzes
    object: syp_biofilm_aggregation_crypt_epithelial_remodeling_and_bioluminescent_symbiosis
    description: RscS-activated syp transcription drives surface biofilm aggregation on the light organ,
      while LuxA/LuxI/LuxR-catalyzed bioluminescence induces host crypt epithelial cell swelling and maintains
      3-to-4-fold higher crypt colonization levels.
    evidence:
    - reference: PMID:17087775
      snippet: Finally, multicopy rscS1 provided a colonization advantage over control cells and substantially
        enhanced the ability of wild-type cells to aggregate on the surface of the symbiotic organ of
        E. scolopes; this latter phenotype similarly depended upon an intact syp locus.
      notes: RscS-mediated transcription of an intact syp locus drives symbiotic aggregation on the Euprymna
        scolopes light organ surface (PMID:17087775).
    - reference: PMID:10913092
      snippet: All three are unable to induce normal luminescence levels in the host and, 2 days after
        initiating the association, had a three- to fourfold defect in the extent of colonization. Surprisingly,
        these lux mutants also were unable to induce swelling in the crypt epithelial cells. Complementing,
        in trans, the defect in light emission restored both normal colonization capability and induction
        of swelling.
      notes: Loss of luxA, luxI, or luxR causes a 3-to-4-fold colonization defect and abolishes host crypt
        epithelial cell swelling in the Euprymna scolopes light organ (PMID:10913092).
