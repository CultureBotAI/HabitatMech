causal_graphs:
- graph_id: squid_light_organ_vha_acidic_mucus_vibrio_fischeri_rscs_syp_lapv_biofilm_and_lux_symbiosis
  title: Squid light organ V-type ATPase acidic mucus recruitment, Vibrio fischeri RscS-Syp biofilm aggregation,
    and LuxR-LuxI-LuxA bioluminescence morphogenesis mechanism
  description: Juvenile Hawaiian bobtail squid (Euprymna scolopes) hatch aposymbiotically and recruit
    their specific bacterial symbiont Vibrio (Aliivibrio) fischeri from seawater across juvenile-specific
    ciliated epithelial fields whose V-type ATPase (VHA) proton pump creates an acidic mucus microenvironment
    containing low-pH-optima antimicrobials. Directed to surface quiet zones by ciliary movements, V.
    fischeri uses the sensor kinase RscS (rscS) to activate transcription of the symbiosis polysaccharide
    (syp) gene locus (including sypN) alongside cellulose polysaccharide and the LapV adhesin, forming
    a transient surface biofilm aggregate before dispersing into deep crypt spaces. Inside the crypts,
    V. fischeri induces the luminescence regulatory and enzymatic proteins LuxR, LuxI, and LuxA (luxA,
    luxI, luxR), catalyzing bioluminescence and oxygen consumption that induce swelling of host crypt
    epithelial cells and sustain full colonization density.
  nodes:
  - node_id: light_organ
    label: cephalopod symbiotic light organ environment
    node_type: HABITAT
    grounding: habitatmech:GOLD.200051736e
    description: Specialized ventral mantle cavity photophore organ of sepiolid squids (such as Euprymna
      scolopes) and other marine animals that houses dense extracellular populations of bioluminescent
      bacterial symbionts in epithelium-lined crypts.
  - node_id: nascent_light_organ_mucus_ciliated_field_and_crypt_microenvironment
    label: V-type ATPase-acidified ciliated recruitment mucus and deep crypt microenvironment
    node_type: ENVIRONMENTAL_FACTOR
    description: Juvenile-specific ciliated epithelial fields on the Euprymna scolopes light organ surface
      acidified by host V-type ATPase (VHA) activity and antimicrobials, leading into epithelium-lined
      crypt spaces.
  - node_id: vibrio_fischeri_monospecific_light_organ_symbiont_population
    label: monospecific Vibrio (Aliivibrio) fischeri light organ symbiont population
    node_type: COMMUNITY
    description: Extracellular monospecific population of the bioluminescent marine bacterium Vibrio (Aliivibrio)
      fischeri colonizing the light organ surface aggregates and deep crypts of Euprymna scolopes.
  - node_id: vibrio_fischeri_rscs_syp_lapv_and_luxa_luxi_luxr_bioluminescence_system
    label: Vibrio fischeri RscS sensor kinase, syp polysaccharide locus (sypN), LapV adhesin, and LuxA/LuxI/LuxR
      bioluminescence system
    node_type: GENE_OR_PROTEIN
    description: 'Symbiosis sensor kinase RscS (rscS), symbiosis polysaccharide (syp) locus including
      glycosyltransferase sypN, LapV adhesin, and the luminescence enzymatic and regulatory proteins LuxA,
      LuxI, and LuxR (luxA, luxI, luxR) in Vibrio (Aliivibrio) fischeri, interacting with host V-type
      ATPase (VHA). Verified protein_examples are attached for the squid light organ symbiont Aliivibrio
      (Vibrio) fischeri strain ATCC 700601 / ES114 (NCBITaxon:312309): symbiosis sensor histidine kinase
      RscS (UniProtKB:Q5E0Y9, rscS, VF_A0237; PMID:17087775), symbiosis polysaccharide glycosyltransferase
      SypN (UniProtKB:Q5DYP3, sypN, VF_A1033; PMID:17087775, PMID:38270381), luciferase alpha chain LuxA
      (UniProtKB:Q5DZ05, luxA, VF_A0921; PMID:10913092), acyl-homoserine-lactone synthase LuxI (UniProtKB:P35328,
      luxI, VF_A0924; PMID:10913092), and transcriptional activator LuxR (UniProtKB:P35327, luxR, VF_A0925;
      PMID:10913092).'
    protein_examples:
    - accession: UniProtKB:Q5E0Y9
