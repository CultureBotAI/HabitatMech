        notes: Aliivibrio (Vibrio) fischeri strain ES114 (NCBITaxon:312309) glycosyltransferase SypN (sypN,
          locus tag VF_A1033, UniProtKB:Q5DYP3, 378 aa) is a core enzyme of the syp symbiosis polysaccharide
