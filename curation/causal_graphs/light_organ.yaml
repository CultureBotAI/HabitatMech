      role_in_node: family_member
      sequence_length: 927
      crc64: 9EE0659CB2E8BF8B
      evidence:
      - reference: PMID:17087775
        snippet: Previously, we identified in Vibrio fischeri a putative sensor kinase, RscS, required
          for initiating symbiotic colonization of its squid host Euprymna scolopes. Here, we analysed
          the role of rscS by isolating an allele, rscS1, with increased activity. Multicopy rscS1 activated
          transcription of genes within the recently identified symbiosis polysaccharide (syp) cluster.
        notes: Aliivibrio (Vibrio) fischeri strain ES114 (NCBITaxon:312309) sensor histidine kinase RscS
          (rscS, locus tag VF_A0237, UniProtKB:Q5E0Y9, 927 aa) activates syp cluster transcription and
          surface biofilm aggregation during Euprymna scolopes light organ colonization (PMID:17087775).
