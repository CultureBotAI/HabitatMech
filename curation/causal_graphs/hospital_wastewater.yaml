causal_graphs:
- graph_id: hospital_wastewater_sub_mic_carbapenem_disinfectant_enterobacterales_blakpc_blandm_blavim_transfer
  title: Hospital wastewater sub-MIC carbapenem and chlorine disinfectant regime, carbapenem-resistant
    Enterobacterales and sewer-biofilm guild selection, and blaNDM/blaKPC/blaVIM/blaOXA-48/intI1/OmpK35-36
    resistance dissemination mechanism
  description: Hospital wastewater and sewer-pipe effluents combine clinical pathogen loads with sub-inhibitory
    concentrations of beta-lactam and carbapenem antibiotics (such as imipenem) and chlorine-containing
    hospital disinfectants. This selective regime enriches multidrug-resistant and carbapenem-resistant
    Enterobacterales (Klebsiella pneumoniae including ST11, Escherichia coli, and Citrobacter freundii)
    as well as sewer-pipe biofilm colonizers (Aeromonas, Pseudomonas, Stenotrophomonas, and Acinetobacter).
    These populations carry and express acquired carbapenemase genes (blaNDM-1, blaKPC-2, blaVIM, blaOXA-48,
    blaGES) alongside class 1 integron integrase (intI1) on conjugative IncX3, IncFII, and 80-kb plasmids
    and ISKpn19 composite transposons, often combined with outer-membrane porin OmpK35 and OmpK36 loss,
    driving elevated carbapenem minimum inhibitory concentrations, disinfectant-tolerant biofilm persistence,
    and interspecies horizontal plasmid transfer.
  nodes:
  - node_id: hospital_wastewater
    label: hospital wastewater
    node_type: HABITAT
    grounding: habitatmech:GOLD.242c0c0793
