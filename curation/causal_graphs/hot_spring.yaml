identifier: ENVO:00000051
causal_graphs:
- graph_id: hot_spring_thermophile_chemolithoautotrophy
  title: Hot spring thermophile chemolithoautotrophy
  description: In high-temperature hot springs, geothermal water can favor
    thermophilic growth and protein thermal stability. Reduced inorganic
    electron donors can support chemolithoautotrophy in capable organisms;
    the cited isolate and community studies do not describe every hot spring.
  nodes:
  - node_id: hot_spring
    label: hot spring
    node_type: HABITAT
    grounding: ENVO:00000051
  - node_id: geothermal_heating
    label: geothermal heating
    node_type: ENVIRONMENTAL_FACTOR
  - node_id: high_water_temperature
    label: high water temperature
    node_type: ENVIRONMENTAL_PARAMETER
  - node_id: thermophilic_growth
    label: thermophilic growth capacity
    node_type: CAPACITY
  - node_id: thermostable_proteins
    label: protein thermal stability
    node_type: TRAIT
  - node_id: geologic_hydrogen
    label: geologic hydrogen
    node_type: CHEMICAL
  - node_id: reduced_sulfur_compounds
    label: reduced sulfur compounds
    node_type: CHEMICAL
  - node_id: aquificales_thermophiles
    label: Aquificales thermophiles
    node_type: TAXON
  - node_id: hydrogen_oxidation
    label: hydrogen oxidation
    node_type: PATHWAY
  - node_id: sulfur_oxidation
    label: sulfur oxidation
    node_type: PATHWAY
  - node_id: chemolithoautotrophic_primary_production
    label: chemolithoautotrophic primary production
    node_type: COMMUNITY_PROCESS
  - node_id: inorganic_carbon_fixation
    label: inorganic carbon fixation
    node_type: BIOLOGICAL_PROCESS
  edges:
  - edge_id: hot_spring_is_geothermally_heated
    subject: hot_spring
    predicate: is heated by
    object: geothermal_heating
    description: Hot springs are groundwater outflows heated by geothermal
      energy.
    evidence:
    - reference: PMID:30038374
      snippet: Microbial biogeography of 925 geothermal springs
      notes: Power et al., Introduction, describes geothermal heating of
        groundwater. The surveyed springs span broad temperatures; heating
        does not imply that every spring is an extreme-temperature habitat.
  - edge_id: geothermal_heating_creates_high_temperature
    subject: geothermal_heating
    predicate: creates
    object: high_water_temperature
    description: Geothermal heating can create high-temperature spring water;
      this edge concerns the surveyed Yellowstone springs above 70 C.
    evidence:
    - reference: PMID:15671178
      snippet: high-temperature microbial ecosystems
      notes: Spear et al., Abstract, studied Yellowstone communities above
        70 C using community composition, chemistry, and thermodynamic models.
  - edge_id: high_temperature_selects_thermophiles
    subject: high_water_temperature
    predicate: selects for
    object: thermophilic_growth
    description: High-temperature conditions can favor thermophilic growth;
      community temperature effects depend on the sampled range and chemistry.
    evidence:
    - reference: PMID:30038374
      snippet: niche selection driving assembly
      notes: Power et al., Abstract, reports local niche selection across
        925 springs. Temperature affected diversity above 70 C; below that,
        pH was the stronger factor. This is community association/inference,
        not an experimental proof of temperature-only selection.
  - edge_id: high_temperature_requires_thermostable_proteins
    subject: high_water_temperature
    predicate: selects for
    object: thermostable_proteins
    description: Growth at high temperature requires functional proteins,
      maintained by intrinsic stability or extrinsic stabilization.
    evidence:
    - reference: PMID:11256505
      snippet: extrinsic factors
      notes: Sterner and Liebl, Abstract, distinguishes intrinsic protein
        stability from stabilization by chaperones and compatible solutes.
  - edge_id: hot_spring_contains_hydrogen
    subject: hot_spring
    predicate: supplies
    object: geologic_hydrogen
    description: Hot-spring fluids can contain geologically sourced hydrogen at
      concentrations relevant to microbial energetics.
    evidence:
    - reference: PMID:31276280
      snippet: Variable vapour input
      notes: Lindsay et al., Abstract, links variation in geological hydrogen
        supply with hydrogen-use and carbon-fixation evidence in specified
        Yellowstone springs; concentrations are not universal spring values.
  - edge_id: hydrogen_fuels_hot_spring_primary_production
    subject: geologic_hydrogen
    predicate: fuels
    object: chemolithoautotrophic_primary_production
    description: Hydrogen oxidation can fuel primary production in
      high-temperature geothermal ecosystems.
    evidence:
    - reference: PMID:15671178
      snippet: three lines of inference
      notes: Spear et al., Abstract, infers hydrogen-supported production from
        community composition, chemistry, and thermodynamics in Yellowstone
        springs above 70 C; it does not directly measure production flux.
  - edge_id: hot_spring_contains_reduced_sulfur
    subject: hot_spring
    predicate: supplies
    object: reduced_sulfur_compounds
    description: Hot-spring fluids can contain reduced sulfur compounds that
      serve as electron donors for thermophilic microorganisms.
    evidence:
    - reference: PMID:15671178
      snippet: high concentrations of sulfide
      notes: Spear et al., Abstract, includes sulfide-rich Yellowstone springs
        in its thermodynamic analysis; the donor need not dominate production.
  - edge_id: hydrogen_supports_aquificales
    subject: geologic_hydrogen
    predicate: supports
    object: aquificales_thermophiles
    description: Hydrogen can support capable hot-spring Aquificales, with
      Thermocrinis minervae CR11 providing a cultured example.
    evidence:
    - reference: PMID:19651724
      snippet: The isolate grows chemolithotrophically
      notes: Caldwell et al., Abstract and growth experiments, establishes
        hydrogen-supported CR11 growth with oxygen, not activity of all
        Aquificales populations in situ.
  - edge_id: reduced_sulfur_supports_aquificales
    subject: reduced_sulfur_compounds
    predicate: supports
    object: aquificales_thermophiles
    description: Reduced sulfur compounds support hot-spring Aquificales capable
      of sulfur oxidation.
    evidence:
    - reference: PMID:19651724
      snippet: The isolate grows chemolithotrophically
      notes: Caldwell et al., Abstract and growth experiments, reports CR11
        using elemental sulfur or thiosulfate with oxygen in culture.
  - edge_id: aquificales_perform_hydrogen_oxidation
    subject: aquificales_thermophiles
    predicate: performs
    object: hydrogen_oxidation
    description: Hot-spring Aquificales include thermophiles that oxidize
      hydrogen for energy.
    evidence:
    - reference: PMID:19651724
      snippet: The isolate grows chemolithotrophically
      notes: Caldwell et al., Abstract, provides the bounded CR11 hydrogen-use
        example; this capability is not asserted for every order member.
  - edge_id: aquificales_perform_sulfur_oxidation
    subject: aquificales_thermophiles
    predicate: performs
    object: sulfur_oxidation
    description: Hot-spring Aquificales include thermophiles that oxidize
      reduced sulfur compounds for energy.
    evidence:
    - reference: PMID:9758770
      snippet: hydrogen, thiosulfate, and elemental sulfur
      notes: Huber et al., Abstract, reports chemolithoautotrophic growth of
        Thermocrinis ruber OC 1/4 with these donors and oxygen in culture.
  - edge_id: sulfur_oxidation_drives_primary_production
    subject: sulfur_oxidation
    predicate: contributes to
    object: chemolithoautotrophic_primary_production
    description: Sulfur oxidation can contribute energy to carbon fixation in
      capable hot-spring Aquificales, as demonstrated for cultured CR11.
    evidence:
    - reference: PMID:19651724
      snippet: as electron donors
      notes: Caldwell et al., species description on p. 342, reports CR11
        chemolithoautotrophy with reduced sulfur and CO2 as a carbon source.
  - edge_id: hydrogen_oxidation_drives_primary_production
    subject: hydrogen_oxidation
    predicate: can drive
    object: chemolithoautotrophic_primary_production
    description: Hydrogen oxidation provides energy for inorganic carbon
      fixation in high-temperature hot-spring communities.
    evidence:
    - reference: PMID:15671178
      snippet: three lines of inference
      notes: Spear et al., Abstract, supports an inferred hydrogen-based
        energy budget, not a measured universal carbon-fixation rate.
  - edge_id: primary_production_fixes_inorganic_carbon
    subject: chemolithoautotrophic_primary_production
    predicate: involves
    object: inorganic_carbon_fixation
    description: Chemolithoautotrophic primary production involves inorganic
      carbon fixation. CR11 demonstrates this capacity in culture, without
      establishing the organic-carbon concentration of its source water.
    evidence:
    - reference: PMID:19651724
      snippet: as carbon sources
      notes: Caldwell et al., species description on p. 342, lists CO2 among
        CR11 carbon sources and explicitly reports chemolithoautotrophy.
        The same isolate can also use organic carbon; isolate capability
        is not a measurement of community production or source-water carbon.
