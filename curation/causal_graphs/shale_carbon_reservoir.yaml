  - node_id: hypersaline_anoxic_shale_brine_guar_polymer_thiosulfate_and_methylamine_regime
    label: hypersaline anoxic shale porewater (up to 3,490 mM Cl-), fracturing-fluid guar polymers, thiosulfate,
