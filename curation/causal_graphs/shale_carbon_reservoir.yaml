causal_graphs:
- graph_id: shale_carbon_reservoir_hypersaline_fracking_fluid_halanaerobium_methanohalophilus_rhodanese_asr_souring
  title: Shale hydrocarbon reservoir hypersaline anoxic porewater and fracturing-polymer/thiosulfate regime,
    Halanaerobium/Methanohalophilus/Desulfohalobium guild selection, and rhodanese/anaerobic sulfite reductase
    and methylotrophic methanogenesis reservoir-souring mechanism
  description: Subsurface shale hydrocarbon reservoirs and hydraulically fractured black shale formations
    (such as the Marcellus, Utica, Antrim, and Permian/Midland Basin shales) maintain anoxic, hypersaline
    porewaters and produced fluids (up to 3,490 mM Cl-) enriched in sedimentary hydrocarbons, injected
    polysaccharide gelling polymers (guar gum), methylated amines, and oxidized sulfur species (thiosulfate
    and sulfate). High chlorinity inhibits acetoclastic methanogenesis above ~1,000 mM Cl- and selects
    for persistent halophilic fermentative and sulfidogenic bacteria dominated by Halanaerobium alongside
    Geotoga, Desulfohalobium, and halophilic methylotrophic methanogens of the genus Methanohalophilus
    (or hydrogenotrophic Methanoplanus and Methanocorpusculum at lower salinities). Halanaerobium expresses
    mixed-acid polymer-fermentation enzymes, conserved rhodanese-like sulfurtransferases, and anaerobic
    sulfite reductase (Asr) complexes that reduce thiosulfate to hydrogen sulfide while generating mannose,
    acetate, H2, and methylated substrates that fuel Desulfohalobium sulfate reduction and Methanohalophilus
    methylotrophic methanogenesis, driving biogenic gas generation, reservoir souring, and pipeline corrosion.
