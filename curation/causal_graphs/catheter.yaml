identifier: NCIT:C50344
causal_graphs:
- graph_id: catheter_polymer_fibrinogen_urea_proteus_staphylococcus_enterococcus_mrph_urease_icaadbc_ebpa_encrustation
  title: Indwelling catheter polymer surface, deposited host fibrinogen, and urinary urea regime, Proteus
    mirabilis/Staphylococcus epidermidis/Enterococcus faecalis biofilm guild selection, and MrpH/urease/icaADBC/EbpA
    crystalline encrustation and biofilm mechanism
  description: Indwelling medical catheters (such as urethral and intravascular catheters) present abiotic
    silicone/polymer luminal surfaces coated with host-released fibrinogen and flushed by urea- and ion-bearing
    urine as well as sub-inhibitory antibiotic or external stresses. These foreign-body surface conditions
    select for polymicrobial and monospecies catheter biofilm colonizers including urease-producing Proteus
    mirabilis, coagulase-negative Staphylococcus epidermidis, and multiantibiotic-resistant Enterococcus
    faecalis. On the catheter surface, Proteus mirabilis expresses mannose-resistant Proteus-like (MR/P)
    fimbriae with tip adhesin MrpH and cytoplasmic urease, Enterococcus faecalis expresses the endocarditis-
    and biofilm-associated pilus (Ebp) tip adhesin EbpA (binding host fibrinogen via its N-terminal domain
    EbpA(NTD)), and Staphylococcus epidermidis expresses the icaADBC operon (subject to IS256-mediated
    phase variation in icaC) synthesizing polysaccharide intercellular adhesin (PIA). Together these adhesins,
    polysaccharides, and urease drive fibrinogen- and polymer-dependent biofilm accumulation, urea hydrolysis
    that elevates urinary pH, and precipitation of calcium phosphate and magnesium ammonium phosphate
    (struvite/apatite) crystals that encrust and occlude the catheter lumen.
