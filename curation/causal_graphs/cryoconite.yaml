causal_graphs:
- graph_id: cryoconite_phormidesmis_wzy_abc_eps_granulation_and_redox_stratified_n_cycling
  title: Glacier cryoconite mineral sediment and radial O2 stratification, Phormidesmis priestleyi and
    nitrifier/denitrifier selection, and Wzy/ABC-dependent EPS granulation and coupled N cycling mechanism
  description: Supraglacial cryoconite holes accumulate dark mineral dust and rock particles on glacier
    ice surfaces under extreme cold and oligotrophic meltwater conditions. Gliding filamentous cyanobacteria
    including Phormidesmis priestleyi (such as Greenland Ice Sheet isolate BC1401) colonize the mineral
    particles and express Wzy- and ABC-dependent exopolysaccharide (EPS) biosynthesis pathways and Wps-homologous
    biofilm gene clusters. Secreted cyanobacterial EPS binds mineral grains into millimeter-scale oval
    cryoconite granules with a photosynthetically oxic cyanobacterial surface layer and an anoxic inner
    core enriched in organic carbon and ammonium from degrading biomass, driving active core nitrification
    and granule-wide denitrification while lowering glacier surface albedo.
  nodes:
  - node_id: cryoconite
    label: glacier cryoconite environment
    node_type: HABITAT
    grounding: habitatmech:GOLD.2e404ba6a0
    description: Dark windblown mineral and biogenic sediment deposited in meltwater-filled cryoconite
      holes and surfaces on glaciers and ice sheets.
  - node_id: supraglacial_mineral_dust_and_granule_oxic_anoxic_stratification
    label: supraglacial mineral sediment particles and radial O2/NH4+/NO2-/NO3- redox stratification
    node_type: ENVIRONMENTAL_FACTOR
    description: Glacial mineral dust substrata and fine-scale radial redox stratification between an
      oxic photosynthetic granule surface and an anoxic, substrate-rich inner core.
  - node_id: cryoconite_phormidesmis_priestleyi_and_core_nitrifier_denitrifier_guild
    label: Phormidesmis priestleyi filamentous cyanobacteria and cryoconite core nitrifier and denitrifier
      guild
    node_type: COMMUNITY
    description: Gliding oscillatorialean cyanobacteria including Phormidesmis priestleyi BC1401 at the
      granule surface paired with heterotrophic nitrifiers and denitrifiers in the anoxic granule interior.
  - node_id: phormidesmis_wzy_abc_eps_wps_biofilm_and_granule_nitrification_denitrification_genes
    label: Phormidesmis priestleyi Wzy- and ABC-dependent EPS biosynthesis, Wps biofilm cluster, and granule
      nitrification/denitrification transcripts
    node_type: GENE_OR_PROTEIN
    description: Wzy- and ABC-dependent exopolysaccharide (EPS) biosynthetic pathways and Wps-homologous
      biofilm gene cluster in Phormidesmis priestleyi (represented in active UniProtKB by polar Phormidesmis
      priestleyi ULC007 polysaccharide export protein UniProtKB:A0A2T1DNA1 and glycosyltransferase UniProtKB:A0A2T1DEC3;
      Greenland Ice Sheet cryoconite isolate P. priestleyi BC1401 NCBITaxon:1850361 draft genome proteins
      in PMID:27485510 are archived in UniParc/RefSeq without active UniProtKB accessions, including UPI0009ED003B/WP_082906463,
      UPI00083A4580/WP_068816785, UPI00083B8902/WP_068816784, and UPI00083B5BEB/WP_068816783) alongside
      unbinned metatranscriptomically active nitrification and denitrification transcripts in cryoconite
      granules (PMID:32990745).
    protein_examples:
    - accession: UniProtKB:A0A2T1DNA1
      entry_name: A0A2T1DNA1_9CYAN
      recommended_name: Polysaccharide export protein
      locus_tag: C7B65_00675
