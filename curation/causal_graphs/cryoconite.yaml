        snippet: Genes involved in EPS biosynthesis were identified from the Wzy- and ABC-dependent pathways.
        notes: Phormidesmis priestleyi encodes Wzy- and ABC-dependent EPS export and biosynthesis genes,
          represented in active UniProtKB by P. priestleyi ULC007 Polysaccharide export protein (C7B65_00675,
          UniProtKB:A0A2T1DNA1; 425 aa) while isolate BC1401 is UniParc/RefSeq-only (UPI0009ED003B) (PMID:27485510).
    - accession: UniProtKB:A0A2T1DEC3
