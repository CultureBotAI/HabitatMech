  - node_id: cryoconite_mineral_granulation_albedo_reduction_and_stratified_n_cycling
    label: EPS-mediated mineral granule aggregation, glacier albedo darkening, and redox-stratified nitrification/denitrification
    node_type: COMMUNITY_PROCESS
    description: Biogenic binding of glacial mineral particles into dark cryoconite granules that lower
      glacier albedo, buffer extreme cold, and partition aerobic surface photosynthesis from anoxic core
      nitrification and denitrification.
  edges:
  - edge_id: cryoconite_maintains_mineral_substrata_and_radial_redox_stratification
    subject: cryoconite
    predicate: maintains
    object: supraglacial_mineral_dust_and_granule_oxic_anoxic_stratification
    description: Glacier cryoconite environments accumulate dark mineral sediment particles that develop
      fine-scale O2, NH4+, NO2-, and NO3- redox stratification between an oxic surface layer and an anoxic
      inner core.
    evidence:
    - reference: PMID:32990745
      snippet: Based on microsensor measurements for O2, NH4+, NO2- and NO3-, we identified the presence
        of fine-scale redox stratification within cryoconite granules. Cyanobacteria at the surface layer
        of the granules created oxic conditions, whereas the inner core of the granules was anoxic.
      notes: Microsensor profiles of O2, NH4+, NO2-, and NO3- demonstrate fine-scale oxic-surface to anoxic-core
        redox stratification within glacier cryoconite granules (PMID:32990745).
    - reference: PMID:37572353
      snippet: Cryoconite, the dark sediment on the surface of glaciers, often aggregates into oval or
        irregular granules serving as biogeochemical factories.
      notes: Cryoconite sediments on glacier surfaces aggregate mineral particles into biogeochemically
        active granules (PMID:37572353).
  - edge_id: mineral_and_redox_gradients_select_for_phormidesmis_and_n_cycling_guild
    subject: supraglacial_mineral_dust_and_granule_oxic_anoxic_stratification
    predicate: selects for
    object: cryoconite_phormidesmis_priestleyi_and_core_nitrifier_denitrifier_guild
    description: Glacial mineral particles and cold supraglacial conditions select for gliding oscillatorialean
      cyanobacteria including Phormidesmis priestleyi on granule surfaces and nitrifiers/denitrifiers
      in the anoxic core.
    evidence:
    - reference: PMID:27485510
      snippet: Phormidesmis priestleyi is a cyanobacterium found throughout the cold biosphere (Arctic,
        Antarctic and alpine habitats). Genome sequencing of P. priestleyi BC1401, an isolate from a cryoconite
        hole on the Greenland Ice Sheet, has allowed for the examination of genes involved in cold shock
        response and production of extracellular polymeric substances (EPS).
      notes: Phormidesmis priestleyi BC1401 thrives in cryoconite holes on the Greenland Ice Sheet and
        across polar and alpine glaciers (PMID:27485510).
    - reference: PMID:32990745
      snippet: Cyanobacteria in the inner core of the granules were inactive, and likely dead and being
        degraded, providing carbon and nitrogen to support nitrifiers and denitrifiers.
      notes: Degrading cyanobacterial biomass in the anoxic inner core of cryoconite granules supports
        active nitrifier and denitrifier populations (PMID:32990745).
  - edge_id: cryoconite_guild_expresses_wzy_abc_eps_wps_and_n_cycling_genes
    subject: cryoconite_phormidesmis_priestleyi_and_core_nitrifier_denitrifier_guild
    predicate: expresses
    object: phormidesmis_wzy_abc_eps_wps_biofilm_and_granule_nitrification_denitrification_genes
    description: Phormidesmis priestleyi BC1401 encodes Wzy- and ABC-dependent EPS biosynthesis genes
      and a Wps-homologous biofilm cluster, while granule core and surface communities express nitrification
      and denitrification transcripts.
    evidence:
    - reference: PMID:27485510
      snippet: Genes involved in EPS biosynthesis were identified from the Wzy- and ABC-dependent pathways.
        The numbers of genes involved in cell wall and membrane biogenesis in P. priestleyi BC1401 were
        typical relative to the genome size. A gene cluster implicated in biofilm formation was found
        homologous to the Wps system, although the intracellular signalling pathways by which this could
        be regulated remain unclear.
      notes: Genome sequencing of cryoconite isolate Phormidesmis priestleyi BC1401 identified Wzy- and
        ABC-dependent EPS biosynthesis genes and a Wps-homologous biofilm formation gene cluster (PMID:27485510).
    - reference: PMID:32990745
      snippet: Metatranscriptomic analyses indicated the active occurrences of nitrification in the inner
        core, whereas denitrification actively occurred both in the inner core and the surface layer of
        the granules.
      notes: Metatranscriptomics of cryoconite granules revealed active expression of nitrification transcripts
        in the inner core and denitrification transcripts across both core and surface layers (PMID:32990745).
  - edge_id: eps_and_n_genes_catalyze_cryoconite_granulation_and_redox_n_cycling
    subject: phormidesmis_wzy_abc_eps_wps_biofilm_and_granule_nitrification_denitrification_genes
    predicate: catalyzes
    object: cryoconite_mineral_granulation_albedo_reduction_and_stratified_n_cycling
    description: Cyanobacterial EPS secretion binds mineral dust into albedo-lowering cryoconite granules
      and buffers extreme cold, while core nitrification and granule denitrification drive supraglacial
      nitrogen cycling.
    evidence:
    - reference: PMID:37572353
      snippet: Moreover, all examined strains were confirmed to produce extracellular polymeric substances
        (EPS), which suggests that cryoconite granulation is most likely due to EPS secretion by gliding
        cyanobacteria.
      notes: Empirical incubation experiments confirm that EPS secretion by gliding oscillatorialean cyanobacteria
        binds mineral substrata into cryoconite granules (PMID:37572353).
    - reference: PMID:32990745
      snippet: Quantities of nitrification genes/transcripts were greater in large cryoconite granules
        than small ones, most likely because nitrogen substrates were more abundantly present in the inner
        core of large granules due to distinct redox stratification. Our results suggest that the development
        of a granular structure of cryoconite granules can largely affect carbon and nitrogen cycling
        on glaciers.
      notes: Granule growth and redox stratification enhance core nitrification and couple carbon and
        nitrogen cycling on glacier surfaces (PMID:32990745).
