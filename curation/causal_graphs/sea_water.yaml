identifier: ENVO:00002149
causal_graphs:
- graph_id: seawater_dom_oligotrophic_uptake
  title: Seawater DOM oligotrophic uptake
  description: Seawater dissolved organic matter supports microbial carbon
    cycling. Pelagibacter ubique is a scoped SAR11 example of oligotrophy and
    genome streamlining. Transport/proteome models explain possible uptake
    trade-offs, not measured selection or flux in every seawater community.
  nodes:
  - node_id: sea_water
    label: sea water
    node_type: HABITAT
    grounding: ENVO:00002149
  - node_id: dissolved_organic_matter
    label: dissolved organic matter
    node_type: CHEMICAL
  - node_id: low_organic_carbon_availability
    label: low organic-carbon availability
    node_type: ENVIRONMENTAL_PARAMETER
  - node_id: oligotrophic_marine_bacteria
    label: Pelagibacter ubique (SAR11 example)
    node_type: TAXON
  - node_id: nutrient_transport_systems
    label: nutrient transport systems
    node_type: GENE_OR_PROTEIN
    description: Bacterial nutrient uptake transporter classes (contrasting
      high-affinity ATP-binding cassette solute-binding systems with
      phosphotransferase systems in the Norris transport/proteome model;
      exemplified in Candidatus Pelagibacter ubique HTCC1062, NCBITaxon:335992,
      by periplasmic ABC solute-binding proteins ProX UniProtKB:Q4FMH4 /
      SAR11_0797, PotD UniProtKB:Q4FKZ8 / SAR11_1336, YhdW UniProtKB:Q4FM26 /
      SAR11_0953, and UniProtKB:Q4FMK2 / SAR11_0769); plural system class node
      not grounded to a single subunit accession.
    protein_examples:
    - accession: UniProtKB:Q4FMH4
      entry_name: Q4FMH4_PELUB
      recommended_name: ABC-type proline/glycine betaine transport system, periplasmic component
      gene_symbol: proX
      locus_tag: SAR11_0797
      taxon_id: NCBITaxon:335992
      taxon_name: Candidatus Pelagibacter ubique (strain HTCC1062)
      role_in_node: subunit
      sequence_length: 342
      crc64: B6D94B1C4E738282
      evidence:
      - reference: PMID:16109880
        snippet: Genome streamlining in a cosmopolitan oceanic bacterium
        notes: Giovannoni and colleagues annotated periplasmic ABC solute-binding
          proteins in Candidatus Pelagibacter ubique HTCC1062 supporting dilute
          substrate uptake.
      - reference: PMID:34010286
        snippet: rely on ATP-binding cassette (ABC) transporters
        notes: Norris and colleagues model SAR11-like oligotroph reliance on
          high-affinity ABC solute-binding transport systems.
    - accession: UniProtKB:Q4FKZ8
      entry_name: Q4FKZ8_PELUB
      recommended_name: Spermidine/putrescine ABC transporter, periplasmic spermidine/putrescine-binding protein
      gene_symbol: potD
      locus_tag: SAR11_1336
      taxon_id: NCBITaxon:335992
      taxon_name: Candidatus Pelagibacter ubique (strain HTCC1062)
      role_in_node: subunit
      sequence_length: 356
      crc64: 38CE69E5CA33EB1D
      evidence:
