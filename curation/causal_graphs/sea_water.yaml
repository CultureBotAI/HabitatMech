        snippet: Genome streamlining in a cosmopolitan oceanic bacterium
        notes: Giovannoni and colleagues annotated periplasmic ABC solute-binding
          proteins in Candidatus Pelagibacter ubique HTCC1062 supporting dilute
          substrate uptake.
      - reference: PMID:34010286
        snippet: rely on ATP-binding cassette (ABC) transporters
        notes: Norris and colleagues model SAR11-like oligotroph reliance on
          high-affinity ABC solute-binding transport systems.
    - accession: UniProtKB:Q4FM26
      entry_name: Q4FM26_PELUB
      recommended_name: General L-amino acid transport system, periplasmic binding protein
      gene_symbol: yhdW
      locus_tag: SAR11_0953
      taxon_id: NCBITaxon:335992
      taxon_name: Candidatus Pelagibacter ubique (strain HTCC1062)
      role_in_node: subunit
      sequence_length: 355
      crc64: 5831BD58A28F18F6
      evidence:
