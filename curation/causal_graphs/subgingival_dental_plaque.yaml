    node_type: GENE_OR_PROTEIN
    description: Porphyromonas gingivalis cell-surface cysteine proteinase-adhesin complexes RgpA-Kgp
      (with adhesin domains A1 and A3), RgpB, and FimA fimbriae together with Treponema denticola chymotrypsin-like
      proteinase dentilisin.
