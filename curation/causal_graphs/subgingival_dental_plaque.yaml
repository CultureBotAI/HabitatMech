    node_type: ENVIRONMENTAL_FACTOR
    description: Subgingival sulcus and periodontal pocket interface enriched in host extracellular matrix
      proteins (fibrinogen, laminin, collagen type V, fibronectin) and vascular hemoglobin supplying iron
      and protoporphyrin IX.
  - node_id: subgingival_porphyromonas_gingivalis_and_treponema_denticola_consortium
    label: Porphyromonas gingivalis (fimA II / kgp biotypes) and Treponema denticola subgingival consortium
    node_type: COMMUNITY
    description: Coaggregating subgingival biofilm consortium of Porphyromonas gingivalis and Treponema
      denticola localized in matured subgingival dental plaque.
  - node_id: gingipain_rgpa_rgpb_kgp_adhesin_complex_fima_and_dentilisin_proteinases
    label: Arg-gingipains RgpA/RgpB (rgpA, rgpB), Lys-gingipain Kgp (kgp), major fimbrial subunit FimA
