        snippet: The proteinases are encoded by three genes designated rgpA, rgpB and kgp. Arg-specific
          proteolytic activity is encoded by rgpA/B and the Lys-specific activity by kgp. RgpA and Kgp
          are polyproteins comprising proteinases with C-terminal adhesin domains that are proteolytically
          processed.
        notes: Reviewed Porphyromonas gingivalis ATCC 33277 Arg-gingipain R1 polyprotein (rgpA, PGN_1970;
          1703 aa) containing catalytic and C-terminal adhesin domains that assemble with Kgp into the
          RgpA-Kgp proteinase-adhesin complex (PMID:14683427).
      - reference: PMID:19114547
        snippet: The RgpA-Kgp proteinase-adhesin complexes of Porphyromonas gingivalis were observed,
          using immunostaining, in human gingival tissue associated with periodontitis but not in healthy
          tissue.
        notes: RgpA-Kgp complexes penetrate gingival connective tissue along a concentration gradient
          from subgingival plaque (PMID:19114547).
