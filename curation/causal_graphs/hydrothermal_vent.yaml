identifier: ENVO:00000215
causal_graphs:
- graph_id: hydrothermal_vent_redox_chemolithoautotrophy
  title: Hydrothermal vent redox chemolithoautotrophy
  description: Hydrothermal vents discharge geothermally heated, chemically
    reduced fluids into oxidized seawater, creating steep thermal and redox
    gradients where sulfur- and hydrogen-oxidizing chemolithoautotrophs fix
    inorganic carbon and form the base of vent microbial production.
  nodes:
