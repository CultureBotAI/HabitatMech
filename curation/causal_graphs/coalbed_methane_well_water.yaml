causal_graphs:
- graph_id: coalbed_methane_well_water_trace_element_acetate_methanobacterium_methanosarcina_mcra_methanogenesis
  title: Coalbed methane well water anoxic coal-derived aromatics/acetate and trace-element cofactor regime,
    Methanobacterium/Methanosarcina/Acetobacterium/Pseudomonas guild selection, and mcrA-driven biogenic
    coalbed methanogenesis mechanism
  description: Subsurface formation and produced waters from coalbed methane (CBM) wells constitute closed,
    anoxic, bicarbonate-buffered hydrological systems rich in coal-derived polycyclic aromatic hydrocarbons
    (such as naphthalene) and acetate but constrained by trace-element micronutrient (Co, Cu, Mo, Ni,
    Fe) availability. This subsurface coal-seam aqueous regime selects for syntrophic bacterial degraders
    and acetogens (Pseudomonas stutzeri, Acetobacterium, Geobacter, and sulfate-reducing bacteria) paired
    with hydrogenotrophic (Methanobacterium subterraneum, Methanobacterium formicicum) and acetoclastic
    (Methanosaeta, Methanosarcina) methanogenic archaea. In response to coal organics and trace-element
    enzyme cofactors, these communities transcribe methyl-coenzyme M reductase subunit alpha (mcrA) alongside
    bacterial naphthalene-degradation and nitrogen-fixation pathways to convert coal-derived aromatics,
    acetate, and H2/CO2 into biogenic coalbed methane.
  nodes:
