      role_in_node: strain_exemplar
      sequence_length: 382
      crc64: 2FB11936B265C3B8
      evidence:
      - reference: PMID:22590465
        snippet: Metabolically active methanogens, identified by clone sequences of mcrA mRNA retrieved
          from enrichment cultures, were closely related to Methanobacterium subterraneum and Methanobacterium
          formicicum.
        notes: Active mcrA mRNA transcripts in coalbed methane well water enrichments belong to Methanobacterium
          subterraneum and M. formicicum (PMID:22590465).
    - accession: UniProtKB:A0A090I2G6
