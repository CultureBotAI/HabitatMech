    label: coalbed methane well water
    node_type: HABITAT
    grounding: habitatmech:GOLD.1b19e33e8c
    description: Subsurface formation water and produced water pumped from coalbed methane extraction
      wells.
  - node_id: anoxic_coal_aromatic_acetate_and_trace_element_cofactor_well_water_regime
    label: anoxic coal-seam formation water with coal-derived aromatics, acetate, and limiting trace-element
      enzyme cofactors (Co, Cu, Mo, Fe, Ni)
    node_type: ENVIRONMENTAL_FACTOR
    description: Closed subsurface coalbed produced-water environment containing coal-derived aromatic
      hydrocarbons and acetate where trace elements (Co, Cu, Mo, Fe, Ni, Zn, Mn, B) control metalloenzyme
      cofactor availability.
  - node_id: cbm_well_methanobacterium_methanosarcina_acetobacterium_and_pseudomonas_guild
    label: hydrogenotrophic Methanobacterium, acetoclastic Methanosaeta/Methanosarcina, Acetobacterium,
      and coal-degrading Pseudomonas stutzeri/Geobacter guild
    node_type: COMMUNITY
    description: Coalbed methane well produced-water consortium comprising hydrogenotrophic Methanobacterium
      subterraneum and M. formicicum, acetoclastic Methanosaeta and Methanosarcina, homoacetogenic Acetobacterium,
      Geobacter, and aromatic-degrading Pseudomonas stutzeri.
  - node_id: coalbed_mcra_methyl_coenzyme_m_reductase_and_naphthalene_nif_pathway_enzymes
    label: methyl-coenzyme M reductase (mcrA) and bacterial naphthalene degradation and nitrogen fixation
      pathway enzymes
    node_type: GENE_OR_PROTEIN
    description: Archaeal methyl-coenzyme M reductase alpha subunit (mcrA) in hydrogenotrophic Methanobacterium
      subterraneum and Methanobacterium formicicum and acetoclastic Methanosarcina and Methanosaeta/Methanothrix
      (exemplified by Methanobacterium subterraneum McrA UniProtKB:D2KZX2, Methanobacterium formicicum
      McrA UniProtKB:A0A090I2G6, and Methanosarcina barkeri McrA UniProtKB:P07962) together with upper/lower
      naphthalene degradation and nitrogen fixation pathway enzymes in coalbed Pseudomonas (Stutzerimonas)
      stutzeri (exemplified by NifH UniProtKB:A4VJ70).
