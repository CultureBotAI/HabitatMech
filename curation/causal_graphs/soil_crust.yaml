causal_graphs:
- graph_id: biological_soil_crust_microcoleus_wzy_eps_bundle_sheath_and_nostocales_nifhdk_fixation
  title: Biological soil crust Microcoleus vaginatus EPS habitat filtering, desiccation-resuscitation
    transcriptional response, and uc/ah-mediated cyanosphere urea-nitrogen mutualism mechanism
  description: Arid and polar biological soil crusts (biocrusts) experience recurrent desiccation-hydration
    cycles, high irradiance, and nitrogen limitation on unconsolidated soil surfaces, selecting for the
    pioneer filamentous cyanobacterium Microcoleus vaginatus (such as M. vaginatus PCC 9802 and CM01)
    and heterotrophic diazotrophs (such as Massilia sp. METH4) in its cyanosphere. During wetting and
    drying cycles, M. vaginatus coordinates DNA repair, photosynthesis recovery, oxidative/osmotic stress
    responses, and exopolysaccharide (EPS) synthesis, while overexpressing urea uptake and the high-affinity
    urea carboxylase/allophanate hydrolase (uc/ah) system in response to urea secreted by cyanosphere
    diazotrophs, driving mutualistic C-for-N exchange, deterministic bacterial network assembly, and arid
    topsoil stabilization.
  nodes:
