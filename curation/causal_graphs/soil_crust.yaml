  - node_id: microcoleus_wzy_eps_pathway_nostocales_nifhdk_and_crp_trehalose_synthase
    label: Microcoleus vaginatus urea carboxylase/allophanate hydrolase (uc/ah), EPS synthesis, and desiccation-hydration
