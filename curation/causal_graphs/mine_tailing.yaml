identifier: ENVO:00000003
causal_graphs:
- graph_id: mine_tailing_acidithiobacillus_ferroplasma_cyc2_rusticyanin_fe_s_oxidation
  title: Mine tailing sulfide mineral oxidation gradient, Acidithiobacillus/Leptospirillum/Ferroplasma
    succession, and Cyc2/rusticyanin extracellular iron oxidation and acid mine drainage mechanism
  description: Metal-sulfide mine tailings undergoing oxidative weathering generate progressive acidification
    gradients from primary and slightly acidic tailings to extremely acidic, heavy-metal-rich oxidized
    tailings. This acidification succession selects for chemolithoautotrophic iron- and sulfur-oxidizing
    consortia shifting from Thiobacillus and Acidithiobacillus in early stages to Acidithiobacillus ferrooxidans,
    Leptospirillum, and the acidophilic archaeon Ferroplasma (28-58% relative abundance in acidic/oxidized
    tailings). Acidithiobacillus ferrooxidans and Ferroplasma acidiphilum express the outer-membrane monoheme
    c-type cytochrome Cyc2 (cyc2) and periplasmic Type-1 copper rusticyanins (AfR and FaR) alongside sulfur-oxidation,
    carbon-fixation, and heavy-metal detoxification pathways to catalyze extracellular electron transfer
    from ferrous iron (Fe2+) to regenerate ferric iron (Fe3+) mineral oxidant and drive tailings bioleaching
    and acid mine drainage.
  nodes:
  - node_id: mine_tailing
    label: mine tailing
    node_type: HABITAT
    grounding: ENVO:00000003
    description: Deposited pulverized rock, sulfide ore residue, and mineral waste remaining after metal
      extraction and beneficiation.
  - node_id: sulfide_tailings_acidification_and_ferrous_iron_heavy_metal_gradient
    label: sulfide mine tailings acidification gradient, ferrous iron (Fe2+), and heavy metal/arsenic
      stress
    node_type: ENVIRONMENTAL_FACTOR
    description: Sequential acidification stages from primary and slightly acidic tailings to extremely
      acidic, oxidized sulfide tailings enriched in Fe2+, chalcopyrite/sulfide minerals, and heavy metals.
  - node_id: acidithiobacillus_leptospirillum_and_ferroplasma_bioleaching_guild
    label: Acidithiobacillus ferrooxidans, Leptospirillum, Thiobacillus, and Ferroplasma acidophilic guild
    node_type: COMMUNITY
    description: Acidophilic chemolithoautotrophic bacterial and archaeal guild dominated by Thiobacillus,
      Acidithiobacillus ferrooxidans, Leptospirillum, and Ferroplasma across acidifying mine tailings.
  - node_id: outer_membrane_monoheme_cyc2_and_periplasmic_rusticyanin_afr_far
    label: Acidithiobacillus ferrooxidans outer-membrane monoheme c-type cytochrome Cyc2 (cyc2) and bacterial/archaeal
      rusticyanins (AfR, FaR)
