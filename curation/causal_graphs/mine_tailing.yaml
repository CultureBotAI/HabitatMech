    description: External-membrane monoheme c-type cytochrome Cyc2 (cyc2, AFE_3153, UniProtKB:B7JAQ7)
      with bound iron-ion electron-transfer sites and periplasmic Type-1 copper protein rusticyanin from
      Acidithiobacillus ferrooxidans (AfR, rus/AFE_3146, UniProtKB:B7JAQ0) alongside the archaeal blue-copper
      cupredoxin/rusticyanin homolog in Ferroplasma acidiphilum (FaR/sulfocyanin soxE, UniProtKB:A0A1V0N1W7).
