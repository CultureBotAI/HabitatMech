identifier: ENVO:00005750
causal_graphs:
- graph_id: grassland_soil_root_drought_carbon_pulses
  title: Grassland soil root drought carbon pulses
  description: Grassland soils are structured by dense herbaceous root systems,
    moderate organic inputs, and recurrent shifts in water availability. Root
    exudates and root litter feed rhizosphere bacteria, arbuscular mycorrhizal
    fungi couple roots to nutrient cycling, and drought followed by rewetting
    redistributes soluble carbon and shifts the bacteria and fungi responsible
    for decomposition, nitrogen cycling, and extracellular enzyme production.
