identifier: ENVO:00002006
causal_graphs:
- graph_id: liquid_water_planktonic_solute_foraging
  title: Liquid water planktonic solute foraging
  description: Bulk liquid water supplies high water activity, suspends
    free-living cells and organic particles, dissolves lower-molecular-weight
    organic substrates, and allows diffusion to form microscale nutrient
    patches. Extracellular enzymes hydrolyze polymers into dissolved organic
    matter, and motile chemotactic bacteria exploit those gradients to convert
    dissolved carbon into bacterial biomass within aquatic microbial loops.
