causal_graphs:
- graph_id: fermented_fish_salted_proteolysis_lab_tetragenococcus_gadb_gadc_plantaricin_lpl1_gaba_biogenic_amine_control
  title: Fermented fish salted amino-acid-rich matrix, Levilactobacillus/Lactiplantibacillus/Pediococcus
    and Tetragenococcus halophilus guild selection, and gadABC/plantaricin LPL-1/low-decarboxylase GABA
    synthesis and biogenic amine suppression mechanism
  description: Traditional fermented fish products (such as Thai som-fak fermented fish cake and East
    Asian high-salt fish sauces) combine fish muscle proteins and free amino acids (including glutamate)
    with elevated sodium chloride levels. This salted, amino-acid-rich fermentation matrix selects for
    lactic acid bacteria (Levilactobacillus brevis, Lactiplantibacillus plantarum, Lactiplantibacillus
    pentosus, Pediococcus acidilactici, and Pediococcus pentosaceus) and halophilic Tetragenococcus halophilus
    and Staphylococcus. Levilactobacillus brevis and Pediococcus acidilactici express glutamate decarboxylase
    and glutamate/GABA antiporter genes (gadA, gadB, gadB1, gadB2, gadC, gadC1, gadC2) to convert glutamate
    into gamma-aminobutyric acid (GABA), Lactiplantibacillus plantarum LPL-1 produces the YGNGV-motif
    class IIa bacteriocin plantaricin LPL-1 to permeabilize and kill foodborne spoilage and pathogenic
    bacteria, and low-decarboxylase Tetragenococcus halophilus A003 outcompetes high amine producers to
    repress cadaverine, histamine, and tyramine accumulation.
