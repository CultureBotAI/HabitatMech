    node_type: GENE_OR_PROTEIN
    description: Alcanivorax and Oleibacter alkane hydroxylase (alkB) and flavin-binding monooxygenase
      (almA) genes together with hadal Marinimicrobia amino-acid metabolism, mismatch-repair, and extracellular
