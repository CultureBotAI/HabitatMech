causal_graphs:
- graph_id: hadopelagic_zone_hydrostatic_pressure_alkane_flux_alcanivorax_marinimicrobia_alkb_alma_degradation
  title: Marine hadopelagic zone extreme hydrostatic pressure and sinking-particle alkane/recalcitrant-DOM
    regime, Alcanivorax/Oleibacter/Marinimicrobia/Chloroflexi/Thaumarchaeota guild selection, and alkB/almA
    alkane hydroxylation and deep-trench biogeochemical cycling mechanism
  description: The marine hadopelagic zone in ocean trenches at depths below 6,000 m to ~11,000 m (such
    as the Mariana Trench Challenger Deep) is characterized by low temperature, extreme hydrostatic pressure,
    recalcitrant dissolved organic matter (DOM), and periodic fluxes of n-alkanes released from subduction-zone
    serpentinization and sinking particles. These extreme pelagic trench conditions select for distinctive
    hadal planktonic communities dominated by heterotrophic Marinimicrobia, recalcitrant-DOM-degrading
    Chloroflexi, chemolithoautotrophic Thaumarchaeota, Nitrospirae, and Rhodospirillales, and a dense
    bloom of aliphatic hydrocarbon-degrading Gammaproteobacteria (Alcanivorax including Alcanivorax jadensis,
    Oleibacter, and Thalassolituus) at depths >10,400 m. These hadopelagic guilds encode and transcribe
    alkane monooxygenase (alkB) and flavin-binding monooxygenase (almA) genes alongside extracellular
    peptidases, amino acid metabolism and DNA mismatch-repair systems, and nitrification/sulfur-oxidation
    pathways to drive piezotolerant n-alkane oxidation, recalcitrant organic matter mineralization, and
    sequential nitrification in the deepest ocean waters.
