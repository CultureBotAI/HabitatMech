causal_graphs:
- graph_id: phyllosphere_diurnal_stress_methanol_succinate_methylobacterium_phyr_prs_cstr_colonization
  title: Phyllosphere fluctuating methanol/succinate and oxidative-desiccation stress regime, Methylobacterium/Methylorubrum
    extorquens guild selection, and PhyR/Prs/CstR epiphytic colonization and stress-metabolic balancing
    mechanism
  description: Aerial plant surfaces (the phyllosphere) expose epiphytic microorganisms to low and fluctuating
    concentrations of plant-emitted one-carbon (methanol) and multi-carbon (succinate) substrates alongside
    diurnal heat, desiccation, oxidative, and pH stresses. These conditions select for pink-pigmented
    facultative methylotrophs of the genera Methylobacterium and Methylorubrum (such as M. extorquens
    AM1 and PA1). During epiphytic growth on leaves, M. extorquens upregulates the two-domain sigma-factor-like
    response regulator PhyR and its downstream oxidative stress regulon (KatE, SodA, AhpC, Ohr, Trx, Dps),
    modulates phosphoribosylpyrophosphate synthetase (Prs) as a metabolic valve to channel scarce C1 carbon
    through the phosphoketolase pathway into biomass, and employs the orphan response receiver CstR (alongside
    EfgA and TtmR) to coordinate NAD+/NADH balance, formaldehyde tolerance, and stress resilience across
    succinate-to-methanol transitions.
  nodes:
