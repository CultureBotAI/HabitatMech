causal_graphs:
- graph_id: sulfur_autotrophic_denitrification_alkalinity_buffering_and_nar_sulfur_oxidation
  title: Sulfur autotrophic denitrification elemental sulfur oxidation, alkalinity buffering, and nar/nir/nor
    nitrate reduction mechanism
  description: Sulfur autotrophic denitrification (SAD) bioreactors supply elemental sulfur (S0) and alkalinity
    buffering (such as NaHCO3 or calcium carbide residue composites that neutralize acid production and
    prevent pH drops to 5.8) under low dissolved oxygen (~0.3 mg/L), enriching chemolithoautotrophic sulfur-oxidizing
    denitrifiers (Thiobacillus, Sulfurimonas, Sulfuritalea, and Annwoodia) that upregulate respiratory
    nitrate/nitrite/nitric-oxide reductases (narGHI, nir, nor), form II RubisCO (cbbM), and sulfur-oxidation
    enzymes (sulfide:quinone oxidoreductase and dsrC) to achieve >90-97% nitrate removal.
  nodes:
  - node_id: sulphur_autotrophic_denitrification
    label: sulfur autotrophic denitrification bioreactor
    node_type: HABITAT
    grounding: habitatmech:GOLD.f07ee97491
    description: Chemolithoautotrophic denitrification bioreactor using elemental sulfur or reduced sulfur
      compounds as electron donors for nitrate removal from low-C/N wastewater.
  - node_id: elemental_sulfur_electron_donor_and_alkalinity_buffered_anoxic_regime
    label: elemental sulfur electron donor and alkalinity-buffered low-DO anoxic regime
    node_type: ENVIRONMENTAL_PARAMETER
    description: Bioavailable elemental sulfur media combined with intrinsic alkalinity buffering (maintaining
      pH 6.9-8.0+ against proton generation) and low dissolved oxygen (~0.3 mg/L).
  - node_id: sulfur_oxidizing_thiobacillus_sulfurimonas_sulfuritalea_guild
    label: Thiobacillus, Sulfurimonas, Sulfuritalea, and Annwoodia sulfur-oxidizing denitrifier guild
    node_type: COMMUNITY
    description: Chemolithoautotrophic sulfur-oxidizing bacterial guild dominated by Thiobacillus, Sulfurimonas,
      Sulfuritalea, and Annwoodia.
  - node_id: thiobacillus_denitrificans_nar_dsr_and_cbbm_enzymes
    label: Thiobacillus denitrificans respiratory nitrate reductase Nar, DsrC, and form II RubisCO CbbM
    node_type: GENE_OR_PROTEIN
    description: Denitrification and sulfur-oxidation enzymes upregulated in Thiobacillus denitrificans
      (strain ATCC 25259 / T1; NCBITaxon:292415) under denitrifying conditions, including respiratory
      nitrate reductase alpha subunit (UniProtKB:Q3SJ14, Q3SJ14_THIDA, Tbd_1403, 1252 aa), form II ribulose
      bisphosphate carboxylase (UniProtKB:Q60028, RBL2_THIDA, cbbM / Tbd_2638, 459 aa), sulfide-quinone
      reductase (UniProtKB:Q3SGR9, Q3SGR9_THIDA, Tbd_2225, 422 aa), and dissimilatory sulfite reductase-associated
      DsrC-like protein (UniProtKB:Q3SFJ8, Q3SFJ8_THIDA, Tbd_2658, 110 aa). Multi-protein enzymatic repertoire
      in T. denitrificans ATCC 25259 represented by four verified UniProtKB exemplars matching the four
      upregulated gene classes in PMID:16980503.
    protein_examples:
    - accession: UniProtKB:Q3SJ14
      entry_name: Q3SJ14_THIDA
      recommended_name: Nitrate reductase, alpha subunit
      locus_tag: Tbd_1403
      taxon_id: NCBITaxon:292415
      taxon_name: Thiobacillus denitrificans (strain ATCC 25259 / T1)
      role_in_node: subunit
      sequence_length: 1252
      crc64: 102C3A0B6DE9B46E
      evidence:
      - reference: PMID:16980503
        snippet: Genes upregulated (ca. 4- to 95-fold) under denitrifying conditions included nar, nir,
          and nor genes (associated, respectively, with nitrate reductase, nitrite reductase, and nitric
          oxide reductase, which catalyze successive steps of denitrification), cbbM (encoding form II RubisCO),
          and genes involved with sulfur compound oxidation (including two physically separated but highly
          similar copies of sulfide:quinone oxidoreductase and of dsrC, associated with dissimilatory sulfite
          reductase).
        notes: Respiratory nitrate reductase alpha subunit (Tbd_1403) upregulated under denitrifying conditions
          in Thiobacillus denitrificans strain ATCC 25259 (PMID:16980503; genome sequence PMID:16452431).
