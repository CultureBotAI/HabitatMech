identifier: ENVO:00002030
causal_graphs:
- graph_id: aquatic_biome_light_redox_carbon_cycling
  title: Aquatic biome light-redox carbon cycling
  description: Aquatic biomes are structured by water bodies that partition
    microbial life into illuminated photic water, sinking particulate organic
    matter, dissolved organic substrates, and redox gradients. Oxygenic
    phototrophs fix carbon in the photic zone, heterotrophic bacteria hydrolyze
    and respire that organic matter, and oxygen depletion enables anaerobic
    redox metabolisms that recycle nutrients.
