      Sox complex (soxB), Nitrosomonas ammonia monooxygenase (amoA), nitrogenase NifH, 4-hydroxybutyryl-CoA
      dehydratase, and Calvin-Benson-Bassham cycle ribulose-1,5-bisphosphate carboxylase/oxygenase large
      subunit (cbbL/RuBisCO).
  - node_id: subterranean_dark_co2_fixation_sulfur_oxidation_and_nitrification_primary_production
