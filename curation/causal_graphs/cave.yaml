causal_graphs:
- graph_id: cave_aphotic_karst_sulfidic_co2_gradient_sulfurovum_thiobacillus_sqr_soxb_cbbl_chemolithoautotrophy
  title: Subterranean cave aphotic oligotrophic and sulfidic/CO2 geochemical regime, Sulfurovum/Thiobacillus/Nitrosomonas/Pseudonocardia
    guild selection, and Sqr/SoxB/AmoA/RuBisCO (cbbL) dark chemolithoautotrophic primary production mechanism
  description: Subterranean karst and sulfidic caves (such as Movile Cave, the Frasassi cave system, Zhijin
    Cave, and Luohandu Cave) are aphotic habitats isolated from photosynthetic energy input, characterized
    by oligotrophic carbonate rock walls and sediments, elevated cave-air CO2 (~2,000 ppm), and in sulfidic
    systems, H2S- and NH4+-bearing groundwater mixing with microoxic cave waters. Absence of light and
    availability of inorganic electron donors (H2S, S0, NH4+) and CO2 select for chemolithoautotrophic
    biofilms and sediment guilds including sulfide-oxidizing Epsilonproteobacteria (Sulfurovum-like and
    Sulfuricurvum spp.), Betaproteobacteria and Gammaproteobacteria sulfur oxidizers (Thiobacillus), ammonia
    and nitrite oxidizers (Nitrosomonas, Nitrospira, Candidatus Nitrotoga), and cbbL-bearing Actinobacteria
    (Pseudonocardia) and Alphaproteobacteria (Bradyrhizobium, Mesorhizobium). These communities express
    sulfide-quinone oxidoreductase (Sqr), thiosulfate-oxidizing Sox proteins (soxB), ammonia monooxygenase
    (amoA), nitrogenase (NifH), and form I ribulose-1,5-bisphosphate carboxylase/oxygenase (RuBisCO, cbbL)
    alongside 4-hydroxybutyryl-CoA dehydratase to drive dark inorganic carbon fixation, elemental sulfur
    S(0) and sulfate formation, and subterranean ecosystem primary production.
