  - node_id: cave_sqr_soxb_amoa_nifh_and_rubisco_cbbl_chemolithoautotrophic_enzymes
    label: sulfide-quinone oxidoreductase (Sqr), Sox pathway proteins (soxB), ammonia monooxygenase (amoA),
