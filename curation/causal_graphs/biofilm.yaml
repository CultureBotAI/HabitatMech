identifier: ENVO:00002034
causal_graphs:
- graph_id: biofilm_eps_gradient_structuring
  title: Biofilm EPS gradient structuring
  description: Biofilms arise when microbial cells adhere to a substratum,
    remain together as an aggregate, and secrete an extracellular polymeric
    matrix. The matrix anchors cells and public goods near a surface, retains
    extracellular enzymes, slows solute transport, and creates oxygen and
    nutrient gradients that differentiate the biofilm into physiologically
    distinct microzones.
