causal_graphs:
- graph_id: deepwater_brine_lake_halocline_sulfurimonas_nitromaritima_methanohalophilus_mcra_dsra_ectoine_cycling
  title: Deep-sea brine pool hypersaline anoxic halocline gradient, Sulfurimonas/Sulfurovum, Candidatus
    Nitromaritima, and Methanohalophilus guild selection, and mcrA/dsrA/ectoine/rTCA biogeochemical cycling
    mechanism
  description: Oceanic deep hypersaline anoxic basins (DHABs, or deep-sea brine pools) in the Red Sea
    and Eastern Mediterranean Sea feature sharp brine-seawater interfaces (haloclines) with extreme salinity
    (up to 155 PSU or 240 g L-1 NaCl), hydrostatic pressure (up to 35 MPa), elevated temperature (up to
    52 degrees C in Atlantis II Deep), deoxygenation, and high dissolved sulfide. These physicochemical
    gradients select for stratified chemolithoautotrophic sulfide-oxidizing Campylobacterota (Sulfurimonas
    and Sulfurovum), halotolerant nitrite-oxidizing Candidatus Nitromaritima RS, Deltaproteobacteria sulfate-reducing
    bacteria, and piezophilic methylotrophic methanogens such as Methanohalophilus profundi. These guilds
    encode and express methyl-coenzyme M reductase (mcrA), dissimilatory sulfite reductase (dsrA), nitrate
    and nitrite reductases, reductive tricarboxylic acid (rTCA) cycle enzymes, and ectoine/hydroxyectoine
    biosynthesis enzymes to couple sulfide and nitrite oxidation with carbon fixation, methylotrophic
    methanogenesis, sulfate reduction, and compatible-solute osmoprotection across the brine-seawater
    interface.
  nodes:
  - node_id: deepwater_brine_lake
    label: deep-sea brine pool
    node_type: HABITAT
    grounding: habitatmech:GOLD.35b68dbb27
    description: Seafloor depression filled with dense hypersaline anoxic brine separated from overlying
      seawater by a steep physicochemical halocline (deep hypersaline anoxic basin, DHAB).
  - node_id: brine_seawater_interface_hypersaline_sulfidic_anoxic_halocline
    label: brine-seawater interface hypersaline, sulfidic, high-pressure oxycline and halocline gradient
    node_type: ENVIRONMENTAL_FACTOR
    description: Steep transition zone from overlying seawater to anoxic hypersaline brine characterized
      by salinities of 91-155 PSU (up to 240 g L-1 NaCl), elevated hydrostatic pressure, low oxygen, and
      high sulfide.
  - node_id: dhab_sulfurimonas_sulfurovum_nitromaritima_and_methanohalophilus_guild
    label: Sulfurimonas/Sulfurovum, Candidatus Nitromaritima RS, Deltaproteobacteria SRB, and Methanohalophilus
      profundi guild
    node_type: COMMUNITY
    description: Stratified brine-seawater interface and brine community comprising sulfide-oxidizing
      Sulfurimonas and Sulfurovum, nitrite-oxidizing Candidatus Nitromaritima RS, Deltaproteobacteria
      sulfate reducers, and methylotrophic Methanohalophilus methanogens.
  - node_id: dhab_mcra_dsra_nitrite_oxidoreductase_rtca_and_ectoine_biosynthesis_enzymes
    label: methyl-coenzyme M reductase (mcrA), dissimilatory sulfite reductase (dsrA), nitrate/nitrite
      reductases, rTCA enzymes, and ectoine/hydroxyectoine synthases
    node_type: GENE_OR_PROTEIN
    description: Functional marker genes mcrA and dsrA, nitrate and nitrite reductases, reductive TCA
      cycle carbon-fixation enzymes, and ectoine/hydroxyectoine and proline/glutamate osmoprotectant biosynthesis
      pathways, exemplified by verified UniProtKB Methanohalophilus mahii McrA (UniProtKB:A7BK26), Nitrospina
      gracilis 3/211 NxrB and NirK1 (UniProtKB:M1YGC7, UniProtKB:M1Z892), Sulfurimonas denitrificans AclA
      (UniProtKB:Q52VR3), and Sulfurimonas autotrophica AclB (UniProtKB:Q32SK1).
    protein_examples:
    - accession: UniProtKB:A7BK26
      entry_name: A7BK26_9EURY
      recommended_name: coenzyme-B sulfoethylthiotransferase
      gene_symbol: mcrA
      taxon_id: NCBITaxon:2176
      taxon_name: Methanohalophilus mahii
      role_in_node: subunit
      sequence_length: 259
      crc64: 98CE48144F6F61DF
      evidence:
      - reference: PMID:32847782
        snippet: Phylogenetic analysis based on 16S rRNA gene and mcrA gene sequences indicated that strain
          SLHTYROT was affiliated to genus Methanohalophilus within the order Methanosarcinales.
        notes: Methanohalophilus mahii methyl-coenzyme M reductase alpha subunit (mcrA, A7BK26_9EURY);
          the Tyro DHAB isolate Methanohalophilus profundi SLHTYROT has no active protein entries in UniProtKB.
      - reference: PMID:26192212
        snippet: Here, we evaluated the relative abundance of Bacteria and Archaea using quantitative
          PCR and conducted phylogenetic analyses of nearly full-length 16S rRNA genes as well as functional
          marker genes encoding the alpha subunits of methyl-coenzyme M reductase (mcrA) and dissimilatory
          sulfite reductase (dsrA).
        notes: Methyl-coenzyme M reductase alpha subunit (mcrA) is a primary functional marker of methanogenic
          archaea across deep hypersaline anoxic basins (PMID:26192212).
    - accession: UniProtKB:M1YGC7
      entry_name: M1YGC7_NITG3
      recommended_name: Nitrite oxidoreductase, beta subunit (C-terminal)
      gene_symbol: nxrB
      locus_tag: NITGR_1090001
      taxon_id: NCBITaxon:1266370
      taxon_name: Nitrospina gracilis (strain 3/211)
      role_in_node: subunit
      sequence_length: 165
      crc64: 41DB376835083432
      evidence:
      - reference: PMID:26657763
        snippet: Comparative pan-genome analyses revealed that less than half of the predicted proteome
          of Ca. Nitromaritima RS is shared with N. gracilis. Interestingly, the capacity for nitrite
          oxidation is also conserved in both genomes.
        notes: Nitrite oxidoreductase beta subunit NxrB (NITGR_1090001) from the marine reference species
          Nitrospina gracilis 3/211 directly compared with uncultured Candidatus Nitromaritima RS (which
          has no active UniProtKB entries) in PMID:26657763.
    - accession: UniProtKB:M1Z892
      entry_name: M1Z892_NITG3
      recommended_name: Copper-containing nitrite reductase
      gene_symbol: nirK1
      locus_tag: NITGR_100028
      taxon_id: NCBITaxon:1266370
      taxon_name: Nitrospina gracilis (strain 3/211)
      role_in_node: family_member
      sequence_length: 336
      crc64: 39676D77DE7ADBFC
      evidence:
      - reference: PMID:26657763
        snippet: Although both lack acidic proteomes synonymous with extreme halophiles, the pangenome
          of Ca. Nitromaritima RS specifically encodes enzymes with osmoregulatory and thermoprotective
          roles (i.e., ectoine/hydroxyectoine biosynthesis) and of thermodynamic importance (i.e., nitrate
          and nitrite reductases).
        notes: Copper-containing nitrite reductase NirK1 (NITGR_100028) in Nitrospina gracilis 3/211 representing
          Nitrospina-lineage nitrite reductase enzymes analyzed in Red Sea brine interfaces.
    - accession: UniProtKB:Q52VR3
