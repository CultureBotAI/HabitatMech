      role_in_node: subunit
      sequence_length: 339
      crc64: C0EFA2696832FEC6
      evidence:
      - reference: PMID:39910644
        snippet: They are stratified along the BSI and utilise the reductive tricarboxylic acid cycle
          to fix carbon dioxide, acting as primary producers.
        notes: Sulfurimonas denitrificans reductive TCA cycle ATP citrate lyase alpha subunit (aclA, Q52VR3_9BACT);
          novel Kebrit Deep Sulfurimonas and Sulfurovum MAGs from PMID:39910644 are not indexed in UniProtKB.
    - accession: UniProtKB:Q32SK1
