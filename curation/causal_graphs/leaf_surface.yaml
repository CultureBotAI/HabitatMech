causal_graphs:
- graph_id: leaf_surface_methylobacterium_lanthanide_xoxf_methanol_methylotrophy
  title: Leaf surface phyllosphere rare-earth-element sensing and Methylobacterium XoxF-dependent methylotrophic
    colonization mechanism
  description: Plant leaf surfaces (phyllosphere) release stomatal methanol and accumulate rare-earth
    elements (REEs such as La3+, up to 10 ug/g dry weight), selecting for pink-pigmented facultative methylotrophs
    such as Methylobacterium extorquens (strains PA1 and AM1). During phyllosphere colonization, M. extorquens
    senses REEs to induce the lanthanide-dependent PQQ methanol dehydrogenase XoxF (while repressing Ca2+-dependent
    mxaFI) alongside a REE-binding protein and TonB-dependent outer-membrane transporter essential for
    chelator-assisted REE uptake, driving rapid methanol and formaldehyde oxidation and competitive leaf
    colonization.
  nodes:
  - node_id: leaf_surface
    label: leaf surface environment
    node_type: HABITAT
    grounding: habitatmech:GOLD.82f62476b8
    description: Aerial epidermal surface of vascular plant leaves (epiphyllous phyllosphere) exposed
      to fluctuating light, humidity, plant-emitted C1 compounds, and leaf-surface trace elements.
  - node_id: phyllosphere_methanol_release_and_rare_earth_element_availability
    label: plant leaf methanol emission and phyllosphere rare-earth element (La3+/REE) availability
    node_type: ENVIRONMENTAL_FACTOR
    description: Availability of plant cell-wall pectin-derived methanol and leaf-surface rare-earth elements
      (such as lanthanum, La3+) present in the Arabidopsis thaliana phyllosphere.
  - node_id: phyllosphere_methylobacterium_extorquens_colonizer_guild
    label: epiphytic Methylobacterium extorquens (strains PA1 and AM1) methylotrophic guild
    node_type: COMMUNITY
    description: Dominant phyllosphere-colonizing facultative methylotrophic Alphaproteobacteria (Methylobacterium
      extorquens PA1 and AM1) adapted to C1 metabolism on plant leaf surfaces.
  - node_id: lanthanide_methanol_dehydrogenase_xoxf_and_tonb_ree_transporter
    label: lanthanide-dependent methanol dehydrogenase XoxF, REE-binding protein, and TonB-dependent transporter
    node_type: GENE_OR_PROTEIN
    description: REE-dependent PQQ methanol dehydrogenase XoxF (induced by La3+ while Ca2+-dependent mxaFI
      is repressed) and the co-regulated REE-binding protein and TonB-dependent outer-membrane transporter
      in Methylobacterium extorquens. Verified protein_examples are attached for Methylorubrum extorquens
      strain ATCC 14718 / DSM 1338 / JCM 2805 / NCIMB 9133 / AM1 (NCBITaxon:272630) lanthanide-dependent
      methanol dehydrogenase XoxF1 (UniProtKB:C5B120, xoxF1, MexAM1_META1p1740; PMID:20447995) and paralog
      XoxF (UniProtKB:C5ATJ3, xoxF, MexAM1_META1p2757; PMID:20447995); the Methylorubrum extorquens PA1
      (NCBITaxon:419610) XoxF (Mext_1809, UPI000158F5C9), REE-binding protein (Mext_1852, UPI00000C0031),
      and TonB-dependent receptor (Mext_1853, UPI000162969E) assayed in PMID:30653750 are archived in
      UniParc without active UniProtKB accessions.
    protein_examples:
    - accession: UniProtKB:C5B120
      entry_name: XOXF1_METEA
      recommended_name: Lanthanide-dependent methanol dehydrogenase
      gene_symbol: xoxF1
      locus_tag: MexAM1_META1p1740
      taxon_id: NCBITaxon:272630
      taxon_name: Methylorubrum extorquens (strain ATCC 14718 / DSM 1338 / JCM 2805 / NCIMB 9133 / AM1)
      role_in_node: strain_exemplar
      sequence_length: 601
      crc64: 4D7DF5EAF4ECAB90
      evidence:
      - reference: PMID:20447995
        snippet: Here, we found that a xoxF mutant is less competitive than the wild-type during colonization
          of the phyllosphere of Arabidopsis thaliana, indicating a function for XoxF during plant colonization.
        notes: Methylorubrum extorquens AM1 (NCBITaxon:272630) lanthanide-dependent methanol dehydrogenase
          XoxF1 (xoxF1, locus tag MexAM1_META1p1740, UniProtKB:C5B120) promotes competitive phyllosphere
          colonization and methanol oxidation in PMID:20447995.
    - accession: UniProtKB:C5ATJ3
      entry_name: C5ATJ3_METEA
      recommended_name: XoxF
      gene_symbol: xoxF
      locus_tag: MexAM1_META1p2757
      taxon_id: NCBITaxon:272630
      taxon_name: Methylorubrum extorquens (strain ATCC 14718 / DSM 1338 / JCM 2805 / NCIMB 9133 / AM1)
