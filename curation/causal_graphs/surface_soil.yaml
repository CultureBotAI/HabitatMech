identifier: ENVO:02000059
causal_graphs:
- graph_id: surface_soil_edaphic_niche_differentiation_and_ammonia_oxidation
  title: Surface soil edaphic niche differentiation, bacterial-fungal antagonism, and archaeal/bacterial
    ammonia oxidation mechanism
  description: Surface soil (topsoil) habitats experience strong edaphic filtering by soil pH, precipitation/aridity
    (threshold 0.65), and organic carbon availability (<2% threshold), driving global niche differentiation
    and antibiotic-mediated antagonism between bacterial and fungal communities alongside chemolithoautotrophic
    ammonia oxidation catalyzed by ammonia monooxygenase (amoA) in soil Nitrososphaera and Nitrosospira
    guilds.
  nodes:
  - node_id: surface_soil
    label: surface soil
    node_type: HABITAT
    grounding: ENVO:02000059
    description: Uppermost biologically active soil layer (topsoil) interacting directly with land plant
      root systems, atmospheric precipitation, and litter inputs.
  - node_id: topsoil_ph_precipitation_and_organic_carbon_regime
    label: topsoil pH, precipitation, aridity, and organic carbon regime
    node_type: ENVIRONMENTAL_FACTOR
    description: Edaphic and climatic gradients in surface soil including soil pH (critical transition
      at pH 5.5), aridity index (0.65), precipitation, and organic carbon (<2% lower fertile limit).
  - node_id: topsoil_bacterial_fungal_decomposer_and_ammonia_oxidizer_guild
    label: topsoil bacterial-fungal decomposer and Nitrososphaera/Nitrosospira ammonia-oxidizing guild
    node_type: COMMUNITY
    description: Surface soil microbial community comprising generalist bacterial and fungal decomposers
      alongside Thaumarchaeota/Nitrososphaerota (Nitrososphaera viennensis, Nitrosocosmicus) and Nitrosospira
      ammonia oxidizers.
  - node_id: archaeal_and_bacterial_ammonia_monooxygenase_amoa
    label: archaeal and bacterial ammonia monooxygenase subunit A (amoA)
    node_type: GENE_OR_PROTEIN
    description: Ammonia monooxygenase (amoA) encoded by soil ammonia-oxidizing archaea (Nitrososphaera
      viennensis, Nitrosocosmicus) and ammonia-oxidizing bacteria (Nitrosospira) catalyzing the rate-limiting
      step of nitrification. Verified protein_examples are attached for the isolated soil ammonia-oxidizing
      archaeon Nitrososphaera viennensis EN76 (NCBITaxon:926571) ammonia monooxygenase subunits AmoA (UniProtKB:A0A060HNG6,
      NVIE_027270), AmoB (UniProtKB:A0A060HVN7, NVIE_028430), and AmoC1 (UniProtKB:A0A060HM27, NVIE_000540;
      PMID:21525411); multi-soil archaeal and bacterial amoA gene pools quantified by qPCR across pristine/agricultural
      soils (PMID:16902146) and microplastic-aged soils (PMID:39729140) are source-limited environmental
      amplicon pools without single-isolate UniProtKB accessions.
    protein_examples:
