        snippet: Here we describe the cultivation and isolation of an AOA from soil. It grows on ammonia
          or urea as an energy source and is capable of using higher ammonia concentrations than the marine
          isolate, Nitrosopumilus maritimus.
        notes: Nitrososphaera viennensis EN76 (NCBITaxon:926571) is the cultivated soil ammonia-oxidizing
          archaeon from PMID:21525411 encoding ammonia monooxygenase subunit A (amoA, locus tag NVIE_027270,
          UniProtKB:A0A060HNG6).
    - accession: UniProtKB:A0A060HVN7
