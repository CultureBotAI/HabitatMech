  edges:
  - edge_id: bioreactor_determined_by_containment
    subject: bioreactor
    predicate: determined by
    object: engineered_containment_vessel
    description: The broad bioreactor class is a containment unit capable of
      hosting organisms and maintaining conditions conducive to their metabolic
      activities; it does not require liquid medium or continuous flow.
    evidence:
    - reference: https://purl.obolibrary.org/obo/ENVO_00002123
      notes: ENVO definition, inspected through OLS on 2026-10-11. This is the
        class boundary, not experimental evidence for a particular operating mode.
  - edge_id: containment_maintains_liquid_medium
    subject: engineered_containment_vessel
    predicate: maintains
    object: liquid_reactor_medium
    description: In liquid-culture designs, the vessel holds process medium in which feed,
      suspended biomass, products, and wastes are mixed.
    evidence:
    - reference: PMID:16207900
      snippet: continuous cultivation
      notes: The continuous-culture review describes liquid reactor cultures
        kept at controlled volume by matched medium addition and removal.
  - edge_id: containment_allows_operating_setpoints
    subject: engineered_containment_vessel
    predicate: enables
    object: managed_operating_setpoints
    description: In controlled liquid-culture designs, vessel construction
      provides operating controls; the cited mass-transfer review addresses
      agitation and gas transfer rather than every possible setpoint.
    evidence:
    - reference: PMID:19041387
      snippet: oxygen transfer in microbial processes
      notes: Garcia-Ochoa and Gomez reviewed how stirred-tank geometry,
        agitation, and gas flow control microbial oxygen transfer and mixing.
  - edge_id: setpoints_control_influent_feed
    subject: managed_operating_setpoints
    predicate: controls
    object: influent_feed
    description: In fed liquid cultures, the selected feed composition and feed rate determine which
      carbon and nutrient substrates enter the reactor.
    evidence:
    - reference: PMID:16207900
      snippet: Continuous culture
      notes: Continuous culture is operated by defined medium input and culture
        removal, making the feed stream an engineered selective pressure.
  - edge_id: influent_feed_sets_organic_loading
    subject: influent_feed
    predicate: determines
    object: organic_loading_rate
    description: In flow-fed anaerobic co-digestion, influent substrate
      concentration and flow relative to reactor volume set organic loading.
    evidence:
    - reference: PMID:36610483
      snippet: organic loading rate and hydraulic retention time
      notes: Zhang and colleagues experimentally varied organic loading rate and
        hydraulic retention time in thermophilic anaerobic co-digestion
        reactors.
  - edge_id: setpoints_control_hydraulic_retention
    subject: managed_operating_setpoints
    predicate: controls
    object: hydraulic_retention_time
    description: In the flow-fed co-digestion experiment, hydraulic retention
      time is an operating variable. Volume divided by flow describes mean
      hydraulic residence, not a fixed residence time for every reacting solute.
    evidence:
    - reference: PMID:36610483
      snippet: hydraulic retention time
      notes: The anaerobic co-digestion experiment treated HRT as an operational
        variable coupled to organic loading.
  - edge_id: hydraulic_retention_creates_dilution
    subject: hydraulic_retention_time
    predicate: determines
    object: dilution_pressure
    description: For a fixed-volume flowing liquid culture without independent
      cell retention, shorter hydraulic retention implies faster turnover of
      medium and suspended cells. This does not apply to batch or retained biomass.
    evidence:
    - reference: PMID:16207900
      snippet: Continuous culture--making a comeback?
      notes: Hoskisson and Hobbs reviewed chemostat operation, where dilution
        rate links flow through the vessel to steady-state microbial growth.
  - edge_id: dilution_selects_retained_microbiome
    subject: dilution_pressure
    predicate: selects for
    object: retained_microbiome
    description: In continuous liquid culture, dilution imposes a persistence
      constraint on non-retained suspended populations. Selection of attachment
      modes is not established by the cited continuous-culture abstract.
    evidence:
    - reference: PMID:16207900
      snippet: continuous culture
      notes: In continuous culture, dilution rate constrains the growth rate
        needed for planktonic organisms to remain in the reactor.
  - edge_id: setpoints_control_mixing_aeration
    subject: managed_operating_setpoints
    predicate: controls
    object: mixing_aeration_regime
    description: In aerated liquid reactors, agitation and gas flow set mixing intensity and oxygen transfer
      into the liquid reactor medium.
    evidence:
    - reference: PMID:19041387
      snippet: oxygen transfer rate
      notes: The bioreactor scale-up review identifies stirring and gas-flow
        variables as controls over microbial mass transfer and mixing.
  - edge_id: mixing_aeration_shapes_microbiome
    subject: mixing_aeration_regime
    predicate: selects for
    object: retained_microbiome
    description: In aerated liquid communities, altered oxygen availability is
      a proposed selective filter. This community-selection extension is an
      inference from mass transfer, not a demonstrated result of the cited review.
    evidence:
    - reference: PMID:19041387
      snippet: Bioreactor scale-up and oxygen transfer
      notes: Garcia-Ochoa and Gomez linked reactor agitation and oxygen transfer
        to the microbial process environment.
  - edge_id: containment_supports_retention_surfaces
    subject: engineered_containment_vessel
    predicate: supports
    object: biomass_retention_surface
    description: Biofilm-based reactor designs add fixed or carrier surfaces
      inside the vessel to keep attached microbial biomass in contact with the
      flowing liquid.
    evidence:
    - reference: DOI:10.1186/s13068-024-02592-4
      snippet: Biofilm application for anaerobic digestion
      notes: Abera and colleagues reviewed fixed-film and carrier-based
        anaerobic digesters in which biofilms retain microbial biomass.
  - edge_id: surfaces_harbor_attached_biofilm
    subject: biomass_retention_surface
    predicate: harbors
    object: attached_biofilm
    description: Carrier surfaces and fixed-bed matrices give reactor
      microorganisms places to attach as biofilms rather than leave with the
      bulk liquid.
    evidence:
    - reference: DOI:10.1186/s13068-024-02592-4
      snippet: Biofilm application for anaerobic digestion
      notes: Abera and colleagues systematically reviewed anaerobic-digestion
        biofilm systems and their use to retain reactor biomass.
  - edge_id: attached_biofilm_retains_microbiome
    subject: attached_biofilm
    predicate: retains
    object: retained_microbiome
    description: In biofilm-based anaerobic designs, attachment can increase
      biomass retention; detachment and washout can still occur.
    evidence:
    - reference: DOI:10.1186/s13068-024-02592-4
      snippet: biomass retention
      notes: The biofilm review summarized fixed-film strategies that extend
        biomass retention time in anaerobic digesters.
  - edge_id: organic_loading_hydraulic_retention_select_microbiome
    subject: organic_loading_rate
    predicate: selects for
    object: retained_microbiome
    description: In the cited thermophilic food-waste and sewage-sludge
      co-digestion experiment, organic loading and hydraulic residence affected
      performance, community interactions, and functional traits.
    evidence:
    - reference: PMID:36610483
      snippet: interspecies interactions and functional traits
      notes: Zhang and colleagues found that HRT and OLR changed organics
        degradation, syntrophic interactions, and functional profiles in
        anaerobic co-digestion.
  - edge_id: operating_setpoints_select_microbiome
    subject: managed_operating_setpoints
    predicate: selects for
    object: retained_microbiome
    description: The cited replicate anaerobic-digester experiment supports
      deterministic selection under shared operating conditions. The separate
      cross-installation survey reports associations, not the same experimental test.
    evidence:
    - reference: DOI:10.1038/ismej.2014.50
      snippet: Deterministic processes
      notes: Vanwonterghem and colleagues observed synchronized population
        dynamics across replicate anaerobic digesters run under the same
        conditions.
    - reference: PMID:25819618
      snippet: Ammonia and temperature
      notes: De Vrieze and colleagues found ammonia and temperature separated
        clusters of anaerobic-digestion microbiomes.
  - edge_id: retained_microbiome_performs_syntrophy
    subject: retained_microbiome
    predicate: performs
    object: anaerobic_syntrophy
    description: In anaerobic digester variants, retained bacterial and archaeal
      populations cooperate through syntrophic conversion of fermentation
      intermediates.
    evidence:
    - reference: PMID:24246480
      snippet: anaerobic digester microbial communities
      notes: Town and colleagues profiled anaerobic digester communities and
        linked microbial populations with reactor performance.
    - reference: PMID:21558697
      snippet: methanogenic environments
      notes: Hattori reviewed syntrophic acetate-oxidizing microbes that
        cooperate with methanogens in anaerobic systems.
  - edge_id: syntrophy_produces_acetate_hydrogen_formate
    subject: anaerobic_syntrophy
    predicate: produces
    object: acetate_hydrogen_formate
    description: Syntrophic food webs interconvert fermentation products into
      acetate, hydrogen, and formate used by methanogens.
    evidence:
    - reference: PMID:21558697
      snippet: syntrophic acetate-oxidizing microbes
      notes: Hattori reviewed acetate oxidation as a syntrophic process coupled
        to hydrogen- or formate-consuming methanogenesis.
  - edge_id: methanogens_convert_intermediates_to_methane
    subject: acetate_hydrogen_formate
    predicate: fuels
    object: methanogenic_archaea
    description: In anaerobic digester food webs, aceticlastic methanogens use
      acetate, whereas hydrogenotrophic methanogens use hydrogen as an electron
      donor to reduce carbon dioxide. Formate can also support methanogenesis.
      Hydrogen is not a carbon substrate; these are alternative guild activities,
      not capabilities attributed to every associated taxon.
    evidence:
    - reference: PMID:21558697
      notes: Hattori 2008, Introduction (p118), Table 1 (p119), and the
        formate-utilizing partner discussion (p120), inspected 2026-10-11.
        Distinguishes acetate cleavage from hydrogen-dependent CO2 reduction
        and formate-linked cooperation; acetate oxidation is one part of a
        broader food web, not the direction of every intermediate-producing edge.
  - edge_id: methanogenic_archaea_produce_methane
    subject: methanogenic_archaea
    predicate: produces
    object: methane
    description: Methanogenic archaea are the terminal methane-producing guild
      in anaerobic bioreactor food webs.
    evidence:
    - reference: PMID:24246480
      snippet: reactor performance
      notes: The anaerobic digester community study used methanogenic archaea
        as a key guild when relating community composition to methane-producing
        reactor function.
