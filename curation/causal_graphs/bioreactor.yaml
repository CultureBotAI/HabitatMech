    label: retained bioreactor microbiome
    node_type: COMMUNITY
  - node_id: anaerobic_syntrophy
    label: anaerobic syntrophy
    node_type: COMMUNITY_PROCESS
  - node_id: acetate_hydrogen_formate
    label: acetate, hydrogen, and formate
    node_type: CHEMICAL
