identifier: ENVO:00002123
causal_graphs:
- graph_id: bioreactor_feed_dilution_biomass_selection
  title: Bioreactor feed dilution biomass selection
  description: Engineered bioreactor operation turns a containment vessel,
    liquid feed, hydraulic exchange, biomass retention, and physicochemical
    setpoints into a wet, nutrient-rich microbial habitat. The feed stream sets
    organic loading, outflow creates dilution pressure on suspended cells,
    retention surfaces keep attached biomass inside the vessel, and choices such
    as aeration, temperature, ammonia, organic loading rate, and hydraulic
    retention time select the community processes that transform influent into
    engineered products.
  nodes:
  - node_id: bioreactor
    label: bioreactor
    node_type: HABITAT
    grounding: ENVO:00002123
  - node_id: engineered_containment_vessel
    label: engineered containment vessel
    node_type: ENVIRONMENTAL_FACTOR
  - node_id: managed_operating_setpoints
    label: managed operating setpoints
    node_type: ENVIRONMENTAL_PARAMETER
