identifier: ENVO:00002123
causal_graphs:
- graph_id: bioreactor_feed_dilution_biomass_selection
  title: Bioreactor feed dilution biomass selection
  description: Conditional examples of liquid continuous-culture, aerobic,
    biofilm-retaining, and anaerobic-digester operation within the broader
    bioreactor class. These branches are not requirements for every bioreactor
    and need not coexist in one vessel. Flow and dilution apply to liquid
    continuous operation; carrier retention applies to biofilm designs;
    syntrophy and methanogenesis apply to anaerobic digester communities.
    Source-attributed environmental parameter bands are not universal operating
    conditions. Detailed flow and community-selection evidence still requires
    claim-level follow-up under issue 1638; conditional scope is not certification
    of every mechanism edge.
  nodes:
  - node_id: bioreactor
    label: bioreactor
    node_type: HABITAT
    grounding: ENVO:00002123
  - node_id: engineered_containment_vessel
    label: engineered containment vessel
    node_type: ENVIRONMENTAL_FACTOR
  - node_id: managed_operating_setpoints
    label: managed operating setpoints
    node_type: ENVIRONMENTAL_PARAMETER
  - node_id: liquid_reactor_medium
    label: liquid reactor medium
    node_type: HABITAT
  - node_id: influent_feed
    label: influent feed
    node_type: CHEMICAL
