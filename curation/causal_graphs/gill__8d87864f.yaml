    object: gill_bacteriocyte_hydrothermal_seep_methane_and_sulfide_flux
    description: Gills of deep-sea Bathymodiolus mussels at hydrothermal vents and cold seeps maintain
      specialized gill cells exposed to hydrothermal and seep fluids.
    evidence:
    - reference: PMID:17504480
      snippet: Cold seeps in the Gulf of Mexico are often dominated by mussels of the genus Bathymodiolus
        that harbour symbiotic bacteria in their gills.
      notes: Bathymodiolus mussels at cold seeps maintain specialized gill habitats for chemosynthetic
        bacterial endosymbionts (PMID:17504480).
    - reference: PMID:26882089
      snippet: 'B. azoricus is a bivalve that lives close to hydrothermal chimney in the Mid-Atlantic
        Ridge (MAR). They harbour in specialized gill cells two types of endosymbiont (gram-bacteria):
        sulphide oxidizing bacteria (SOX) and methanotrophic bacteria (MOX).'
      notes: Bathymodiolus azoricus near hydrothermal chimneys harbors sulfide-oxidizing (SOX) and methanotrophic
        (MOX) endosymbionts inside specialized gill cells (PMID:26882089).
  - edge_id: gill_bacteriocyte_flux_selects_for_gammaproteobacterial_mox_and_sox_symbionts
    subject: gill_bacteriocyte_hydrothermal_seep_methane_and_sulfide_flux
    predicate: selects for
    object: bathymodiolus_gill_gammaproteobacterial_mox_and_sox_endosymbiont_guild
    description: Hydrothermal vent and cold-seep methane and sulfide fluxes select for Gammaproteobacteria
      methanotrophic (MOX) and thioautotrophic (SOX) endosymbionts in Bathymodiolus gills.
    evidence:
    - reference: PMID:17205805
      snippet: Phylogenetic analysis of the pmoA placed this endosymbiont within the Gammaproteobacteria,
        in a cluster including the methanotrophic bacterial genus Methylobacter and other methanotrophic
        Bathymodiolus gill symbionts. These results provide evidence for the existence of two types of
        endosymbionts (thioautotrophic and methanotrophic) in the gills of B. azoricus and demonstrate
        that, apart from the phylogenetic analysis of 16S rRNA genes, parallel analysis of functional
        genes is essential.
      notes: Bathymodiolus azoricus gills harbor both Mytilidae-cluster thioautotrophic and Methylobacter-cluster
        methanotrophic Gammaproteobacteria endosymbionts (PMID:17205805).
    - reference: PMID:17504480
      snippet: Comparative 16S rRNA sequence analysis confirmed a single methanotroph-related symbiont
        in 'B.' childressi and a dual symbiosis with a methanotroph- and thiotroph-related symbiont in
        B. brooksi.
      notes: Gulf of Mexico cold-seep Bathymodiolus gills select for methanotrophic and thiotrophic endosymbionts
        whose densities vary across seep sites (PMID:17504480).
  - edge_id: gill_holobiont_expresses_pmoa_cbbl_and_ba_lysozyme_paralogs
    subject: bathymodiolus_gill_gammaproteobacterial_mox_and_sox_endosymbiont_guild
    predicate: expresses
    object: endosymbiont_pmoa_rubisco_cbbl_and_host_gill_ba_lysozyme_paralogs
    description: Bathymodiolus gill endosymbionts carry and express particulate methane monooxygenase
      (pmoA) and form I RuBisCO (cbbL), while the mussel gill expresses six i-type lysozyme paralogs (Ba-lysozymes).
    evidence:
    - reference: PMID:16761196
      snippet: Fluorescence in situ hybridization demonstrated simultaneous occurrence of the symbiont-specific
        16S rDNA, cbbL and pmoA, but not sopT, in the mussel gill. This is the first molecular and visual
        evidence for a methanotrophic bacterial endosymbiont that bears the RuBisCO cbbL gene relevant
        to autotrophic CO(2) fixation.
      notes: FISH and gene sequencing demonstrate co-occurrence of pmoA and form I RuBisCO cbbL in Bathymodiolus
        gill methanotrophic endosymbionts (PMID:16761196).
    - reference: PMID:26882089
      snippet: Results show the presence of 6 paralogs in B. azoricus. In absence of symbionts, 3 paralogs
        are up-regulated while others are not differentially expressed. Moreover the global activity of
        lysozyme is increasing with the loss of symbiont.
      notes: Bathymodiolus azoricus gills express six i-type lysozyme paralogs (Ba-lysozymes) that are
        differentially regulated according to endosymbiont presence (PMID:26882089).
  - edge_id: pmoa_cbbl_and_lysozymes_catalyze_host_carbon_nutrition_and_symbiont_regulation
    subject: endosymbiont_pmoa_rubisco_cbbl_and_host_gill_ba_lysozyme_paralogs
    predicate: catalyzes
    object: gill_methanotrophic_thioautotrophic_carbon_nutrition_and_lysozyme_symbiont_homeostasis
    description: Symbiont pmoA and RuBisCO cbbL drive methanotrophy and autotrophic CO2 fixation for mussel
      carbon nutrition, while host i-type lysozymes regulate gill endosymbiont abundance.
    evidence:
    - reference: PMID:17504480
      snippet: A gene characteristic of methane-oxidzing bacteria, pmoA, was identified in all three mussel
        species confirming the methanotrophic potential of their symbionts. Stable isotope analyses of
        lipids and whole tissue also confirmed the importance of methanotrophy in the carbon nutrition
        of all of the mussels.
      notes: pmoA-mediated methanotrophy in gill endosymbionts supplies carbon nutrition to Bathymodiolus
        lipids and tissues (PMID:17504480).
    - reference: PMID:26882089
      snippet: Moreover the global activity of lysozyme is increasing with the loss of symbiont. All together
        these results suggest that lysozyme may play a crucial role in symbiont regulation.
      notes: Host gill i-type lysozyme activity regulates endosymbiont dynamics in Bathymodiolus azoricus
        (PMID:26882089).
