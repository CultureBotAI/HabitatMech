causal_graphs:
- graph_id: gill_bathymodiolus_bacteriocyte_pmoa_cbbl_dual_chemosymbiosis_and_lysozyme_regulation
  title: Mussel gill bacteriocyte CH4/H2S interface, Bathymodiolus methanotrophic (MOX) and thiotrophic
    (SOX) endosymbiont selection, and pmoA/cbbL chemosynthesis and host i-type lysozyme regulation mechanism
  description: Gills of deep-sea hydrothermal vent and cold-seep mussels (Bathymodiolus azoricus, B. heckerae,
    B. brooksi, and B. childressi) house specialized epithelial bacteriocytes at the interface of methane-
    and sulfide-rich vent/seep fluids and oxygenated seawater. This gill bacteriocyte niche selects for
    dual or monospecific Gammaproteobacteria endosymbionts comprising methane-oxidizing (MOX, Methylobacter-clade)
    and sulfide-oxidizing (SOX, Mytilidae thiotrophic clade) bacteria. The gill endosymbionts express
    particulate methane monooxygenase (pmoA) and form I ribulose-1,5-bisphosphate carboxylase/oxygenase
    (RuBisCO cbbL) to fix methane- and CO2-derived carbon for host nutrition, while host gill cells express
    six i-type lysozyme paralogs (Ba-lysozymes) whose transcription and bactericidal activity are modulated
    during symbiont loss and re-acquisition to regulate endosymbiont density.
