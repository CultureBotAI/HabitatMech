      evidence:
      - reference: PMID:40358234
        snippet: The filamentous cyanobacterium Nostoc punctiforme contains a single putative exosortase,
          designated cyanoexosortase B (CrtB), implicated by previous work both in motility and in the
          production of the UV-absorbing pigment, scytonemin.
        notes: Nostoc punctiforme ATCC 29133 / PCC 73102 (NCBITaxon:63737) cyanoexosortase B (CrtB, locus
          tag Npun_F0456, annotated in UniProtKB as Eight transmembrane protein EpsH, UniProtKB:B2J727)
          is essential for motility, biofilm formation, and scytonemin biosynthesis in PMID:40358234.
    - accession: UniProtKB:B2IXH4
      entry_name: TRPDH_NOSP7
      recommended_name: L-tryptophan dehydrogenase
      locus_tag: Npun_R1275
      taxon_id: NCBITaxon:63737
      taxon_name: Nostoc punctiforme (strain ATCC 29133 / PCC 73102)
      role_in_node: subunit
      sequence_length: 353
      crc64: 598B1E8D193C8EE6
      evidence:
      - reference: PMID:35208882
        snippet: The indole-alkaloid scytonemin is a sunscreen pigment that is widely produced among cyanobacteria
          as an ultraviolet radiation (UVR) survival strategy. Scytonemin biosynthesis is encoded by two
          gene clusters that are known to be induced by long-wavelength radiation (UVA).
        notes: Nostoc punctiforme ATCC 29133 / PCC 73102 (NCBITaxon:63737) L-tryptophan dehydrogenase
          ScyB (locus tag Npun_R1275, UniProtKB:B2IXH4) is a core enzyme of the UVA-inducible scytonemin
          biosynthesis gene cluster analyzed in PMID:35208882.
    - accession: UniProtKB:B2IXH1
      entry_name: B2IXH1_NOSP7
      recommended_name: PEP-CTERM protein-sorting domain-containing protein
      locus_tag: Npun_R1272
