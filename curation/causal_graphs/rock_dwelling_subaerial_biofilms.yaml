causal_graphs:
- graph_id: subaerial_rock_biofilm_desiccation_uv_crtb_scytonemin_bioprotection
  title: Subaerial rock biofilm desiccation/UV stress, Nostoc CrtB-dependent PEP-CTERM/scytonemin trafficking,
    and lithic water retention mechanism
  description: Subaerial rock biofilms (SABs) on exposed stone and monument surfaces experience fluctuating
    water activity governed by local temperature and relative humidity alongside intense ultraviolet (UVA/UVB)
    radiation and drought. Phototroph-chemotroph SAB consortia (including filamentous cyanobacteria such
    as Nostoc punctiforme) employ cyanoexosortase B (CrtB) to export PEP-CTERM proteins that stabilize
    extracellular polymeric substances (EPS) and enable UVA/UVB-inducible biosynthesis of the indole-alkaloid
    sunscreen pigment scytonemin, while desiccated SABs enrich the matrix with proteins and DNA, shift
    metabolism to fermentation, and delay water evaporation from the underlying stone.
  nodes:
  - node_id: rock_dwelling_subaerial_biofilms
    label: subaerial rock biofilm
    node_type: HABITAT
    grounding: habitatmech:GOLD.02bb8b9d08
    description: Sessile microbial biofilm community colonizing air-exposed rock, limestone, marble, and
      stone monument surfaces.
  - node_id: subaerial_desiccation_water_activity_and_uv_radiation_regime
    label: subaerial desiccation, temperature/RH-constrained water activity, and UVA/UVB irradiation
    node_type: ENVIRONMENTAL_FACTOR
    description: Restricted liquid water access where biofilm water activity is constrained by local temperature
      and relative humidity, combined with episodic drought and solar UVA/UVB exposure.
  - node_id: lithic_phototroph_chemotroph_and_nostoc_cyanobacterial_guild
    label: subaerial phototroph-chemotroph consortium and filamentous cyanobacteria (Nostoc punctiforme)
    node_type: COMMUNITY
    description: Rock-dwelling phototrophic-chemotrophic biofilm community including scytonemin-producing
      filamentous cyanobacteria such as Nostoc punctiforme.
  - node_id: cyanoexosortase_b_crtb_pep_cterm_and_scytonemin_gene_clusters
    label: cyanoexosortase B (CrtB), PEP-CTERM exoproteins, and UVA-inducible scytonemin biosynthesis
      genes
    node_type: GENE_OR_PROTEIN
    description: Nostoc punctiforme cyanoexosortase B (crtB), which processes and exports PEP-CTERM domain
      proteins to stabilize EPS/hormogonium polysaccharide interactions, and the two UVA/UVB-upregulated
      scytonemin biosynthesis gene clusters. Verified protein_examples are attached for Nostoc punctiforme
      strain ATCC 29133 / PCC 73102 (NCBITaxon:63737) cyanoexosortase B CrtB / EpsH (UniProtKB:B2J727,
      Npun_F0456; PMID:40358234), scytonemin operon L-tryptophan dehydrogenase ScyB (UniProtKB:B2IXH4,
      Npun_R1275; PMID:35208882), and periplasmic scytonemin-cluster PEP-CTERM proteins ScyE (UniProtKB:B2IXH1,
      Npun_R1272; PMID:40358234) and ScyF (UniProtKB:B2IXH0, Npun_R1271; PMID:40358234).
    protein_examples:
