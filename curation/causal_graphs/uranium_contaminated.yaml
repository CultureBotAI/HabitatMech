causal_graphs:
- graph_id: uranium_contaminated_soil_hexavalent_uranyl_geobacter_ppca_ppcb_cytochrome_pili_u6_bioreduction
  title: Uranium-contaminated soil soluble hexavalent U(VI) and heavy-metal/nutrient-limitation regime,
    Geotalea/Geobacter uraniireducens and uranium-tolerant Bacillus/Arthrobacter guild selection, and
    triheme c-type cytochrome (PpcA/PpcB) and conductive-pili U(VI)-to-U(IV) bioreduction mechanism
  description: Uranium-contaminated soils and subsurface aquifer sediments (such as at the Rifle, Colorado
    uranium-bioremediation site and uranium-tailings soils) expose soil and subsurface microbiota to mobile,
    toxic hexavalent uranium [U(VI)] alongside heavy-metal stress and nitrogen and phosphate limitation.
    These radioactive and redox-selective soil conditions enrich dissimilatory metal-reducing bacteria
    dominated by Geotalea uraniireducens (formerly Geobacter uraniireducens), Geobacter sulfurreducens,
    and Shewanella together with uranium-tolerant soil bacteria and fungi (Bacillus subtilis, Priestia
    megaterium, Priestia aryabhattai, Arthrobacter woluwensis, and Mucor spp.). During growth in uranium-contaminated
    sediments and soils, Geotalea/Geobacter uraniireducens upregulates 34 c-type cytochrome genes—including
    abundant periplasmic triheme c-type cytochromes PpcA and PpcB—and conductive pili for extracellular
    electron transfer (EET), while uranium-tolerant soil consortia upregulate nirS3, phnK, urease, and
    dehydrogenase activities, catalyzing the directional electron transfer that reduces soluble hexavalent
    U(VI) into insoluble tetravalent U(IV) and immobilizes acid-soluble soil uranium.
