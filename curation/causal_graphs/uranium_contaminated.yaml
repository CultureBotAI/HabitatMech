  edges:
  - edge_id: uranium_contaminated_soil_maintains_soluble_u6_and_heavy_metal_nutrient_stress
    subject: uranium_contaminated
    predicate: maintains
    object: soluble_hexavalent_uranium_heavy_metal_stress_and_nutrient_limitation_regime
    description: Uranium-contaminated soils and subsurface sediments expose resident microbes to soluble
