identifier: ENVO:01001041
causal_graphs:
- graph_id: fungi_associated_hyphae_mycosphere_dispersal
  title: Fungi-associated hyphae mycosphere dispersal
  description: Fungal structures create host-associated microsites by extending
    hyphae through soil and organic matter, releasing fungal exudates, exposing
    chitin-rich cell walls, and forming hydrated surfaces that bacteria can
    colonize. These hyphal traits recruit mycosphere bacteria, provide fungal
    highways for motile dispersers, support fungus-feeding chitinolytic bacteria,
    and contain intracellular niches for endofungal symbionts.
