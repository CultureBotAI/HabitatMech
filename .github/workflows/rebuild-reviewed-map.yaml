---
name: Temporary reviewed-record map rebuild

on:  # yamllint disable-line rule:truthy
  push:
    branches: [codex/record-reviews-20261012g]
    paths: [.github/workflows/rebuild-reviewed-map.yaml]

permissions:
  contents: read
  actions: read

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      NUMBA_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-record-map-698523ae31a20f2c9de78eeef250cae519e1c808
          run-id: 38231606106
          github-token: ${{ github.token }}
          path: build/prior-map
      - name: Install unchanged locked environments
        run: |
          uv sync --locked --extra dev
          uv sync --locked --project conf/embedding-runtime
      - name: Verify prior cache and export current inputs
        run: |
          uv run --locked python scripts/embedding_pipeline.py check --output data/text_map --input build/prior-map/build/text-map/inputs.jsonl --cache build/prior-map/build/text-map/vectors.sqlite
          uv run --locked python scripts/text_map_inputs.py --output build/text-map/inputs.jsonl
          uv run --locked python scripts/text_map_inputs.py --limit 32 --output build/text-map/projection-canary.jsonl
          uv run --locked python scripts/text_map_inputs.py --record data/habitats/aquatic/saline_lake_sediment.yaml --record data/habitats/aquatic/saline_marsh.yaml --record data/habitats/aquatic/saline_spring_sediment.yaml --record data/habitats/aquatic/saline_water__863799b0.yaml --record data/habitats/aquatic/saline_water_body.yaml --record data/habitats/aquatic/salt_crust.yaml --record data/habitats/aquatic/salt_crystallizer_ponds.yaml --record data/habitats/aquatic/salt_flat_salt_pan_sediment.yaml --record data/habitats/aquatic/salt_marsh_sediment.yaml --record data/habitats/aquatic/salt_pond_sediment.yaml --record data/habitats/aquatic/salt_spring.yaml --record data/habitats/aquatic/sand__41bd3609.yaml --record data/habitats/aquatic/sea_grass_bed.yaml --record data/habitats/aquatic/sea_ice.yaml --record data/habitats/aquatic/sea_ice__a6c14b9a.yaml --record data/habitats/aquatic/sea_water.yaml --record data/habitats/aquatic/seagrass_bed_sediment.yaml --record data/habitats/aquatic/seaweed.yaml --record data/habitats/aquatic/sediment__064b5f4b.yaml --record data/habitats/aquatic/sediment__0bbc27fb.yaml --record data/habitats/aquatic/sediment__0d49df05.yaml --record data/habitats/aquatic/sediment__0ef8e416.yaml --record data/habitats/aquatic/sediment__155ecb33.yaml --record data/habitats/aquatic/sediment__22a0bba7.yaml --record data/habitats/aquatic/sediment__24eaa500.yaml --record data/habitats/aquatic/sediment__2a63f0bb.yaml --record data/habitats/aquatic/sediment__2b3ec834.yaml --record data/habitats/aquatic/sediment__2f8c22b7.yaml --record data/habitats/aquatic/sediment__301877e9.yaml --record data/habitats/aquatic/sediment__347a23a3.yaml --record data/habitats/aquatic/sediment__3f324bf4.yaml --record data/habitats/aquatic/sediment__40797ec7.yaml --output build/text-map/canary.jsonl
          cp build/prior-map/build/text-map/vectors.sqlite build/text-map/vectors.sqlite
      - name: Encode changed-record canary and prove reuse
        run: |
          uv run --locked --project conf/embedding-runtime python scripts/embedding_pipeline.py embed --input build/text-map/canary.jsonl --cache build/text-map/vectors.sqlite --profile-output build/text-map/profile.json --device cpu --batch-size 8 > build/text-map/canary-first.json
          uv run --locked --project conf/embedding-runtime python scripts/embedding_pipeline.py embed --input build/text-map/canary.jsonl --cache build/text-map/vectors.sqlite --profile-output build/text-map/profile.json --device cpu --batch-size 8 > build/text-map/canary-repeat.json
          uv run --locked python -c 'import json; from pathlib import Path; first=json.loads(Path("build/text-map/canary-first.json").read_text()); repeat=json.loads(Path("build/text-map/canary-repeat.json").read_text()); assert first["count"] == first["encoded"] + first["reused"] == 32, first; assert repeat["count"] == repeat["reused"] == 32 and repeat["encoded"] == 0, repeat; print(first, repeat)'
      - name: Project canary and complete full map
        run: |
          uv run --locked --project conf/embedding-runtime python scripts/embedding_pipeline.py project --input build/text-map/projection-canary.jsonl --cache build/text-map/vectors.sqlite --profile build/text-map/profile.json --output build/text-map/canary-map
          uv run --locked python scripts/embedding_pipeline.py check --output build/text-map/canary-map --input build/text-map/projection-canary.jsonl --cache build/text-map/vectors.sqlite
          uv run --locked --project conf/embedding-runtime python scripts/embedding_pipeline.py embed --input build/text-map/inputs.jsonl --cache build/text-map/vectors.sqlite --profile-output build/text-map/profile.json --device cpu --batch-size 8 > build/text-map/full-embed.json
          uv run --locked python -c 'import json; from pathlib import Path; result=json.loads(Path("build/text-map/full-embed.json").read_text()); assert result["count"] == result["reused"] == 3208 and result["encoded"] == 0, result; print(result)'
          uv run --locked --project conf/embedding-runtime python scripts/embedding_pipeline.py project --input build/text-map/inputs.jsonl --cache build/text-map/vectors.sqlite --profile build/text-map/profile.json --output data/text_map --title "HabitatMech semantic text map"
          uv run --locked python scripts/embedding_pipeline.py check --output data/text_map --input build/text-map/inputs.jsonl --cache build/text-map/vectors.sqlite > build/text-map/full-check.json
      - name: Upload checked products and cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-record-map-${{ github.sha }}
          retention-days: 7
          path: |
            data/text_map/
            build/text-map/
          if-no-files-found: warn
