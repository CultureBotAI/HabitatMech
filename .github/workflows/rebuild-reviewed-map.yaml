---
name: Temporary reviewed-record map rebuild

on:  # yamllint disable-line rule:truthy
  push:
    branches: [codex/record-reviews-20261011n]
    paths: [.github/workflows/rebuild-reviewed-map.yaml]

permissions:
  contents: read
  actions: read

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      NUMBA_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-record-map-e570f41a6423a2ae6133ab8379f4d0c7942c21dd
          run-id: 38153553858
          github-token: ${{ github.token }}
          path: build/prior-map
      - name: Install unchanged locked environments
        run: |
          uv sync --locked --extra dev
          uv sync --locked --project conf/embedding-runtime
      - name: Verify prior cache and export current inputs
        run: |
          uv run --locked python scripts/embedding_pipeline.py check --output data/text_map --input build/prior-map/build/text-map/inputs.jsonl --cache build/prior-map/build/text-map/vectors.sqlite
          uv run --locked python scripts/text_map_inputs.py --output build/text-map/inputs.jsonl
          uv run --locked python scripts/text_map_inputs.py --limit 32 --output build/text-map/projection-canary.jsonl
          uv run --locked python scripts/text_map_inputs.py --record data/habitats/engineered/sludge__03f51c5b.yaml --record data/habitats/engineered/sludge__133813c4.yaml --record data/habitats/engineered/sludge__19220baa.yaml --record data/habitats/engineered/sludge__24a43e8a.yaml --record data/habitats/engineered/sludge__25c88b98.yaml --record data/habitats/engineered/sludge__47f7c56a.yaml --record data/habitats/engineered/sludge__579ac3b2.yaml --record data/habitats/engineered/sludge__8386cab1.yaml --record data/habitats/engineered/sludge__bb19be97.yaml --record data/habitats/engineered/sludge__c3365fbe.yaml --record data/habitats/engineered/sludge__cb27e648.yaml --record data/habitats/engineered/sludge__df43c436.yaml --record data/habitats/engineered/sludge__e608f05a.yaml --record data/habitats/engineered/wastewater.yaml --record data/habitats/engineered/wastewater__05daf28f.yaml --record data/habitats/engineered/wastewater__379edbf8.yaml --record data/habitats/engineered/wastewater__49e4fa74.yaml --record data/habitats/engineered/wastewater__b5b1cb15.yaml --record data/habitats/engineered/wastewater__c5873720.yaml --record data/habitats/engineered/wastewater__7fd6e093.yaml --output build/text-map/canary.jsonl
          cp build/prior-map/build/text-map/vectors.sqlite build/text-map/vectors.sqlite
      - name: Encode changed-record canary and prove reuse
        run: |
          uv run --locked --project conf/embedding-runtime python scripts/embedding_pipeline.py embed --input build/text-map/canary.jsonl --cache build/text-map/vectors.sqlite --profile-output build/text-map/profile.json --device cpu --batch-size 8 > build/text-map/canary-first.json
          uv run --locked --project conf/embedding-runtime python scripts/embedding_pipeline.py embed --input build/text-map/canary.jsonl --cache build/text-map/vectors.sqlite --profile-output build/text-map/profile.json --device cpu --batch-size 8 > build/text-map/canary-repeat.json
          uv run --locked python -c 'import json; from pathlib import Path; first=json.loads(Path("build/text-map/canary-first.json").read_text()); repeat=json.loads(Path("build/text-map/canary-repeat.json").read_text()); assert first["count"] == first["encoded"] + first["reused"] == 20, first; assert repeat["count"] == repeat["reused"] == 20 and repeat["encoded"] == 0, repeat; print(first, repeat)'
      - name: Project canary and complete full map
        run: |
          uv run --locked --project conf/embedding-runtime python scripts/embedding_pipeline.py project --input build/text-map/projection-canary.jsonl --cache build/text-map/vectors.sqlite --profile build/text-map/profile.json --output build/text-map/canary-map
          uv run --locked python scripts/embedding_pipeline.py check --output build/text-map/canary-map --input build/text-map/projection-canary.jsonl --cache build/text-map/vectors.sqlite
          uv run --locked --project conf/embedding-runtime python scripts/embedding_pipeline.py embed --input build/text-map/inputs.jsonl --cache build/text-map/vectors.sqlite --profile-output build/text-map/profile.json --device cpu --batch-size 8 > build/text-map/full-embed.json
          uv run --locked python -c 'import json; from pathlib import Path; result=json.loads(Path("build/text-map/full-embed.json").read_text()); assert result["count"] == result["reused"] == 3208 and result["encoded"] == 0, result; print(result)'
          uv run --locked --project conf/embedding-runtime python scripts/embedding_pipeline.py project --input build/text-map/inputs.jsonl --cache build/text-map/vectors.sqlite --profile build/text-map/profile.json --output data/text_map --title "HabitatMech semantic text map"
          uv run --locked python scripts/embedding_pipeline.py check --output data/text_map --input build/text-map/inputs.jsonl --cache build/text-map/vectors.sqlite > build/text-map/full-check.json
      - name: Upload checked products and cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-record-map-${{ github.sha }}
          retention-days: 7
          path: |
            data/text_map/
            build/text-map/
          if-no-files-found: warn
