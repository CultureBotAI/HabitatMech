---
name: Build and test

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A second push supersedes the first; nothing waits on the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qc:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.10 is the floor pyproject advertises, so it is tested rather than
        # assumed; 3.12 is what developers run.
        python-version: ["3.10", "3.12"]
      fail-fast: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # build_redirects.py reconstructs retired URLs from history, so the
          # default shallow clone would leave it with nothing to read (#54).
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      # Runs before validate-all: the tests cover the seeder's grounding rules
      # and the corpus-wide invariants (duplicate identifiers, dangling minted
      # parents, category/directory agreement) that per-record schema
      # validation cannot see.
      - name: Test
        run: uv run pytest -q

      - name: Validate every record against the schema (closed mode)
        run: uv run python scripts/validate_strict.py --quiet

      # Schema validation checks each record's shape, not its content. Without
      # this, a hand-edited record passes every other check in this workflow.
      - name: Verify the corpus reproduces from data/raw/
        run: uv run python scripts/verify_corpus.py

      # pages/ is committed and served from the branch root, so it can drift
      # from the corpus the same way records could drift from data/raw/.
      - name: Verify the site is in step with the corpus
        run: uv run python scripts/render_pages.py --check

      # A record page is named after its label and identifier, so curation
      # moves URLs. RETIRED.tsv keeps the old addresses resolving; if it is
      # stale, an improvement has silently 404'd a published page (#54).
      - name: Check the retired-URL map is current
        run: uv run python scripts/build_redirects.py --check

      - name: Corpus report
        run: uv run python scripts/habitat_report.py

      - name: Upload validation failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-failures
          path: reports/
          if-no-files-found: ignore
