---
name: Build and test

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qc:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
      fail-fast: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      # Runs before validate-all: the tests cover the seeder's grounding rules
      # and the corpus-wide invariants (duplicate identifiers, dangling minted
      # parents, category/directory agreement) that per-record schema
      # validation cannot see.
      - name: Test
        run: uv run pytest -q

      - name: Validate every record against the schema (closed mode)
        run: uv run python scripts/validate_strict.py --quiet

      - name: Corpus report
        run: uv run python scripts/habitat_report.py

      - name: Upload validation failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-failures
          path: reports/
          if-no-files-found: ignore
