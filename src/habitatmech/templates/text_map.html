{% extends "base.html" %}
{% block title %}Semantic text map — HabitatMech{% endblock %}
{% block wrapclass %} wide{% endblock %}
{% block content %}
<h1>Semantic text map</h1>
<p>The map below uses the shared, validated record-description projection. <a href="../text-map-source/index.html">Open the map on its own</a>.</p>
<iframe id="text-map-view" title="Explore HabitatMech records by semantic similarity" src="../text-map-source/index.html" style="width:100%;height:80vh;min-height:38rem;border:1px solid var(--rule)"></iframe>
<script>
(function () {
  var frame = document.getElementById('text-map-view');
  frame.addEventListener('load', function () {
    // The immutable shared page remains byte-identical. Record navigation
    // leaves the frame so readers retain normal full-page history and links.
    frame.contentDocument.addEventListener('click', function (event) {
      var anchor = event.target.closest('a');
      if (anchor && new URL(anchor.href).pathname.includes('/habitats/')) {
        anchor.target = '_top';
      }
    });
  });
})();
</script>
{% endblock %}
