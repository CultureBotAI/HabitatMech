    "definition_source": "HabitatMech", "habitat_category": "HOST_ASSOCIATED", "grounding_status":
    "UNGROUNDED", "mapping_status": "REVIEWED", "synonyms": [{"synonym_text": "Invertebrates",
    "synonym_type": "EXACT_SYNONYM", "source": "HabitatMech curation"}], "parent_habitats":
    ["ENVO:01001000", "ENVO:01001002"], "source_attestations": [{"source": "GOLD",
    "source_id": "gold.ecosystem:3374", "source_label": "Invertebrates", "source_path":
    "Host-associated > Invertebrates", "assertion_count": 621, "assertion_unit": "ORGANISM",
    "notes": "4 GOLD ecosystem node ids share this path; first shown. See data/raw/gold_ecosystem_paths.tsv."}],
    "curation_history": [{"timestamp": "2026-08-12T00:00:00Z", "curator": "claude-opus-5",
    "action": "CONFIRM_UNGROUNDED", "changes": "Confirmed UNGROUNDED: no ontology
    term fits this concept. Nearest broader term ENVO:01001002 ''animal-associated
    environment'' attached as a parent. Invertebrates as host. Parented to animal-associated
    environment; not grounded there because every host clade would merge onto one
    record. ENVO term request. (source concept habitatmech:GOLD.4d792ac724)"}, {"timestamp":
    "2026-08-16T00:00:00Z", "curator": "claude-opus-5", "action": "DEFINED", "changes":
    "Defined as ''invertebrate-associated environment'' under ENVO:01001002 ''animal-associated
    environment''. The habitat is the host clade, and it is the entire content of
    the concept: GOLD and BacDive both organise host-associated isolates by host,
    and every downstream anatomical path hangs off it. HabitatMech deliberately does
    not ground these to animal-associated environment, because every clade would then
    merge onto one record and the distinction the sources are making would be lost.
    ENVO already has this shape at plant-, animal- and fungi-associated environment;
    this asks for the same pattern one level down. Invertebrate is a grade rather
    than a clade, but it is the grouping both sources use and the request records
    that rather than inventing a taxonomy they do not have."}, {"timestamp": "2026-08-16T05:58:02Z",
    "curator": "seed_from_sources", "action": "SEEDED_FROM_SOURCES", "changes": "Seeded
    from data/raw/ inventories; attested by GOLD. Grounding: UNGROUNDED."}]}'
