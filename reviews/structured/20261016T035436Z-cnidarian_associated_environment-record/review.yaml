- assessment_id: A1
  area: identity
  topic: Identity, grounding, aliases and strictly broader hierarchy
  outcome: supported
  summary: 'The two GOLD Cnidaria bins plausibly denote cnidarian-associated environments,
    with valid animal/organism-determined and invertebrate-environment genera. The
    latter parent is an associated environment, not a whole animal. The BacDive Cnidaria-Corals
    bin needs finer scope assessment: inspected primary papers include genuine coral
    and jellyfish isolates, but also exact S304 from hydrothermal coral-reef sediment
    and V. astriarenae from reef seawater. Those environmental settings do not alone
    establish determination by a living cnidarian. Preserve the native 75 STRAIN,
    95 and 102 ORGANISM counts separately and the top 25 of 73 taxa; do not remove
