summary: The authored definition denotes pollutant-bearing anthropogenic gaseous effluent,
  and ENVO:01000797 is a valid genus for that material. However, the BacDive waste-gas
  category includes biofilter isolates rather than demonstrated sampling from the
  gas phase. BacDive11867 explicitly assigns strain905/1 to this category while describing
  a waste-gas-treatment biofilter; its species is in the retained association set.
  Gas stream and filter material must remain distinct. This witness does not prove
  all20 frozen strains misclassified.
