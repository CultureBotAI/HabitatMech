summary: The PREGO BTO coelom identity is a body-cavity concept; its dated definition
  is retained as source wording, not endorsed as a universal developmental account.
  The only taxon is P. entomophila L48. BacDive identifies its Drosophila origin,
  while the original infection abstract contrasts artificial body-cavity injection
  in earlier studies with this organism's oral infection and gut damage. Neither proves
  this exact PREGO coelom localization. Recover the original pair and body-cavity
  dictionary context before inferring a natural coelomic habitat or deleting the association;
  do not equate hemocoel, gut lumen and true coelom.
