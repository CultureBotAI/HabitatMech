findings:
- finding_id: F1
  issue_key: gold-7d30100f56-mapping-endpoint-contract
  category: representation
  severity: major
  status: open
  certainty: confirmed
  title: NARROW/narrowMatch compares the retained source concept with an implicit
    ontology parent
  description: 'The exact source path mints GOLD.7d30100f56, which remains the record
    identity. resolve_gold nevertheless returns NARROW/skos:narrowMatch because ENVO:03501300
    is broader, and ingest_gold copies the generated predicate into SourceAttestation.
    The declared mapping endpoints are source -> record identifier, with omission
    for retained source identity; GroundingStatusEnum compares that same identifier
    to its sources. ENVO:03501300 is not the declared mapping target. This is the
    application-contract mismatch in #1398, not proof that SKOS self-links are forbidden
    or that all downstream consumers emit a wrong triple.'
  target_ids:
  - habitatmech:GOLD.7d30100f56
  field_paths:
