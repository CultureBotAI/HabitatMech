findings:
- finding_id: process_habitat_scope
  issue_key: microbial-enhanced-oil-recovery-process-habitat-scope
  category: identity
  severity: major
  status: open
  certainty: provisional
  title: Process-named source lacks a resolved physical-habitat interpretation
  description: Inspected experimental usage distinguishes the MEOR procedure from
    sampled environments. The current source record has no positive ITEM identity
    assessment and relies on a process-named parent category. The missing link is
    which physical entity, if any, GOLD intends this bin to denote. This is a material
    semantic uncertainty, not a claim that every process-named category is invalid,
    proof of wrong mint, or a mandatory NOT_APPLICABLE outcome.
  target_ids:
