actions:
- action_id: resolve_identity
  description: Recover source definitions and original members for nodes3535/3875/4313,
    especially the Gs0054992 biosample. Decide at ITEM depth whether the source denotes
    the procedure or a consistently bounded physical setting; reassess the Biotransformation
    parent in the same decision.
  finding_ids:
  - process_habitat_scope
  target_ids:
  - habitatmech:GOLD.7bfc46d5f7
  owner_paths:
  - repository: CultureBotAI/HabitatMech
    path: curation/decisions.tsv
    role: Source identity and CLASS/ITEM decision
  - repository: CultureBotAI/HabitatMech
    path: curation/term_requests.tsv
    role: Evidence-backed habitat definition if source scope warrants one
  generator: 'Authorized normal curation: dry seed, target canary, append native history,
    regenerate products.'
  acceptance_checks:
  - Document exact member accessions and source-scope evidence, or explicitly retain
    unresolved scope if access remains unavailable.
  - If the source is the procedure, use a justified NOT_APPLICABLE decision without
    assigning a process identity to a habitat. If it denotes a physical setting, retain
    the mint and define that evidence-backed habitat under a strictly broader genus.
  - Preserve all three original GOLD nodes, full path, zero-count omission and separate
    later biosample/study provenance; do not import generic field-trial taxa or conditions.
  - Run target LinkML/strict validation, just verify-corpus, just validate-history,
    normal generated-product gates, just qc, and any affected ontology-label validation.
  - Retain this immutable observation and use exact lineage references in a successor
    disposition.
limitations:
- One of3208 records reviewed here; the full-corpus goal remains incomplete.
- Original source-member details remain unavailable. The one-biosample source lead
  is not a crosswalk to the cited field trial.
- The hierarchy concern is conditional on unresolved identity; no parent edge is declared
  independently false or automatically removed.
- The historical parent review supplies context only; parent findings are neither
  closed nor reproduced as child findings.
- Primary paper was read through structured Europe PMC full text after publisher access
  failed. Only inspected sections support this assessment; no search snippet or inaccessible
  source is scientific evidence.
- Exact-baseline fullQC and ontology-label receipts are reused on unchanged scientific
  inputs. No new global ontology refresh; three baseline native tests remain skipped.
- No scientific data, native status/history or GitHub state changed; no publication
  or SSSOM/KGX readiness assessment.
