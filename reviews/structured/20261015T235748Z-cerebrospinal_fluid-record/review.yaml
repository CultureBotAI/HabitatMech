  summary: '[{"row": 239, "data": {"term_id": "BTO:0000237", "ontology": "BTO", "label":
    "cerebrospinal fluid", "definition": "The serumlike fluid that circulates through
    the ventricles of the brain, the cavity of the spinal cord, and the subarachnoid
    space, functioning in shock absorption. A liquid that is comparable to serum but
    contains less dissolved material, that is secreted from the blood into the lateral
    ventricles of the brain by the choroid plexus, circulates through the ventricles
    to the spaces between the meninges about the brain and spinal cord, and is resorbed
    into the blood through the subarachnoid sinuses, and that serves chiefly to maintain
    uniform pressure within the brain and spinal cord.", "synonyms": "", "deprecated":
    "", "directly_referenced": "TRUE", "label_only": "FALSE"}}]'
