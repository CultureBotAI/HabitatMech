    and it makes the case against itself more clearly than any of the others: its
    own near-miss table rejects ENVO:01001055 ''environment associated with an animal
    part or small animal'' because ''the source concept is whole organisms across
    five classes spanning millimetre brittle stars to metre-long holothurians'', and
