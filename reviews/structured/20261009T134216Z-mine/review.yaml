limitations:
- One record reviewed, not the full3208-record corpus; no finding means no new target
  defect within this declared scope.
- All25 displayed identifiers were verified, but the full58-taxon PREGO matrix and
  every underlying isolate/genome source statement were not independently reconstructed.
  Source associations are not characteristic or abundant taxa.
- Configured upstream PREGO files were missing. Broader ignored-inclusive filename
  search had permission-denied directories and could miss nodes.tsv/edges.tsv in differently
  named directories; no global absence claim.
- PREGO public TLS certificate validation failed. No insecure retrieval,credential
  search,paid research or authenticated source mutation was attempted.
- The separate historical Built Environment ancestor finding is not resolved or duplicated
  here. Direct-parent support does not certify transitive graph consistency across
  the whole corpus.
- Full QC/label receipts are reused at exact unchanged e4ce383d9;3 baseline tests
  remain skipped. Relevant taxa/terms were directly fetched, but no new global ontology
  refresh or full local QC was run.
- Only this immutable review pair is written. No curation,generated scientific product,native
