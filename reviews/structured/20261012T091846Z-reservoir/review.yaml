- Later GOLD export/classification is distinct from the original August snapshot;
  source node IDs are verified against the frozen inventory, not individually certified
  live at GOLD.
- No source snapshot, scientific record, mapping status, curation history or GitHub
  issue was changed.
- 'Same-agent assessment, not independent approval. SSSOM/KGX conformance to current
  kg-microbe modeling was not audited; issue #1398 remains unresolved.'
- Label validation passed with 1178 canonical pairs, one synonym, five accepted exceptions
  and 2057 no-adapter skips; skips are not scientific validation.
- Broad gates do not increase scientific coverage beyond this exact record. Supporting
  legacy reports are leads and remain immutable; not every cited legacy publication
  was rechecked.
