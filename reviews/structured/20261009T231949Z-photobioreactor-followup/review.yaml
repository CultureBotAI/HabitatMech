  inspections; no repeated external census is claimed. The entire corrected record,
  changed maintained rows, regressions, session history, generated products and prior
  observation were reread for this assessment.
- The temporary Linux build workflow was removed before the captured complete-product
  commit. Only a fresh immutable map generation/pointer and generated pages were imported
