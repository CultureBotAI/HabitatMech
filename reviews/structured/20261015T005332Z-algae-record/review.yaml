summary: The minted living-alga-associated environment, ENVO:01001000 genus and FOODON
  organism-group xref preserve the host-versus-habitat distinction. Both source ITEM
  decisions explain REVIEWED, but that workflow status does not validate unconditional
  source equivalence. The obsolete ENVO:02500019 identifier is retained as Madin provenance,
  not as active grounding. The pinned Madin release contains 100 host_algae observations
  for 88 distinct IDs, including every displayed ID. Its conversion table maps 38
  source strings, including decomposing scum, algal mats, algae-bearing sediment and
  lichen-colonized rock. This mixed scope is not unconditionally the living-host environment.
  Separately, Algae denotes the organism group and should not be an exact synonym
  of its associated environment.
