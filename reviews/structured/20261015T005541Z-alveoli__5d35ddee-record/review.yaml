summary: The complete human lung path specifies pulmonary alveoli. Active UBERON:0002299
  is an anatomically appropriate candidate. The two same-depth leaves retain source
  mints via gold_narrower_than_leaf_match; automatic NARROW/SEEDED does not establish
  exact identity or justify merging host-qualified concepts without ITEM review. The
  whole human lung is a container, not a strictly broader class of alveolus. The typed
  ontology distinguishes subClassOf alveolus from part_of lung. Independently, mapping_predicate
  is defined as source-to-record but narrowMatch is emitted to the retained source
  mint; the comparison with the ontology parent has no represented endpoint in that
  field.
