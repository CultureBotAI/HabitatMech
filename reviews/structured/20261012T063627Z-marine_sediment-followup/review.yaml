- assessment_id: EDGE-marine_sediment_receives_particles
  area: evidence
  topic: marine_sediment_receives_particles
  outcome: supported
  target_ids:
  - ENVO:03000033
  evidence_ids:
  - PRIOR
  - CURRENT
  summary: Supported within the explicitly conditional graph scope, not a universal
    habitat property. Marine sediment forms from particles transported through the
    marine water column and deposited on the seafloor. Introduction, electron-donor
    discussion; deposited organic matter supplies reducing power to the sediment.
    This does not imply that all deposited particles contain bioavailable organic
    matter.
- assessment_id: EDGE-particles_bury_marine_organic_matter
  area: evidence
  topic: particles_bury_marine_organic_matter
  outcome: supported
  target_ids:
  - ENVO:03000033
  evidence_ids:
  - PRIOR
  - CURRENT
  summary: Supported within the explicitly conditional graph scope, not a universal
    habitat property. Deposition and burial of organic-bearing particles supply organic
    matter to sediment habitats on and below the seafloor. Introduction, organic-matter
    burial and electron-donor discussion; burial is a possible fate, not the fate
    of every settling particle.
- assessment_id: EDGE-buried_organic_matter_depletes_oxygen
  area: evidence
  topic: buried_organic_matter_depletes_oxygen
  outcome: supported
  target_ids:
  - ENVO:03000033
  evidence_ids:
  - PRIOR
  - CURRENT
  summary: Supported within the explicitly conditional graph scope, not a universal
    habitat property. Aerobic microbial remineralization of buried organic matter
    consumes oxygen; whether porewater becomes anoxic depends on oxygen supply relative
    to consumption. Organic Matter Degradation and Fig. 1; surface oxygen is available
    for respiration. The review focuses on fine-grained shelf sediment. Introduction
    and Fig. 1 contrast respiration exceeding oxygen supply with slowly accumulating
    sediment that remains oxic to basement.
- assessment_id: EDGE-oxygen_depletion_creates_anoxic_porewater
  area: evidence
  topic: oxygen_depletion_creates_anoxic_porewater
  outcome: supported
  target_ids:
  - ENVO:03000033
  evidence_ids:
  - PRIOR
  - CURRENT
  summary: Supported within the explicitly conditional graph scope, not a universal
    habitat property. Where oxygen consumption exceeds resupply, depletion can create
    anoxic porewater. Oxygen can instead persist through slowly accumulating deep-ocean
    sediment; no universal depletion depth or rate is asserted. Introduction, Fig.
    1 and Box 1 distinguish oxic and anoxic sediment columns and the limits of the
    standard redox-zonation model.
- assessment_id: EDGE-seawater_supplies_sulfate
  area: evidence
  topic: seawater_supplies_sulfate
  outcome: supported
  target_ids:
  - ENVO:03000033
  evidence_ids:
  - PRIOR
  - CURRENT
  summary: Supported within the explicitly conditional graph scope, not a universal
    habitat property. Marine sediment porewaters receive sulfate from overlying seawater.
    Organic Matter Degradation, first paragraph; sulfate supplied from seawater penetrates
    the seabed. The cited concentration is not asserted as a universal measurement
    for this habitat.
- assessment_id: EDGE-sulfate_selects_sulfate_reducers
  area: evidence
  topic: sulfate_selects_sulfate_reducers
  outcome: supported
  target_ids:
  - ENVO:03000033
  evidence_ids:
  - PRIOR
  - CURRENT
  summary: Supported within the explicitly conditional graph scope, not a universal
    habitat property. Sulfate supplies an electron acceptor for sulfate-respiring
    populations in anoxic porewater when suitable donors and physiological conditions
    are available; sulfate alone does not establish growth. Introduction and Sulfate-Reducing
    Microorganisms; diverse populations use sulfate with available donors. Legacy
    selection edge ID retained.
- assessment_id: EDGE-anoxic_porewater_enables_sulfate_reduction
  area: evidence
  topic: anoxic_porewater_enables_sulfate_reduction
  outcome: supported
  target_ids:
  - ENVO:03000033
  evidence_ids:
  - PRIOR
  - CURRENT
  summary: Supported within the explicitly conditional graph scope, not a universal
    habitat property. Anoxic porewater supports sulfate reduction where sulfate, suitable
    donors and active populations coexist. Iron reduction and other pathways can overlap;
    prior exhaustion of every other acceptor is not required by this model. Organic
    Matter Degradation, redox-zonation discussion; sulfate reduction also occurs in
    layers geochemically characterized by iron reduction. This is not a mutually exclusive
    sequence. Box 1, overlapping pathways and limitations of standard zonation.
- assessment_id: EDGE-sulfate_reducers_perform_sulfate_reduction
  area: evidence
  topic: sulfate_reducers_perform_sulfate_reduction
  outcome: supported
  target_ids:
  - ENVO:03000033
  evidence_ids:
  - PRIOR
  - CURRENT
  summary: Supported within the explicitly conditional graph scope, not a universal
    habitat property. Sulfate-reducing populations couple suitable substrate oxidation
    to sulfate respiration; organic compounds or hydrogen can provide reducing power.
    Sulfate-Reducing Microorganisms; organic compounds and hydrogen are electron donors,
    and the functional group spans multiple taxa.
- assessment_id: EDGE-sulfate_reduction_mineralizes_carbon
  area: evidence
  topic: sulfate_reduction_mineralizes_carbon
  outcome: supported
  target_ids:
  - ENVO:03000033
  evidence_ids:
  - PRIOR
  - CURRENT
  summary: Supported within the explicitly conditional graph scope, not a universal
    habitat property. Organoclastic sulfate reduction couples organic-carbon oxidation
    toward inorganic carbon to sulfate reduction. Sulfide is the reduced sulfur product,
    not a carbon-mineralization product. Introduction, first paragraph and Organic
    Matter Degradation; terminal organic-carbon oxidation to CO2 is coupled to sulfate
    reduction. Hydrogen-driven sulfate reduction need not oxidize organic carbon directly.
- assessment_id: EDGE-sulfate_reduction_produces_sulfide
  area: evidence
  topic: sulfate_reduction_produces_sulfide
  outcome: supported
  target_ids:
  - ENVO:03000033
  evidence_ids:
  - PRIOR
  - CURRENT
  summary: Supported within the explicitly conditional graph scope, not a universal
    habitat property. Microbial sulfate reduction reduces sulfate to hydrogen sulfide
    in marine porewaters. Introduction and Sulfate-Reducing Microorganisms describe
    sulfate reduction to sulfide. The former non-verbatim snippet is removed; hydrogen
    sulfide and its dissociated forms depend on solution chemistry.
- assessment_id: EDGE-sulfide_selects_sulfur_oxidizers
  area: evidence
  topic: sulfide_selects_sulfur_oxidizers
  outcome: supported
  target_ids:
  - ENVO:03000033
  evidence_ids:
  - PRIOR
  - CURRENT
  summary: Supported within the explicitly conditional graph scope, not a universal
    habitat property. Sulfide can support sulfur-oxidizing populations where suitable
    oxidants and physiological conditions are available; geochemical sulfide oxidation
    also occurs. Introduction and Fig. 1 distinguish biological and geochemical oxidation
    and multiple possible oxidants. No selection experiment or universal biological
    fraction is asserted; legacy edge ID retained.
- assessment_id: EDGE-sulfur_oxidizers_perform_sulfide_oxidation
  area: evidence
  topic: sulfur_oxidizers_perform_sulfide_oxidation
  outcome: supported
  target_ids:
  - ENVO:03000033
  evidence_ids:
  - PRIOR
  - CURRENT
  summary: Supported within the explicitly conditional graph scope, not a universal
    habitat property. Sulfur-oxidizing microorganisms return reduced sulfide toward
    oxidized sulfur pools. Introduction, microbial sulfur-cycle overview; sulfur-oxidizing
    populations mediate oxidation of reduced sulfur. This does not assign all sulfide
    oxidation to microorganisms.
- assessment_id: EDGE-reactive_iron_traps_sulfide
  area: evidence
  topic: reactive_iron_traps_sulfide
  outcome: supported
  target_ids:
  - ENVO:03000033
  evidence_ids:
  - PRIOR
  - CURRENT
  summary: Supported within the explicitly conditional graph scope, not a universal
    habitat property. Reactive iron can react with sulfide in the modeled sediment;
    iron reactivity and availability constrain this sink. Introduction and Fig. 1
    explain sulfide reaction with buried iron and iron-sulfide formation. Lin's mineral-surface/rate
    study is not evidence for this trapping reaction and is removed from the edge.
- assessment_id: EDGE-sulfide_reaction_forms_iron_sulfides
  area: evidence
  topic: sulfide_reaction_forms_iron_sulfides
  outcome: supported
  target_ids:
  - ENVO:03000033
  evidence_ids:
  - PRIOR
  - CURRENT
  summary: Supported within the explicitly conditional graph scope, not a universal
    habitat property. Sulfide reacts with reactive iron to form iron sulfide minerals,
    trapping part of the reduced sulfur pool in sediment. Introduction and Fig. 1
    identify iron monosulfide and pyrite as sulfur sinks; precipitation is one fate
    alongside reoxidation and organic-sulfur formation, not a complete sulfur budget.
