  hot aquifer water in a Japanese gold mine, and PMID18845759 describes one South
  African fracture-water ecosystem containing Desulforudis. These are bounded examples,
  not a general mine community. All four displayed taxon keys resolve; NCBITaxon:3175
  has a current Klebsormidium flaccidum name but lacks a generated display label.
