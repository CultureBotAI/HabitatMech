[project]
name = "habitatmech"
version = "0.1.0"
description = "Knowledge base of microbial habitats and environments, harmonized from GOLD, BacDive, and PREGO and grounded in ENVO/UBERON/FOODON"
authors = [
    {name = "HabitatMech Contributors"}
]
readme = "README.md"
license = {text = "CC0-1.0"}
requires-python = ">=3.10"
keywords = [
    "microbiology",
    "habitat",
    "environment",
    "envo",
    "gold",
    "bacdive",
    "prego",
    "ontology",
    "knowledge graph",
    "linkml",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "linkml>=1.10.0",
    "linkml-runtime>=1.7.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/CultureBotAI/HabitatMech"
Repository = "https://github.com/CultureBotAI/HabitatMech"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/habitatmech"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
# extend-exclude, not exclude: `exclude` REPLACES ruff's defaults (which cover
# .venv, .git, build/, ...), so setting it would put the whole virtualenv in
# scope and drown the repo's own findings in ~34k third-party ones.
extend-exclude = ["src/habitatmech/schema/habitatmech_dataclasses.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
