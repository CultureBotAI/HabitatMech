[project]
name = "habitatmech"
version = "0.1.0"
description = "Knowledge base of microbial habitats harmonized from GOLD, BacDive, PREGO, and Madin et al. and grounded in environmental and anatomy ontologies"
authors = [
    {name = "HabitatMech Contributors"}
]
readme = "README.md"
license = {text = "CC0-1.0"}
requires-python = ">=3.10"
keywords = [
    "microbiology",
    "habitat",
    "environment",
    "envo",
    "gold",
    "bacdive",
    "prego",
    "ontology",
    "knowledge graph",
    "linkml",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "linkml>=1.10.0",
    "linkml-runtime>=1.7.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]
# Only scripts/research_habitat.py needs this, and only when actually calling a
# provider. Seeding, validation, rendering and the whole test suite run without
# it — the same separation data/raw/ has from a kg-microbe checkout. Pinned to
# 3.12+ to match TraitMech, which shares the client and the conventions.
research = [
    "deep-research-client[cyberian]>=0.2.4; python_version >= '3.12'",
]

[project.urls]
Homepage = "https://github.com/CultureBotAI/HabitatMech"
Repository = "https://github.com/CultureBotAI/HabitatMech"

[project.scripts]
habitatmech-seed = "habitatmech.seed:main"
habitatmech-extract = "habitatmech.extract:main"
habitatmech-report = "habitatmech.report:main"
habitatmech-propose = "habitatmech.proposals:main"
habitatmech-sample = "habitatmech.sampling:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/habitatmech"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 110
target-version = "py310"
# extend-exclude, not exclude: `exclude` REPLACES ruff's defaults (which cover
# .venv, .git, build/, ...), so setting it would put the whole virtualenv in
# scope and drown the repo's own findings in ~34k third-party ones.
extend-exclude = ["src/habitatmech/schema/habitatmech_dataclasses.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
